        - type: object
          required: [type, payload]
          properties:
            type: { const: config_ack }
            payload: { $ref: '#/components/schemas/ConfigAckPayload' }
      unevaluatedProperties: false
    SyncRecord:
      description: One outbox record; `type` selects the payload schema.
      oneOf:
        - { $ref: '#/components/schemas/GeoBreadcrumbRecord' }
        - { $ref: '#/components/schemas/AttendanceEventRecord' }
        - { $ref: '#/components/schemas/DayOpenRecord' }
        - { $ref: '#/components/schemas/DaySubmitRecord' }
        - { $ref: '#/components/schemas/DayExceptionRecord' }
        - { $ref: '#/components/schemas/StockMovementRecord' }
        - { $ref: '#/components/schemas/VisitRecord' }
        - { $ref: '#/components/schemas/VisitCloseRecord' }
        - { $ref: '#/components/schemas/VisitSkipRecord' }
        - { $ref: '#/components/schemas/MemoRecord' }
        - { $ref: '#/components/schemas/MemoLineRecord' }
        - { $ref: '#/components/schemas/MemoDiscountRecord' }
        - { $ref: '#/components/schemas/QcLineRecord' }
        - { $ref: '#/components/schemas/PrintEventRecord' }
        - { $ref: '#/components/schemas/MemoVoidRecord' }
        - { $ref: '#/components/schemas/DueCollectionRecord' }
        - { $ref: '#/components/schemas/SurveyResponseRecord' }
        - { $ref: '#/components/schemas/OutletChangeRequestRecord' }
        - { $ref: '#/components/schemas/OutletRequestVerificationRecord' }
        - { $ref: '#/components/schemas/DistributionCheckRecord' }
        - { $ref: '#/components/schemas/DistributionCheckLineRecord' }
        - { $ref: '#/components/schemas/CallAssessmentRecord' }
        - { $ref: '#/components/schemas/CallAssessmentAnswerRecord' }
        - { $ref: '#/components/schemas/TaskRecord' }
        - { $ref: '#/components/schemas/TaskEventRecord' }
        - { $ref: '#/components/schemas/VisitPlanRecord' }
        - { $ref: '#/components/schemas/VisitPlanOutletRecord' }
        - { $ref: '#/components/schemas/LeaveApplicationRecord' }
        - { $ref: '#/components/schemas/FeedbackRecord' }
        - { $ref: '#/components/schemas/MediaMetaRecord' }
        - { $ref: '#/components/schemas/DeviceStatusRecord' }
        - { $ref: '#/components/schemas/ConfigAckRecord' }
        - { $ref: '#/components/schemas/ContentViewRecord' }
        - { $ref: '#/components/schemas/RedemptionRecord' }
        - { $ref: '#/components/schemas/RedemptionLineRecord' }
        - { $ref: '#/components/schemas/GiftPhotoRecord' }
        - { $ref: '#/components/schemas/PriceComplianceCheckRecord' }
        - { $ref: '#/components/schemas/RiskReviewRecord' }
        - { $ref: '#/components/schemas/ActivityLogRecord' }
        - { $ref: '#/components/schemas/AppErrorRecord' }
        - { $ref: '#/components/schemas/SaleAbortRecord' }
        - { $ref: '#/components/schemas/ConsentAcceptRecord' }
      discriminator:
        propertyName: type
        mapping:
          geo_breadcrumb: '#/components/schemas/GeoBreadcrumbRecord'
          attendance_event: '#/components/schemas/AttendanceEventRecord'
          day_open: '#/components/schemas/DayOpenRecord'
          day_submit: '#/components/schemas/DaySubmitRecord'
          day_exception: '#/components/schemas/DayExceptionRecord'
          stock_movement: '#/components/schemas/StockMovementRecord'
          visit: '#/components/schemas/VisitRecord'
          visit_close: '#/components/schemas/VisitCloseRecord'
          visit_skip: '#/components/schemas/VisitSkipRecord'
          memo: '#/components/schemas/MemoRecord'
          memo_line: '#/components/schemas/MemoLineRecord'
          memo_discount: '#/components/schemas/MemoDiscountRecord'
          qc_line: '#/components/schemas/QcLineRecord'
          print_event: '#/components/schemas/PrintEventRecord'
          memo_void: '#/components/schemas/MemoVoidRecord'
          due_collection: '#/components/schemas/DueCollectionRecord'
          survey_response: '#/components/schemas/SurveyResponseRecord'
          outlet_change_request: '#/components/schemas/OutletChangeRequestRecord'
          outlet_request_verification: '#/components/schemas/OutletRequestVerificationRecord'
          distribution_check: '#/components/schemas/DistributionCheckRecord'
          distribution_check_line: '#/components/schemas/DistributionCheckLineRecord'
          call_assessment: '#/components/schemas/CallAssessmentRecord'
          call_assessment_answer: '#/components/schemas/CallAssessmentAnswerRecord'
          task: '#/components/schemas/TaskRecord'
          task_event: '#/components/schemas/TaskEventRecord'
          visit_plan: '#/components/schemas/VisitPlanRecord'
          visit_plan_outlet: '#/components/schemas/VisitPlanOutletRecord'
          leave_application: '#/components/schemas/LeaveApplicationRecord'
          feedback: '#/components/schemas/FeedbackRecord'
          media_meta: '#/components/schemas/MediaMetaRecord'
          device_status: '#/components/schemas/DeviceStatusRecord'
          config_ack: '#/components/schemas/ConfigAckRecord'
          content_view: '#/components/schemas/ContentViewRecord'
          redemption: '#/components/schemas/RedemptionRecord'
          redemption_line: '#/components/schemas/RedemptionLineRecord'
          gift_photo: '#/components/schemas/GiftPhotoRecord'
          price_compliance_check: '#/components/schemas/PriceComplianceCheckRecord'
          risk_review: '#/components/schemas/RiskReviewRecord'
          activity_log: '#/components/schemas/ActivityLogRecord'
          app_error: '#/components/schemas/AppErrorRecord'
          sale_abort: '#/components/schemas/SaleAbortRecord'
          consent_accept: '#/components/schemas/ConsentAcceptRecord'

    ContentViewRecord:
      allOf:
        - { $ref: '#/components/schemas/RecordEnvelope' }
        - type: object
          required: [type, payload]
          properties:
            type: { const: content_view }
            payload: { $ref: '#/components/schemas/ContentViewPayload' }
      unevaluatedProperties: false
    RedemptionRecord:
      allOf:
        - { $ref: '#/components/schemas/RecordEnvelope' }
        - type: object
          required: [type, payload]
          properties:
            type: { const: redemption }
            payload: { $ref: '#/components/schemas/RedemptionPayload' }
      unevaluatedProperties: false
    RedemptionLineRecord:
      allOf:
        - { $ref: '#/components/schemas/RecordEnvelope' }
        - type: object
          required: [type, payload]
          properties:
            type: { const: redemption_line }
            payload: { $ref: '#/components/schemas/RedemptionLinePayload' }
      unevaluatedProperties: false
    GiftPhotoRecord:
      allOf:
        - { $ref: '#/components/schemas/RecordEnvelope' }
        - type: object
          required: [type, payload]
          properties:
            type: { const: gift_photo }
            payload: { $ref: '#/components/schemas/GiftPhotoPayload' }
      unevaluatedProperties: false
    PriceComplianceCheckRecord:
      allOf:
        - { $ref: '#/components/schemas/RecordEnvelope' }
        - type: object
          required: [type, payload]
          properties:
            type: { const: price_compliance_check }
            payload: { $ref: '#/components/schemas/PriceComplianceCheckPayload' }
      unevaluatedProperties: false
    RiskReviewRecord:
      allOf:
        - { $ref: '#/components/schemas/RecordEnvelope' }
        - type: object
          required: [type, payload]
          properties:
            type: { const: risk_review }
            payload: { $ref: '#/components/schemas/RiskReviewPayload' }
      unevaluatedProperties: false
    ActivityLogRecord:
      allOf:
        - { $ref: '#/components/schemas/RecordEnvelope' }
        - type: object
          required: [type, payload]
          properties:
            type: { const: activity_log }
            payload: { $ref: '#/components/schemas/ActivityLogPayload' }
      unevaluatedProperties: false
    AppErrorRecord:
      allOf:
        - { $ref: '#/components/schemas/RecordEnvelope' }
        - type: object
          required: [type, payload]
          properties:
            type: { const: app_error }
            payload: { $ref: '#/components/schemas/AppErrorPayload' }
      unevaluatedProperties: false
    SaleAbortRecord:
      allOf:
        - { $ref: '#/components/schemas/RecordEnvelope' }
        - type: object
          required: [type, payload]
          properties:
            type: { const: sale_abort }
            payload: { $ref: '#/components/schemas/SaleAbortPayload' }
      unevaluatedProperties: false
    ConsentAcceptRecord:
      allOf:
        - { $ref: '#/components/schemas/RecordEnvelope' }
        - type: object
          required: [type, payload]
          properties:
            type: { const: consent_accept }
            payload: { $ref: '#/components/schemas/ConsentAcceptPayload' }
      unevaluatedProperties: false

    # ---------- record payloads ----------
    GeoBreadcrumbPayload:
      type: object
      required: [fix]
      additionalProperties: false
      properties:
        fix: { $ref: '#/components/schemas/GeoFix' }
    AttendanceEventPayload:
      type: object
      required: [kind, fix]
      additionalProperties: false
      properties:
        kind: { $ref: '#/components/schemas/AttendanceKind' }
        fix: { $ref: '#/components/schemas/GeoFix' }
        address_display: { type: [string, 'null'], maxLength: 300, description: 'Reverse-geocoded text shown on screen; display only, never used for a decision.' }
    DayOpenPayload:
      type: object
      required: [route_ids, online, bundle_valid_for, offline_start]
      additionalProperties: false
      properties:
        route_ids:
          type: array
          minItems: 1
          maxItems: 20
          items: { $ref: '#/components/schemas/Id' }
        online: { type: boolean }
        bundle_valid_for: { $ref: '#/components/schemas/BusinessDate' }
        offline_start: { type: boolean, description: True when the day was opened offline on a cached bundle (counts as logged in). }
    DaySubmitPayload:
      type: object
      description: Always the last record of the route-day (or supervisor-day) sequence in the outbox.
      required: [scope, submit_cycle, device_counts, device_money, rejected_count, quarantined_count, pending_count, submitted_with_dues, dues_outstanding_mtk, retailers_with_dues, stock_slip_printed]
      additionalProperties: false
      properties:
        scope: { type: string, enum: [route_day, supervisor_day] }
        submit_cycle: { type: integer, minimum: 1, maximum: 50, description: 1 for the first submit; n+1 after the server voided cycle n. }
        device_counts: { $ref: '#/components/schemas/TypeCounts' }
        device_money: { $ref: '#/components/schemas/MoneyTotals' }
        rejected_count: { type: integer, minimum: 0 }
        quarantined_count: { type: integer, minimum: 0 }
        pending_count: { type: integer, minimum: 0, description: Rows of this route-day not yet acknowledged when the SR tapped submit. }
        submitted_with_dues: { type: boolean }
        dues_outstanding_mtk: { $ref: '#/components/schemas/MtkNonNegative' }
        retailers_with_dues: { type: integer, minimum: 0 }
        stock_slip_printed: { type: boolean }
    DayExceptionPayload:
      type: object
      required: [reason_code, route_ids, from_date, to_date]
      additionalProperties: false
      properties:
        reason_code: { type: string, pattern: '^[a-z][a-z0-9_]{1,40}$', description: Code list day_exception_reason. }
        route_ids:
          type: array
          minItems: 1
          maxItems: 60
          items: { $ref: '#/components/schemas/Id' }
        from_date: { $ref: '#/components/schemas/BusinessDate' }
        to_date: { $ref: '#/components/schemas/BusinessDate' }
        note: { type: [string, 'null'], maxLength: 500 }
    StockMovementPayload:
      type: object
      description: One event per SKU per Save (an increment, never an overwrite). qty_entered is negative only for kind adjustment.
      required: [kind, sku_id, qty_entered, unit_entered, pack_factor, qty_base, slip_printed]
      additionalProperties: false
      properties:
        kind: { $ref: '#/components/schemas/StockMovementKind' }
        sku_id: { $ref: '#/components/schemas/Id' }
        qty_entered: { type: integer, minimum: -10000000, maximum: 10000000, not: { const: 0 } }
        unit_entered: { $ref: '#/components/schemas/QtyUnit' }
        pack_factor: { type: integer, minimum: 1, maximum: 1000 }
        qty_base: { type: integer, minimum: -10000000, maximum: 10000000, description: qty_entered x pack_factor. }
        reason_code: { type: [string, 'null'], pattern: '^[a-z][a-z0-9_]{1,40}$', description: 'Required for adjustment, damaged and short (code list stock_variance_reason).' }
        slip_printed: { type: boolean }
    VisitPayload:
      type: object
      description: Immutable facts at outlet open. The visit is the family root (rank 0, family_uuid = its client_uuid).
      required: [visit_kind, outlet_id, opened_at, sequence_no, planned, fix, geo]
      additionalProperties: false
      properties:
        visit_kind: { $ref: '#/components/schemas/VisitKind' }
        outlet_id: { $ref: '#/components/schemas/Id' }
        opened_at: { $ref: '#/components/schemas/Timestamp' }
        sequence_no: { type: integer, minimum: 1, maximum: 1000, description: Order of this visit in the user's business day. }
        planned: { type: boolean, description: The outlet is on a route planned today. }
        assessed_user_id: { type: [integer, 'null'], format: int64, minimum: 1, description: SR assessed on an AMO joint call (the route's active assignee). }
        fix: { $ref: '#/components/schemas/GeoFix' }
        geo: { $ref: '#/components/schemas/DeviceGeoVerdict' }
    VisitClosePayload:
      type: object
      required: [visit_client_uuid, outcome_code, call_declined, ended_at, is_zero_sale]
      additionalProperties: false
      properties:
        visit_client_uuid: { $ref: '#/components/schemas/Uuid' }
        outcome_code: { $ref: '#/components/schemas/VisitOutcome' }
        call_started_at:
          oneOf:
            - { $ref: '#/components/schemas/Timestamp' }
            - type: 'null'
        call_declined: { type: boolean, description: '"না" at the start-call prompt; not counted as visited.' }
        ended_at: { $ref: '#/components/schemas/Timestamp' }
        is_zero_sale: { type: boolean }
    VisitSkipPayload:
      type: object
      required: [outlet_id, reason_code]
      additionalProperties: false
      properties:
        outlet_id: { $ref: '#/components/schemas/Id' }
        reason_code: { type: string, pattern: '^[a-z][a-z0-9_]{1,40}$', description: Code list skip_reason (default not_reached). }
    MemoPayload:
      type: object
      description: |
        Memo header committed with its lines, discount lines and QC lines in one phone transaction. Server-checked
        arithmetic (reject `arithmetic_mismatch`): gross = sum(line.gross_mtk); offer_discount = sum(discount where kind
        in offer, free_goods); drp_discount = sum(discount where kind = drp); qc_deduction = sum(qc_line.settlement_mtk
        where applied_to_memo); net = gross - offer - drp - qc + round_adj; net is a whole paisa (net % 10 = 0) and
        |round_adj| <= 5; paid + due = net; is_credit = due > 0 (docs/24 s7.4).
      required: [visit_client_uuid, outlet_id, memo_no, memo_kind, committed_at, price_list_date, price_type, gross_mtk, offer_discount_mtk, drp_discount_mtk, qc_deduction_mtk, round_adj_mtk, net_mtk, paid_mtk, due_mtk, is_credit, line_count, discount_line_count, qc_line_count, rounding_mode]
      additionalProperties: false
      properties:
        visit_client_uuid: { $ref: '#/components/schemas/Uuid' }
        outlet_id: { $ref: '#/components/schemas/Id' }
        memo_no: { $ref: '#/components/schemas/MemoNo' }
        memo_kind: { type: string, enum: [sale, zero_sale] }
        committed_at: { $ref: '#/components/schemas/Timestamp' }
        price_list_date: { $ref: '#/components/schemas/BusinessDate' }
        price_type: { $ref: '#/components/schemas/SellingPriceType' }
        gross_mtk: { $ref: '#/components/schemas/MtkNonNegative' }
        offer_discount_mtk: { $ref: '#/components/schemas/MtkNonNegative' }
        drp_discount_mtk: { $ref: '#/components/schemas/MtkNonNegative' }
        qc_deduction_mtk: { $ref: '#/components/schemas/MtkNonNegative' }
        round_adj_mtk: { type: integer, minimum: -5, maximum: 5 }
        net_mtk: { $ref: '#/components/schemas/Mtk' }
        paid_mtk: { $ref: '#/components/schemas/MtkNonNegative' }
        due_mtk: { $ref: '#/components/schemas/Mtk' }
        is_credit: { type: boolean }
        outstanding_before_mtk: { type: [integer, 'null'], format: int64, description: Outlet balance printed on the memo (from the bundle plus local collections). }
        line_count: { type: integer, minimum: 0, maximum: 60 }
        discount_line_count: { type: integer, minimum: 0, maximum: 120 }
        qc_line_count: { type: integer, minimum: 0, maximum: 60 }
        supersedes_client_uuid:
          description: Set on an edited memo (new number; the old memo becomes superseded on the server).
          oneOf:
            - { $ref: '#/components/schemas/Uuid' }
            - type: 'null'
        edit_reason_code: { type: [string, 'null'], pattern: '^[a-z][a-z0-9_]{1,40}$' }
        edit_fix:
          oneOf:
            - { $ref: '#/components/schemas/GeoFix' }
            - type: 'null'
        offer_version_ids:
          type: array
          maxItems: 30
          items: { $ref: '#/components/schemas/Id' }
        rounding_mode: { type: string, enum: [half_up_paisa] }
    MemoLinePayload:
      type: object
      description: gross_mtk = div_half_up(qty_base x base_price_mtk, price_per_qty) (reject arithmetic_mismatch otherwise).
      required: [memo_client_uuid, line_no, sku_id, line_kind, qty_entered, unit_entered, pack_factor, qty_base, price_type, price_valid_from, base_price_mtk, price_per_qty, gross_mtk]
      additionalProperties: false
      properties:
        memo_client_uuid: { $ref: '#/components/schemas/Uuid' }
        line_no: { type: integer, minimum: 1, maximum: 60 }
        sku_id: { $ref: '#/components/schemas/Id' }
        line_kind: { $ref: '#/components/schemas/LineKind' }
        qty_entered: { type: integer, minimum: 1, maximum: 10000000 }
        unit_entered: { $ref: '#/components/schemas/QtyUnit' }
        pack_factor: { type: integer, minimum: 1, maximum: 1000 }
        qty_base: { type: integer, minimum: 1, maximum: 10000000 }
        price_type: { $ref: '#/components/schemas/SellingPriceType' }
        price_valid_from: { $ref: '#/components/schemas/BusinessDate' }
        base_price_mtk: { $ref: '#/components/schemas/MtkNonNegative' }
        price_per_qty: { type: integer, minimum: 1, maximum: 1000 }
        gross_mtk: { $ref: '#/components/schemas/MtkNonNegative' }
        offer_id: { type: [integer, 'null'], format: int64, minimum: 1 }
    MemoDiscountPayload:
      type: object
      description: One discount component as (sku, qty, value, kind) so every reading of the memo's Discount table fits (Q-UI-01).
      required: [memo_client_uuid, kind, value_mtk]
      additionalProperties: false
      properties:
        memo_client_uuid: { $ref: '#/components/schemas/Uuid' }
        kind: { $ref: '#/components/schemas/DiscountKind' }
        sku_id: { type: [integer, 'null'], format: int64, minimum: 1 }
        qty_base: { type: [integer, 'null'], minimum: 0, maximum: 10000000 }
        value_mtk: { $ref: '#/components/schemas/MtkNonNegative' }
        offer_id: { type: [integer, 'null'], format: int64, minimum: 1 }
        offer_version_id: { type: [integer, 'null'], format: int64, minimum: 1 }
        basis_qty_base: { type: [integer, 'null'], minimum: 0, description: 'For drp, the empties collected in base units.' }
        line_no: { type: [integer, 'null'], minimum: 1, maximum: 60, description: 'The memo line this component belongs to, if any.' }
    QcLinePayload:
      type: object
      required: [visit_client_uuid, applied_to_memo, sku_id, fault_type_code, fault_group, qty_base, unit_price_mtk, settlement_mtk]
      additionalProperties: false
      properties:
        visit_client_uuid: { $ref: '#/components/schemas/Uuid' }
        memo_client_uuid:
          oneOf:
            - { $ref: '#/components/schemas/Uuid' }
            - type: 'null'
        applied_to_memo: { type: boolean, description: 'True when committed in the memo transaction and deducted; false when saved after the memo (reported, never deducted).' }
        sku_id: { $ref: '#/components/schemas/Id' }
        fault_type_code: { type: string, pattern: '^[a-z][a-z0-9_]{1,40}$' }
        fault_group: { type: string, enum: [MFC, MKT] }
        qty_base: { type: integer, minimum: 1, maximum: 100000 }
        unit_price_mtk: { $ref: '#/components/schemas/MtkNonNegative' }
        settlement_mtk: { $ref: '#/components/schemas/MtkNonNegative' }
    PrintEventPayload:
      type: object
      required: [document_kind, print_count, outcome, template_version]
      additionalProperties: false
      properties:
        document_kind: { $ref: '#/components/schemas/PrintDocumentKind' }
        memo_client_uuid:
          oneOf:
            - { $ref: '#/components/schemas/Uuid' }
            - type: 'null'
        ref_client_uuid:
          description: For stock slips the stock family uuid; for due receipts the due_collection uuid.
          oneOf:
            - { $ref: '#/components/schemas/Uuid' }
            - type: 'null'
        print_count: { type: integer, minimum: 1, maximum: 100 }
        outcome: { $ref: '#/components/schemas/PrintOutcome' }
        user_confirmed: { type: [boolean, 'null'] }
        template_version: { type: integer, minimum: 1, maximum: 999 }
        printer_model: { type: [string, 'null'], maxLength: 40 }
    MemoVoidPayload:
      type: object
      required: [memo_client_uuid, memo_no, reason_code, fix, retailer_ack]
      additionalProperties: false
      properties:
        memo_client_uuid: { $ref: '#/components/schemas/Uuid' }
        memo_no: { $ref: '#/components/schemas/MemoNo' }
        reason_code: { type: string, pattern: '^[a-z][a-z0-9_]{1,40}$' }
        fix: { $ref: '#/components/schemas/GeoFix' }
        retailer_ack: { type: boolean }
        note: { type: [string, 'null'], maxLength: 500 }
    DueCollectionPayload:
      type: object
      required: [outlet_id, against_memo_client_uuid, against_memo_no, against_memo_business_date, amount_mtk, is_full_settlement, outstanding_before_mtk, payment_mode]
      additionalProperties: false
      properties:
        outlet_id: { $ref: '#/components/schemas/Id' }
        against_memo_client_uuid: { $ref: '#/components/schemas/Uuid' }
        against_memo_no: { type: string, maxLength: 40, description: Native memo number or the imported number of an old memo. }
        against_memo_business_date: { $ref: '#/components/schemas/BusinessDate' }
        amount_mtk: { type: integer, format: int64, minimum: 10 }
        is_full_settlement: { type: boolean }
        outstanding_before_mtk: { $ref: '#/components/schemas/MtkNonNegative' }
        payment_mode: { type: string, enum: [cash] }
        visit_client_uuid:
          oneOf:
            - { $ref: '#/components/schemas/Uuid' }
            - type: 'null'
        fix:
          oneOf:
            - { $ref: '#/components/schemas/GeoFix' }
            - type: 'null'
    SurveyResponsePayload:
      type: object
      required: [visit_client_uuid, survey_id, survey_version, question_id, answer_type]
      additionalProperties: false
      properties:
        visit_client_uuid: { $ref: '#/components/schemas/Uuid' }
        survey_id: { $ref: '#/components/schemas/Id' }
        survey_version: { type: integer, minimum: 1 }
        question_id: { $ref: '#/components/schemas/Id' }
        answer_type: { type: string, enum: [bool, num, option, text, photo_only] }
        answer_bool: { type: [boolean, 'null'] }
        answer_num: { type: [number, 'null'] }
        answer_option_code: { type: [string, 'null'], pattern: '^[a-z][a-z0-9_]{1,40}$' }
        answer_text: { type: [string, 'null'], maxLength: 1000 }
        photo_uuid:
          oneOf:
            - { $ref: '#/components/schemas/Uuid' }
            - type: 'null'
    OutletProposal:
      type: object
      description: Proposed outlet facts; which members are required depends on the request type (docs/24 s12.2).
      additionalProperties: false
      properties:
        name: { type: string, minLength: 2, maxLength: 120 }
        name_bn: { type: [string, 'null'], maxLength: 120 }
        owner_name: { type: string, minLength: 2, maxLength: 120 }
        contact_number: { $ref: '#/components/schemas/PhoneBd' }
        address: { type: [string, 'null'], maxLength: 300 }
        cluster_id: { $ref: '#/components/schemas/Id' }
        sub_channel_id: { type: [integer, 'null'], format: int64, minimum: 1 }
        geo_class: { type: [string, 'null'], enum: [Hill, Urban, SemiUrban, Rural, null] }
        lat: { type: number, minimum: -90, maximum: 90 }
        lng: { type: number, minimum: -180, maximum: 180 }
        close_reason_code: { type: string, pattern: '^[a-z][a-z0-9_]{1,40}$' }
    OutletChangeRequestPayload:
      type: object
      required: [request_type, proposed, fix, photo_uuids]
      additionalProperties: false
      properties:
        request_type: { $ref: '#/components/schemas/OutletRequestType' }
        outlet_id: { type: [integer, 'null'], format: int64, minimum: 1, description: Null only for request_type new. }
        proposed: { $ref: '#/components/schemas/OutletProposal' }
        fix: { $ref: '#/components/schemas/GeoFix' }
        photo_uuids:
          type: array
          maxItems: 4
          items: { $ref: '#/components/schemas/Uuid' }
        origin_visit_client_uuid:
          description: Set when a force sale at a confirmed outlet raised a location request.
          oneOf:
            - { $ref: '#/components/schemas/Uuid' }
            - type: 'null'
        note: { type: [string, 'null'], maxLength: 500 }
    OutletRequestVerificationPayload:
      type: object
      required: [request_uuid, decision, fix]
      additionalProperties: false
      properties:
        request_uuid: { $ref: '#/components/schemas/Uuid' }
        decision: { type: string, enum: [verified, discarded] }
        sub_channel_id: { type: [integer, 'null'], format: int64, minimum: 1 }
        geo_class: { type: [string, 'null'], enum: [Hill, Urban, SemiUrban, Rural, null] }
        fix: { $ref: '#/components/schemas/GeoFix' }
        photo_uuid:
          oneOf:
            - { $ref: '#/components/schemas/Uuid' }
            - type: 'null'
        note: { type: [string, 'null'], maxLength: 500 }
    DistributionCheckPayload:
      type: object
      required: [visit_client_uuid]
      additionalProperties: false
      properties:
        visit_client_uuid: { $ref: '#/components/schemas/Uuid' }
        posm_present: { type: [boolean, 'null'] }
        note: { type: [string, 'null'], maxLength: 500 }
    DistributionCheckLinePayload:
      type: object
      description: OOS implies present (reject schema_invalid otherwise).
      required: [check_client_uuid, brand_id, present, oos]
      additionalProperties: false
      properties:
        check_client_uuid: { $ref: '#/components/schemas/Uuid' }
        brand_id: { $ref: '#/components/schemas/Id' }
        present: { type: boolean }
        oos: { type: boolean }
    CallAssessmentPayload:
      type: object
      required: [kind, rubric_id, rubric_version, total_score, max_score, delegate_task]
      additionalProperties: false
      properties:
        kind: { type: string, enum: [joint_call, retailer_questionnaire] }
        visit_client_uuid:
          oneOf:
            - { $ref: '#/components/schemas/Uuid' }
            - type: 'null'
        visit_plan_outlet_client_uuid:
          oneOf:
            - { $ref: '#/components/schemas/Uuid' }
            - type: 'null'
        rubric_id: { $ref: '#/components/schemas/Id' }
        rubric_version: { type: integer, minimum: 1 }
        assessed_user_id: { type: [integer, 'null'], format: int64, minimum: 1 }
        total_score: { type: integer, minimum: 0, maximum: 1000 }
        max_score: { type: integer, minimum: 0, maximum: 1000 }
        delegate_task: { type: boolean }
    CallAssessmentAnswerPayload:
      type: object
      required: [assessment_client_uuid, criterion_id]
      additionalProperties: false
      properties:
        assessment_client_uuid: { $ref: '#/components/schemas/Uuid' }
        criterion_id: { $ref: '#/components/schemas/Id' }
        score: { type: [integer, 'null'], minimum: 1, maximum: 5 }
        answer_text: { type: [string, 'null'], maxLength: 1000 }
        answer_bool: { type: [boolean, 'null'] }
    TaskPayload:
      type: object
      required: [task_type_code, assignee_user_id, title]
      additionalProperties: false
      properties:
        task_type_code: { type: string, pattern: '^[a-z][a-z0-9_]{1,40}$' }
        assignee_user_id: { $ref: '#/components/schemas/Id' }
        outlet_id: { type: [integer, 'null'], format: int64, minimum: 1 }
        title: { type: string, minLength: 1, maxLength: 120 }
        description: { type: [string, 'null'], maxLength: 1000 }
        due_date:
          oneOf:
            - { $ref: '#/components/schemas/BusinessDate' }
            - type: 'null'
        source_visit_client_uuid:
          oneOf:
            - { $ref: '#/components/schemas/Uuid' }
            - type: 'null'
    TaskEventPayload:
      type: object
      required: [task_uuid, event]
      additionalProperties: false
      properties:
        task_uuid: { $ref: '#/components/schemas/Uuid' }
        event: { type: string, enum: [resolved, reopened] }
        note: { type: [string, 'null'], maxLength: 500 }
    VisitPlanPayload:
      type: object
      required: [plan_date]
      additionalProperties: false
      properties:
        plan_date: { $ref: '#/components/schemas/BusinessDate' }
        note: { type: [string, 'null'], maxLength: 500 }
    VisitPlanOutletPayload:
      type: object
      required: [plan_client_uuid, outlet_id]
      additionalProperties: false
      properties:
        plan_client_uuid: { $ref: '#/components/schemas/Uuid' }
        outlet_id: { $ref: '#/components/schemas/Id' }
    LeaveApplicationPayload:
      type: object
      required: [leave_type_code, from_date, days, reason]
      additionalProperties: false
      properties:
        leave_type_code: { type: string, pattern: '^[a-z][a-z0-9_]{1,40}$' }
        from_date: { $ref: '#/components/schemas/BusinessDate' }
        days: { type: integer, minimum: 1, maximum: 365, description: Authoritative; to_date = from_date + days - 1. }
        reason: { type: string, minLength: 1, maxLength: 500 }
    FeedbackPayload:
      type: object
      required: [category_code, title, description]
      additionalProperties: false
      properties:
        category_code: { type: string, pattern: '^[a-z][a-z0-9_]{1,40}$' }
        title: { type: string, minLength: 1, maxLength: 120 }
        description: { type: string, minLength: 1, maxLength: 2000 }
        photo_uuid:
          oneOf:
            - { $ref: '#/components/schemas/Uuid' }
            - type: 'null'
    MediaMetaPayload:
      type: object
      description: The record's client_uuid IS the media UUID; sent after the blob upload succeeded.
      required: [purpose, ref_type, ref_client_uuid, sha256, bytes, width, height, mime, blob_path, taken_at]
      additionalProperties: false
      properties:
        purpose: { $ref: '#/components/schemas/MediaPurpose' }
        ref_type: { $ref: '#/components/schemas/RecordType' }
        ref_client_uuid: { $ref: '#/components/schemas/Uuid' }
        sha256: { $ref: '#/components/schemas/Sha256Hex' }
        phash: { type: [string, 'null'], pattern: '^[0-9a-f]{16}$' }
        bytes: { type: integer, minimum: 1, maximum: 307200 }
        width: { type: integer, minimum: 1, maximum: 4096 }
        height: { type: integer, minimum: 1, maximum: 4096 }
        mime: { type: string, const: image/jpeg }
        blob_path: { type: string, pattern: '^photos/\d{4}-\d{2}-\d{2}/[0-9a-f-]{36}/[0-9a-f-]{36}\.jpg$' }
        taken_at: { $ref: '#/components/schemas/Timestamp' }
        fix:
          oneOf:
            - { $ref: '#/components/schemas/GeoFix' }
            - type: 'null'
    ConfigAckPayload:
      type: object
      required: [config_version, applied_at, keys]
      additionalProperties: false
      properties:
        config_version: { $ref: '#/components/schemas/ConfigVersionNumber' }
        applied_at: { $ref: '#/components/schemas/Timestamp' }
        keys:
          type: array
          maxItems: 100
          description: Keys with requires_ack that changed in this version.
          items: { $ref: '#/components/schemas/ConfigKeyName' }

    # ---------- batch ----------
    TypeCounts:
      type: object
      description: Count of committed rows per record type (missing type = 0).
      propertyNames: { $ref: '#/components/schemas/RecordType' }
      additionalProperties: { type: integer, minimum: 0 }
    MoneyTotals:
      type: object
      description: Money and quantity totals of one business date for exact reconciliation (never unit-less sums).
      required: [active_memo_count, gross_mtk, offer_discount_mtk, drp_discount_mtk, qc_deduction_mtk, net_mtk, paid_mtk, due_mtk, due_collected_mtk, net_by_category_mtk, issued_qty_base_by_sku, sold_qty_base_by_sku]
      additionalProperties: false
      properties:
        active_memo_count: { type: integer, minimum: 0, description: Memos with status active and line_count > 0. }
        gross_mtk: { $ref: '#/components/schemas/MtkNonNegative' }
        offer_discount_mtk: { $ref: '#/components/schemas/MtkNonNegative' }
        drp_discount_mtk: { $ref: '#/components/schemas/MtkNonNegative' }
        qc_deduction_mtk: { $ref: '#/components/schemas/MtkNonNegative' }
        net_mtk: { $ref: '#/components/schemas/Mtk' }
        paid_mtk: { $ref: '#/components/schemas/MtkNonNegative' }
        due_mtk: { $ref: '#/components/schemas/Mtk' }
        due_collected_mtk: { $ref: '#/components/schemas/MtkNonNegative' }
        net_by_category_mtk:
          type: object
          description: Product category code to net mtk.
          propertyNames: { type: string, pattern: '^[a-z][a-z0-9_]{1,30}$' }
          additionalProperties: { type: integer, format: int64 }
        issued_qty_base_by_sku:
          type: object
          description: SKU id (as a string) to issued quantity in base units (each SKU in its own unit).
          propertyNames: { type: string, pattern: '^[1-9][0-9]{0,17}$' }
          additionalProperties: { type: integer, minimum: -10000000 }
        sold_qty_base_by_sku:
          type: object
          propertyNames: { type: string, pattern: '^[1-9][0-9]{0,17}$' }
          additionalProperties: { type: integer, minimum: 0 }
    TimeAnchor:
      type: object
      required: [boot_count, server_time, elapsed_ms]
      additionalProperties: false
      properties:
        boot_count: { type: integer, minimum: 0 }
        server_time: { $ref: '#/components/schemas/Timestamp' }
        elapsed_ms: { type: integer, format: int64, minimum: 0 }
    DeviceDayTelemetry:
      type: object
      description: At most one per business date (the whole telemetry object stays under 1,024 bytes).
      required: [d, b_mob, b_mob_media, b_wifi, cpu_ms, wake_ms, starts, gps]
      additionalProperties: false
      properties:
        d: { $ref: '#/components/schemas/BusinessDate' }
        b_mob: { type: integer, format: int64, minimum: 0 }
        b_mob_media: { type: integer, format: int64, minimum: 0 }
        b_wifi: { type: integer, format: int64, minimum: 0 }
        cpu_ms: { type: integer, format: int64, minimum: 0 }
        wake_ms: { type: integer, format: int64, minimum: 0 }
        starts: { type: integer, minimum: 0 }
        gps: { type: integer, minimum: 0, description: Fixes taken. }
        gps_ms: { type: integer, format: int64, minimum: 0 }
        bat:
          type: array
          maxItems: 3
          description: Battery percent at 08:00, 12:00 and 17:00 Dhaka.
          items: { type: [integer, 'null'], minimum: 0, maximum: 100 }
        plug: { type: integer, enum: [0, 1] }
        regained:
          oneOf:
            - { $ref: '#/components/schemas/Timestamp' }
            - type: 'null'
    SyncBatchRequest:
      type: object
      required: [batch_uuid, device_uuid, schema_version, app_version, trigger, sent_at_device, pending_rows, time_anchors, device_counts, records]
      additionalProperties: false
      properties:
        batch_uuid: { $ref: '#/components/schemas/Uuid' }
        device_uuid: { $ref: '#/components/schemas/Uuid' }
        schema_version: { type: integer, minimum: 1, maximum: 1000 }
        app_version: { $ref: '#/components/schemas/AppVersionString' }
        trigger: { $ref: '#/components/schemas/SyncTrigger' }
        sent_at_device: { $ref: '#/components/schemas/Timestamp' }
        pending_rows: { type: integer, minimum: 0 }
        time_anchors:
          type: array
          maxItems: 3
          items: { $ref: '#/components/schemas/TimeAnchor' }
        device_counts:
          type: object
          description: Business date to committed-row counts per type, for every date present in `records` plus today.
          propertyNames: { type: string, pattern: '^\d{4}-\d{2}-\d{2}$' }
          additionalProperties: { $ref: '#/components/schemas/TypeCounts' }
        device_money:
          type: object
          description: Business date to money totals (sent with day_submit and at least once per date).
          propertyNames: { type: string, pattern: '^\d{4}-\d{2}-\d{2}$' }
          additionalProperties: { $ref: '#/components/schemas/MoneyTotals' }
        telemetry:
          oneOf:
            - { $ref: '#/components/schemas/DeviceDayTelemetry' }
            - type: 'null'
        records:
          type: array
          minItems: 1
          maxItems: 500
          items: { $ref: '#/components/schemas/SyncRecord' }
    RecordAck:
      type: object
      required: [client_uuid, type, status]
      additionalProperties: false
      properties:
        client_uuid: { $ref: '#/components/schemas/Uuid' }
        type: { $ref: '#/components/schemas/RecordType' }
        status: { $ref: '#/components/schemas/AckStatus' }
        code:
          description: Present when status is rejected or quarantined.
          oneOf:
            - { $ref: '#/components/schemas/RecordOutcomeCode' }
            - type: 'null'
        retryable: { type: [boolean, 'null'], description: Present when status is rejected. }
        message_key: { type: [string, 'null'], pattern: '^[a-z0-9_.]{3,80}$' }
        server_id: { type: [integer, 'null'], format: int64, minimum: 1 }
    ServerTotals:
      type: object
      description: The server's view of one user and business date.
      required: [business_date, as_of, by_type, money]
      additionalProperties: false
      properties:
        business_date: { $ref: '#/components/schemas/BusinessDate' }
        as_of: { $ref: '#/components/schemas/Timestamp' }
        by_type:
          type: object
          propertyNames: { $ref: '#/components/schemas/RecordType' }
          additionalProperties: { $ref: '#/components/schemas/TypeOutcomeCounts' }
        money: { $ref: '#/components/schemas/MoneyTotals' }
    TypeOutcomeCounts:
      type: object
      required: [accepted, rejected, quarantined]
      additionalProperties: false
      properties:
        accepted: { type: integer, minimum: 0, description: 'Stored rows (accepted now or earlier, duplicates counted once).' }
        rejected: { type: integer, minimum: 0 }
        quarantined: { type: integer, minimum: 0 }
    RouteDayState:
      type: object
      required: [route_id, business_date, state, submit_cycle, submit_voided]
      additionalProperties: false
      properties:
        route_id: { $ref: '#/components/schemas/Id' }
        business_date: { $ref: '#/components/schemas/BusinessDate' }
        state: { $ref: '#/components/schemas/DayState' }
        planned: { type: boolean }
        submit_cycle: { type: integer, minimum: 1 }
        submit_voided: { type: boolean }
        submit_count_mismatch: { type: [boolean, 'null'] }
        logged_in_at:
          oneOf:
            - { $ref: '#/components/schemas/Timestamp' }
            - type: 'null'
        sales_submitted_at:
          oneOf:
            - { $ref: '#/components/schemas/Timestamp' }
            - type: 'null'
        final_submitted_at:
          oneOf:
            - { $ref: '#/components/schemas/Timestamp' }
            - type: 'null'
        rows_awaited: { type: [integer, 'null'], minimum: 0, description: 'While submit_pending_rows, device counts minus server totals.' }
        route_code: { type: [string, 'null'], maxLength: 40 }
        route_name: { type: [string, 'null'], maxLength: 120 }
        assigned_user_id: { type: [integer, 'null'], format: int64, minimum: 1 }
        acting_user_id: { type: [integer, 'null'], format: int64, minimum: 1 }
    SupervisorDayState:
      type: object
      required: [user_id, business_date, checked_in, sales_submitted]
      additionalProperties: false
      properties:
        user_id: { $ref: '#/components/schemas/Id' }
        business_date: { $ref: '#/components/schemas/BusinessDate' }
        checked_in: { type: boolean }
        sales_submitted: { type: boolean }
        submit_cycle: { type: integer, minimum: 1 }
    DayStateList:
      type: object
      required: [route_days]
      additionalProperties: false
      properties:
        route_days:
          type: array
          items: { $ref: '#/components/schemas/RouteDayState' }
        supervisor_day:
          oneOf:
            - { $ref: '#/components/schemas/SupervisorDayState' }
            - type: 'null'
    Resolution:
      type: object
      required: [client_uuid, type, resolution, resolved_at]
      additionalProperties: false
      properties:
        client_uuid: { $ref: '#/components/schemas/Uuid' }
        type: { $ref: '#/components/schemas/RecordType' }
        resolution: { type: string, enum: [accepted, accepted_with_fix, discarded] }
        resolved_at: { $ref: '#/components/schemas/Timestamp' }
    SyncBatchResponse:
      type: object
      required: [batch_uuid, replayed, received_at, acks, summary, server_totals, day_states, resolutions, hold_s, config_version, generation]
      additionalProperties: false
      properties:
        batch_uuid: { $ref: '#/components/schemas/Uuid' }
        replayed: { type: boolean, description: True when this is the stored response of an already-processed batch_uuid. }
        received_at: { $ref: '#/components/schemas/Timestamp' }
        acks:
          type: array
          description: Exactly one acknowledgement per request record, in request order (partition invariant).
          maxItems: 500
          items: { $ref: '#/components/schemas/RecordAck' }
        summary:
          type: object
          required: [accepted, duplicate, rejected, quarantined]
          additionalProperties: false
          properties:
            accepted: { type: integer, minimum: 0 }
            duplicate: { type: integer, minimum: 0 }
            rejected: { type: integer, minimum: 0 }
            quarantined: { type: integer, minimum: 0 }
        server_totals:
          type: array
          maxItems: 10
          description: For every business date present in the batch, plus today.
          items: { $ref: '#/components/schemas/ServerTotals' }
        day_states:
          type: array
          maxItems: 40
          items: { $ref: '#/components/schemas/RouteDayState' }
        supervisor_day:
          oneOf:
            - { $ref: '#/components/schemas/SupervisorDayState' }
            - type: 'null'
        resolutions:
          type: array
          maxItems: 200
          description: Server decisions on this user's quarantined records not yet delivered.
          items: { $ref: '#/components/schemas/Resolution' }
        hold_s: { type: integer, minimum: 0, maximum: 900, description: '> 0 asks the phone to pause automatic sync for this many seconds (plus jitter).' }
        config_version: { $ref: '#/components/schemas/ConfigVersionNumber' }
        bundle_version_current:
          oneOf:
            - { $ref: '#/components/schemas/BundleVersion' }
            - type: 'null'
        generation: { $ref: '#/components/schemas/Uuid' }
        directives:
          type: array
          maxItems: 5
          items: { $ref: '#/components/schemas/Directive' }
    SyncDigestRequest:
      type: object
      required: [device_uuid, items]
      additionalProperties: false
      properties:
        device_uuid: { $ref: '#/components/schemas/Uuid' }
        items:
          type: array
          maxItems: 200
          items:
            type: object
            required: [business_date, type, buckets]
            additionalProperties: false
            properties:
              business_date: { $ref: '#/components/schemas/BusinessDate' }
              type: { $ref: '#/components/schemas/RecordType' }
              buckets:
                type: array
                minItems: 16
                maxItems: 16
                description: Bucket i holds the acked client_uuids whose first hex digit is i; hash = sum of the first 8 bytes of each uuid modulo 2^64, as 16 hex digits.
                items:
                  type: object
                  required: [count, hash]
                  additionalProperties: false
                  properties:
                    count: { type: integer, minimum: 0 }
                    hash: { type: string, pattern: '^[0-9a-f]{16}$' }
    SyncDigestResponse:
      type: object
      required: [resend]
      additionalProperties: false
      properties:
        resend:
          type: array
          items:
            type: object
            required: [business_date, type, buckets]
            additionalProperties: false
            properties:
              business_date: { $ref: '#/components/schemas/BusinessDate' }
              type: { $ref: '#/components/schemas/RecordType' }
              buckets:
                type: array
                maxItems: 16
                items: { type: integer, minimum: 0, maximum: 15 }
    SyncTotalsResponse:
      type: object
      required: [totals, day_states]
      additionalProperties: false
      properties:
        totals: { $ref: '#/components/schemas/ServerTotals' }
        day_states:
          type: array
          items: { $ref: '#/components/schemas/RouteDayState' }
        supervisor_day:
          oneOf:
            - { $ref: '#/components/schemas/SupervisorDayState' }
            - type: 'null'
    ServerGeneration:
      type: object
      required: [generation, kind, minted_at]
      additionalProperties: false
      properties:
        generation: { $ref: '#/components/schemas/Uuid' }
        kind: { type: string, enum: [initial, failover, pitr] }
        restore_point_utc:
          oneOf:
            - { $ref: '#/components/schemas/Timestamp' }
            - type: 'null'
        lost_after_utc:
          oneOf:
            - { $ref: '#/components/schemas/Timestamp' }
            - type: 'null'
        minted_at: { $ref: '#/components/schemas/Timestamp' }
    # ---------- bundle ----------
    BundleMeta:
      type: object
      required: [bundle_version, valid_for_business_date, generated_at, server_time, user_id, role, config_version, schema_version, cursor, paged_sections]
      additionalProperties: false
      properties:
        bundle_version: { $ref: '#/components/schemas/BundleVersion' }
        valid_for_business_date: { $ref: '#/components/schemas/BusinessDate' }
        generated_at: { $ref: '#/components/schemas/Timestamp' }
        server_time: { $ref: '#/components/schemas/Timestamp' }
        user_id: { $ref: '#/components/schemas/Id' }
        role: { $ref: '#/components/schemas/Role' }
        config_version: { $ref: '#/components/schemas/ConfigVersionNumber' }
        schema_version: { type: integer, minimum: 1 }
        cursor: { $ref: '#/components/schemas/DeltaCursor' }
        is_prefetch: { type: boolean, description: True when `for` is a later date than today (never counts as a login). }
        paged_sections:
          type: array
          maxItems: 7
          items:
            type: object
            required: [section, pages, rows]
            additionalProperties: false
            properties:
              section: { $ref: '#/components/schemas/BundleSectionName' }
              pages: { type: integer, minimum: 1, maximum: 1000 }
              rows: { type: integer, minimum: 0 }
    BundleUser:
      type: object
      required: [user_id, username, full_name, role, locale, bind_ordinal, memo_seq_block_size]
      additionalProperties: false
      properties:
        user_id: { $ref: '#/components/schemas/Id' }
        username: { $ref: '#/components/schemas/Username' }
        full_name: { type: string, maxLength: 120 }
        role: { $ref: '#/components/schemas/Role' }
        designation: { type: [string, 'null'], maxLength: 60 }
        locale: { type: string, enum: [bn, en] }
        bind_ordinal: { type: integer, minimum: 0, maximum: 3 }
        memo_seq_block_size: { type: integer, minimum: 100, maximum: 999 }
        zone_id: { type: [integer, 'null'], format: int64, minimum: 1 }
        territory_id: { type: [integer, 'null'], format: int64, minimum: 1 }
    ResolvedConfigValue:
      type: object
      required: [key, value, scope_type, effective_from, requires_ack]
      additionalProperties: false
      properties:
        key: { $ref: '#/components/schemas/ConfigKeyName' }
        value: { $ref: '#/components/schemas/ConfigValueJson' }
        scope_type: { type: string, enum: [default, global, role, wing, division, territory, geo_class, zone, route, outlet, user, device], description: Scope of the winning row (`default` = registry default). }
        scope_id: { type: [integer, 'null'], format: int64, minimum: 0 }
        effective_from:
          oneOf:
            - { $ref: '#/components/schemas/Timestamp' }
            - type: 'null'
        effective_to:
          oneOf:
            - { $ref: '#/components/schemas/Timestamp' }
            - type: 'null'
        config_version: { type: [integer, 'null'], format: int64, minimum: 0 }
        requires_ack: { type: boolean }
        bounds:
          oneOf:
            - { $ref: '#/components/schemas/ConfigBounds' }
            - type: 'null'
    ResolvedConfig:
      type: object
      required: [config_version, values, scheduled]
      additionalProperties: false
      properties:
        config_version: { $ref: '#/components/schemas/ConfigVersionNumber' }
        values:
          type: array
          maxItems: 300
          items: { $ref: '#/components/schemas/ResolvedConfigValue' }
        scheduled:
          type: array
          maxItems: 300
          description: Future-dated values within cfg.sys.schedule_horizon_days; applied by the phone at effective_from on trusted time.
          items: { $ref: '#/components/schemas/ResolvedConfigValue' }
    CodeItem:
      type: object
      required: [code, label_en, sort]
      additionalProperties: false
      properties:
        code: { type: string, pattern: '^[a-z][a-z0-9_]{1,40}$' }
        label_bn: { type: [string, 'null'], maxLength: 120 }
        label_en: { type: string, maxLength: 120 }
        sort: { type: integer }
        attrs:
          type: object
          description: List-specific attributes (for example `group` MFC or MKT on qc_fault_type).
          additionalProperties: { $ref: '#/components/schemas/JsonScalar' }
        valid_from: { $ref: '#/components/schemas/BusinessDate' }
        valid_to:
          oneOf:
            - { $ref: '#/components/schemas/BusinessDate' }
            - type: 'null'
    CodeList:
      type: object
      required: [list_key, items]
      additionalProperties: false
      properties:
        list_key: { $ref: '#/components/schemas/CodeListKey' }
        items:
          type: array
          maxItems: 100
          items: { $ref: '#/components/schemas/CodeItem' }
    CodeListCollection:
      type: object
      required: [lists]
      additionalProperties: false
      properties:
        lists:
          type: array
          items: { $ref: '#/components/schemas/CodeList' }
    CodeListWrite:
      type: object
      required: [items, change_reason]
      additionalProperties: false
      properties:
        items:
          type: array
          minItems: 1
          maxItems: 100
          items: { $ref: '#/components/schemas/CodeItem' }
        change_reason: { $ref: '#/components/schemas/ChangeReason' }
    BundleProductNode:
      type: object
      required: [id, level, name, sort]
      additionalProperties: false
      properties:
        id: { $ref: '#/components/schemas/Id' }
        level: { $ref: '#/components/schemas/ProductTreeLevel' }
        parent_id: { type: [integer, 'null'], format: int64, minimum: 1 }
        code: { type: [string, 'null'], maxLength: 40 }
        name: { type: string, maxLength: 120 }
        name_bn: { type: [string, 'null'], maxLength: 120 }
        sort: { type: integer }
    BundleProducts:
      type: object
      required: [nodes, skus]
      additionalProperties: false
      properties:
        nodes:
          type: array
          maxItems: 500
          items: { $ref: '#/components/schemas/BundleProductNode' }
        skus:
          type: array
          maxItems: 500
          items: { $ref: '#/components/schemas/Sku' }
    BundleOutlet:
      type: object
      description: Outlet as the phone needs it. `radius_m` and `max_accuracy_m` are already resolved for this outlet (outlet > route > zone > geo_class > territory > division > wing > global).
      required: [outlet_id, route_id, code, name, name_sort_key, owner_name, location_confirmed, cluster_id, cluster_name, channel, status, price_type, outlet_kind, radius_m, max_accuracy_m, open_due_mtk, programme_flags, pending_request]
      additionalProperties: false
      properties:
        outlet_id: { $ref: '#/components/schemas/Id' }
        route_id: { $ref: '#/components/schemas/Id' }
        code: { type: string, maxLength: 32 }
        name: { type: string, maxLength: 120 }
        name_bn: { type: [string, 'null'], maxLength: 120 }
        name_sort_key: { type: string, maxLength: 200 }
        owner_name: { type: string, maxLength: 120 }
        contact_number:
          description: Visible to the route's SR and supervisors per cfg.bundle.outlet_fields; null when masked.
          oneOf:
            - { $ref: '#/components/schemas/PhoneBd' }
            - type: 'null'
        lat: { type: [number, 'null'], minimum: -90, maximum: 90 }
        lng: { type: [number, 'null'], minimum: -180, maximum: 180 }
        location_confirmed: { type: boolean, description: False for missing coordinates and placeholder pins (first visit goes through the correction path). }
        provisional_lat: { type: [number, 'null'], minimum: -90, maximum: 90 }
        provisional_lng: { type: [number, 'null'], minimum: -180, maximum: 180 }
        cluster_id: { $ref: '#/components/schemas/Id' }
        cluster_name: { type: string, maxLength: 120 }
        channel: { type: string, maxLength: 20 }
        sub_channel_id: { type: [integer, 'null'], format: int64, minimum: 1 }
        geo_class: { type: [string, 'null'], enum: [Hill, Urban, SemiUrban, Rural, null] }
        status: { $ref: '#/components/schemas/OutletStatus' }
        price_type: { $ref: '#/components/schemas/SellingPriceType' }
        outlet_kind: { type: string, enum: [retail, wholesale] }
        radius_m: { type: integer, minimum: 10, maximum: 5000 }
        max_accuracy_m: { type: integer, minimum: 10, maximum: 1000 }
        visit_sequence: { type: [integer, 'null'], minimum: 1 }
        open_due_mtk: { $ref: '#/components/schemas/MtkNonNegative' }
        open_due_as_of:
          oneOf:
            - { $ref: '#/components/schemas/Timestamp' }
            - type: 'null'
        programme_flags:
          type: array
          maxItems: 8
          description: Eligibility dots shown before the outlet (codes and colours from cfg.ui.outlet_badges).
          items: { type: string, pattern: '^[a-z][a-z0-9_]{1,30}$' }
        pending_request: { type: boolean }
        suggested_qty:
          type: array
          maxItems: 500
          description: Suggested order quantity hook; empty until the formula is confirmed (cfg.sale.suggested_qty_enabled).
          items: { $ref: '#/components/schemas/SuggestedQty' }
    OpenMemo:
      type: object
      description: Credit memo with an open due, so the phone can collect and print the balance offline.
      required: [memo_client_uuid, memo_no, business_date, outlet_id, net_mtk, due_mtk]
      additionalProperties: false
      properties:
        memo_client_uuid: { $ref: '#/components/schemas/Uuid' }
        memo_no: { type: string, maxLength: 40 }
        business_date: { $ref: '#/components/schemas/BusinessDate' }
        outlet_id: { $ref: '#/components/schemas/Id' }
        net_mtk: { $ref: '#/components/schemas/Mtk' }
        due_mtk: { $ref: '#/components/schemas/MtkNonNegative' }
    TargetRow:
      type: object
      required: [scope_type, scope_id, month, product_level, product_id, std_target, std_unit, memo_target]
      additionalProperties: false
      properties:
        scope_type: { $ref: '#/components/schemas/TargetScopeType' }
        scope_id: { $ref: '#/components/schemas/Id' }
        month: { $ref: '#/components/schemas/Month' }
        product_level: { $ref: '#/components/schemas/ProductLevel' }
        product_id: { $ref: '#/components/schemas/Id' }
        std_target: { $ref: '#/components/schemas/Decimal3' }
        std_unit: { type: string, enum: [stick, piece, dozen] }
        memo_target: { type: integer, minimum: 0 }
    AchievementRow:
      type: object
      description: Month-to-date achievement known to the server; the phone adds its own unsynced sales on top.
      required: [scope_type, scope_id, month, product_level, product_id, achieved_qty_base, memo_count, as_of]
      additionalProperties: false
      properties:
        scope_type: { $ref: '#/components/schemas/TargetScopeType' }
        scope_id: { $ref: '#/components/schemas/Id' }
        month: { $ref: '#/components/schemas/Month' }
        product_level: { $ref: '#/components/schemas/ProductLevel' }
        product_id: { $ref: '#/components/schemas/Id' }
        achieved_qty_base: { type: integer, format: int64, minimum: 0 }
        memo_count: { type: integer, minimum: 0 }
        as_of: { $ref: '#/components/schemas/Timestamp' }
    RouteSnapshot:
      type: object
      description: Per-route section of the bundle; replaced as a whole when the route is added to the user.
      required: [route_id, route_snapshot_version, route, assignment_kind, planned_today, target_outlets, outlets, open_memos, sales_plan_sku_ids, targets, achievement_mtd, day_state]
      additionalProperties: false
      properties:
        route_id: { $ref: '#/components/schemas/Id' }
        route_snapshot_version: { type: integer, minimum: 1 }
        route: { $ref: '#/components/schemas/Route' }
        assignment_kind: { type: string, enum: [primary, cover] }
        acting_for_user_id: { type: [integer, 'null'], format: int64, minimum: 1 }
        planned_today: { type: boolean }
        target_outlets: { type: integer, minimum: 0, description: Frozen at the first bundle of the day (strike-rate denominator). }
        outlets:
          type: array
          maxItems: 2000
          items: { $ref: '#/components/schemas/BundleOutlet' }
        open_memos:
          type: array
          maxItems: 2000
          items: { $ref: '#/components/schemas/OpenMemo' }
        sales_plan_sku_ids:
          type: array
          maxItems: 500
          items: { $ref: '#/components/schemas/Id' }
        targets:
          type: array
          maxItems: 500
          items: { $ref: '#/components/schemas/TargetRow' }
        achievement_mtd:
          type: array
          maxItems: 500
          items: { $ref: '#/components/schemas/AchievementRow' }
        day_state: { $ref: '#/components/schemas/RouteDayState' }
    PrintTemplate:
      type: object
      required: [kind, version, font_columns, template_json]
      additionalProperties: false
      properties:
        kind: { type: string, enum: [cash_memo, credit_memo, offer_memo, drp_memo, zero_memo, edited_memo, stock_slip, day_summary, due_receipt, void_slip] }
        version: { type: integer, minimum: 1, maximum: 999 }
        font_columns: { type: integer, enum: [32, 42] }
        template_json: { type: string, maxLength: 20000, description: Template definition as a JSON string validated by the phone against its embedded schema; the phone falls back to its embedded default. }
    SupervisorSection:
      type: object
      description: AMO and TSO only.
      required: [zone_ids, route_ids, team, pending_outlet_requests]
      additionalProperties: false
      properties:
        zone_ids:
          type: array
          maxItems: 100
          items: { $ref: '#/components/schemas/Id' }
        route_ids:
          type: array
          maxItems: 2000
          items: { $ref: '#/components/schemas/Id' }
        team:
          type: array
          maxItems: 500
          items: { $ref: '#/components/schemas/TeamMember' }
        pending_outlet_requests:
          type: array
          maxItems: 2000
          items: { $ref: '#/components/schemas/OutletRequestSummary' }
        risk_signals:
          type: array
          maxItems: 500
          description: Open risk signals of the zone for the AMO Exceptions screen (reviewed offline with risk_review records).
          items: { $ref: '#/components/schemas/RiskSignal' }
        supervisor_day:
          oneOf:
            - { $ref: '#/components/schemas/SupervisorDayState' }
            - type: 'null'
    TeamMember:
      type: object
      required: [user_id, username, full_name, role, route_ids]
      additionalProperties: false
      properties:
        user_id: { $ref: '#/components/schemas/Id' }
        username: { $ref: '#/components/schemas/Username' }
        full_name: { type: string, maxLength: 120 }
        role: { $ref: '#/components/schemas/Role' }
        route_ids:
          type: array
          maxItems: 20
          items: { $ref: '#/components/schemas/Id' }
        phone_masked: { type: [string, 'null'], maxLength: 20 }
    CalendarSection:
      type: object
      required: [weekend_days, entries]
      additionalProperties: false
      properties:
        weekend_days:
          type: array
          maxItems: 7
          description: ISO weekday numbers (1 Monday .. 7 Sunday) that are not selling days; default [5] (Friday).
          items: { type: integer, minimum: 1, maximum: 7 }
        entries:
          type: array
          maxItems: 60
          description: Holidays, make-up days and emergency off-days from yesterday to 14 days ahead for the user's zones.
          items: { $ref: '#/components/schemas/Holiday' }
    RubricDef:
      type: object
      required: [rubric_id, version, kind, criteria]
      additionalProperties: false
      properties:
        rubric_id: { $ref: '#/components/schemas/Id' }
        version: { type: integer, minimum: 1 }
        kind: { type: string, enum: [joint_call, retailer_questionnaire] }
        criteria:
          type: array
          maxItems: 50
          items:
            type: object
            required: [criterion_id, label_en, answer_type]
            additionalProperties: false
            properties:
              criterion_id: { $ref: '#/components/schemas/Id' }
              label_bn: { type: [string, 'null'], maxLength: 300 }
              label_en: { type: string, maxLength: 300 }
              answer_type: { type: string, enum: [score_1_5, text, bool] }
              enabled: { type: boolean }
    SurveyDef:
      type: object
      required: [survey_id, version, questions]
      additionalProperties: false
      properties:
        survey_id: { $ref: '#/components/schemas/Id' }
        version: { type: integer, minimum: 1 }
        title_en: { type: string, maxLength: 120 }
        title_bn: { type: [string, 'null'], maxLength: 120 }
        questions:
          type: array
          maxItems: 50
          items:
            type: object
            required: [question_id, answer_type, label_en]
            additionalProperties: false
            properties:
              question_id: { $ref: '#/components/schemas/Id' }
              answer_type: { type: string, enum: [bool, num, option, text, photo_only] }
              label_en: { type: string, maxLength: 300 }
              label_bn: { type: [string, 'null'], maxLength: 300 }
              option_codes:
                type: array
                maxItems: 20
                items: { type: string, pattern: '^[a-z][a-z0-9_]{1,40}$' }
              requires_photo: { type: boolean }
    Bundle:
      type: object
      description: The day bundle (docs/24 s4.10). One snapshot of all routes assigned to the user for the business date.
      required: [meta, user, config, code_lists, products, prices, offers, calendar, templates, routes, tasks, reason_texts]
      additionalProperties: false
      properties:
        meta: { $ref: '#/components/schemas/BundleMeta' }
        user: { $ref: '#/components/schemas/BundleUser' }
        config: { $ref: '#/components/schemas/ResolvedConfig' }
        code_lists:
          type: array
          maxItems: 30
          items: { $ref: '#/components/schemas/CodeList' }
        products: { $ref: '#/components/schemas/BundleProducts' }
        prices:
          type: array
          maxItems: 3000
          description: Outlet, cc and distributor prices valid today plus any starting within cfg.sys.schedule_horizon_days.
          items: { $ref: '#/components/schemas/SkuPrice' }
        offers:
          type: array
          maxItems: 200
          items: { $ref: '#/components/schemas/Offer' }
        calendar: { $ref: '#/components/schemas/CalendarSection' }
        templates:
          type: array
          maxItems: 20
          items: { $ref: '#/components/schemas/PrintTemplate' }
        routes:
          type: array
          maxItems: 60
          items: { $ref: '#/components/schemas/RouteSnapshot' }
        tasks:
          type: array
          maxItems: 1000
          items: { $ref: '#/components/schemas/Task' }
        surveys:
          type: array
          maxItems: 20
          items: { $ref: '#/components/schemas/SurveyDef' }
        rubrics:
          type: array
          maxItems: 10
          items: { $ref: '#/components/schemas/RubricDef' }
        supervisor:
          oneOf:
            - { $ref: '#/components/schemas/SupervisorSection' }
            - type: 'null'
        reason_texts:
          type: object
          description: Record outcome code to bn and en text (REJECT and QUARANTINE codes only).
          propertyNames: { $ref: '#/components/schemas/RecordOutcomeCode' }
          additionalProperties:
            type: object
            required: [bn, en]
            additionalProperties: false
            properties:
              bn: { type: string, maxLength: 300 }
              en: { type: string, maxLength: 300 }
        device_policy_version: { $ref: '#/components/schemas/ConfigVersionNumber' }
        programmes:
          description: Loyalty, Astha and campaign data of the user's routes (docs/24 s4.14); null when no programme is active.
          oneOf:
            - { $ref: '#/components/schemas/ProgrammesSection' }
            - type: 'null'
        content:
          type: array
          maxItems: 50
          description: AV and KV items valid today or within cfg.sys.schedule_horizon_days.
          items: { $ref: '#/components/schemas/ContentItem' }
        tutorials:
          type: array
          maxItems: 100
          items: { $ref: '#/components/schemas/TutorialItem' }
        my_outlet_requests:
          type: array
          maxItems: 200
          description: The user's own outlet change requests of the last 30 days with status and rejection reason (SR and AMO own-request list).
          items: { $ref: '#/components/schemas/OutletRequestSummary' }
    BundlePage:
      type: object
      required: [bundle_version, section, page, pages, rows]
      additionalProperties: false
      properties:
        bundle_version: { $ref: '#/components/schemas/BundleVersion' }
        section: { $ref: '#/components/schemas/BundleSectionName' }
        page: { type: integer, minimum: 1 }
        pages: { type: integer, minimum: 1 }
        rows:
          description: Rows of the section; the element type follows `section`.
          type: array
          maxItems: 2000
          items:
            oneOf:
              - { $ref: '#/components/schemas/BundleOutlet' }
              - { $ref: '#/components/schemas/OpenMemo' }
              - { $ref: '#/components/schemas/SkuPrice' }
              - { $ref: '#/components/schemas/Offer' }
              - { $ref: '#/components/schemas/Task' }
              - { $ref: '#/components/schemas/TeamMember' }
              - { $ref: '#/components/schemas/OutletRequestSummary' }
    SectionDelta:
      type: object
      required: [upsert, delete]
      additionalProperties: false
      properties:
        upsert:
          type: array
          maxItems: 5000
          items:
            oneOf:
              - { $ref: '#/components/schemas/BundleOutlet' }
              - { $ref: '#/components/schemas/OpenMemo' }
              - { $ref: '#/components/schemas/SkuPrice' }
              - { $ref: '#/components/schemas/Offer' }
              - { $ref: '#/components/schemas/Task' }
              - { $ref: '#/components/schemas/TeamMember' }
              - { $ref: '#/components/schemas/OutletRequestSummary' }
              - { $ref: '#/components/schemas/Sku' }
              - { $ref: '#/components/schemas/TargetRow' }
              - { $ref: '#/components/schemas/AchievementRow' }
        delete:
          type: array
          maxItems: 5000
          description: Keys of removed rows (outlet_id, memo client_uuid, price id, offer id, task_uuid, user_id, request_uuid, sku id).
          items:
            oneOf:
              - type: integer
                format: int64
                minimum: 1
              - { $ref: '#/components/schemas/Uuid' }
    BundleDelta:
      type: object
      description: Changes since `base_cursor`; applied in one local transaction (old or new, never a mix).
      required: [meta, sections, routes_added, routes_removed, day_states]
      additionalProperties: false
      properties:
        meta:
          type: object
          required: [bundle_version, base_cursor, cursor, valid_for_business_date, config_version, server_time]
          additionalProperties: false
          properties:
            bundle_version: { $ref: '#/components/schemas/BundleVersion' }
            base_cursor: { $ref: '#/components/schemas/DeltaCursor' }
            cursor: { $ref: '#/components/schemas/DeltaCursor' }
            valid_for_business_date: { $ref: '#/components/schemas/BusinessDate' }
            config_version: { $ref: '#/components/schemas/ConfigVersionNumber' }
            server_time: { $ref: '#/components/schemas/Timestamp' }
        sections:
          type: object
          additionalProperties: false
          properties:
            outlets: { $ref: '#/components/schemas/SectionDelta' }
            open_memos: { $ref: '#/components/schemas/SectionDelta' }
            prices: { $ref: '#/components/schemas/SectionDelta' }
            offers: { $ref: '#/components/schemas/SectionDelta' }
            tasks: { $ref: '#/components/schemas/SectionDelta' }
            skus: { $ref: '#/components/schemas/SectionDelta' }
            targets: { $ref: '#/components/schemas/SectionDelta' }
            achievement_mtd: { $ref: '#/components/schemas/SectionDelta' }
            team: { $ref: '#/components/schemas/SectionDelta' }
            pending_outlet_requests: { $ref: '#/components/schemas/SectionDelta' }
        code_lists:
          type: array
          maxItems: 30
          description: Lists that changed, replaced whole.
          items: { $ref: '#/components/schemas/CodeList' }
        templates:
          type: array
          maxItems: 20
          items: { $ref: '#/components/schemas/PrintTemplate' }
        routes_added:
          type: array
          maxItems: 20
          items: { $ref: '#/components/schemas/RouteSnapshot' }
        routes_removed:
          type: array
          maxItems: 20
          items: { $ref: '#/components/schemas/Id' }
        day_states:
          type: array
          maxItems: 40
          items: { $ref: '#/components/schemas/RouteDayState' }
        resolutions:
          type: array
          maxItems: 200
          items: { $ref: '#/components/schemas/Resolution' }
    ConfigDelta:
      type: object
      required: [from_version, to_version, values, scheduled, removed_keys, calendar_changes]
      additionalProperties: false
      properties:
        from_version: { $ref: '#/components/schemas/ConfigVersionNumber' }
        to_version: { $ref: '#/components/schemas/ConfigVersionNumber' }
        values:
          type: array
          maxItems: 300
          description: Full resolved values of every key whose resolved value changed for the caller's chain.
          items: { $ref: '#/components/schemas/ResolvedConfigValue' }
        scheduled:
          type: array
          maxItems: 300
          items: { $ref: '#/components/schemas/ResolvedConfigValue' }
        removed_keys:
          type: array
          maxItems: 100
          items: { $ref: '#/components/schemas/ConfigKeyName' }
        calendar_changes:
          type: array
          maxItems: 60
          items: { $ref: '#/components/schemas/Holiday' }
        outlet_radius_changes:
          type: array
          maxItems: 5000
          description: Outlets of the caller's routes whose resolved radius_m or max_accuracy_m changed.
          items:
            type: object
            required: [outlet_id, radius_m, max_accuracy_m]
            additionalProperties: false
            properties:
              outlet_id: { $ref: '#/components/schemas/Id' }
              radius_m: { type: integer, minimum: 10, maximum: 5000 }
              max_accuracy_m: { type: integer, minimum: 10, maximum: 1000 }
        policy_changed: { type: boolean, description: True when the device policy version changed (fetch GET /v1/devices/me/policy). }

    # ---------- media ----------
    MediaSasRequest:
      type: object
      required: [items]
      additionalProperties: false
      properties:
        items:
          type: array
          minItems: 1
          maxItems: 10
          items:
            type: object
            required: [media_uuid, purpose, sha256, bytes, business_date, mime]
            additionalProperties: false
            properties:
              media_uuid: { $ref: '#/components/schemas/Uuid' }
              purpose: { $ref: '#/components/schemas/MediaPurpose' }
              sha256: { $ref: '#/components/schemas/Sha256Hex' }
              bytes: { type: integer, minimum: 1, maximum: 307200 }
              business_date: { $ref: '#/components/schemas/BusinessDate' }
              mime: { type: string, const: image/jpeg }
    MediaSasResponse:
      type: object
      required: [items]
      additionalProperties: false
      properties:
        items:
          type: array
          maxItems: 10
          items:
            type: object
            required: [media_uuid, method, upload_url, blob_path, required_headers, expires_at]
            additionalProperties: false
            properties:
              media_uuid: { $ref: '#/components/schemas/Uuid' }
              method: { type: string, const: PUT }
              upload_url: { type: string, format: uri, maxLength: 2000 }
              blob_path: { type: string, maxLength: 200 }
              required_headers:
                type: object
                required: [x-ms-blob-type, Content-Type]
                additionalProperties: false
                properties:
                  x-ms-blob-type: { type: string, const: BlockBlob }
                  Content-Type: { type: string, const: image/jpeg }
              expires_at: { $ref: '#/components/schemas/Timestamp' }
              already_uploaded: { type: boolean, description: 'True when a blob with the same sha256 already exists (skip the PUT, send media_meta).' }
    MediaReadUrl:
      type: object
      required: [url, expires_at]
      additionalProperties: false
      properties:
        url: { type: string, format: uri, maxLength: 2000 }
        expires_at: { $ref: '#/components/schemas/Timestamp' }

    # ---------- app ----------
    UpdateCheck:
      type: object
      required: [update_available, blocked, min_version_code]
      additionalProperties: false
      properties:
        update_available: { type: boolean }
        blocked: { type: boolean, description: The installed version is in cfg.release.blocked_version_codes (no new captures; upload continues). }
        min_version_code: { type: integer, minimum: 1 }
        latest:
          oneOf:
            - { $ref: '#/components/schemas/AppRelease' }
            - type: 'null'
        prompt_policy: { type: string, enum: [silent, prompt, force_after_date] }
        wifi_only: { type: boolean }
    AppHome:
      type: object
      required: [as_of, business_date, node, kpis]
      additionalProperties: false
      properties:
        as_of: { $ref: '#/components/schemas/Timestamp' }
        business_date: { $ref: '#/components/schemas/BusinessDate' }
        node: { $ref: '#/components/schemas/NodeRef' }
        kpis: { $ref: '#/components/schemas/DashboardKpis' }
        team:
          type: array
          maxItems: 200
          items: { $ref: '#/components/schemas/TeamDayRow' }
        targets:
          oneOf:
            - { $ref: '#/components/schemas/TargetAchievement' }
            - type: 'null'
    TeamDayRow:
      type: object
      required: [user_id, full_name, route_id, state, visited, successful_calls, net_mtk]
      additionalProperties: false
      properties:
        user_id: { $ref: '#/components/schemas/Id' }
        full_name: { type: string, maxLength: 120 }
        route_id: { $ref: '#/components/schemas/Id' }
        route_name: { type: string, maxLength: 120 }
        state: { $ref: '#/components/schemas/DayState' }
        visited: { type: integer, minimum: 0 }
        target_outlets: { type: integer, minimum: 0 }
        successful_calls: { type: integer, minimum: 0 }
        net_mtk: { $ref: '#/components/schemas/Mtk' }
        last_sync_at:
          oneOf:
            - { $ref: '#/components/schemas/Timestamp' }
            - type: 'null'

    # ---------- day ----------
    SalesSubmitRequest:
      type: object
      required: [client_uuid, scope, business_date, submit_cycle, device_counts, device_money, submitted_with_dues, dues_outstanding_mtk]
      additionalProperties: false
      properties:
        client_uuid: { $ref: '#/components/schemas/Uuid' }
        scope: { type: string, enum: [route_day, supervisor_day] }
        route_id: { type: [integer, 'null'], format: int64, minimum: 1 }
        business_date: { $ref: '#/components/schemas/BusinessDate' }
        submit_cycle: { type: integer, minimum: 1, maximum: 50 }
        device_counts: { $ref: '#/components/schemas/TypeCounts' }
        device_money: { $ref: '#/components/schemas/MoneyTotals' }
        submitted_with_dues: { type: boolean }
        dues_outstanding_mtk: { $ref: '#/components/schemas/MtkNonNegative' }
    FinalSubmitPreview:
      type: object
      required: [zone_id, business_date, already_submitted, routes]
      additionalProperties: false
      properties:
        zone_id: { $ref: '#/components/schemas/Id' }
        business_date: { $ref: '#/components/schemas/BusinessDate' }
        already_submitted: { type: boolean }
        submitted_at:
          oneOf:
            - { $ref: '#/components/schemas/Timestamp' }
            - type: 'null'
        submitted_by: { type: [string, 'null'], maxLength: 120 }
        routes:
          type: array
          maxItems: 200
          items:
            type: object
            required: [route_id, route_code, route_name, kind, state, had_data, memo_count, net_mtk]
            additionalProperties: false
            properties:
              route_id: { $ref: '#/components/schemas/Id' }
              route_code: { type: string, maxLength: 40 }
              route_name: { type: string, maxLength: 120 }
              kind: { type: string, enum: [sr, amo] }
              ff_user_id: { type: [integer, 'null'], format: int64, minimum: 1, description: Null means "SR Not Set" (normal for an AMO route). }
              ff_user_name: { type: [string, 'null'], maxLength: 120 }
              state: { $ref: '#/components/schemas/DayState' }
              had_data: { type: boolean }
              memo_count: { type: integer, minimum: 0 }
              net_mtk: { $ref: '#/components/schemas/Mtk' }
              pending_rows_reported: { type: [integer, 'null'], minimum: 0 }
        warnings:
          type: array
          maxItems: 20
          items: { type: string, enum: [routes_not_sales_submitted, routes_with_pending_rows, routes_not_logged_in] }
    FinalSubmitRequest:
      type: object
      required: [client_uuid, zone_id, business_date]
      additionalProperties: false
      properties:
        client_uuid: { $ref: '#/components/schemas/Uuid' }
        zone_id: { $ref: '#/components/schemas/Id' }
        business_date: { $ref: '#/components/schemas/BusinessDate' }
    FinalSubmitResult:
      type: object
      required: [zone_id, business_date, submitted_at, kind, route_count, memo_count, net_mtk]
      additionalProperties: false
      properties:
        zone_id: { $ref: '#/components/schemas/Id' }
        business_date: { $ref: '#/components/schemas/BusinessDate' }
        submitted_at: { $ref: '#/components/schemas/Timestamp' }
        kind: { type: string, enum: [manual, delegated, auto] }
        route_count: { type: integer, minimum: 0 }
        memo_count: { type: integer, minimum: 0 }
        net_mtk: { $ref: '#/components/schemas/Mtk' }
    SubmitVoidRequest:
      type: object
      required: [route_id, business_date, reason_code]
      additionalProperties: false
      properties:
        route_id: { $ref: '#/components/schemas/Id' }
        business_date: { $ref: '#/components/schemas/BusinessDate' }
        reason_code: { type: string, pattern: '^[a-z][a-z0-9_]{1,40}$' }
        note: { type: [string, 'null'], maxLength: 500 }
        confirmer_user_id: { type: [integer, 'null'], format: int64, minimum: 1, description: The zone TSO confirming a SUPPORT-initiated void. }
    DayReopenRequest:
      type: object
      required: [zone_id, business_date, reason]
      additionalProperties: false
      properties:
        zone_id: { $ref: '#/components/schemas/Id' }
        business_date: { $ref: '#/components/schemas/BusinessDate' }
        reason: { $ref: '#/components/schemas/ChangeReason' }
    DayReopenResult:
      type: object
      required: [zone_id, business_date, reopened_at, reopened_by]
      additionalProperties: false
      properties:
        zone_id: { $ref: '#/components/schemas/Id' }
        business_date: { $ref: '#/components/schemas/BusinessDate' }
        reopened_at: { $ref: '#/components/schemas/Timestamp' }
        reopened_by: { $ref: '#/components/schemas/Id' }
    CoverRequest:
      type: object
      required: [client_uuid, route_id, user_id, from_date, to_date, reason]
      additionalProperties: false
      properties:
        client_uuid: { $ref: '#/components/schemas/Uuid' }
        route_id: { $ref: '#/components/schemas/Id' }
        user_id: { $ref: '#/components/schemas/Id' }
        from_date: { $ref: '#/components/schemas/BusinessDate' }
        to_date: { $ref: '#/components/schemas/BusinessDate' }
        reason: { type: string, minLength: 3, maxLength: 300 }
    RouteDayPage:
      type: object
      required: [items, next_cursor]
      additionalProperties: false
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/RouteDayState' }
        next_cursor:
          oneOf:
            - { $ref: '#/components/schemas/PageCursor' }
            - type: 'null'
    DayException:
      type: object
      required: [exception_uuid, raised_by_user_id, reason_code, route_ids, from_date, to_date, status, raised_at]
      additionalProperties: false
      properties:
        exception_uuid: { $ref: '#/components/schemas/Uuid' }
        raised_by_user_id: { $ref: '#/components/schemas/Id' }
        reason_code: { type: string, pattern: '^[a-z][a-z0-9_]{1,40}$' }
        route_ids:
          type: array
          items: { $ref: '#/components/schemas/Id' }
        from_date: { $ref: '#/components/schemas/BusinessDate' }
        to_date: { $ref: '#/components/schemas/BusinessDate' }
        note: { type: [string, 'null'], maxLength: 500 }
        status: { $ref: '#/components/schemas/DecisionStatus' }
        raised_at: { $ref: '#/components/schemas/Timestamp' }
        decided_by_user_id: { type: [integer, 'null'], format: int64, minimum: 1 }
        decided_at:
          oneOf:
            - { $ref: '#/components/schemas/Timestamp' }
            - type: 'null'
    DayExceptionPage:
      type: object
      required: [items, next_cursor]
      additionalProperties: false
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/DayException' }
        next_cursor:
          oneOf:
            - { $ref: '#/components/schemas/PageCursor' }
            - type: 'null'
    DecisionRequest:
      type: object
      required: [decision]
      additionalProperties: false
      properties:
        decision: { type: string, enum: [approve, reject] }
        note: { type: [string, 'null'], maxLength: 500 }
    ReasonRequest:
      type: object
      required: [reason]
      additionalProperties: false
      properties:
        reason: { $ref: '#/components/schemas/ChangeReason' }
    ChangeReason:
      type: string
      minLength: 10
      maxLength: 500
      description: Free-text reason stored in the audit log (at least 10 characters).
    DataVoidRequest:
      type: object
      required: [client_uuid, route_id, business_date, scope, reason]
      additionalProperties: false
      properties:
        client_uuid: { $ref: '#/components/schemas/Uuid' }
        route_id: { $ref: '#/components/schemas/Id' }
        business_date: { $ref: '#/components/schemas/BusinessDate' }
        scope: { type: string, enum: [web_entry, app_memos, all] }
        reason: { $ref: '#/components/schemas/ChangeReason' }
    DataVoidResult:
      type: object
      required: [route_id, business_date, scope, voided_at, tombstoned_records, pending_rows_reported]
      additionalProperties: false
      properties:
        route_id: { $ref: '#/components/schemas/Id' }
        business_date: { $ref: '#/components/schemas/BusinessDate' }
        scope: { type: string, enum: [web_entry, app_memos, all] }
        voided_at: { $ref: '#/components/schemas/Timestamp' }
        tombstoned_records: { type: integer, minimum: 0 }
        pending_rows_reported: { type: [integer, 'null'], minimum: 0, description: 'Last X-Pending-Rows of the route''s device, shown in the confirmation.' }

    # ---------- memos (read) ----------
    MemoView:
      type: object
      required: [memo_client_uuid, memo_no, business_date, outlet_id, outlet_name, route_id, user_id, status, totals, lines, discounts, print_count, entry_source]
      additionalProperties: false
      properties:
        memo_client_uuid: { $ref: '#/components/schemas/Uuid' }
        memo_no: { type: string, maxLength: 40 }
        business_date: { $ref: '#/components/schemas/BusinessDate' }
        outlet_id: { $ref: '#/components/schemas/Id' }
        outlet_name: { type: string, maxLength: 120 }
        route_id: { $ref: '#/components/schemas/Id' }
        user_id: { $ref: '#/components/schemas/Id' }
        status: { type: string, enum: [active, superseded, void] }
        supersedes_memo_no: { type: [string, 'null'], maxLength: 40 }
        totals:
          type: object
          required: [gross_mtk, offer_discount_mtk, drp_discount_mtk, qc_deduction_mtk, round_adj_mtk, net_mtk, paid_mtk, due_mtk]
          additionalProperties: false
          properties:
            gross_mtk: { $ref: '#/components/schemas/MtkNonNegative' }
            offer_discount_mtk: { $ref: '#/components/schemas/MtkNonNegative' }
            drp_discount_mtk: { $ref: '#/components/schemas/MtkNonNegative' }
            qc_deduction_mtk: { $ref: '#/components/schemas/MtkNonNegative' }
            round_adj_mtk: { type: integer, minimum: -5, maximum: 5 }
            net_mtk: { $ref: '#/components/schemas/Mtk' }
            paid_mtk: { $ref: '#/components/schemas/MtkNonNegative' }
            due_mtk: { $ref: '#/components/schemas/Mtk' }
        lines:
          type: array
          maxItems: 60
          items: { $ref: '#/components/schemas/MemoLinePayload' }
        discounts:
          type: array
          maxItems: 120
          items: { $ref: '#/components/schemas/MemoDiscountPayload' }
        printed_at:
          oneOf:
            - { $ref: '#/components/schemas/Timestamp' }
            - type: 'null'
        print_count: { type: integer, minimum: 0 }
        entry_source: { type: string, enum: [app, manual, migration] }
    MemoPage:
      type: object
      required: [items, next_cursor]
      additionalProperties: false
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/MemoView' }
        next_cursor:
          oneOf:
            - { $ref: '#/components/schemas/PageCursor' }
            - type: 'null'

    # ---------- outlet requests ----------
    OutletRequestSummary:
      type: object
      required: [request_uuid, request_type, status, requested_by_user_id, requested_at]
      additionalProperties: false
      properties:
        request_uuid: { $ref: '#/components/schemas/Uuid' }
        request_type: { $ref: '#/components/schemas/OutletRequestType' }
        status: { $ref: '#/components/schemas/OutletRequestStatus' }
        outlet_id: { type: [integer, 'null'], format: int64, minimum: 1 }
        outlet_name: { type: [string, 'null'], maxLength: 120 }
        route_id: { type: [integer, 'null'], format: int64, minimum: 1 }
        cluster_id: { type: [integer, 'null'], format: int64, minimum: 1 }
        requested_by_user_id: { $ref: '#/components/schemas/Id' }
        requested_at: { $ref: '#/components/schemas/Timestamp' }
        rejection_reason: { type: [string, 'null'], maxLength: 500 }
    OutletRequest:
      type: object
      required: [request_uuid, request_type, status, proposed, requested_by_user_id, requested_at, photos, events]
      additionalProperties: false
      properties:
        request_uuid: { $ref: '#/components/schemas/Uuid' }
        request_type: { $ref: '#/components/schemas/OutletRequestType' }
        status: { $ref: '#/components/schemas/OutletRequestStatus' }
        outlet_id: { type: [integer, 'null'], format: int64, minimum: 1 }
        proposed: { $ref: '#/components/schemas/OutletProposal' }
        route_id: { type: [integer, 'null'], format: int64, minimum: 1 }
        cluster_id: { type: [integer, 'null'], format: int64, minimum: 1 }
        requested_by_user_id: { $ref: '#/components/schemas/Id' }
        requested_at: { $ref: '#/components/schemas/Timestamp' }
        request_fix:
          oneOf:
            - { $ref: '#/components/schemas/GeoFix' }
            - type: 'null'
        moved_m: { type: [number, 'null'], minimum: 0 }
        requires_tso: { type: boolean }
        flags:
          type: array
          items: { type: string, enum: [remote_verification, moved_to_home, low_accuracy, mocked_fix] }
        photos:
          type: array
          maxItems: 6
          items: { $ref: '#/components/schemas/Uuid' }
        verified_by_user_id: { type: [integer, 'null'], format: int64, minimum: 1 }
        verified_at:
          oneOf:
            - { $ref: '#/components/schemas/Timestamp' }
            - type: 'null'
        verified_via: { type: [string, 'null'], enum: [app, web, null] }
        approved_by_user_id: { type: [integer, 'null'], format: int64, minimum: 1 }
        approved_at:
          oneOf:
            - { $ref: '#/components/schemas/Timestamp' }
            - type: 'null'
        rejection_reason: { type: [string, 'null'], maxLength: 500 }
        resulting_outlet_id: { type: [integer, 'null'], format: int64, minimum: 1 }
        events:
          type: array
          maxItems: 50
          items:
            type: object
            required: [event, actor_user_id, at]
            additionalProperties: false
            properties:
              event: { type: string, enum: [requested, verified, discarded, rejected, approved, lapsed] }
              actor_user_id: { $ref: '#/components/schemas/Id' }
              at: { $ref: '#/components/schemas/Timestamp' }
              note: { type: [string, 'null'], maxLength: 500 }
    OutletRequestPage:
      type: object
      required: [items, next_cursor]
      additionalProperties: false
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/OutletRequestSummary' }
        next_cursor:
          oneOf:
            - { $ref: '#/components/schemas/PageCursor' }
            - type: 'null'
    OutletRequestVerifyRequest:
      type: object
      required: [sub_channel_id]
      additionalProperties: false
      properties:
        sub_channel_id: { $ref: '#/components/schemas/Id' }
        geo_class: { type: [string, 'null'], enum: [Hill, Urban, SemiUrban, Rural, null] }
        note: { type: [string, 'null'], maxLength: 500 }
    OutletRequestApproveRequest:
      type: object
      required: [change_reason]
      additionalProperties: false
      properties:
        outlet_code: { type: [string, 'null'], pattern: '^[0-9A-Za-z][0-9A-Za-z._/-]{0,31}$', description: For new outlets; generated when null. }
        route_id: { type: [integer, 'null'], format: int64, minimum: 1, description: Required for AMO-created new outlets. }
        change_reason: { $ref: '#/components/schemas/ChangeReason' }

    # ---------- tasks and notifications ----------
    Task:
      type: object
      required: [task_uuid, task_type_code, title, assignee_user_id, assigned_by_user_id, status, created_at, source]
      additionalProperties: false
      properties:
        task_uuid: { $ref: '#/components/schemas/Uuid' }
        task_type_code: { type: string, pattern: '^[a-z][a-z0-9_]{1,40}$' }
        title: { type: string, maxLength: 120 }
        description: { type: [string, 'null'], maxLength: 1000 }
        assignee_user_id: { $ref: '#/components/schemas/Id' }
        assigned_by_user_id: { $ref: '#/components/schemas/Id' }
        route_id: { type: [integer, 'null'], format: int64, minimum: 1 }
        outlet_id: { type: [integer, 'null'], format: int64, minimum: 1 }
        due_date:
          oneOf:
            - { $ref: '#/components/schemas/BusinessDate' }
            - type: 'null'
        status: { $ref: '#/components/schemas/TaskStatus' }
        created_at: { $ref: '#/components/schemas/Timestamp' }
        resolved_at:
          oneOf:
            - { $ref: '#/components/schemas/Timestamp' }
            - type: 'null'
        resolution_note: { type: [string, 'null'], maxLength: 500 }
        source: { type: string, enum: [app, web] }
    TaskCreateRequest:
      type: object
      required: [task_uuid, task_type_code, assignee_user_id, title]
      additionalProperties: false
      properties:
        task_uuid: { $ref: '#/components/schemas/Uuid' }
        task_type_code: { type: string, pattern: '^[a-z][a-z0-9_]{1,40}$' }
        assignee_user_id: { $ref: '#/components/schemas/Id' }
        route_id: { type: [integer, 'null'], format: int64, minimum: 1 }
        outlet_id: { type: [integer, 'null'], format: int64, minimum: 1 }
        title: { type: string, minLength: 1, maxLength: 120 }
        description: { type: [string, 'null'], maxLength: 1000 }
        due_date:
          oneOf:
            - { $ref: '#/components/schemas/BusinessDate' }
            - type: 'null'
    TaskPage:
      type: object
      required: [items, next_cursor]
      additionalProperties: false
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/Task' }
        next_cursor:
          oneOf:
            - { $ref: '#/components/schemas/PageCursor' }
            - type: 'null'
    NotificationRequest:
      type: object
      required: [kind, scope_type, scope_id, title_en, body_en]
      additionalProperties: false
      properties:
        kind: { type: string, enum: [announcement, config_pull, bundle_pull] }
        scope_type: { type: string, enum: [global, wing, division, territory, zone, user, device] }
        scope_id: { type: integer, format: int64, minimum: 0 }
        title_en: { type: string, maxLength: 80 }
        title_bn: { type: [string, 'null'], maxLength: 80 }
        body_en: { type: string, maxLength: 300 }
        body_bn: { type: [string, 'null'], maxLength: 300 }
        urgent: { type: boolean, description: 'pull_after_s jitter U(0, 20) when true, U(0, 120) otherwise.' }
    NotificationAccepted:
      type: object
      required: [notification_id, devices_targeted]
      additionalProperties: false
      properties:
        notification_id: { $ref: '#/components/schemas/Uuid' }
        devices_targeted: { type: integer, minimum: 0 }

    # ---------- team and people ----------
    TeamLocation:
      type: object
      required: [user_id, full_name, route_ids, last_fix]
      additionalProperties: false
      properties:
        user_id: { $ref: '#/components/schemas/Id' }
        full_name: { type: string, maxLength: 120 }
        route_ids:
          type: array
          items: { $ref: '#/components/schemas/Id' }
        last_fix:
          type: [object, 'null']
          required: [lat, lng, at, source]
          additionalProperties: false
          properties:
            lat: { type: number, minimum: -90, maximum: 90 }
            lng: { type: number, minimum: -180, maximum: 180 }
            accuracy_m: { type: [number, 'null'], minimum: 0 }
            at: { $ref: '#/components/schemas/Timestamp' }
            source: { type: string, enum: [check_in, visit, check_out, breadcrumb] }
            age_min: { type: integer, minimum: 0 }
    TeamLocationList:
      type: object
      required: [as_of, items]
      additionalProperties: false
      properties:
        as_of: { $ref: '#/components/schemas/Timestamp' }
        items:
          type: array
          items: { $ref: '#/components/schemas/TeamLocation' }
    TeamStockList:
      type: object
      required: [as_of, business_date, items]
      additionalProperties: false
      properties:
        as_of: { $ref: '#/components/schemas/Timestamp' }
        business_date: { $ref: '#/components/schemas/BusinessDate' }
        items:
          type: array
          items:
            type: object
            required: [user_id, full_name, by_sku]
            additionalProperties: false
            properties:
              user_id: { $ref: '#/components/schemas/Id' }
              full_name: { type: string, maxLength: 120 }
              by_sku:
                type: array
                items:
                  type: object
                  required: [sku_id, base_unit, issued_qty_base, sold_qty_base, returned_qty_base, current_qty_base]
                  additionalProperties: false
                  properties:
                    sku_id: { $ref: '#/components/schemas/Id' }
                    base_unit: { type: string, enum: [stick, piece, dozen] }
                    issued_qty_base: { type: integer }
                    sold_qty_base: { $ref: '#/components/schemas/QtyBase' }
                    returned_qty_base: { $ref: '#/components/schemas/QtyBase' }
                    current_qty_base: { type: integer }
    LeaveApplication:
      type: object
      required: [leave_uuid, user_id, leave_type_code, from_date, days, to_date, reason, status]
      additionalProperties: false
      properties:
        leave_uuid: { $ref: '#/components/schemas/Uuid' }
        user_id: { $ref: '#/components/schemas/Id' }
        leave_type_code: { type: string, pattern: '^[a-z][a-z0-9_]{1,40}$' }
        from_date: { $ref: '#/components/schemas/BusinessDate' }
        days: { type: integer, minimum: 1 }
        to_date: { $ref: '#/components/schemas/BusinessDate' }
        reason: { type: string, maxLength: 500 }
        status: { $ref: '#/components/schemas/DecisionStatus' }
        decided_by_user_id: { type: [integer, 'null'], format: int64, minimum: 1 }
        decided_at:
          oneOf:
            - { $ref: '#/components/schemas/Timestamp' }
            - type: 'null'
    LeavePage:
      type: object
      required: [items, next_cursor]
      additionalProperties: false
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/LeaveApplication' }
        next_cursor:
          oneOf:
            - { $ref: '#/components/schemas/PageCursor' }
            - type: 'null'
    VisitPlan:
      type: object
      required: [plan_uuid, planner_user_id, plan_date, route_id, outlets]
      additionalProperties: false
      properties:
        plan_uuid: { $ref: '#/components/schemas/Uuid' }
        planner_user_id: { $ref: '#/components/schemas/Id' }
        plan_date: { $ref: '#/components/schemas/BusinessDate' }
        route_id: { $ref: '#/components/schemas/Id' }
        outlets:
          type: array
          items:
            type: object
            required: [outlet_id, status]
            additionalProperties: false
            properties:
              outlet_id: { $ref: '#/components/schemas/Id' }
              status: { type: string, enum: [pending, completed] }
              completed_at:
                oneOf:
                  - { $ref: '#/components/schemas/Timestamp' }
                  - type: 'null'
    VisitPlanPage:
      type: object
      required: [items, next_cursor]
      additionalProperties: false
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/VisitPlan' }
        next_cursor:
          oneOf:
            - { $ref: '#/components/schemas/PageCursor' }
            - type: 'null'
    Feedback:
      type: object
      required: [feedback_uuid, user_id, category_code, title, description, created_at]
      additionalProperties: false
      properties:
        feedback_uuid: { $ref: '#/components/schemas/Uuid' }
        user_id: { $ref: '#/components/schemas/Id' }
        category_code: { type: string, pattern: '^[a-z][a-z0-9_]{1,40}$' }
        title: { type: string, maxLength: 120 }
        description: { type: string, maxLength: 2000 }
        photo_uuid:
          oneOf:
            - { $ref: '#/components/schemas/Uuid' }
            - type: 'null'
        created_at: { $ref: '#/components/schemas/Timestamp' }
        status: { $ref: '#/components/schemas/FeedbackStatus' }
    FeedbackPage:
      type: object
      required: [items, next_cursor]
      additionalProperties: false
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/Feedback' }
        next_cursor:
          oneOf:
            - { $ref: '#/components/schemas/PageCursor' }
            - type: 'null'
    # ---------- dashboards ----------
    DashboardKpis:
      type: object
      description: KPI block (definitions in docs/24 s12.4). Percentages are 0 to 100 with 2 decimals, null when the denominator is 0.
      required: [target_routes, logged_in_routes, login_pct, sales_submitted_routes, submit_pct_of_logged_in, day_completion_pct, target_outlets, visited_outlets, successful_calls, strike_rate_pct, active_memo_count, gross_mtk, net_mtk, geo_valid_pct, force_sale_pct, mock_visits, suspicious_visits]
      additionalProperties: false
      properties:
        target_routes: { type: integer, minimum: 0 }
        logged_in_routes: { type: integer, minimum: 0 }
        login_pct: { type: [number, 'null'], minimum: 0, maximum: 100 }
        sales_submitted_routes: { type: integer, minimum: 0 }
        submit_pct_of_logged_in: { type: [number, 'null'], minimum: 0, maximum: 100 }
        day_completion_pct: { type: [number, 'null'], minimum: 0, maximum: 100 }
        target_outlets: { type: integer, minimum: 0 }
        visited_outlets: { type: integer, minimum: 0 }
        successful_calls: { type: integer, minimum: 0 }
        strike_rate_pct: { type: [number, 'null'], minimum: 0, maximum: 100 }
        active_memo_count: { type: integer, minimum: 0 }
        gross_mtk: { $ref: '#/components/schemas/MtkNonNegative' }
        net_mtk: { $ref: '#/components/schemas/Mtk' }
        geo_valid_pct: { type: [number, 'null'], minimum: 0, maximum: 100 }
        force_sale_pct: { type: [number, 'null'], minimum: 0, maximum: 100 }
        mock_visits: { type: integer, minimum: 0 }
        suspicious_visits: { type: integer, minimum: 0 }
        zones_with_target_routes: { type: [integer, 'null'], minimum: 0 }
        zones_final_submitted: { type: [integer, 'null'], minimum: 0 }
        final_submit_pct: { type: [number, 'null'], minimum: 0, maximum: 100 }
    CategoryVolume:
      type: object
      required: [category_code, base_unit, qty_base, net_mtk]
      additionalProperties: false
      properties:
        category_code: { type: string, pattern: '^[a-z][a-z0-9_]{1,30}$' }
        base_unit: { type: string, enum: [stick, piece, dozen] }
        qty_base: { type: integer, format: int64, minimum: 0 }
        report_unit: { type: [string, 'null'], enum: [stick, piece, dozen, box, pack, null] }
        qty_report: { oneOf: [ { $ref: '#/components/schemas/Decimal3' }, { type: 'null' } ] }
        net_mtk: { $ref: '#/components/schemas/Mtk' }
    DashboardSummary:
      type: object
      required: [as_of, from, to, node, kpis, by_category, children]
      description: Dashboard of a node; `by_channel`, `by_segment` and `by_brand` feed the TSO cards (By Channel STD, By Segment Value Contribution, By Brand Call/Memo Ratio).
      additionalProperties: false
      properties:
        as_of: { $ref: '#/components/schemas/Timestamp' }
        from: { $ref: '#/components/schemas/BusinessDate' }
        to: { $ref: '#/components/schemas/BusinessDate' }
        node: { $ref: '#/components/schemas/NodeRef' }
        kpis: { $ref: '#/components/schemas/DashboardKpis' }
        by_category:
          type: array
          maxItems: 10
          items: { $ref: '#/components/schemas/CategoryVolume' }
        by_channel:
          type: array
          maxItems: 20
          items: { $ref: '#/components/schemas/ChannelVolume' }
        by_segment:
          type: array
          maxItems: 50
          items: { $ref: '#/components/schemas/ChannelVolume' }
        by_brand:
          type: array
          maxItems: 100
          items: { $ref: '#/components/schemas/ChannelVolume' }
        children:
          type: array
          maxItems: 2000
          items:
            type: object
            required: [node, kpis]
            additionalProperties: false
            properties:
              node: { $ref: '#/components/schemas/NodeRef' }
              kpis: { $ref: '#/components/schemas/DashboardKpis' }
    DailyTrackingRow:
      type: object
      required: [route_id, route_name, zone_id, state, target_outlets, visited_outlets, successful_calls, active_memo_count, net_mtk, bucket]
      additionalProperties: false
      properties:
        route_id: { $ref: '#/components/schemas/Id' }
        route_name: { type: string, maxLength: 120 }
        zone_id: { $ref: '#/components/schemas/Id' }
        user_id: { type: [integer, 'null'], format: int64, minimum: 1 }
        user_name: { type: [string, 'null'], maxLength: 120 }
        state: { $ref: '#/components/schemas/DayState' }
        target_outlets: { type: integer, minimum: 0 }
        visited_outlets: { type: integer, minimum: 0 }
        successful_calls: { type: integer, minimum: 0 }
        active_memo_count: { type: integer, minimum: 0 }
        net_mtk: { $ref: '#/components/schemas/Mtk' }
        by_category:
          type: array
          maxItems: 10
          items: { $ref: '#/components/schemas/CategoryVolume' }
        tilldate_target_achievement_pct: { type: [number, 'null'], minimum: 0 }
        bucket: { type: string, enum: [ge_100, from_90, from_80, below_80, exception, not_logged_in] }
    DailyTrackingPage:
      type: object
      required: [as_of, business_date, items, next_cursor]
      additionalProperties: false
      properties:
        as_of: { $ref: '#/components/schemas/Timestamp' }
        business_date: { $ref: '#/components/schemas/BusinessDate' }
        items:
          type: array
          items: { $ref: '#/components/schemas/DailyTrackingRow' }
        next_cursor:
          oneOf:
            - { $ref: '#/components/schemas/PageCursor' }
            - type: 'null'
    LoginSubmitStatus:
      type: object
      required: [as_of, business_date, kpis, not_logged_in, logged_in_not_submitted, submitted]
      additionalProperties: false
      properties:
        as_of: { $ref: '#/components/schemas/Timestamp' }
        business_date: { $ref: '#/components/schemas/BusinessDate' }
        kpis: { $ref: '#/components/schemas/DashboardKpis' }
        not_logged_in:
          type: array
          items: { $ref: '#/components/schemas/RouteDayState' }
        logged_in_not_submitted:
          type: array
          items: { $ref: '#/components/schemas/RouteDayState' }
        submitted:
          type: array
          items: { $ref: '#/components/schemas/RouteDayState' }
        exceptions:
          type: array
          items: { $ref: '#/components/schemas/RouteDayState' }
    SyncHealthRow:
      type: object
      required: [user_id, device_id, app_version, pending_rows_reported, rejected_count, quarantined_count, held_rows_alert]
      additionalProperties: false
      properties:
        user_id: { $ref: '#/components/schemas/Id' }
        username: { type: string, maxLength: 40 }
        route_ids:
          type: array
          items: { $ref: '#/components/schemas/Id' }
        device_id: { $ref: '#/components/schemas/Id' }
        device_model: { type: [string, 'null'], maxLength: 80 }
        app_version: { $ref: '#/components/schemas/AppVersionString' }
        last_contact_at:
          oneOf:
            - { $ref: '#/components/schemas/Timestamp' }
            - type: 'null'
        last_batch_at:
          oneOf:
            - { $ref: '#/components/schemas/Timestamp' }
            - type: 'null'
        pending_rows_reported: { type: integer, minimum: 0 }
        last_sync_error: { type: [string, 'null'], maxLength: 60 }
        rejected_count: { type: integer, minimum: 0 }
        quarantined_count: { type: integer, minimum: 0 }
        submit_count_mismatch: { type: [boolean, 'null'] }
        held_rows_alert: { type: boolean, description: Pending rows reported and no contact for more than cfg.sla.pending_rows_alert_h. }
        trust_level: { $ref: '#/components/schemas/TrustLevel' }
        sync_p95_s: { type: [number, 'null'], minimum: 0, description: Capture-to-ack latency p95 today. }
    SyncHealthPage:
      type: object
      required: [as_of, summary, items, next_cursor]
      additionalProperties: false
      properties:
        as_of: { $ref: '#/components/schemas/Timestamp' }
        summary:
          type: object
          required: [devices, devices_with_pending, held_rows_alerts, rejected, quarantined, mismatched_route_days]
          additionalProperties: false
          properties:
            devices: { type: integer, minimum: 0 }
            devices_with_pending: { type: integer, minimum: 0 }
            held_rows_alerts: { type: integer, minimum: 0 }
            rejected: { type: integer, minimum: 0 }
            quarantined: { type: integer, minimum: 0 }
            mismatched_route_days: { type: integer, minimum: 0 }
        items:
          type: array
          items: { $ref: '#/components/schemas/SyncHealthRow' }
        next_cursor:
          oneOf:
            - { $ref: '#/components/schemas/PageCursor' }
            - type: 'null'
    GeoValidationSummary:
      type: object
      required: [as_of, from, to, node, visits, geo_valid_pct, force_sale_pct, mock_pct, geo_mismatch_pct, suspicious_pct, signals_by_code, children]
      additionalProperties: false
      properties:
        as_of: { $ref: '#/components/schemas/Timestamp' }
        from: { $ref: '#/components/schemas/BusinessDate' }
        to: { $ref: '#/components/schemas/BusinessDate' }
        node: { $ref: '#/components/schemas/NodeRef' }
        visits: { type: integer, minimum: 0 }
        geo_valid_pct: { type: [number, 'null'], minimum: 0, maximum: 100 }
        force_sale_pct: { type: [number, 'null'], minimum: 0, maximum: 100 }
        mock_pct: { type: [number, 'null'], minimum: 0, maximum: 100 }
        geo_mismatch_pct: { type: [number, 'null'], minimum: 0, maximum: 100 }
        suspicious_pct: { type: [number, 'null'], minimum: 0, maximum: 100 }
        signals_by_code:
          type: object
          propertyNames: { $ref: '#/components/schemas/RiskSignalCode' }
          additionalProperties: { type: integer, minimum: 0 }
        children:
          type: array
          items:
            type: object
            required: [node, visits, geo_valid_pct, suspicious_visits]
            additionalProperties: false
            properties:
              node: { $ref: '#/components/schemas/NodeRef' }
              visits: { type: integer, minimum: 0 }
              geo_valid_pct: { type: [number, 'null'], minimum: 0, maximum: 100 }
              suspicious_visits: { type: integer, minimum: 0 }
    TargetAchievement:
      type: object
      required: [month, as_of, node, tilldate_basis, rows]
      additionalProperties: false
      properties:
        month: { $ref: '#/components/schemas/Month' }
        as_of: { $ref: '#/components/schemas/Timestamp' }
        node: { $ref: '#/components/schemas/NodeRef' }
        tilldate_basis: { type: string, enum: [calendar_days, working_days, route_days] }
        rows:
          type: array
          items:
            type: object
            required: [product_level, product_id, name, unit, target_qty, achieved_qty, tilldate_target_qty, remaining_qty]
            additionalProperties: false
            properties:
              product_level: { $ref: '#/components/schemas/ProductLevel' }
              product_id: { $ref: '#/components/schemas/Id' }
              name: { type: string, maxLength: 120 }
              unit: { type: string, enum: [stick, piece, dozen, box, pack] }
              target_qty: { $ref: '#/components/schemas/Decimal3' }
              achieved_qty: { $ref: '#/components/schemas/Decimal3' }
              tilldate_target_qty: { $ref: '#/components/schemas/Decimal3' }
              achievement_pct: { type: [number, 'null'], minimum: 0 }
              remaining_qty: { $ref: '#/components/schemas/Decimal3' }
              memo_target: { type: [integer, 'null'], minimum: 0 }
              memo_achieved: { type: [integer, 'null'], minimum: 0 }

    # ---------- risk ----------
    RiskSignal:
      type: object
      required: [signal_id, code, severity, business_date, subject_type, subject_id, score, evidence, status, config_version, created_at]
      additionalProperties: false
      properties:
        signal_id: { $ref: '#/components/schemas/Id' }
        code: { $ref: '#/components/schemas/RiskSignalCode' }
        severity: { type: integer, minimum: 1, maximum: 4 }
        business_date: { $ref: '#/components/schemas/BusinessDate' }
        subject_type: { type: string, enum: [user, device, visit, outlet, route, memo] }
        subject_id: { type: string, maxLength: 64, description: Id or client_uuid of the subject. }
        user_id: { type: [integer, 'null'], format: int64, minimum: 1 }
        route_id: { type: [integer, 'null'], format: int64, minimum: 1 }
        zone_id: { type: [integer, 'null'], format: int64, minimum: 1 }
        score: { type: number, minimum: 0, maximum: 300 }
        evidence:
          type: object
          description: The numbers that fired it (distances, speeds, counts, thresholds used).
          additionalProperties:
            oneOf:
              - { $ref: '#/components/schemas/JsonScalar' }
              - type: array
                maxItems: 50
                items: { $ref: '#/components/schemas/JsonScalar' }
        status: { $ref: '#/components/schemas/RiskSignalStatus' }
        config_version: { $ref: '#/components/schemas/ConfigVersionNumber' }
        created_at: { $ref: '#/components/schemas/Timestamp' }
        last_review:
          type: [object, 'null']
          required: [action, reviewer_user_id, at]
          additionalProperties: false
          properties:
            action: { type: string, enum: [reviewed, dismissed, confirmed] }
            reviewer_user_id: { $ref: '#/components/schemas/Id' }
            note: { type: [string, 'null'], maxLength: 500 }
            at: { $ref: '#/components/schemas/Timestamp' }
    RiskSignalPage:
      type: object
      required: [items, next_cursor]
      additionalProperties: false
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/RiskSignal' }
        next_cursor:
          oneOf:
            - { $ref: '#/components/schemas/PageCursor' }
            - type: 'null'
    RiskReviewRequest:
      type: object
      required: [review_uuid, action]
      additionalProperties: false
      properties:
        review_uuid: { $ref: '#/components/schemas/Uuid' }
        action: { type: string, enum: [reviewed, dismissed, confirmed] }
        note: { type: [string, 'null'], maxLength: 500 }

    # ---------- reports ----------
    ReportColumn:
      type: object
      required: [key, label_en, type]
      additionalProperties: false
      properties:
        key: { type: string, pattern: '^[a-z][a-z0-9_]{0,60}$' }
        label_en: { type: string, maxLength: 120 }
        label_bn: { type: [string, 'null'], maxLength: 120 }
        type: { type: string, enum: [string, integer, decimal, mtk, pct, date, timestamp, bool] }
        unit: { type: [string, 'null'], maxLength: 20 }
        pii: { type: boolean }
    ReportDefinition:
      type: object
      required: [report_key, title_en, area, grain, formats, columns, filters]
      additionalProperties: false
      properties:
        report_key: { $ref: '#/components/schemas/ReportKey' }
        title_en: { type: string, maxLength: 120 }
        title_bn: { type: [string, 'null'], maxLength: 120 }
        area: { type: string, enum: [sales, field_force, outlet, day_control, geo, finance, ops] }
        grain: { type: string, maxLength: 80 }
        formats:
          type: array
          items: { type: string, enum: [json, xlsx, pdf, print] }
        columns:
          type: array
          maxItems: 120
          items: { $ref: '#/components/schemas/ReportColumn' }
        filters:
          type: array
          description: ReportQuery members this report honours.
          items: { type: string, enum: [period, date_grouping, location, geo, category, product_type, products, active_status, sub_channels, field_force_type, std_criteria, memo_criteria, outlet_code] }
        columns_known: { type: boolean, description: False until a real sample workbook fixed the column set. }
    ReportDefinitionList:
      type: object
      required: [items]
      additionalProperties: false
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/ReportDefinition' }
    Criteria:
      type: object
      required: [op, value]
      additionalProperties: false
      properties:
        op: { type: string, enum: ['>', '>=', '=', '<=', '<'] }
        value: { type: number }
    ReportQuery:
      type: object
      description: One parameter object for every report (docs/24 s12.3). Geo selectors only narrow; omitted = the whole reach.
      required: [period, output]
      additionalProperties: false
      properties:
        period:
          type: object
          additionalProperties: false
          properties:
            from: { $ref: '#/components/schemas/BusinessDate' }
            to: { $ref: '#/components/schemas/BusinessDate' }
            date: { $ref: '#/components/schemas/BusinessDate' }
            month: { $ref: '#/components/schemas/Month' }
        date_grouping: { type: string, enum: [total, day, week, month], default: total }
        location: { type: string, enum: [wing, division, territory, zone, route, outlet, user] }
        geo:
          type: object
          additionalProperties: false
          properties:
            wing: { type: array, maxItems: 50, items: { $ref: '#/components/schemas/Id' } }
            division: { type: array, maxItems: 100, items: { $ref: '#/components/schemas/Id' } }
            territory: { type: array, maxItems: 300, items: { $ref: '#/components/schemas/Id' } }
            zone: { type: array, maxItems: 1100, items: { $ref: '#/components/schemas/Id' } }
            route: { type: array, maxItems: 2000, items: { $ref: '#/components/schemas/Id' } }
        category: { type: array, maxItems: 10, items: { $ref: '#/components/schemas/Id' } }
        product_type: { $ref: '#/components/schemas/ProductLevel' }
        products: { type: array, maxItems: 500, items: { $ref: '#/components/schemas/Id' } }
        active_status: { type: string, enum: [all, active, inactive], default: all }
        sub_channels: { type: array, maxItems: 20, items: { $ref: '#/components/schemas/Id' } }
        field_force_type: { type: string, enum: [sr, amo, all], default: all }
        std_criteria: { $ref: '#/components/schemas/Criteria' }
        memo_criteria: { $ref: '#/components/schemas/Criteria' }
        outlet_code: { type: [string, 'null'], maxLength: 32 }
        output:
          type: object
          required: [format]
          additionalProperties: false
          properties:
            format: { type: string, enum: [json, xlsx, pdf, print] }
            page: { type: integer, minimum: 1, default: 1 }
            page_size: { type: integer, enum: [10, 25, 50, 100, 500], default: 50 }
            sort:
              type: array
              maxItems: 3
              items:
                type: object
                required: [col, dir]
                additionalProperties: false
                properties:
                  col: { type: string, pattern: '^[a-z][a-z0-9_]{0,60}$' }
                  dir: { type: string, enum: [asc, desc] }
    ReportResult:
      type: object
      required: [report_key, as_of, columns, rows, page, page_size, total_rows]
      additionalProperties: false
      properties:
        report_key: { $ref: '#/components/schemas/ReportKey' }
        as_of: { $ref: '#/components/schemas/Timestamp' }
        columns:
          type: array
          items: { $ref: '#/components/schemas/ReportColumn' }
        rows:
          type: array
          maxItems: 500
          items:
            type: object
            additionalProperties: { $ref: '#/components/schemas/JsonScalar' }
        totals:
          type: [object, 'null']
          additionalProperties: { $ref: '#/components/schemas/JsonScalar' }
        page: { type: integer, minimum: 1 }
        page_size: { type: integer, minimum: 1 }
        total_rows: { type: integer, minimum: 0 }
    ExportJob:
      type: object
      required: [export_id, report_key, status, created_at]
      additionalProperties: false
      properties:
        export_id: { $ref: '#/components/schemas/Uuid' }
        report_key: { $ref: '#/components/schemas/ReportKey' }
        status: { type: string, enum: [queued, running, done, failed] }
        row_count: { type: [integer, 'null'], minimum: 0 }
        created_at: { $ref: '#/components/schemas/Timestamp' }
        download_url: { type: [string, 'null'], format: uri, maxLength: 2000 }
        expires_at:
          oneOf:
            - { $ref: '#/components/schemas/Timestamp' }
            - type: 'null'
        error: { type: [string, 'null'], maxLength: 300 }

    # ---------- quarantine ----------
    QuarantineItem:
      type: object
      required: [quarantine_id, client_uuid, type, code, status, user_id, business_date, received_at, payload]
      additionalProperties: false
      properties:
        quarantine_id: { $ref: '#/components/schemas/Id' }
        client_uuid: { $ref: '#/components/schemas/Uuid' }
        type: { $ref: '#/components/schemas/RecordType' }
        code: { $ref: '#/components/schemas/RecordOutcomeCode' }
        status: { $ref: '#/components/schemas/QuarantineStatus' }
        user_id: { $ref: '#/components/schemas/Id' }
        device_id: { type: [integer, 'null'], format: int64, minimum: 1 }
        route_id: { type: [integer, 'null'], format: int64, minimum: 1 }
        business_date: { $ref: '#/components/schemas/BusinessDate' }
        received_at: { $ref: '#/components/schemas/Timestamp' }
        payload: { $ref: '#/components/schemas/SyncRecord' }
        detail: { type: [string, 'null'], maxLength: 1000 }
        resolved_by_user_id: { type: [integer, 'null'], format: int64, minimum: 1 }
        resolved_at:
          oneOf:
            - { $ref: '#/components/schemas/Timestamp' }
            - type: 'null'
        resolution_note: { type: [string, 'null'], maxLength: 500 }
    QuarantinePage:
      type: object
      required: [items, next_cursor]
      additionalProperties: false
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/QuarantineItem' }
        next_cursor:
          oneOf:
            - { $ref: '#/components/schemas/PageCursor' }
            - type: 'null'
    QuarantineResolveRequest:
      type: object
      required: [action, reason]
      additionalProperties: false
      properties:
        action: { type: string, enum: [accept, accept_with_fix, discard, return_to_device], description: return_to_device asks the phone to re-send the row after a bundle refresh (it becomes retryable). }
        fixed_record:
          description: Required for accept_with_fix; same client_uuid and type as the quarantined record.
          oneOf:
            - { $ref: '#/components/schemas/SyncRecord' }
            - type: 'null'
        reason: { $ref: '#/components/schemas/ChangeReason' }

    # ---------- master data ----------
    MasterAudit:
      type: object
      required: [created_at, updated_at, version]
      properties:
        created_at: { $ref: '#/components/schemas/Timestamp' }
        updated_at: { $ref: '#/components/schemas/Timestamp' }
        version: { type: integer, minimum: 1, description: Optimistic-concurrency version (ETag is the quoted version). }
    GeoNode:
      allOf:
        - { $ref: '#/components/schemas/MasterAudit' }
        - type: object
          required: [id, level, code, name, status]
          properties:
            id: { $ref: '#/components/schemas/Id' }
            level: { $ref: '#/components/schemas/GeoLevel' }
            code: { type: string, pattern: '^[A-Za-z0-9][A-Za-z0-9_-]{0,39}$' }
            name: { type: string, maxLength: 120 }
            name_bn: { type: [string, 'null'], maxLength: 120 }
            parent_id: { type: [integer, 'null'], format: int64, minimum: 1, description: Null only for wings. }
            status: { $ref: '#/components/schemas/ActiveStatus' }
            dep_name: { type: [string, 'null'], maxLength: 120, description: Zones only. }
            email: { type: [string, 'null'], format: email, maxLength: 120 }
            address: { type: [string, 'null'], maxLength: 300 }
            pda_contact_no: { type: [string, 'null'], pattern: '^\+?[0-9]{5,15}$' }
      unevaluatedProperties: false
    GeoNodeWrite:
      type: object
      required: [code, name]
      additionalProperties: false
      properties:
        code: { type: string, pattern: '^[A-Za-z0-9][A-Za-z0-9_-]{0,39}$' }
        name: { type: string, minLength: 1, maxLength: 120 }
        name_bn: { type: [string, 'null'], maxLength: 120 }
        parent_id: { type: [integer, 'null'], format: int64, minimum: 1 }
        dep_name: { type: [string, 'null'], maxLength: 120 }
        email: { type: [string, 'null'], format: email, maxLength: 120 }
