openapi: 3.1.0
info:
  title: Aron API
  version: 1.0.0
  summary: The one API of the Aron rebuild (SR, AMO and TSO apps, web dashboards and admin portal).
  description: |
    Binding contract for every lane of the seven-day build. Rules that apply to every operation are in
    `docs/24-build-spec.md` section 3 (API conventions) and section 4 (sync protocol); this file is the
    machine-readable half and wins over prose when they disagree on a field name or type.

    Conventions in one place:
    - Base path `/v1`. JSON (`application/json`) with snake_case members; UTF-8; unknown members are rejected.
    - Requests and responses may be gzip-compressed (`Content-Encoding: gzip`, `Accept-Encoding: gzip`);
      `POST /v1/sync/batch` MUST be gzip-compressed.
    - Errors are RFC 9457 problem details (`application/problem+json`) with a stable `code`.
    - Every API-originated response carries `X-Aron-Api: 1`, `X-Request-Id`, `X-Server-Time`,
      `X-Config-Version` and `X-Server-Generation`. A response without `X-Aron-Api` came from the edge
      (WAF page, gateway timeout) and is a transport failure for the phone, never a business answer.
    - Money is integer milli-taka (`*_mtk`, 1 Tk = 1000). Quantities are integers in the SKU's base unit
      (`qty_base`: sticks, pieces or dozens). Timestamps are RFC 3339 UTC with milliseconds; business
      dates are `YYYY-MM-DD` in Asia/Dhaka.
    - Scope is never sent by the client: reach is derived on the server from the token. Narrowing
      selectors outside the caller's reach return 403 `ERR_OUT_OF_SCOPE`.
    - Lists use cursor pagination (`limit`, `cursor`, response `next_cursor`) and master data also accept
      `updated_since`.
  contact:
    name: Aron build lead (AKTCL)
    url: https://github.com/asefameerador96-ctrl/Aron-Pro-Max
  license:
    name: Proprietary, AKTCL. All rights reserved.
    url: https://github.com/asefameerador96-ctrl/Aron-Pro-Max
servers:
  - url: https://{host}
    description: 'Azure Front Door endpoint of an environment (rg-aron-dev for the build). Paths include /v1. Local development runs backend:app (ARON_ROLE=api) on port 8080 with the same paths.'
    variables:
      host:
        default: api.aron-dev.invalid
        description: Set per environment by the infra lane (custom domain first, Front Door default host second).
security:
  - bearerAuth: []
tags:
  - name: health
    description: Liveness, readiness and the unauthenticated public configuration.
  - name: auth
    description: Login, token refresh, logout, password change, device binding and web MFA (docs/24 s8).
  - name: devices
    description: Phone-side device enrolment, integrity nonce, policy and status (docs/24 s8, s10).
  - name: sync
    description: Bundle, delta, batch ingest, digest, totals and server generation (docs/24 s4).
  - name: media
    description: Photo upload by user-delegation SAS and read URLs.
  - name: config
    description: Device-side config delta (docs/24 s9).
  - name: app
    description: App home snapshots and the in-app update check.
  - name: day
    description: Sales submit, final submit, submit void, reopen, cover, route-day states and day exceptions.
  - name: memos
    description: Memo history beyond the phone's local window.
  - name: outlet-requests
    description: Outlet change requests (new, close, info, cluster, location) with verification and approval.
  - name: tasks
    description: Tasks assigned by AMO or TSO and resolved by the SR.
  - name: notifications
    description: Push token registration and admin nudges (FCM data messages only nudge a sync).
  - name: team
    description: Supervisor views of the team (last synced location, stock).
  - name: people
    description: Leave, visit plans and feedback read by the web.
  - name: dashboards
    description: Aggregates for the web and the AMO and TSO apps (read from dw, never the transaction log).
  - name: risk
    description: Geo-integrity and anti-spoofing risk signals for supervisors.
  - name: reports
    description: Report registry, ReportQuery execution (json and xlsx) and export jobs.
  - name: admin-geography
    description: Wings, divisions, territories, houses, zones and clusters.
  - name: admin-routes
    description: Routes with visit days, and route assignments.
  - name: admin-products
    description: Product tree, SKUs, prices with effective dates, sales plan and offers.
  - name: admin-users
    description: Users, roles, scope and credentials administration.
  - name: admin-outlets
    description: Outlet master data.
  - name: admin-targets
    description: Monthly targets needed for the displayed target and achievement.
  - name: admin-calendar
    description: Working-day calendar and code lists.
  - name: admin-config
    description: Config registry, change requests with reason, approval, history, rollback and reach.
  - name: admin-devices
    description: Device fleet, enrolment QR tokens, device OTPs, policy preview and remote directives.
  - name: admin-releases
    description: App releases, minimum and blocked versions, staged rollout.
  - name: admin-audit
    description: Immutable audit log reads.
  - name: programmes
    description: Loyalty (Diamond League), Astha targets and gift choices, campaign gifts (docs/24 s4.14).
  - name: web-entry
    description: Web back-office entry - route-day aggregate, Astha outlet-SKU, QC, paper backfill, unlock grants (docs/24 s12.6).
  - name: admin-content
    description: Surveys, rubrics, AV and KV content, tutorials, print templates, programmes and gifts.
  - name: admin-finance
    description: Dues adjustments and write-offs (maker-checker).
  - name: support
    description: PDA to Support uploads and web error reports.
paths:
  /v1/health:
    get:
      tags: [health]
      operationId: getHealth
      summary: Liveness and phone connectivity validation.
      description: Unauthenticated, cheap, never touches PostgreSQL. The phone uses HEAD with a 3 s timeout to validate connectivity (docs/24 s4.7 T3).
      security: []
      responses:
        '200':
          description: The API process is alive.
          headers:
            X-Aron-Api: { $ref: '#/components/headers/XAronApi' }
            X-Server-Time: { $ref: '#/components/headers/XServerTime' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Health' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
    head:
      tags: [health]
      operationId: headHealth
      summary: Connectivity check with no body.
      security: []
      responses:
        '200':
          description: Alive.
          headers:
            X-Aron-Api: { $ref: '#/components/headers/XAronApi' }
            X-Server-Time: { $ref: '#/components/headers/XServerTime' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
  /v1/health/ready:
    get:
      tags: [health]
      operationId: getReadiness
      summary: Readiness probe for Azure Container Apps (checks the database pool).
      security: []
      responses:
        '200':
          description: Ready to serve.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Health' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
  /v1/config/public:
    get:
      tags: [health]
      operationId: getPublicConfig
      summary: Unauthenticated values the login screen needs (minimum versions, banner, helpdesk).
      description: Cached at Front Door for 60 s. Never contains a secret or personal data.
      security: []
      responses:
        '200':
          description: Public configuration.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PublicConfig' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

  /v1/auth/login:
    post:
      tags: [auth]
      operationId: login
      summary: Password login (phone or web).
      description: |
        Phone: needs an enrolled device (`device_uuid`); returns `bind_required` with a short-lived `bind_token`
        when the user is not yet bound to this device and `cfg.auth.bind_otp_required` is true. Web: returns
        `mfa_required` with an `mfa_token` for roles in `cfg.auth.mfa_required_roles`. A version below the
        flavour's `cfg.release.min_version_code` gets 426. Rate limits: 10 per 15 min per username and 30 per
        15 min per device (docs/24 s3.6, s8.1).
      security: []
      parameters:
        - $ref: '#/components/parameters/XAppVersion'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoginRequest' }
      responses:
        '200':
          description: Outcome of the login.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LoginResponse' }
              examples:
                phoneOk:
                  summary: SR on a bound, enrolled phone
                  value:
                    status: ok
                    access_token: eyJhbGciOiJFUzI1NiIsImtpZCI6InNpZy0yMDI2LTEwIn0.eyJzdWIiOiIxMDAxIn0.sig
                    access_expires_at: '2026-10-05T03:12:44.120Z'
                    refresh_token: 3q2-7wEAAABqZW1hZ2ljLXJlZnJlc2gtdG9rZW4tZXhhbXBsZQ
                    refresh_expires_at: '2027-01-02T00:00:00.000Z'
                    upload_refresh_token: Ulb2FkLWdyYW50LXRva2VuLWV4YW1wbGUtMzJieXRlcw
                    bind_token: null
                    mfa_token: null
                    user: { user_id: 1001, username: sr334001, full_name: Testing Banani, role: SR, designation: SR, locale: bn }
                    scope: { scope_version: 7, nodes: [ { type: route, id: 10231, code: R-334-01, name: Apsis RouteDaily } ] }
                    device: { device_id: 501, bind_ordinal: 0, memo_seq_block_size: 500 }
                    config_version: 318
                    server_time: '2026-10-05T02:12:44.120Z'
                    min_app_version_code: 100
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '426': { $ref: '#/components/responses/UpgradeRequired' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
  /v1/auth/refresh:
    post:
      tags: [auth]
      operationId: refreshToken
      summary: Rotate a refresh token (full or upload grant).
      description: |
        Rotation with reuse detection: a replaced token presented within `cfg.auth.refresh_grace_s` (60 s)
        gets the stored replacement; after that the whole family is revoked (401 `ERR_AUTH_REFRESH_REUSED`).
        Phones send `X-Device-Proof`; the web sends the `aron_rt` HttpOnly cookie instead of a body token.
      security: []
      parameters:
        - $ref: '#/components/parameters/XDeviceId'
        - $ref: '#/components/parameters/XDeviceProof'
        - in: cookie
          name: aron_rt
          required: false
          description: Web refresh token cookie (HttpOnly, Secure, SameSite=Strict, Path=/v1/auth/refresh).
          schema: { type: string, minLength: 43, maxLength: 64 }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RefreshRequest' }
      responses:
        '200':
          description: New token pair.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TokenPair' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
  /v1/auth/logout:
    post:
      tags: [auth]
      operationId: logout
      summary: End a session; optionally revoke the upload grant after the outbox is empty.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LogoutRequest' }
      responses:
        '204': { description: Logged out. }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /v1/auth/change-password:
    post:
      tags: [auth]
      operationId: changePassword
      summary: Change the caller's password (policy-checked, revokes the user's other full-grant families).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ChangePasswordRequest' }
      responses:
        '204': { description: Password changed. }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
  /v1/auth/bind-device:
    post:
      tags: [auth]
      operationId: bindDevice
      summary: Bind the user to this enrolled phone with the 4-digit OTP the TSO reads on the web.
      description: Authorised with the `bind_token` from login (Bearer). Assigns the memo-number bind ordinal (docs/24 s7.5).
      parameters:
        - $ref: '#/components/parameters/XDeviceId'
        - $ref: '#/components/parameters/XDeviceProof'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/BindDeviceRequest' }
      responses:
        '200':
          description: Bound; tokens issued.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LoginResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
  /v1/auth/mfa/enrol:
    post:
      tags: [auth]
      operationId: enrolMfa
      summary: Start TOTP enrolment for the caller (web admin roles).
      responses:
        '200':
          description: TOTP secret URI and one-time recovery codes (shown once).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MfaEnrolment' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409': { $ref: '#/components/responses/Conflict' }
  /v1/auth/mfa/verify:
    post:
      tags: [auth]
      operationId: verifyMfa
      summary: Second login step for web admins (TOTP or recovery code).
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MfaVerifyRequest' }
      responses:
        '200':
          description: Login completed.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LoginResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
  /v1/auth/jwks:
    get:
      tags: [auth]
      operationId: getJwks
      summary: Public signing keys (JWKS) for access-token verification.
      security: []
      responses:
        '200':
          description: JSON Web Key Set (ES256 public keys; two during rotation).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Jwks' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
  /v1/me:
    get:
      tags: [auth]
      operationId: getMe
      summary: The caller's identity, role, permissions and scope summary.
      responses:
        '200':
          description: Principal.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Me' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /v1/devices/enrol:
    post:
      tags: [devices]
      operationId: enrolDevice
      summary: Register a factory-reset, device-owner phone with an enrolment token from the QR.
      description: |
        Called once by the field app right after QR provisioning (or after the dev-mode adb enrolment with a
        typed token). Unauthenticated: the enrolment token is the credential. Verifies the Keystore attestation
        chain (package, signing certificate, verified boot) and stores the device public key used by
        `X-Device-Proof` (docs/24 s8.3, s10.4).
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EnrolDeviceRequest' }
      responses:
        '201':
          description: Device enrolled.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EnrolDeviceResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
  /v1/devices/nonce:
    post:
      tags: [devices]
      operationId: createDeviceNonce
      summary: Single-use nonce for a Play Integrity request or a key re-attestation.
      description: Callable with a device proof alone (no user token) so an unbound enrolled phone can attest.
      security:
        - bearerAuth: []
        - {}
      parameters:
        - $ref: '#/components/parameters/XDeviceIdRequired'
        - $ref: '#/components/parameters/XDeviceProof'
      responses:
        '200':
          description: Nonce valid for 10 minutes.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DeviceNonce' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
  /v1/devices/me/policy:
    get:
      tags: [devices]
      operationId: getDevicePolicy
      summary: The device-owner policy for this phone (ETag = policy_version).
      security:
        - bearerAuth: []
        - {}
      parameters:
        - $ref: '#/components/parameters/XDeviceIdRequired'
        - $ref: '#/components/parameters/XDeviceProof'
        - $ref: '#/components/parameters/IfNoneMatch'
      responses:
        '200':
          description: Current policy.
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DevicePolicy' }
        '304': { $ref: '#/components/responses/NotModified' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /v1/devices/me/status:
    post:
      tags: [devices]
      operationId: reportDeviceStatus
      summary: Report policy, integrity and health status now (online path; the same object also rides the batch as `device_status`).
      security:
        - bearerAuth: []
        - {}
      parameters:
        - $ref: '#/components/parameters/XDeviceIdRequired'
        - $ref: '#/components/parameters/XDeviceProof'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DeviceStatusReport' }
      responses:
        '200':
          description: Server view of the device's trust and the current policy version.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DeviceStatusAck' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
  /v1/devices/me/push-token:
    put:
      tags: [notifications]
      operationId: registerPushToken
      summary: Register or replace the FCM token of this phone for the calling user.
      parameters:
        - $ref: '#/components/parameters/XDeviceIdRequired'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PushTokenRegistration' }
      responses:
        '204': { description: Stored. }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /v1/sync/bundle:
    get:
      tags: [sync]
      operationId: getBundle
      summary: Full day bundle for the caller and a business date (per-route snapshots inside).
      description: |
        The first request of Dhaka date D (200, 304 or a delta) marks `logged_in` for every route-day of the user
        (docs/24 s4.9). A request with `for` = the next working day is a pre-fetch and never a login. Sections
        above `cfg.bundle.page_threshold_rows` are listed in `meta.paged_sections` and fetched with
        `GET /v1/sync/bundle/page`. A version below the minimum app version gets 426 only for a NEW business date.
      parameters:
        - $ref: '#/components/parameters/XDeviceIdRequired'
        - $ref: '#/components/parameters/XAppVersion'
        - $ref: '#/components/parameters/XConfigVersionRequest'
        - $ref: '#/components/parameters/IfNoneMatch'
        - name: for
          in: query
          required: false
          description: Business date (Asia/Dhaka) the bundle is for; default today. At most the next working day.
          schema: { $ref: '#/components/schemas/BusinessDate' }
      responses:
        '200':
          description: Full bundle (gzip on the wire).
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
            X-Config-Version: { $ref: '#/components/headers/XConfigVersion' }
            X-Server-Generation: { $ref: '#/components/headers/XServerGeneration' }
            X-Server-Time: { $ref: '#/components/headers/XServerTime' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Bundle' }
              examples:
                sr:
                  $ref: '#/components/examples/BundleSr'
        '304': { $ref: '#/components/responses/NotModified' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '426': { $ref: '#/components/responses/UpgradeRequired' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
  /v1/sync/bundle/page:
    get:
      tags: [sync]
      operationId: getBundlePage
      summary: One page of a paged bundle section (AMO zone-wide outlet lists).
      parameters:
        - $ref: '#/components/parameters/XDeviceIdRequired'
        - name: bundle_version
          in: query
          required: true
          schema: { $ref: '#/components/schemas/BundleVersion' }
        - name: section
          in: query
          required: true
          schema: { $ref: '#/components/schemas/BundleSectionName' }
        - name: page
          in: query
          required: true
          schema: { type: integer, minimum: 1, maximum: 1000 }
      responses:
        '200':
          description: The page.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BundlePage' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '410': { $ref: '#/components/responses/Gone' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
  /v1/sync/delta:
    get:
      tags: [sync]
      operationId: getBundleDelta
      summary: Changes since a delta cursor for the same business date.
      description: |
        304 when nothing changed. 409 `ERR_BUNDLE_NEW_BUSINESS_DATE` when the cursor belongs to an older business
        date (fetch the full bundle for today; keep yesterday's cache for an unsubmitted day). 410
        `ERR_BUNDLE_CURSOR_EXPIRED` when the cursor is older than `cfg.bundle.delta_max_age_h` (fetch full).
      parameters:
        - $ref: '#/components/parameters/XDeviceIdRequired'
        - $ref: '#/components/parameters/XConfigVersionRequest'
        - name: since
          in: query
          required: true
          description: The `cursor` of the bundle or delta last applied.
          schema: { $ref: '#/components/schemas/DeltaCursor' }
        - name: for
          in: query
          required: false
          schema: { $ref: '#/components/schemas/BusinessDate' }
      responses:
        '200':
          description: Delta to apply in one local transaction.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BundleDelta' }
              examples:
                outletMoved:
                  $ref: '#/components/examples/DeltaExample'
        '304': { $ref: '#/components/responses/NotModified' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409': { $ref: '#/components/responses/Conflict' }
        '410': { $ref: '#/components/responses/Gone' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
  /v1/sync/batch:
    post:
      tags: [sync]
      operationId: postSyncBatch
      summary: Idempotent upload of outbox records; one acknowledgement per record.
      description: |
        Body MUST be gzip (`Content-Encoding: gzip`), at most 1 MiB compressed, 8 MiB decompressed (20:1 ratio
        guard), at most 500 records. Records are processed in array order. Idempotency: per record by
        `client_uuid` + payload hash, per batch by (`device_uuid`, `batch_uuid`): a repeat returns the stored
        response with `replayed: true`; the same `batch_uuid` with a different record set is 409. The upload grant
        (`aud = aron-upload`) may call this operation. Access tokens expired by at most 60 s are accepted here.
        Never blocked by the app-version gate (docs/24 s4).
      parameters:
        - $ref: '#/components/parameters/XDeviceIdRequired'
        - $ref: '#/components/parameters/XDeviceProof'
        - $ref: '#/components/parameters/XAppVersion'
        - $ref: '#/components/parameters/XConfigVersionRequest'
        - $ref: '#/components/parameters/XBatchAttempt'
        - $ref: '#/components/parameters/XPendingRows'
        - $ref: '#/components/parameters/XLastSyncError'
        - $ref: '#/components/parameters/XDeviceTime'
        - name: Content-Encoding
          in: header
          required: true
          schema: { type: string, enum: [gzip] }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SyncBatchRequest' }
            examples:
              saleFamily:
                $ref: '#/components/examples/SyncBatchRequestExample'
      responses:
        '200':
          description: The batch transaction committed; every record has exactly one acknowledgement.
          headers:
            X-Config-Version: { $ref: '#/components/headers/XConfigVersion' }
            X-Server-Generation: { $ref: '#/components/headers/XServerGeneration' }
            X-Server-Time: { $ref: '#/components/headers/XServerTime' }
            X-Bundle-Version-Current: { $ref: '#/components/headers/XBundleVersionCurrent' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SyncBatchResponse' }
              examples:
                mixed:
                  $ref: '#/components/examples/SyncBatchResponseExample'
                rejected:
                  $ref: '#/components/examples/SyncBatchResponseRejectExample'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/InternalError' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
  /v1/sync/digest:
    post:
      tags: [sync]
      operationId: postSyncDigest
      summary: Compare per-type bucket digests of recent days; the server names the buckets to re-send.
      parameters:
        - $ref: '#/components/parameters/XDeviceIdRequired'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SyncDigestRequest' }
      responses:
        '200':
          description: Buckets whose count or hash differ.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SyncDigestResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
  /v1/sync/totals:
    get:
      tags: [sync]
      operationId: getSyncTotals
      summary: Server totals for the caller and a business date (the Server column of Sales Submit).
      parameters:
        - $ref: '#/components/parameters/BusinessDateQueryRequired'
      responses:
        '200':
          description: Per-type counts, money totals and route-day states.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SyncTotalsResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
  /v1/sync/generation:
    get:
      tags: [sync]
      operationId: getServerGeneration
      summary: Statement of the current server generation after a failover or point-in-time restore.
      responses:
        '200':
          description: Generation record.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ServerGeneration' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /v1/media/sas:
    post:
      tags: [media]
      operationId: createMediaUploadUrls
      summary: Write-only user-delegation SAS URLs for up to 10 photos (15 minutes, one blob path each).
      description: The upload grant may call this operation. The record that references a photo always syncs first (docs/24 s4.11).
      parameters:
        - $ref: '#/components/parameters/XDeviceIdRequired'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MediaSasRequest' }
      responses:
        '200':
          description: One upload target per item.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MediaSasResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
  /v1/media/{media_uuid}/read-url:
    get:
      tags: [media]
      operationId: getMediaReadUrl
      summary: Short-lived read URL for a photo in the caller's reach (supervisors, web).
      parameters:
        - $ref: '#/components/parameters/MediaUuidPath'
      responses:
        '200':
          description: Read URL valid for 5 minutes.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MediaReadUrl' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /v1/config/delta:
    get:
      tags: [config]
      operationId: getConfigDelta
      summary: Resolved config changes for the caller's scope chain since a version.
      description: Called when a response's `X-Config-Version` is newer than the applied one, on foreground resume (at most every `cfg.sync.config_check_min_gap_min`) and on opening a visit. 304 when nothing relevant changed.
      parameters:
        - $ref: '#/components/parameters/XDeviceId'
        - name: since
          in: query
          required: true
          schema: { $ref: '#/components/schemas/ConfigVersionNumber' }
      responses:
        '200':
          description: Changes to apply in one local transaction.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ConfigDelta' }
        '304': { $ref: '#/components/responses/NotModified' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '410': { $ref: '#/components/responses/Gone' }

  /v1/app/home:
    get:
      tags: [app]
      operationId: getAppHome
      summary: Role-scoped KPI snapshot for the AMO and TSO app home screens (explicit open, never a timer).
      parameters:
        - $ref: '#/components/parameters/BusinessDateQuery'
      responses:
        '200':
          description: Snapshot with an as-of stamp.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AppHome' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
  /v1/app/update-check:
    get:
      tags: [app]
      operationId: checkForUpdate
      summary: Latest published release for this flavour and ABI, with the minimum and blocked versions.
      parameters:
        - $ref: '#/components/parameters/FlavourQuery'
        - name: version_code
          in: query
          required: true
          schema: { type: integer, minimum: 1, maximum: 2100000000 }
        - name: abi
          in: query
          required: true
          schema: { $ref: '#/components/schemas/Abi' }
      responses:
        '200':
          description: Update decision.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UpdateCheck' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /v1/day/sales-submit:
    post:
      tags: [day]
      operationId: postSalesSubmit
      summary: Online Sales Submit for a route-day or a supervisor-day (the phone normally sends a `day_submit` record).
      description: Idempotent by `client_uuid`. Settles per docs/24 s4.9 (state `submit_pending_rows` until the server totals reach the device counts, at most `cfg.day.submit_settle_timeout_min`).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SalesSubmitRequest' }
      responses:
        '200':
          description: Resulting state.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DayStateList' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
  /v1/day/final-submit/preview:
    get:
      tags: [day]
      operationId: getFinalSubmitPreview
      summary: Read before Final Submit (the "already submitted" alert fires here, at Get Sales Data).
      parameters:
        - $ref: '#/components/parameters/ZoneIdQueryRequired'
        - $ref: '#/components/parameters/BusinessDateQueryRequired'
      responses:
        '200':
          description: Zone-day preview.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FinalSubmitPreview' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /v1/day/final-submit:
    post:
      tags: [day]
      operationId: postFinalSubmit
      summary: Close a zone-day (TSO app or web). Online-only, once per zone and day.
      description: The same `client_uuid` replays the first success; a different one gets 409 `ERR_DAY_ALREADY_FINAL_SUBMITTED`.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/FinalSubmitRequest' }
      responses:
        '200':
          description: Zone-day final-submitted.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FinalSubmitResult' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
  /v1/day/submit-void:
    post:
      tags: [day]
      operationId: postSubmitVoid
      summary: Void the effective Sales Submit of one route-day (capture unlocks on the phone, submit_seq + 1).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SubmitVoidRequest' }
      responses:
        '200':
          description: New route-day state.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RouteDayState' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
  /v1/day/reopen:
    post:
      tags: [day]
      operationId: postDayReopen
      summary: Audited reopen of a final-submitted zone-day (roles in cfg.day.reopen_roles).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DayReopenRequest' }
      responses:
        '200':
          description: Reopened.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DayReopenResult' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
  /v1/day/cover:
    post:
      tags: [day]
      operationId: postCoverAssignment
      summary: Same-day cover of a route by another user of the zone (up to 7 days); bumps scope_version.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CoverRequest' }
      responses:
        '200':
          description: Assignment created (idempotent by client_uuid).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RouteAssignment' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
  /v1/day/route-days:
    get:
      tags: [day]
      operationId: listRouteDays
      summary: Route-day states in the caller's reach for a business date.
      parameters:
        - $ref: '#/components/parameters/BusinessDateQueryRequired'
        - $ref: '#/components/parameters/ZoneIdQuery'
        - $ref: '#/components/parameters/TerritoryIdQuery'
        - name: state
          in: query
          required: false
          schema: { $ref: '#/components/schemas/DayState' }
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: Page of route-days.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RouteDayPage' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /v1/day/exceptions:
    get:
      tags: [day]
      operationId: listDayExceptions
      summary: Day exceptions (rain, hartal, ...) raised in the caller's reach.
      parameters:
        - name: status
          in: query
          required: false
          schema: { $ref: '#/components/schemas/DecisionStatus' }
        - $ref: '#/components/parameters/ZoneIdQuery'
        - $ref: '#/components/parameters/FromDate'
        - $ref: '#/components/parameters/ToDate'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: Page of exceptions.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DayExceptionPage' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /v1/day/exceptions/{exception_uuid}/decision:
    post:
      tags: [day]
      operationId: decideDayException
      summary: Approve or reject a day exception (TSO of the zone).
      parameters:
        - name: exception_uuid
          in: path
          required: true
          schema: { $ref: '#/components/schemas/Uuid' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DecisionRequest' }
      responses:
        '200':
          description: Decided.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DayException' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /v1/memos:
    get:
      tags: [memos]
      operationId: listMemos
      summary: Memo history for an outlet beyond the phone's 7-day local window (online fallback), or for the web.
      parameters:
        - name: outlet_id
          in: query
          required: false
          schema: { $ref: '#/components/schemas/Id' }
        - name: route_id
          in: query
          required: false
          schema: { $ref: '#/components/schemas/Id' }
        - name: memo_no
          in: query
          required: false
          schema: { $ref: '#/components/schemas/MemoNo' }
        - $ref: '#/components/parameters/FromDate'
        - $ref: '#/components/parameters/ToDate'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: Page of memos with lines and discount lines.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MemoPage' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /v1/outlet-requests:
    get:
      tags: [outlet-requests]
      operationId: listOutletRequests
      summary: Outlet change requests in the caller's reach (web Outlet Approval Panel, AMO verification list).
      parameters:
        - name: status
          in: query
          required: false
          schema: { $ref: '#/components/schemas/OutletRequestStatus' }
        - name: request_type
          in: query
          required: false
          schema: { $ref: '#/components/schemas/OutletRequestType' }
        - $ref: '#/components/parameters/ZoneIdQuery'
        - $ref: '#/components/parameters/TerritoryIdQuery'
        - $ref: '#/components/parameters/FromDate'
        - $ref: '#/components/parameters/ToDate'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: Page of requests.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OutletRequestPage' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /v1/outlet-requests/{request_uuid}:
    get:
      tags: [outlet-requests]
      operationId: getOutletRequest
      summary: One request with its event trail and photo references.
      parameters:
        - $ref: '#/components/parameters/RequestUuidPath'
      responses:
        '200':
          description: The request.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OutletRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /v1/outlet-requests/{request_uuid}/verify:
    post:
      tags: [outlet-requests]
      operationId: verifyOutletRequest
      summary: Web verification of a pending request (the AMO app verifies with an `outlet_request_verification` record).
      parameters:
        - $ref: '#/components/parameters/RequestUuidPath'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/OutletRequestVerifyRequest' }
      responses:
        '200':
          description: Verified.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OutletRequest' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /v1/outlet-requests/{request_uuid}/approve:
    post:
      tags: [outlet-requests]
      operationId: approveOutletRequest
      summary: Approve a verified request on the web (new outlet gets a code; close sets status closed; location moves the pin).
      description: The approver must differ from the requester and the verifier (409 `ERR_SEPARATION_OF_DUTIES`). A location move above `cfg.sec.fraud.location_move_alert_m` on a confirmed outlet needs the TSO.
      parameters:
        - $ref: '#/components/parameters/RequestUuidPath'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/OutletRequestApproveRequest' }
      responses:
        '200':
          description: Approved and applied to the outlet master.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OutletRequest' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /v1/outlet-requests/{request_uuid}/reject:
    post:
      tags: [outlet-requests]
      operationId: rejectOutletRequest
      summary: Reject a pending or verified request with a reason (shown to the requester).
      parameters:
        - $ref: '#/components/parameters/RequestUuidPath'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReasonRequest' }
      responses:
        '200':
          description: Rejected.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OutletRequest' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /v1/tasks:
    get:
      tags: [tasks]
      operationId: listTasks
      summary: Tasks in the caller's reach.
      parameters:
        - name: status
          in: query
          required: false
          schema: { $ref: '#/components/schemas/TaskStatus' }
        - name: assignee_user_id
          in: query
          required: false
          schema: { $ref: '#/components/schemas/Id' }
        - $ref: '#/components/parameters/ZoneIdQuery'
        - $ref: '#/components/parameters/FromDate'
        - $ref: '#/components/parameters/ToDate'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: Page of tasks.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TaskPage' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [tasks]
      operationId: createTask
      summary: Create a task online (web, AMO or TSO online path; apps normally queue a `task` record).
      description: Idempotent by `task_uuid`. The assignee is notified by an FCM nudge when `cfg.notify.task_push_enabled` is true; the task itself always arrives with the next delta.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TaskCreateRequest' }
      responses:
        '200':
          description: Created or replayed.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Task' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
  /v1/tasks/{task_uuid}/cancel:
    post:
      tags: [tasks]
      operationId: cancelTask
      summary: Cancel an ongoing task (creator, the zone's TSO or an admin).
      parameters:
        - name: task_uuid
          in: path
          required: true
          schema: { $ref: '#/components/schemas/Uuid' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReasonRequest' }
      responses:
        '200':
          description: Cancelled.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Task' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /v1/admin/notifications:
    post:
      tags: [notifications]
      operationId: sendNotification
      summary: Send an FCM data nudge (announcement or config pull) to devices in a scope.
      description: Payload carries `pull_after_s` jitter; FCM never triggers an upload (docs/24 s4.7). Refused with 409 `ERR_PUSH_DISABLED` while `cfg.ops.push_enabled` is false.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/NotificationRequest' }
      responses:
        '202':
          description: Queued for delivery.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/NotificationAccepted' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }

  /v1/team/locations:
    get:
      tags: [team]
      operationId: getTeamLocations
      summary: Last synced fix per team member (no live tracking; age and source shown).
      parameters:
        - $ref: '#/components/parameters/ZoneIdQuery'
        - $ref: '#/components/parameters/BusinessDateQuery'
      responses:
        '200':
          description: Team locations.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TeamLocationList' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /v1/team/stock:
    get:
      tags: [team]
      operationId: getTeamStock
      summary: Issued, sold, returned and current stock per SR and SKU for a date (SR phones never returned).
