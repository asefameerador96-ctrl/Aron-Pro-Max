      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/Device' }
        next_cursor:
          oneOf:
            - { $ref: '#/components/schemas/PageCursor' }
            - type: 'null'
    DeviceStatusPage:
      type: object
      required: [items, next_cursor]
      additionalProperties: false
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/DeviceStatusReport' }
        next_cursor:
          oneOf:
            - { $ref: '#/components/schemas/PageCursor' }
            - type: 'null'
    DeviceStateChangeRequest:
      type: object
      required: [action, reason]
      additionalProperties: false
      properties:
        action: { type: string, enum: [suspend, revoke, reactivate, mark_replaced] }
        reason: { $ref: '#/components/schemas/ChangeReason' }
    DirectiveCreateRequest:
      type: object
      required: [type]
      additionalProperties: false
      properties:
        type: { type: string, enum: [send_status, redownload_bundle, upload_support_bundle, resend_from] }
        resend_from:
          description: For resend_from, the business date from which acked rows are re-sent (registry dedupe absorbs repeats).
          oneOf:
            - { $ref: '#/components/schemas/BusinessDate' }
            - type: 'null'
        ttl_h: { type: integer, minimum: 1, maximum: 72, default: 24 }
    DirectiveList:
      type: object
      required: [items]
      additionalProperties: false
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/Directive' }
    EnrolmentToken:
      type: object
      required: [token_id, token_prefix, flavour, lockdown_level, max_uses, used_count, expires_at, created_by, created_at]
      additionalProperties: false
      properties:
        token_id: { $ref: '#/components/schemas/Id' }
        token_prefix: { type: string, pattern: '^[A-Za-z0-9_-]{6}$', description: 'First 6 characters, for identification only.' }
        flavour: { $ref: '#/components/schemas/AppFlavour' }
        lockdown_level: { $ref: '#/components/schemas/LockdownLevel' }
        max_uses: { type: integer, minimum: 1, maximum: 500 }
        used_count: { type: integer, minimum: 0 }
        zone_id: { type: [integer, 'null'], format: int64, minimum: 1 }
        expires_at: { $ref: '#/components/schemas/Timestamp' }
        created_by: { $ref: '#/components/schemas/Id' }
        created_at: { $ref: '#/components/schemas/Timestamp' }
        revoked_at:
          oneOf:
            - { $ref: '#/components/schemas/Timestamp' }
            - type: 'null'
        note: { type: [string, 'null'], maxLength: 300 }
    EnrolmentTokenPage:
      type: object
      required: [items, next_cursor]
      additionalProperties: false
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/EnrolmentToken' }
        next_cursor:
          oneOf:
            - { $ref: '#/components/schemas/PageCursor' }
            - type: 'null'
    EnrolmentTokenCreateRequest:
      type: object
      required: [flavour, lockdown_level, max_uses, expires_in_h]
      additionalProperties: false
      properties:
        flavour: { $ref: '#/components/schemas/AppFlavour' }
        lockdown_level: { $ref: '#/components/schemas/LockdownLevel' }
        max_uses: { type: integer, minimum: 1, maximum: 500 }
        expires_in_h: { type: integer, minimum: 1, maximum: 168 }
        zone_id: { type: [integer, 'null'], format: int64, minimum: 1 }
        release_id: { type: [integer, 'null'], format: int64, minimum: 1, description: APK to provision; default the latest published release of the flavour. }
        wifi:
          description: Optional Wi-Fi for the setup wizard; included in the QR only, never stored.
          type: [object, 'null']
          required: [ssid, security_type]
          additionalProperties: false
          properties:
            ssid: { type: string, minLength: 1, maxLength: 32 }
            security_type: { type: string, enum: [NONE, WPA, WEP] }
            password: { type: [string, 'null'], maxLength: 63, writeOnly: true }
        note: { type: [string, 'null'], maxLength: 300 }
    ProvisioningQrPayload:
      type: object
      description: Android fully-managed device provisioning extras (encoded as JSON text in the QR). Keys are Android constants.
      required: [android.app.extra.PROVISIONING_DEVICE_ADMIN_COMPONENT_NAME, android.app.extra.PROVISIONING_DEVICE_ADMIN_PACKAGE_DOWNLOAD_LOCATION, android.app.extra.PROVISIONING_DEVICE_ADMIN_SIGNATURE_CHECKSUM, android.app.extra.PROVISIONING_LEAVE_ALL_SYSTEM_APPS_ENABLED, android.app.extra.PROVISIONING_ADMIN_EXTRAS_BUNDLE]
      additionalProperties: false
      properties:
        android.app.extra.PROVISIONING_DEVICE_ADMIN_COMPONENT_NAME: { type: string, pattern: '^com\.aktcl\.aron\.(sr|amo|tso)/com\.aktcl\.aron\.dpc\.AronDeviceAdminReceiver$' }
        android.app.extra.PROVISIONING_DEVICE_ADMIN_PACKAGE_DOWNLOAD_LOCATION: { type: string, format: uri, maxLength: 1000 }
        android.app.extra.PROVISIONING_DEVICE_ADMIN_SIGNATURE_CHECKSUM: { type: string, pattern: '^[A-Za-z0-9_-]{43}$', description: URL-safe base64 (no padding) SHA-256 of the APK signing certificate. }
        android.app.extra.PROVISIONING_LEAVE_ALL_SYSTEM_APPS_ENABLED: { type: boolean }
        android.app.extra.PROVISIONING_SKIP_ENCRYPTION: { type: boolean }
        android.app.extra.PROVISIONING_WIFI_SSID: { type: string, maxLength: 34 }
        android.app.extra.PROVISIONING_WIFI_SECURITY_TYPE: { type: string, enum: [NONE, WPA, WEP] }
        android.app.extra.PROVISIONING_WIFI_PASSWORD: { type: string, maxLength: 63 }
        android.app.extra.PROVISIONING_ADMIN_EXTRAS_BUNDLE:
          type: object
          required: [aron.enrolment_token, aron.api_base_url, aron.env, aron.flavour, aron.lockdown_level]
          additionalProperties: false
          properties:
            aron.enrolment_token: { type: string, minLength: 43, maxLength: 64, pattern: '^[A-Za-z0-9_-]+$' }
            aron.api_base_url: { type: string, format: uri, maxLength: 200 }
            aron.env: { type: string, enum: [dev, staging, prod] }
            aron.flavour: { $ref: '#/components/schemas/AppFlavour' }
            aron.lockdown_level: { $ref: '#/components/schemas/LockdownLevel' }
            aron.zone_code: { type: string, maxLength: 40 }
    EnrolmentTokenCreated:
      type: object
      required: [token, enrolment_token, qr_payload, qr_text]
      additionalProperties: false
      properties:
        token: { $ref: '#/components/schemas/EnrolmentToken' }
        enrolment_token: { type: string, minLength: 43, maxLength: 64, pattern: '^[A-Za-z0-9_-]+$', description: The secret; shown once (also inside the QR). }
        qr_payload: { $ref: '#/components/schemas/ProvisioningQrPayload' }
        qr_text: { type: string, maxLength: 4000, description: 'Compact JSON of qr_payload, the exact text to encode in the QR code.' }
    DeviceOtp:
      type: object
      required: [user_id, username, full_name, created_at, expires_at, attempts]
      additionalProperties: false
      properties:
        user_id: { $ref: '#/components/schemas/Id' }
        username: { $ref: '#/components/schemas/Username' }
        full_name: { type: string, maxLength: 120 }
        zone_id: { type: [integer, 'null'], format: int64, minimum: 1 }
        otp: { type: [string, 'null'], pattern: '^[0-9]{4,8}$', description: Shown only while unexpired; each page view is audited. }
        device_model: { type: [string, 'null'], maxLength: 80 }
        created_at: { $ref: '#/components/schemas/Timestamp' }
        expires_at: { $ref: '#/components/schemas/Timestamp' }
        attempts: { type: integer, minimum: 0 }
    DeviceOtpPage:
      type: object
      required: [items, next_cursor]
      additionalProperties: false
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/DeviceOtp' }
        next_cursor:
          oneOf:
            - { $ref: '#/components/schemas/PageCursor' }
            - type: 'null'
    DeviceOtpIssueRequest:
      type: object
      required: [user_id, reason]
      additionalProperties: false
      properties:
        user_id: { $ref: '#/components/schemas/Id' }
        reason: { $ref: '#/components/schemas/ChangeReason' }

    # ---------- releases ----------
    AppRelease:
      type: object
      required: [release_id, flavour, version_name, version_code, abi, sha256, size_bytes, download_url, signing_cert_sha256, status, rollout_pct, created_at, version]
      additionalProperties: false
      properties:
        release_id: { $ref: '#/components/schemas/Id' }
        flavour: { $ref: '#/components/schemas/AppFlavour' }
        version_name: { type: string, pattern: '^\d{1,3}\.\d{1,3}\.\d{1,3}$' }
        version_code: { type: integer, minimum: 1, maximum: 2100000000 }
        abi: { $ref: '#/components/schemas/Abi' }
        sha256: { $ref: '#/components/schemas/Sha256Hex' }
        size_bytes: { type: integer, minimum: 1, maximum: 104857600 }
        download_url: { type: string, format: uri, maxLength: 1000 }
        signing_cert_sha256: { $ref: '#/components/schemas/Sha256Hex' }
        status: { type: string, enum: [draft, published, blocked, retired] }
        rollout_pct: { type: integer, minimum: 0, maximum: 100, description: Staged exposure by stable device hash. }
        notes_en: { type: [string, 'null'], maxLength: 2000 }
        notes_bn: { type: [string, 'null'], maxLength: 2000 }
        created_at: { $ref: '#/components/schemas/Timestamp' }
        published_at:
          oneOf:
            - { $ref: '#/components/schemas/Timestamp' }
            - type: 'null'
        version: { type: integer, minimum: 1 }
    AppReleaseWrite:
      type: object
      required: [flavour, version_name, version_code, abi, sha256, size_bytes, download_url, signing_cert_sha256]
      additionalProperties: false
      properties:
        flavour: { $ref: '#/components/schemas/AppFlavour' }
        version_name: { type: string, pattern: '^\d{1,3}\.\d{1,3}\.\d{1,3}$' }
        version_code: { type: integer, minimum: 1, maximum: 2100000000 }
        abi: { $ref: '#/components/schemas/Abi' }
        sha256: { $ref: '#/components/schemas/Sha256Hex' }
        size_bytes: { type: integer, minimum: 1, maximum: 104857600 }
        download_url: { type: string, format: uri, maxLength: 1000 }
        signing_cert_sha256: { $ref: '#/components/schemas/Sha256Hex' }
        notes_en: { type: [string, 'null'], maxLength: 2000 }
        notes_bn: { type: [string, 'null'], maxLength: 2000 }
    AppReleasePatch:
      type: object
      minProperties: 1
      additionalProperties: false
      properties:
        status: { type: string, enum: [published, blocked, retired] }
        rollout_pct: { type: integer, minimum: 0, maximum: 100 }
        notes_en: { type: [string, 'null'], maxLength: 2000 }
        notes_bn: { type: [string, 'null'], maxLength: 2000 }
        change_reason: { oneOf: [ { $ref: '#/components/schemas/ChangeReason' }, { type: 'null' } ] }
    AppReleasePage:
      type: object
      required: [items, next_cursor]
      additionalProperties: false
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/AppRelease' }
        next_cursor:
          oneOf:
            - { $ref: '#/components/schemas/PageCursor' }
            - type: 'null'
    ReleasePolicyList:
      type: object
      required: [items]
      additionalProperties: false
      properties:
        items:
          type: array
          items:
            type: object
            required: [flavour, min_version_code, blocked_version_codes]
            additionalProperties: false
            properties:
              flavour: { $ref: '#/components/schemas/AppFlavour' }
              min_version_code: { type: integer, minimum: 1 }
              latest_version_code: { type: [integer, 'null'], minimum: 1 }
              blocked_version_codes:
                type: array
                maxItems: 100
                items: { type: integer, minimum: 1 }
              devices_below_min: { type: integer, minimum: 0 }

    # ---------- audit ----------
    AuditEntry:
      type: object
      required: [id, at, actor_user_id, via, entity, entity_id, action, row_hash]
      additionalProperties: false
      properties:
        id: { $ref: '#/components/schemas/Id' }
        at: { $ref: '#/components/schemas/Timestamp' }
        actor_user_id: { type: [integer, 'null'], format: int64, minimum: 1 }
        actor_username: { type: [string, 'null'], maxLength: 40 }
        actor_role: { oneOf: [ { $ref: '#/components/schemas/Role' }, { type: 'null' } ] }
        via: { type: string, enum: [web, api, job, device] }
        entity: { type: string, maxLength: 40 }
        entity_id: { type: string, maxLength: 64 }
        action: { type: string, maxLength: 60 }
        before:
          type: [object, 'null']
          additionalProperties: { $ref: '#/components/schemas/JsonScalar' }
        after:
          type: [object, 'null']
          additionalProperties: { $ref: '#/components/schemas/JsonScalar' }
        reason: { type: [string, 'null'], maxLength: 500 }
        request_id: { oneOf: [ { $ref: '#/components/schemas/Uuid' }, { type: 'null' } ] }
        row_hash: { $ref: '#/components/schemas/Sha256Hex' }
    AuditPage:
      type: object
      required: [items, next_cursor]
      additionalProperties: false
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/AuditEntry' }
        next_cursor:
          oneOf:
            - { $ref: '#/components/schemas/PageCursor' }
            - type: 'null'
    ContentViewPayload:
      type: object
      description: One AV or KV item shown during a call (docs/24 s4.14). Telemetry class; a missing asset is logged as skipped and never blocks the sale.
      required: [visit_client_uuid, content_id, content_version, kind, outcome, sequence_no]
      additionalProperties: false
      properties:
        visit_client_uuid: { $ref: '#/components/schemas/Uuid' }
        content_id: { $ref: '#/components/schemas/Id' }
        content_version: { type: integer, minimum: 1 }
        kind: { $ref: '#/components/schemas/ContentKind' }
        outcome: { type: string, enum: [viewed, skipped_missing, skipped_user] }
        sequence_no: { type: integer, minimum: 1, maximum: 20 }
        started_at:
          oneOf:
            - { $ref: '#/components/schemas/Timestamp' }
            - type: 'null'
        duration_ms: { type: [integer, 'null'], minimum: 0, maximum: 3600000 }
    RedemptionPayload:
      type: object
      description: |
        A loyalty redemption basket confirmed on the phone (Diamond League). Points are deducted once per
        `client_uuid` (docs/24 s4.14). points_total = cash_points + sum(redemption_line.points_total);
        cash_mtk = cash_points x cash_rate_mtk_per_point (otherwise quarantined `arithmetic_mismatch`).
      required: [outlet_id, programme_id, balance_before_points, points_total, cash_points, cash_mtk, cash_rate_mtk_per_point, line_count, confirmed_at]
      additionalProperties: false
      properties:
        outlet_id: { $ref: '#/components/schemas/Id' }
        programme_id: { $ref: '#/components/schemas/Id' }
        visit_client_uuid:
          oneOf:
            - { $ref: '#/components/schemas/Uuid' }
            - type: 'null'
        balance_before_points: { type: integer, minimum: 0, description: Balance the phone showed (bundle balance minus local unsynced redemptions). }
        points_total: { type: integer, minimum: 1, maximum: 100000 }
        cash_points: { type: integer, minimum: 0, maximum: 100000, description: 'Cash-back points (at most cfg.loyalty.cash_max_points).' }
        cash_mtk: { $ref: '#/components/schemas/MtkNonNegative' }
        cash_rate_mtk_per_point: { type: integer, minimum: 0, maximum: 100000, description: Rate used (cfg.loyalty.cash_rate_mtk_per_point at capture). }
        line_count: { type: integer, minimum: 0, maximum: 20 }
        confirmed_at: { $ref: '#/components/schemas/Timestamp' }
        fix:
          oneOf:
            - { $ref: '#/components/schemas/GeoFix' }
            - type: 'null'
    RedemptionLinePayload:
      type: object
      required: [redemption_client_uuid, gift_id, qty, points_each, points_total]
      additionalProperties: false
      properties:
        redemption_client_uuid: { $ref: '#/components/schemas/Uuid' }
        gift_id: { $ref: '#/components/schemas/Id' }
        qty: { type: integer, minimum: 1, maximum: 50 }
        points_each: { type: integer, minimum: 1, maximum: 100000, description: Gift cost in the bundle at capture. }
        points_total: { type: integer, minimum: 1, maximum: 1000000, description: qty x points_each. }
    GiftPhotoPayload:
      type: object
      description: |
        Hand-over photo of a gift: an Astha gift assignment (one photo per assignment, cfg.astha.one_photo_per_outlet)
        or one redeemed campaign gift (Gift Verify). The first accepted photo locks the Astha choice.
      required: [programme_kind, outlet_id, gift_id, photo_uuid, fix]
      additionalProperties: false
      properties:
        programme_kind: { $ref: '#/components/schemas/ProgrammeKind' }
        outlet_id: { $ref: '#/components/schemas/Id' }
        gift_id: { $ref: '#/components/schemas/Id' }
        gift_assignment_id: { type: [integer, 'null'], format: int64, minimum: 1, description: Set for Astha. }
        redemption_client_uuid:
          description: Set for a campaign Gift Verify photo.
          oneOf:
            - { $ref: '#/components/schemas/Uuid' }
            - type: 'null'
        unit_no: { type: [integer, 'null'], minimum: 1, maximum: 50, description: Which unit of a redeemed line (one slot per redeemed gift). }
        photo_uuid: { $ref: '#/components/schemas/Uuid' }
        fix: { $ref: '#/components/schemas/GeoFix' }
    PriceComplianceCheckPayload:
      type: object
      description: Observed shelf price of one SKU at an AMO control call; counted in the AMO reconciliation row.
      required: [visit_client_uuid, sku_id, price_type, reference_price_mtk, observed_price_mtk, compliant]
      additionalProperties: false
      properties:
        visit_client_uuid: { $ref: '#/components/schemas/Uuid' }
        sku_id: { $ref: '#/components/schemas/Id' }
        price_type: { $ref: '#/components/schemas/SellingPriceType' }
        reference_price_mtk: { $ref: '#/components/schemas/MtkNonNegative' }
        observed_price_mtk: { $ref: '#/components/schemas/MtkNonNegative' }
        compliant: { type: boolean }
        note: { type: [string, 'null'], maxLength: 300 }
    RiskReviewPayload:
      type: object
      description: Offline review of a risk signal from the AMO Exceptions screen; the same event as POST /v1/risk-signals/{signal_id}/review with review_uuid = client_uuid.
      required: [signal_id, action]
      additionalProperties: false
      properties:
        signal_id: { $ref: '#/components/schemas/Id' }
        action: { type: string, enum: [reviewed, dismissed, confirmed] }
        note: { type: [string, 'null'], maxLength: 500 }
    ActivityLogPayload:
      type: object
      description: Screen and action events sampled at cfg.app.activity_log_sample_pct; telemetry, duplicates tolerated.
      required: [events]
      additionalProperties: false
      properties:
        events:
          type: array
          minItems: 1
          maxItems: 200
          items:
            type: object
            required: [at, screen, action]
            additionalProperties: false
            properties:
              at: { $ref: '#/components/schemas/Timestamp' }
              screen: { type: string, pattern: '^[a-z][a-z0-9_.]{1,60}$' }
              action: { type: string, pattern: '^[a-z][a-z0-9_.]{1,60}$' }
              duration_ms: { type: [integer, 'null'], minimum: 0, maximum: 86400000 }
    AppErrorPayload:
      type: object
      description: A crash, ANR or handled error from the phone, scrubbed of phone numbers and outlet names before capture.
      required: [occurred_at, kind, exception_class, app_version]
      additionalProperties: false
      properties:
        occurred_at: { $ref: '#/components/schemas/Timestamp' }
        kind: { type: string, enum: [crash, anr, handled] }
        exception_class: { type: string, maxLength: 200 }
        message: { type: [string, 'null'], maxLength: 500 }
        stack: { type: [string, 'null'], maxLength: 16000 }
        screen: { type: [string, 'null'], maxLength: 60 }
        app_version: { $ref: '#/components/schemas/AppVersionString' }
    SaleAbortPayload:
      type: object
      description: A memo number that was consumed without a committed memo; explains the gap in the memo-number-gaps report.
      required: [memo_no, reason]
      additionalProperties: false
      properties:
        memo_no: { $ref: '#/components/schemas/MemoNo' }
        reason: { type: string, enum: [user_cancelled, app_killed, commit_failed] }
        visit_client_uuid:
          oneOf:
            - { $ref: '#/components/schemas/Uuid' }
            - type: 'null'
        outlet_id: { type: [integer, 'null'], format: int64, minimum: 1 }
    ConsentAcceptPayload:
      type: object
      description: Acceptance of the employee-location notice (cfg.app.location_notice_required), uploaded once per user and policy version.
      required: [policy_key, policy_version, accepted, locale, shown_at]
      additionalProperties: false
      properties:
        policy_key: { type: string, enum: [location_notice] }
        policy_version: { type: integer, minimum: 1 }
        accepted: { type: boolean }
        locale: { type: string, enum: [bn, en] }
        shown_at: { $ref: '#/components/schemas/Timestamp' }

    # ---------- programmes, content, web entry and admin additions (docs/24 s4.14, s12.6) ----------
    ProgrammeKind:
      type: string
      enum: [diamond_league, astha, campaign, superstar]
    ContentKind:
      type: string
      enum: [av, kv]
    TargetRevisionStatus:
      type: string
      enum: [pending_approval, approved, rejected, superseded]
    Programme:
      type: object
      required: [programme_id, kind, code, name_en, active_from, active_to, status, version]
      additionalProperties: false
      properties:
        programme_id: { $ref: '#/components/schemas/Id' }
        kind: { $ref: '#/components/schemas/ProgrammeKind' }
        code: { type: string, pattern: '^[A-Za-z0-9][A-Za-z0-9_-]{0,39}$' }
        name_en: { type: string, maxLength: 120 }
        name_bn: { type: [string, 'null'], maxLength: 120 }
        period_label: { type: [string, 'null'], maxLength: 40, description: 'For example `2026-10` (Diamond League month) or `2026-Q4` (Astha quarter).' }
        active_from: { $ref: '#/components/schemas/BusinessDate' }
        active_to: { $ref: '#/components/schemas/BusinessDate' }
        points_expire_on:
          description: Diamond League points of this period expire after this date (period end + cfg.loyalty.expiry_days).
          oneOf:
            - { $ref: '#/components/schemas/BusinessDate' }
            - type: 'null'
        rules:
          type: object
          description: Kind-specific rules as data (Superstar slabs and criteria, campaign gift list); validated against the kind's schema.
          additionalProperties: { $ref: '#/components/schemas/JsonScalar' }
        status: { $ref: '#/components/schemas/ActiveStatus' }
        version: { type: integer, minimum: 1 }
    ProgrammeWrite:
      type: object
      required: [kind, code, name_en, active_from, active_to, change_reason]
      additionalProperties: false
      properties:
        kind: { $ref: '#/components/schemas/ProgrammeKind' }
        code: { type: string, pattern: '^[A-Za-z0-9][A-Za-z0-9_-]{0,39}$' }
        name_en: { type: string, maxLength: 120 }
        name_bn: { type: [string, 'null'], maxLength: 120 }
        period_label: { type: [string, 'null'], maxLength: 40 }
        active_from: { $ref: '#/components/schemas/BusinessDate' }
        active_to: { $ref: '#/components/schemas/BusinessDate' }
        rules:
          type: object
          additionalProperties: { $ref: '#/components/schemas/JsonScalar' }
        status: { $ref: '#/components/schemas/ActiveStatus' }
        change_reason: { $ref: '#/components/schemas/ChangeReason' }
    ProgrammeList:
      type: object
      required: [items]
      additionalProperties: false
      properties:
        items:
          type: array
          maxItems: 500
          items: { $ref: '#/components/schemas/Programme' }
    ProgrammeEnrolment:
      type: object
      required: [programme_id, outlet_id, valid_from]
      additionalProperties: false
      properties:
        programme_id: { $ref: '#/components/schemas/Id' }
        outlet_id: { $ref: '#/components/schemas/Id' }
        league_label: { type: [string, 'null'], maxLength: 40, description: Diamond League label shown on Outlet Points. }
        tier_code: { type: [string, 'null'], pattern: '^[a-z][a-z0-9_]{1,40}$', description: Astha tier (sub-channel) or Superstar slab. }
        base_target: { oneOf: [{ $ref: '#/components/schemas/Decimal3' }, { type: 'null' }] }
        valid_from: { $ref: '#/components/schemas/BusinessDate' }
        valid_to:
          oneOf:
            - { $ref: '#/components/schemas/BusinessDate' }
            - type: 'null'
    ProgrammeEnrolmentPage:
      type: object
      required: [items, next_cursor]
      additionalProperties: false
      properties:
        items:
          type: array
