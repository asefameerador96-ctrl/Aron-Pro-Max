    # ---------- config admin ----------
    ConfigKeyName:
      type: string
      pattern: '^cfg\.[a-z]+\.[a-z0-9_]+(\.[a-z0-9_]+)?$'
      maxLength: 80
      examples: [cfg.geo.radius_m]
    ConfigBounds:
      type: object
      additionalProperties: false
      properties:
        min: { type: [number, 'null'] }
        max: { type: [number, 'null'] }
        enum:
          type: array
          maxItems: 50
          items: { type: string, maxLength: 60 }
        max_items: { type: [integer, 'null'], minimum: 0 }
        dynamic_min: { oneOf: [ { $ref: '#/components/schemas/ConfigKeyName' }, { type: 'null' } ] }
        dynamic_max: { oneOf: [ { $ref: '#/components/schemas/ConfigKeyName' }, { type: 'null' } ] }
    ConfigKey:
      type: object
      required: [key, area, kind, value_type, default_value, bounds, scope_levels, risk_class, effect, delivery, requires_ack, future_dated_only, editor_permission, description_en]
      additionalProperties: false
      properties:
        key: { $ref: '#/components/schemas/ConfigKeyName' }
        area: { type: string, pattern: '^[a-z]+$' }
        kind: { type: string, enum: [S, T, O], description: 'S setting, T time-shaped, O operational switch (auto-expires).' }
        value_type: { type: string, enum: [int, number, bool, time, text, url, pct, money_mtk, enum, list, json] }
        default_value: { $ref: '#/components/schemas/ConfigValueJson' }
        bounds: { $ref: '#/components/schemas/ConfigBounds' }
        scope_levels:
          type: array
          minItems: 1
          items: { $ref: '#/components/schemas/ConfigScopeType' }
        risk_class: { type: integer, minimum: 0, maximum: 3 }
        effect: { type: string, enum: [B, S, R], description: B next request or bundle; S next session or business day; R next release. }
        delivery: { type: string, enum: [server, device, both] }
        requires_ack: { type: boolean }
        future_dated_only: { type: boolean }
        restrictive_dir: { type: string, enum: [up, down, enum_order, none] }
        editor_permission: { type: string, pattern: '^cfg\.edit\.[a-z]+$' }
        description_en: { type: string, maxLength: 500 }
        description_bn: { type: [string, 'null'], maxLength: 500 }
    ConfigKeyList:
      type: object
      required: [items]
      additionalProperties: false
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/ConfigKey' }
    ConfigValue:
      type: object
      required: [id, key, scope_type, scope_id, value, effective_from, config_version, set_by, set_at, reason]
      additionalProperties: false
      properties:
        id: { $ref: '#/components/schemas/Id' }
        key: { $ref: '#/components/schemas/ConfigKeyName' }
        scope_type: { $ref: '#/components/schemas/ConfigScopeType' }
        scope_id: { type: integer, format: int64, minimum: 0 }
        value: { $ref: '#/components/schemas/ConfigValueJson' }
        effective_from: { $ref: '#/components/schemas/Timestamp' }
        effective_to:
          oneOf:
            - { $ref: '#/components/schemas/Timestamp' }
            - type: 'null'
        config_version: { $ref: '#/components/schemas/ConfigVersionNumber' }
        superseded_in_version: { type: [integer, 'null'], format: int64, minimum: 0 }
        set_by: { $ref: '#/components/schemas/Id' }
        set_at: { $ref: '#/components/schemas/Timestamp' }
        reason: { type: string, maxLength: 500 }
    ConfigValuePage:
      type: object
      required: [items, next_cursor]
      additionalProperties: false
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/ConfigValue' }
        next_cursor:
          oneOf:
            - { $ref: '#/components/schemas/PageCursor' }
            - type: 'null'
    ConfigChangeItem:
      type: object
      required: [key, scope_type, scope_id, value]
      additionalProperties: false
      properties:
        key: { $ref: '#/components/schemas/ConfigKeyName' }
        scope_type: { $ref: '#/components/schemas/ConfigScopeType' }
        scope_id: { type: integer, format: int64, minimum: 0 }
        value:
          description: New value; null removes the override at this scope (closes the open row).
          oneOf:
            - { $ref: '#/components/schemas/ConfigValueJson' }
            - type: 'null'
        effective_from:
          description: Null = now. Future-dated-only keys require a future Dhaka midnight.
          oneOf:
            - { $ref: '#/components/schemas/Timestamp' }
            - type: 'null'
        effective_to:
          oneOf:
            - { $ref: '#/components/schemas/Timestamp' }
            - type: 'null'
    ConfigChangeRequest:
      type: object
      required: [reason, changes]
      additionalProperties: false
      properties:
        reason: { $ref: '#/components/schemas/ChangeReason' }
        break_glass: { type: boolean, default: false, description: 'Break-glass apply (cfg.sys.break_glass_mode, at most cfg.sys.break_glass_max_h); reviewed afterwards.' }
        changes:
          type: array
          minItems: 1
          maxItems: 100
          items: { $ref: '#/components/schemas/ConfigChangeItem' }
    ConfigChange:
      type: object
      required: [change_id, status, risk_class, changes, reason, requested_by, requested_at, blast_radius]
      additionalProperties: false
      properties:
        change_id: { $ref: '#/components/schemas/Id' }
        status: { $ref: '#/components/schemas/ConfigChangeStatus' }
        risk_class: { type: integer, minimum: 0, maximum: 3 }
        changes:
          type: array
          items:
            allOf:
              - { $ref: '#/components/schemas/ConfigChangeItem' }
              - type: object
                properties:
                  old_value:
                    oneOf:
                      - { $ref: '#/components/schemas/ConfigValueJson' }
                      - type: 'null'
            unevaluatedProperties: false
        reason: { type: string, maxLength: 500 }
        requested_by: { $ref: '#/components/schemas/Id' }
        requested_at: { $ref: '#/components/schemas/Timestamp' }
        approved_by: { type: [integer, 'null'], format: int64, minimum: 1 }
        approved_at:
          oneOf:
            - { $ref: '#/components/schemas/Timestamp' }
            - type: 'null'
        apply_at:
          oneOf:
            - { $ref: '#/components/schemas/Timestamp' }
            - type: 'null'
        config_version: { type: [integer, 'null'], format: int64, minimum: 0 }
        is_revert_of: { type: [integer, 'null'], format: int64, minimum: 0 }
        blast_radius:
          type: object
          required: [zones, routes, outlets, devices]
          additionalProperties: false
          properties:
            zones: { type: integer, minimum: 0 }
            routes: { type: integer, minimum: 0 }
            outlets: { type: integer, minimum: 0 }
            devices: { type: integer, minimum: 0 }
            outlets_changed: { type: [integer, 'null'], minimum: 0 }
            overrides_kept: { type: [integer, 'null'], minimum: 0 }
    ConfigChangePage:
      type: object
      required: [items, next_cursor]
      additionalProperties: false
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/ConfigChange' }
        next_cursor:
          oneOf:
            - { $ref: '#/components/schemas/PageCursor' }
            - type: 'null'
    ConfigDecisionRequest:
      type: object
      required: [decision]
      additionalProperties: false
      properties:
        decision: { type: string, enum: [approve, reject, cancel, adopt], description: adopt turns a TSO radius proposal into a change request of the adopting editor. }
        note: { type: [string, 'null'], maxLength: 500 }
    ConfigVersion:
      type: object
      required: [version, kind, committed_at, committed_by, summary, max_risk_class]
      additionalProperties: false
      properties:
        version: { $ref: '#/components/schemas/ConfigVersionNumber' }
        kind: { type: string, enum: [change, revert, rollback, schedule_apply, expiry, content] }
        committed_at: { $ref: '#/components/schemas/Timestamp' }
        committed_by: { $ref: '#/components/schemas/Id' }
        summary: { type: string, maxLength: 500 }
        max_risk_class: { type: integer, minimum: 0, maximum: 3 }
        is_revert_of: { type: [integer, 'null'], format: int64, minimum: 0 }
        change_id: { type: [integer, 'null'], format: int64, minimum: 1 }
    ConfigVersionPage:
      type: object
      required: [items, next_cursor]
      additionalProperties: false
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/ConfigVersion' }
        next_cursor:
          oneOf:
            - { $ref: '#/components/schemas/PageCursor' }
            - type: 'null'
    ConfigRollbackRequest:
      type: object
      required: [mode, reason]
      additionalProperties: false
      properties:
        mode: { type: string, enum: [revert_this_version, rollback_to_this_version] }
        reason: { $ref: '#/components/schemas/ChangeReason' }
    ConfigReach:
      type: object
      required: [version, committed_at, devices_targeted, devices_applied, devices_acked, devices_pending]
      additionalProperties: false
      properties:
        version: { $ref: '#/components/schemas/ConfigVersionNumber' }
        committed_at: { $ref: '#/components/schemas/Timestamp' }
        devices_targeted: { type: integer, minimum: 0 }
        devices_applied: { type: integer, minimum: 0, description: Devices whose request header carried this version or newer. }
        devices_acked: { type: integer, minimum: 0, description: Devices that sent a config_ack for a requires_ack key. }
        devices_pending: { type: integer, minimum: 0 }
        p95_reach_min: { type: [number, 'null'], minimum: 0, description: '95th percentile minutes from commit to applied, selling devices only.' }
        by_zone:
          type: array
          items:
            type: object
            required: [zone_id, targeted, applied]
            additionalProperties: false
            properties:
              zone_id: { $ref: '#/components/schemas/Id' }
              targeted: { type: integer, minimum: 0 }
              applied: { type: integer, minimum: 0 }

