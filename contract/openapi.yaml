            - type: 'null'
        app_version:
          oneOf:
            - { $ref: '#/components/schemas/AppVersionString' }
            - type: 'null'
        policy_version_applied: { type: [integer, 'null'], format: int64, minimum: 0 }
        config_version_applied: { type: [integer, 'null'], format: int64, minimum: 0 }
        last_contact_at:
