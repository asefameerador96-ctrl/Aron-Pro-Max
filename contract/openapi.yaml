  # ---------- backlog coverage additions (docs/24 s4.14, s12.6; docs/24-build-spec-verification.md s10) ----------
  /v1/outlets/nearby:
    get:
      tags: [team]
      operationId: getNearbyOutlets
      summary: Outlets within a radius of a point (TSO Retailer radius map), capped and scoped.
      description: |
        Served from a geo index on confirmed outlet coordinates within the caller's reach. `radius_m` must be one
        of `cfg.tso.periphery_radius_options_m` (50, 100, 300); at most `cfg.tso.periphery_max_markers` (300)
        outlets are returned, nearest first, with `truncated` set when more exist. Contact numbers only with the
        `pii` claim.
      parameters:
        - { name: lat, in: query, required: true, schema: { type: number, minimum: 20.0, maximum: 27.0 }, description: Latitude of the centre (Bangladesh bounds). }
        - { name: lng, in: query, required: true, schema: { type: number, minimum: 88.0, maximum: 93.0 }, description: Longitude of the centre (Bangladesh bounds). }
        - { name: radius_m, in: query, required: true, schema: { type: integer, minimum: 10, maximum: 5000 }, description: Radius in metres; one of cfg.tso.periphery_radius_options_m. }
        - $ref: '#/components/parameters/ZoneIdQuery'
      responses:
        '200':
          description: Outlets inside the circle.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/NearbyOutlets' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /v1/dashboards/daily-tracking/actions:
    post:
      tags: [dashboards]
      operationId: createTrackingAction
      summary: Daily Tracking "take action" note on a route-day; notifies the route's TSO and AMO, never reassigns.
      description: |
        Allowed after `cfg.day.take_action_after` (17:00 Dhaka) of the business date (`409 ERR_REQUEST_STATE`
        before it). Idempotent by `action_uuid`. The notification is an FCM nudge to the TSO and AMO of the route.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TrackingActionRequest' }
      responses:
        '201':
          description: Stored (or the stored action on replay).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TrackingAction' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }

  /v1/tutorials:
    get:
      tags: [app]
      operationId: listTutorials
      summary: Tutorial videos and manuals for the caller's role (also in the bundle; playback is online only).
      responses:
        '200':
          description: Tutorial list.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TutorialList' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /v1/support/pda-upload:
    post:
      tags: [support]
      operationId: createSupportUpload
      summary: Write-only SAS for one "PDA to Support" data file (encrypted zip, size-capped).
      description: |
        Idempotent by `upload_uuid` (a repeat returns the same blob path with a fresh SAS). The file is at most
        `cfg.support.max_upload_mb` (20 MB); on mobile data the phone waits for Wi-Fi when
        `cfg.support.pda_upload_wifi_only` is true. The zip is encrypted on the phone with the support public key.
      parameters:
        - $ref: '#/components/parameters/XDeviceIdRequired'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SupportUploadRequest' }
      responses:
        '200':
          description: Upload URL.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SupportUpload' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /v1/client-errors:
    post:
      tags: [support]
      operationId: reportClientError
      summary: Privacy-scrubbed error report from the web app (phones send `app_error` records in the batch).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ClientErrorReport' }
      responses:
        '202': { description: Accepted (deduplicated by error_uuid). }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /v1/media/upload:
    post:
      tags: [media]
      operationId: uploadMediaMultipart
      summary: Multipart fallback for one small non-evidence image (feedback); evidence photos always use SAS.
      description: |
        Idempotent by (`media_uuid`, `purpose`): a repeat returns `replayed: true` and stores nothing. Only purposes
        `feedback` and `support` are accepted here; at most 300 KB JPEG.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema: { $ref: '#/components/schemas/MediaMultipartUpload' }
      responses:
        '200':
          description: Stored.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MediaUploaded' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }

  /v1/report-exports:
    get:
      tags: [reports]
      operationId: listExportLog
      summary: Export log viewer (who exported which report with which filters, rows and PII flag).
      parameters:
        - { name: user_id, in: query, required: false, schema: { $ref: '#/components/schemas/Id' }, description: Exports of one user. }
        - { name: report_key, in: query, required: false, schema: { $ref: '#/components/schemas/ReportKey' }, description: Exports of one report. }
        - $ref: '#/components/parameters/FromDate'
        - $ref: '#/components/parameters/ToDate'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: Page of export log entries, newest first.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ExportLogPage' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /v1/programmes/loyalty/balances:
    get:
      tags: [programmes]
      operationId: getLoyaltyBalances
      summary: Live loyalty balance of outlets in reach (online refresh of the bundle's previous-day balance).
      parameters:
        - { name: outlet_id, in: query, required: false, schema: { type: array, maxItems: 200, items: { $ref: '#/components/schemas/Id' } }, style: form, explode: true, description: Outlets to read; omitted = the outlets of the caller's routes today. }
        - { name: programme_id, in: query, required: false, schema: { $ref: '#/components/schemas/Id' }, description: One programme. }
      responses:
        '200':
          description: Balances.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LoyaltyBalanceList' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /v1/programmes/astha/targets:
    get:
      tags: [programmes]
      operationId: listAsthaTargets
      summary: Astha targets and achievement by outlet and brand for a quarter (route and shop information, web reads).
      parameters:
        - { name: quarter, in: query, required: true, schema: { type: string, pattern: '^\d{4}-Q[1-4]$' }, description: 'Quarter `YYYY-Qn` (quarter start month from cfg.astha.quarter_start_month).' }
        - { name: route_id, in: query, required: false, schema: { $ref: '#/components/schemas/Id' }, description: One route (the AMO route selector). }
        - $ref: '#/components/parameters/ZoneIdQuery'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: Target rows with achievement.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AsthaTargetPage' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    put:
      tags: [programmes]
      operationId: putAsthaTargets
      summary: Upsert Astha targets for a quarter (roles in cfg.astha.target_entry_roles; targets never negative).
      description: Idempotent by `batch_uuid`; all-or-nothing. A negative target is `400 ERR_VALIDATION`.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AsthaTargetWrite' }
      responses:
        '200':
          description: Stored.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TargetBatchResult' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }

  /v1/programmes/astha/gift-choices:
    get:
      tags: [programmes]
      operationId: listGiftChoices
      summary: Astha gift choice per outlet (TSO panel and Astha Gift Choice report source).
      parameters:
        - { name: quarter, in: query, required: true, schema: { type: string, pattern: '^\d{4}-Q[1-4]$' }, description: 'Quarter `YYYY-Qn`.' }
        - { name: route_id, in: query, required: false, schema: { $ref: '#/components/schemas/Id' }, description: One route. }
        - $ref: '#/components/parameters/ZoneIdQuery'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: Gift assignments.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GiftAssignmentPage' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    put:
      tags: [programmes]
      operationId: putGiftChoices
      summary: Save gift choices explicitly (roles in cfg.astha.gift_choice_roles); a choice locks once the SR's photo exists.
      description: |
        Idempotent by each row's `client_uuid`. A row whose assignment already has a `gift_photo` is refused per row
        with `ERR_GIFT_CHOICE_LOCKED` in `results[]` (cfg.astha.gift_choice_lock = on_sr_photo); the other rows are saved.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/GiftChoiceWrite' }
      responses:
        '200':
          description: Per-row results.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GiftChoiceResult' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /v1/web-entry/route-day:
    get:
      tags: [web-entry]
      operationId: getWebEntryRouteDay
      summary: The web route-day aggregate entry of a route and date (with the app's sale quantities read-only).
      parameters:
        - { name: route_id, in: query, required: true, schema: { $ref: '#/components/schemas/Id' }, description: Route. }
        - $ref: '#/components/parameters/BusinessDateQueryRequired'
      responses:
        '200':
          description: Current entry (empty lines when none).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WebEntryRouteDay' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      tags: [web-entry]
      operationId: saveWebEntryRouteDay
      summary: Save one route-day aggregate entry (Issue, Return, Memos, Successful Call per SKU); a re-save replaces with audit.
      description: |
        One entry per route-day; idempotent by `client_uuid`; a re-save with a new `client_uuid` replaces the previous
        entry and writes an audit row. Web rows and app rows for one route-day are never added
        (`cfg.web.entry_app_overlap_policy` = exclusive_flag: stored and flagged). Successful calls may not exceed
        the target-outlet snapshot. Outside `cfg.web.entry_backdate_days` without an active entry unlock:
        `409 ERR_ENTRY_WINDOW_CLOSED`; after Final Submit: `409 ERR_DAY_ALREADY_FINAL_SUBMITTED`. Astha-channel
        outlets are excluded (they use the outlet-SKU entry).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/WebEntryRouteDayWrite' }
      responses:
        '200':
          description: Stored.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WebEntryRouteDay' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }

  /v1/web-entry/outlet-sku:
    get:
      tags: [web-entry]
      operationId: getAsthaWebEntry
      summary: Astha Web Entry grid (Astha-channel outlets by SKU) of a route and date.
      parameters:
        - { name: route_id, in: query, required: true, schema: { $ref: '#/components/schemas/Id' }, description: Route. }
        - $ref: '#/components/parameters/BusinessDateQueryRequired'
      responses:
        '200':
          description: Grid rows with app-memo overlap flags.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AsthaWebEntry' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [web-entry]
      operationId: saveAsthaWebEntry
      summary: Save the Astha outlet-by-SKU entry explicitly; overlap with app memos is flagged, never added.
      description: Idempotent by `client_uuid` (the same uuid sent twice stores one entry). Only Astha-channel outlets (`400 ERR_VALIDATION` otherwise); window rules as for the route-day entry.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AsthaWebEntryWrite' }
      responses:
        '200':
          description: Stored.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AsthaWebEntry' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }

  /v1/web-entry/qc:
    post:
      tags: [web-entry]
      operationId: saveQcEntry
      summary: Market or Warehouse QC entry (SKU by fault type) stored as a separate web source, never added to app QC.
      description: Idempotent by `client_uuid`. Warehouse entries need a reason and the warehouse QC permission (403 otherwise); each save writes an audit row.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/QcEntryWrite' }
      responses:
        '200':
          description: Stored.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/QcEntryResult' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }

  /v1/admin/data-entry:
    post:
      tags: [web-entry]
      operationId: createPaperBackfill
      summary: Key a dead-phone day from a printed memo (source manual) through the same ingest path.
      description: |
        Allowed within `cfg.entry.paper_backfill_window_days` (7) of the business date. Idempotent by `client_uuid`;
        a memo number already stored (from the phone or an earlier backfill) is stored once and answered with
        `status: duplicate_memo_no`. The memo is flagged `source = manual` in every report (Online/Offline).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PaperBackfillRequest' }
      responses:
        '200':
          description: Result.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PaperBackfillResult' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }

  /v1/admin/entry-unlocks:
    get:
      tags: [web-entry]
      operationId: listEntryUnlocks
      summary: Entry unlock grants (zone or route, date range, reason, expiry).
      parameters:
        - $ref: '#/components/parameters/ZoneIdQuery'
        - { name: active, in: query, required: false, schema: { type: boolean }, description: Only grants not yet expired. }
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: Page of grants.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EntryUnlockPage' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [web-entry]
      operationId: createEntryUnlock
      summary: Grant back-dated web entry for a zone or route (roles in cfg.web.entry_unlock_roles), audited.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EntryUnlockWrite' }
      responses:
        '201':
          description: Created.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EntryUnlock' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /v1/admin/entry-unlocks/{unlock_id}/expire:
    post:
      tags: [web-entry]
      operationId: expireEntryUnlock
      summary: Expire an unlock grant now (an expired grant no longer allows back-dated entry).
      parameters:
        - { name: unlock_id, in: path, required: true, schema: { $ref: '#/components/schemas/Id' }, description: Grant id. }
      responses:
        '200':
          description: Expired.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EntryUnlock' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /v1/admin/target-revisions:
    get:
      tags: [admin-targets]
      operationId: listTargetRevisions
      summary: Target revise list (approval queue) with month and status filters.
      parameters:
        - { name: month, in: query, required: false, schema: { $ref: '#/components/schemas/Month' }, description: Target month. }
        - { name: status, in: query, required: false, schema: { $ref: '#/components/schemas/TargetRevisionStatus' }, description: Revision status. }
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: Page of revisions.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TargetRevisionPage' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /v1/admin/target-revisions/{revision_id}/decision:
    post:
      tags: [admin-targets]
      operationId: decideTargetRevision
      summary: Approve or reject a target revision at the caller's level of cfg.target.approval_levels.
      description: The approver is never the maker (`409 ERR_SEPARATION_OF_DUTIES`). The last approval makes the revision live; nothing is overwritten (older revisions become superseded).
      parameters:
        - { name: revision_id, in: path, required: true, schema: { $ref: '#/components/schemas/Id' }, description: Revision id. }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DecisionRequest' }
      responses:
        '200':
          description: Decided.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TargetRevision' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /v1/admin/targets/upload:
    post:
      tags: [admin-targets]
      operationId: uploadTargets
      summary: Upload a target workbook (all-or-nothing); a bad row rejects the whole file with a downloadable error sheet.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema: { $ref: '#/components/schemas/TargetUpload' }
      responses:
        '200':
          description: Accepted as a pending revision, or rejected with the error sheet.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TargetUploadResult' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
  /v1/admin/targets/template:
    get:
      tags: [admin-targets]
      operationId: getTargetTemplate
      summary: Target sample workbook for a month and scope (cfg.target.template_version).
      parameters:
        - { name: month, in: query, required: true, schema: { $ref: '#/components/schemas/Month' }, description: Target month. }
        - $ref: '#/components/parameters/TerritoryIdQuery'
      responses:
        '200':
          description: The workbook.
          content:
            application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
              schema: { type: string, contentMediaType: application/vnd.openxmlformats-officedocument.spreadsheetml.sheet }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /v1/admin/supervisor-targets:
    get:
      tags: [admin-targets]
      operationId: listSupervisorTargets
      summary: AMO call targets (total, control-call, joint-call) by user and month; they feed the AMO home tiles.
      parameters:
        - { name: month, in: query, required: true, schema: { $ref: '#/components/schemas/Month' }, description: Target month. }
        - $ref: '#/components/parameters/ZoneIdQuery'
      responses:
        '200':
          description: Targets.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SupervisorTargetList' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    put:
      tags: [admin-targets]
      operationId: putSupervisorTargets
      summary: Upsert AMO call targets for a month (all-or-nothing, never negative).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SupervisorTargetWrite' }
      responses:
        '200':
          description: Stored.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TargetBatchResult' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /v1/admin/prices/preview:
    post:
      tags: [admin-products]
      operationId: previewPrices
      summary: Mandatory preview of a price publish (SKUs, price types, outlets and devices affected; whether a second approver is needed).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PricePublishRequest' }
      responses:
        '200':
          description: Preview.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PricePreview' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /v1/admin/prices/batches/{batch_uuid}/decision:
    post:
      tags: [admin-products]
      operationId: decidePriceBatch
      summary: Second-approver decision on a price batch that moves a price by more than cfg.price.max_change_pct.
      parameters:
        - { name: batch_uuid, in: path, required: true, schema: { $ref: '#/components/schemas/Uuid' }, description: The publish batch. }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DecisionRequest' }
      responses:
        '200':
          description: Decided; on approval the prices become effective from their date.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PriceBatch' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /v1/admin/outlets/outlet-kind:
    post:
      tags: [admin-outlets]
      operationId: bulkSetOutletKind
      summary: Mark outlets wholesale or retail in bulk, idempotent by batch_uuid, one audit row per outlet.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/OutletKindBulkWrite' }
      responses:
        '200':
          description: Applied (or the stored result on replay).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BulkResult' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /v1/admin/dues-adjustments:
    get:
      tags: [admin-finance]
      operationId: listDuesAdjustments
      summary: Dues adjustments and write-offs with their maker-checker state.
      parameters:
        - { name: outlet_id, in: query, required: false, schema: { $ref: '#/components/schemas/Id' }, description: One outlet. }
        - { name: status, in: query, required: false, schema: { $ref: '#/components/schemas/DecisionStatus' }, description: Decision status. }
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: Page of adjustments.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DuesAdjustmentPage' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
