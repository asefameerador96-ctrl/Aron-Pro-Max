path: /v1/devices/me/commands
method: get
operation:
  tags:
  - devices
  operationId: pullDeviceCommands
  summary: Commands waiting for this phone (the DPC polls on every sync; FCM only nudges).
  description: Authenticated by X-Device-Proof. Returns queued and sent, unexpired commands, oldest first, marks
    them sent. Each carries an ES256 signature bound to the device.
  security:
  - bearerAuth: []
  - {}
  parameters:
  - $ref: '#/components/parameters/XDeviceIdRequired'
  - $ref: '#/components/parameters/XDeviceProof'
  responses:
    '200':
      description: Commands.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/DeviceCommandList'
    '401':
      $ref: '#/components/responses/Unauthorized'
