path: /v1/support/tickets/summary
method: get
operation:
  tags:
  - support
  operationId: getSupportTicketSummary
  summary: Ticket counts for the Ticket Dashboard (the caller's own tickets; the support desk counts every ticket).
  description: 'D-TSO-MAN-25 (contract 1.10.0). `total` counts every status, `open` = `new` + `in_progress`. The
    answer carries

    counts only (lead ruling R-F-14): the phone and the web compute the whole percents (resolved / total, open /

    total) once from the counts, and total 0 prints "0%". The app reads it on Ticket Dashboard open and on

    pull-to-refresh only.

    '
  responses:
    '200':
      description: Ticket counts.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/SupportTicketSummary'
    '401':
      $ref: '#/components/responses/Unauthorized'
    '403':
      $ref: '#/components/responses/Forbidden'
