path: /v1/sync/generation
method: get
operation:
  tags:
  - sync
  operationId: getServerGeneration
  summary: Statement of the current server generation after a failover or point-in-time restore.
  parameters:
  - name: since
    in: query
    required: false
    description: The last generation the phone handled; the answer then carries `earliest_lost_after_utc`.
    schema:
      $ref: '#/components/schemas/Uuid'
  responses:
    '200':
      description: Generation record.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ServerGeneration'
    '400':
      $ref: '#/components/responses/BadRequest'
    '401':
      $ref: '#/components/responses/Unauthorized'
