path: /v1/dashboards/targets
method: get
operation:
  tags:
  - dashboards
  operationId: getTargetAchievement
  summary: Monthly target and achievement (till-date basis per surface) for a node.
  description: 'Target Status (D-TSO-MAN-39, contract 1.10.0). Without `level`/`node_id` the node is the caller''s
    top reach node;

    a node outside the reach is 403 `ERR_OUT_OF_SCOPE`. `children=zone` also returns one node per zone in the

    caller''s reach under that node (the TSO''s Territory card plus one card per zone); the zones come from the
    token

    reach, never from client ids. `children=zone` is allowed only when the node is a territory or below (lead ruling

    R-F-18): a territory node answers its zones, a zone node answers itself as its one child, a house node answers

    its zones in the reach (a house is a group of zones inside one territory; it is the default top reach node of
    a

    TSO or AMO who holds a house, D-AUTHZ-1-7-WIRING-01); at a national, wing or division node it is 400

    `ERR_VALIDATION` (`query.children` invalid_value). The check runs on the resolved node, the default top reach
    node

    included. An explicit `level=house` stays 400 `ERR_VALIDATION` (`query.level`, as GeoLevelQuery says), with
    or

    without `children`. Each child carries its own `elapsed_days` and `period_days` and its rows follow them (R-F-15,

    D-TSO-MAN-08). The till-date basis follows the caller''s role (TSO: the TSO key, AMO: the AMO team

    key; calendar days by default, D-TSO-MAN-05). The integer members (`*_qty_base`, `*_pct_bp`) are what the TSO
    app

    prints; the Decimal3 members and `achievement_pct` keep their meaning for the AMO app.

    '
  parameters:
  - name: month
    in: query
    required: true
    schema:
      $ref: '#/components/schemas/Month'
  - $ref: '#/components/parameters/GeoLevelQuery'
  - $ref: '#/components/parameters/NodeIdQuery'
  - name: product_level
    in: query
    required: false
    schema:
      $ref: '#/components/schemas/ProductLevel'
  - name: children
    in: query
    required: false
    description: '`zone`: add `children`, one node per zone in the caller''s reach under the node (contract 1.10.0).
      Only at a territory, house or zone node; at a national, wing or division node 400 `ERR_VALIDATION` (R-F-18).'
    schema:
      type: string
      enum:
      - zone
  responses:
    '200':
      description: Target rows.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/TargetAchievement'
    '400':
      $ref: '#/components/responses/BadRequest'
    '401':
      $ref: '#/components/responses/Unauthorized'
    '403':
      $ref: '#/components/responses/Forbidden'
