path: /v1/admin/offers
method: get
operation:
  tags:
  - admin-products
  operationId: listOffers
  summary: Offer and promotion rules (data, not code).
  description: 'Discount programmes of the portal (1.12.0). Permission module `discounts`: SUPERADMIN, or ADMIN
    with the `r` grant, read all; NATIONAL reads all; BRAND, WM, DMO and TSO read the offers within their server-side
    scope (the client never sends scope ids); SR, AMO, SUPPORT and ANALYST are refused `403`. Newest first; `limit`
    and `cursor` page it.'
  parameters:
  - name: status
    in: query
    required: false
    schema:
      $ref: '#/components/schemas/OfferStatus'
  - name: valid_on
    in: query
    required: false
    schema:
      $ref: '#/components/schemas/BusinessDate'
  - $ref: '#/components/parameters/Limit'
  - $ref: '#/components/parameters/Cursor'
  responses:
    '200':
      description: Page of offers.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/OfferPage'
    '401':
      $ref: '#/components/responses/Unauthorized'
    '403':
      $ref: '#/components/responses/Forbidden'
