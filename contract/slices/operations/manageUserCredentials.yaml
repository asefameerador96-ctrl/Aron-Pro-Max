path: /v1/admin/users/{id}/credentials
method: post
operation:
  tags:
  - admin-users
  operationId: manageUserCredentials
  summary: Reset password (temporary, shown once), unlock, or force logout (revoke full-grant families).
  description: SUPPORT and ADMIN for any user in reach; a TSO may `reset_password` and `unlock` SR and AMO users
    of its own zones (docs/24 s8.5). Every action is audited.
  parameters:
  - $ref: '#/components/parameters/IdPath'
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: '#/components/schemas/CredentialActionRequest'
  responses:
    '200':
      description: Action result.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/CredentialActionResult'
    '400':
      $ref: '#/components/responses/BadRequest'
    '401':
      $ref: '#/components/responses/Unauthorized'
    '403':
      $ref: '#/components/responses/Forbidden'
    '404':
      $ref: '#/components/responses/NotFound'
