path: /v1/dashboards/national/login-submit
method: post
operation:
  tags:
  - dashboards
  operationId: queryNationalLoginSubmit
  summary: Login / Submit Status card
  description: 'Target routes, logins and Bikroy Joma submits (brief s3.4). BRAND users get 403 (docs/34 s1: cards
    without a brand dimension are hidden). Reads summary tables only (never the transaction log); scope from the
    token.'
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: '#/components/schemas/NationalDashboardFilter'
  responses:
    '200':
      description: Login / Submit Status card
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/NationalLoginSubmit'
    '400':
      $ref: '#/components/responses/BadRequest'
    '401':
      $ref: '#/components/responses/Unauthorized'
    '403':
      $ref: '#/components/responses/Forbidden'
    '429':
      $ref: '#/components/responses/TooManyRequests'
    '503':
      $ref: '#/components/responses/ServiceUnavailable'
