path: /v1/admin/outlets/import
method: post
operation:
  tags:
  - admin-outlets
  operationId: importOutlets
  summary: Bulk create-or-update outlets from a sheet as the field has it (preview with dry_run, commit with a reason).
  description: 'The field''s data is accepted as it is (1.18.0). A channel label of the field ("GT Channel") is
    mapped; an empty channel comes from the sub-channel, else the row loads as GT with the warning `channel_defaulted`;
    a channel that names none of the six is the row error `unknown_channel` (never a 400 for the batch). Phones
    are repaired to the national form, coordinates are rounded to 8 decimals, a tier that does not fit the channel
    loads with no tier and the warning `sub_channel_mismatch`. `dry_run: true` writes nothing and returns the report;
    `dry_run: false` needs `change_reason` and, with `on_row_error` `reject_batch` (default), refuses the whole
    batch on any row error; `skip_rows` writes the good rows and lists the skipped ones. Idempotent by `batch_uuid`
    (same content replays, other content is 409 ERR_SYNC_BATCH_UUID_REUSED). A row whose `code` names an outlet
    of the same zone updates it (never its status; a blank route, pin, phone, address, tier or geo class keeps the
    stored one).

    '
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: '#/components/schemas/OutletImportWrite'
  responses:
    '200':
      description: The preview report (dry_run) or the commit result.
      content:
        application/json:
          schema:
            oneOf:
            - $ref: '#/components/schemas/OutletImportPreview'
            - $ref: '#/components/schemas/OutletImportResult'
    '400':
      $ref: '#/components/responses/BadRequest'
    '401':
      $ref: '#/components/responses/Unauthorized'
    '403':
      $ref: '#/components/responses/Forbidden'
    '409':
      $ref: '#/components/responses/Conflict'
