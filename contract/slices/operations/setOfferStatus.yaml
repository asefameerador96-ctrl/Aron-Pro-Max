path: /v1/admin/offers/{id}/status
method: post
operation:
  tags:
  - admin-products
  operationId: setOfferStatus
  summary: Activate a draft or end an active offer (1.12.0).
  description: 'Allowed moves: draft -> active (SUPERADMIN only, as for prices), active -> inactive (SUPERADMIN,
    or ADMIN with the `w` grant on module `discounts`). Anything else is `409`. Activation needs a current version
    whose `valid_to` is not in the past (Asia/Dhaka business date), else `400`. The move is recorded with its reason
    in the append-only status trail and in the audit log. Idempotent by `request_uuid`: a repeat returns the first
    result; the same `request_uuid` with a different move is `409`. Activating does not change the field: the bundle
    `offers` array stays empty.'
  parameters:
  - $ref: '#/components/parameters/IdPath'
  - name: If-Match
    in: header
    required: false
    description: Optional (1.12.2). The ETag of the offer being moved; when given and stale the move is refused
      `412`. A replay of a stored `request_uuid` is answered before `If-Match` is judged, so a retry that carries
      the now-stale ETag still gets the first result.
    schema:
      type: string
      pattern: ^"[0-9]{1,10}"$
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: '#/components/schemas/OfferStatusChange'
  responses:
    '200':
      description: The offer after the move (or the stored first result of a replay).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Offer'
    '400':
      $ref: '#/components/responses/BadRequest'
    '401':
      $ref: '#/components/responses/Unauthorized'
    '403':
      $ref: '#/components/responses/Forbidden'
    '404':
      $ref: '#/components/responses/NotFound'
    '409':
      $ref: '#/components/responses/Conflict'
    '412':
      $ref: '#/components/responses/PreconditionFailed'
