path: /v1/admin/surveys
method: post
operation:
  tags:
  - admin-content
  operationId: createSurvey
  summary: Create a survey (version 1); questions are immutable once answered, a change is a new version.
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: '#/components/schemas/SurveyWrite'
  responses:
    '201':
      description: Created.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/SurveyAdmin'
    '400':
      $ref: '#/components/responses/BadRequest'
    '401':
      $ref: '#/components/responses/Unauthorized'
    '403':
      $ref: '#/components/responses/Forbidden'
    '409':
      $ref: '#/components/responses/Conflict'
