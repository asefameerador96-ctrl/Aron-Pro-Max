path: /v1/admin/outlets/{id}
method: patch
operation:
  tags:
  - admin-outlets
  operationId: updateOutlet
  summary: Update an outlet (status close is never a delete; placement changes keep history).
  parameters:
  - $ref: '#/components/parameters/IdPath'
  - $ref: '#/components/parameters/IfMatch'
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: '#/components/schemas/OutletPatch'
  responses:
    '200':
      description: Updated.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Outlet'
    '400':
      $ref: '#/components/responses/BadRequest'
    '401':
      $ref: '#/components/responses/Unauthorized'
    '403':
      $ref: '#/components/responses/Forbidden'
    '404':
      $ref: '#/components/responses/NotFound'
    '412':
      $ref: '#/components/responses/PreconditionFailed'
