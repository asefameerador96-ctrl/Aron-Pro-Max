path: /v1/admin/notifications
method: post
operation:
  tags:
  - notifications
  operationId: sendNotification
  summary: Send an FCM data nudge (announcement or config pull) to devices in a scope.
  description: Payload carries `pull_after_s` jitter, and `urgent` = "true" on an urgent `config_pull` (the phone's
    urgent pull, F-SYS-073); FCM never triggers an upload (docs/24 s4.7). Refused with 409 `ERR_PUSH_DISABLED` while
    `cfg.ops.push_enabled` is false.
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: '#/components/schemas/NotificationRequest'
  responses:
    '202':
      description: Queued for delivery.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/NotificationAccepted'
    '400':
      $ref: '#/components/responses/BadRequest'
    '401':
      $ref: '#/components/responses/Unauthorized'
    '403':
      $ref: '#/components/responses/Forbidden'
    '409':
      $ref: '#/components/responses/Conflict'
