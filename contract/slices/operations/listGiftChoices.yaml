path: /v1/programmes/astha/gift-choices
method: get
operation:
  tags:
  - programmes
  operationId: listGiftChoices
  summary: Astha gift choice per outlet (TSO panel and Astha Gift Choice report source).
  parameters:
  - name: quarter
    in: query
    required: true
    schema:
      type: string
      pattern: ^\d{4}-Q[1-4]$
    description: Quarter `YYYY-Qn`.
  - name: route_id
    in: query
    required: false
    schema:
      $ref: '#/components/schemas/Id'
    description: One route.
  - $ref: '#/components/parameters/ZoneIdQuery'
  - $ref: '#/components/parameters/Limit'
  - $ref: '#/components/parameters/Cursor'
  responses:
    '200':
      description: Gift assignments.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/GiftAssignmentPage'
    '401':
      $ref: '#/components/responses/Unauthorized'
    '403':
      $ref: '#/components/responses/Forbidden'
