path: /v1/admin/gifts/{id}
method: patch
operation:
  tags:
  - admin-content
  operationId: updateGift
  summary: Change cost, labels or status of a gift (memos and redemptions keep the cost they used).
  parameters:
  - $ref: '#/components/parameters/IdPath'
  - $ref: '#/components/parameters/IfMatch'
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: '#/components/schemas/GiftWrite'
  responses:
    '200':
      description: Updated.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Gift'
    '400':
      $ref: '#/components/responses/BadRequest'
    '401':
      $ref: '#/components/responses/Unauthorized'
    '403':
      $ref: '#/components/responses/Forbidden'
    '404':
      $ref: '#/components/responses/NotFound'
    '412':
      $ref: '#/components/responses/PreconditionFailed'
