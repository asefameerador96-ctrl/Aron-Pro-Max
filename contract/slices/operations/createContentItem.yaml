path: /v1/admin/content
method: post
operation:
  tags:
  - admin-content
  operationId: createContentItem
  summary: Create an AV or KV item from an uploaded asset (at most cfg.content.max_item_mb).
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: '#/components/schemas/ContentWrite'
  responses:
    '201':
      description: Created.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ContentAdmin'
    '400':
      $ref: '#/components/responses/BadRequest'
    '401':
      $ref: '#/components/responses/Unauthorized'
    '403':
      $ref: '#/components/responses/Forbidden'
    '413':
      $ref: '#/components/responses/PayloadTooLarge'
