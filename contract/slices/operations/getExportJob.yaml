path: /v1/report-exports/{export_id}
method: get
operation:
  tags:
  - reports
  operationId: getExportJob
  summary: Status of an export job; a short-lived download URL when done.
  parameters:
  - name: export_id
    in: path
    required: true
    schema:
      $ref: '#/components/schemas/Uuid'
  responses:
    '200':
      description: Job.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ExportJob'
    '401':
      $ref: '#/components/responses/Unauthorized'
    '403':
      $ref: '#/components/responses/Forbidden'
    '404':
      $ref: '#/components/responses/NotFound'
