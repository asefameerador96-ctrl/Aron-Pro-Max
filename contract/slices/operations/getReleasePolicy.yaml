path: /v1/admin/releases/policy
method: get
operation:
  tags:
  - admin-releases
  operationId: getReleasePolicy
  summary: Minimum, latest and blocked version codes per flavour (edited through config changes of cfg.release.*).
  responses:
    '200':
      description: Release policy.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ReleasePolicyList'
    '401':
      $ref: '#/components/responses/Unauthorized'
    '403':
      $ref: '#/components/responses/Forbidden'
