path: /v1/admin/route-kpi-targets
method: put
operation:
  tags:
  - admin-targets
  operationId: putRouteKpiTargets
  summary: Validate (dry_run) or commit KPI targets (brand memo targets and allocated KPI, month allocation and
    CPR), upsert by route, brand and month.
  description: 'Same guarantees as `putRouteTargets`: `dry_run: true` validates and writes nothing; `dry_run: false`
    needs `change_reason`, commits all rows or none, is idempotent by `batch_uuid` (same content replays, other
    content or user is 409; the idempotency record is shared with the route target upload) and never rewrites a
    past Dhaka month. Errors point at `body.brand_rows/<i>/<member>` or `body.month_rows/<i>/<member>`. Money is
    integer milli-taka; CPR target is basis points. The volume target stays in `putRouteTargets`. Audited as entity
    `route_kpi_target`.'
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: '#/components/schemas/RouteKpiTargetWrite'
  responses:
    '200':
      description: Preview (dry_run) or commit result.
      content:
        application/json:
          schema:
            oneOf:
            - $ref: '#/components/schemas/RouteKpiTargetPreview'
            - $ref: '#/components/schemas/RouteTargetCommitResult'
    '400':
      $ref: '#/components/responses/BadRequest'
    '401':
      $ref: '#/components/responses/Unauthorized'
    '403':
      $ref: '#/components/responses/Forbidden'
    '503':
      $ref: '#/components/responses/ServiceUnavailable'
    '409':
      $ref: '#/components/responses/Conflict'
    '413':
      $ref: '#/components/responses/PayloadTooLarge'
