path: /v1/day/final-submit
method: post
operation:
  tags:
  - day
  operationId: postFinalSubmit
  summary: Close a zone-day (TSO app or web). Online-only, once per zone and day.
  description: 'The same `client_uuid` replays the first success; a different one gets 409 `ERR_DAY_ALREADY_FINAL_SUBMITTED`.

    A replay succeeds only while the matched submit is live: when that zone-day was reopened since, the answer is
    409

    `ERR_DAY_FINAL_SUBMIT_REOPENED` and the app reads the preview again (its `submit_seq` gives the next

    `client_uuid`; D-TSO-MAN-28, contract 1.10.0). Not-uploaded due routes never block the submit (D-TSO-MAN-27).

    '
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: '#/components/schemas/FinalSubmitRequest'
  responses:
    '200':
      description: Zone-day final-submitted.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/FinalSubmitResult'
    '400':
      $ref: '#/components/responses/BadRequest'
    '401':
      $ref: '#/components/responses/Unauthorized'
    '403':
      $ref: '#/components/responses/Forbidden'
    '409':
      $ref: '#/components/responses/Conflict'
