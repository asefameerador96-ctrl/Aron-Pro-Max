path: /v1/dashboards/sale-position/{outlet_id}
method: get
operation:
  tags:
  - dashboards
  operationId: getSalePosition
  summary: Sale Position (SR hit / miss)
  description: 'Base position, sale positions with kind and the force-sale photo of one outlet and day (brief s5.4).
    BRAND users get 403 (docs/34 s1: cards without a brand dimension are hidden).'
  parameters:
  - name: outlet_id
    in: path
    required: true
    schema:
      $ref: '#/components/schemas/Id'
  - name: date
    in: query
    required: false
    description: Business day; default today (Dhaka).
    schema:
      $ref: '#/components/schemas/BusinessDate'
  responses:
    '200':
      description: Sale Position (SR hit / miss)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/SalePosition'
    '404':
      $ref: '#/components/responses/NotFound'
    '400':
      $ref: '#/components/responses/BadRequest'
    '401':
      $ref: '#/components/responses/Unauthorized'
    '403':
      $ref: '#/components/responses/Forbidden'
    '429':
      $ref: '#/components/responses/TooManyRequests'
    '503':
      $ref: '#/components/responses/ServiceUnavailable'
