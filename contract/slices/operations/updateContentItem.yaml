path: /v1/admin/content/{id}
method: patch
operation:
  tags:
  - admin-content
  operationId: updateContentItem
  summary: Change validity, assignment or order, replace the asset (new version) or deactivate.
  parameters:
  - $ref: '#/components/parameters/IdPath'
  - $ref: '#/components/parameters/IfMatch'
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: '#/components/schemas/ContentWrite'
  responses:
    '200':
      description: Updated.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ContentAdmin'
    '400':
      $ref: '#/components/responses/BadRequest'
    '401':
      $ref: '#/components/responses/Unauthorized'
    '403':
      $ref: '#/components/responses/Forbidden'
    '404':
      $ref: '#/components/responses/NotFound'
    '412':
      $ref: '#/components/responses/PreconditionFailed'
