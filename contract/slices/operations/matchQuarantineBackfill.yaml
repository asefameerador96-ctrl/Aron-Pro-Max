path: /v1/admin/quarantine/{quarantine_id}/match-backfill
method: post
operation:
  tags:
  - sync
  operationId: matchQuarantineBackfill
  summary: Resolve a held phone memo as the same memo as a paper backfill (same SR, outlet, lines and money); releases
    its held collections onto the paper memo.
  description: The held item is an open `memo_no_duplicate` memo whose stored twin is a live `source = manual` paper
    backfill. Any difference between the two is 409 `ERR_CONFLICT` with one `errors[]` entry per difference and
    nothing changes. The phone's visit is kept and the paper visit is voided (`superseded_by_device_visit`). A repeat
    of a done match is 409 `ERR_REQUEST_STATE` (the item is no longer open). SUPPORT, ADMIN, SUPERADMIN; the item's
    route must be in the caller's reach.
  parameters:
  - name: quarantine_id
    in: path
    required: true
    schema:
      $ref: '#/components/schemas/Id'
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: '#/components/schemas/ReasonRequest'
  responses:
    '200':
      description: Matched.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/BackfillMatchResult'
    '400':
      $ref: '#/components/responses/BadRequest'
    '401':
      $ref: '#/components/responses/Unauthorized'
    '403':
      $ref: '#/components/responses/Forbidden'
    '404':
      $ref: '#/components/responses/NotFound'
    '409':
      $ref: '#/components/responses/Conflict'
