path: /v1/programmes/loyalty/balances
method: get
operation:
  tags:
  - programmes
  operationId: getLoyaltyBalances
  summary: Live loyalty balance of outlets in reach (online refresh of the bundle's previous-day balance).
  parameters:
  - name: outlet_id
    in: query
    required: false
    schema:
      type: array
      maxItems: 200
      items:
        $ref: '#/components/schemas/Id'
    style: form
    explode: true
    description: 'Outlets to read; omitted = the outlets of the caller''s routes today (a national reader must name
      outlets: `400`). Outlets outside the caller''s reach are left out of the answer, never an error. Balances
      are live (the ledger up to and including today), where the bundle''s are as of the previous business day.'
  - name: programme_id
    in: query
    required: false
    schema:
      $ref: '#/components/schemas/Id'
    description: One programme.
  responses:
    '200':
      description: Balances.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/LoyaltyBalanceList'
    '400':
      $ref: '#/components/responses/BadRequest'
    '401':
      $ref: '#/components/responses/Unauthorized'
    '403':
      $ref: '#/components/responses/Forbidden'
    '429':
      $ref: '#/components/responses/TooManyRequests'
