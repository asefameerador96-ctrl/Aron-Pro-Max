path: /v1/sku-images/{asset_id}/read-url
method: get
operation:
  tags:
  - media
  operationId: getSkuImageReadUrl
  summary: Short-lived read URL of a SKU's pack picture (PARITY-SPEC s2.6), by the stable `Sku.image_asset_id` of
    the bundle.
  description: 'Any signed-in user (pack art is the same for every role and reach). The URL is valid for 5 minutes;
    the phone

    downloads at once and caches the bytes under the asset id, so a new upload (a new asset id) is the only refetch.

    Only an asset of purpose `sku_image` that a SKU currently binds is served; anything else is 404. The bundle

    carries the asset id, never a signed URL, so the bundle fingerprint stays stable. The answer is `no-store`.

    '
  parameters:
  - name: asset_id
    in: path
    required: true
    schema:
      $ref: '#/components/schemas/Uuid'
  responses:
    '200':
      description: Read URL valid for 5 minutes (a JPEG or PNG of at most 300 KB).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/MediaReadUrl'
    '400':
      $ref: '#/components/responses/BadRequest'
    '401':
      $ref: '#/components/responses/Unauthorized'
    '404':
      $ref: '#/components/responses/NotFound'
    '503':
      $ref: '#/components/responses/ServiceUnavailable'
