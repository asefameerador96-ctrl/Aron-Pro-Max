path: /v1/admin/mdm/enrolment-tokens
method: get
operation:
  tags:
  - admin-mdm
  operationId: listMdmEnrolmentTokens
  summary: Enrolment tokens of the device-owner DPC (same data as listEnrolmentTokens, gated by the mdm module).
  parameters:
  - name: active_only
    in: query
    required: false
    schema:
      type: boolean
      default: true
  - $ref: '#/components/parameters/Limit'
  - $ref: '#/components/parameters/Cursor'
  responses:
    '200':
      description: Page of tokens.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/EnrolmentTokenPage'
    '401':
      $ref: '#/components/responses/Unauthorized'
    '403':
      $ref: '#/components/responses/Forbidden'
