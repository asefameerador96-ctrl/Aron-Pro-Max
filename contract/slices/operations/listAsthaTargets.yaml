path: /v1/programmes/astha/targets
method: get
operation:
  tags:
  - programmes
  operationId: listAsthaTargets
  summary: Astha targets and achievement by outlet and brand for a quarter (route and shop information, web reads).
  description: A national reader (reach of the whole network) must narrow by `route_id` or `zone_id` (`400`, pointer
    `query.route_id`); a `route_id` or `zone_id` outside the caller's reach is `403 ERR_OUT_OF_SCOPE`. Paged by
    `limit` and `cursor`; achievement is as of the read (`as_of`), computed by the same query as the bundle.
  parameters:
  - name: quarter
    in: query
    required: true
    schema:
      type: string
      pattern: ^\d{4}-Q[1-4]$
    description: Quarter `YYYY-Qn` (quarter start month from cfg.astha.quarter_start_month).
  - name: route_id
    in: query
    required: false
    schema:
      $ref: '#/components/schemas/Id'
    description: One route (the AMO route selector).
  - $ref: '#/components/parameters/ZoneIdQuery'
  - $ref: '#/components/parameters/Limit'
  - $ref: '#/components/parameters/Cursor'
  responses:
    '200':
      description: Target rows with achievement.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/AsthaTargetPage'
    '400':
      $ref: '#/components/responses/BadRequest'
    '401':
      $ref: '#/components/responses/Unauthorized'
    '403':
      $ref: '#/components/responses/Forbidden'
