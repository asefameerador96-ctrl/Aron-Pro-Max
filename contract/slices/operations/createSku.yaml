path: /v1/admin/skus
method: post
operation:
  tags:
  - admin-products
  operationId: createSku
  summary: Create a SKU.
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: '#/components/schemas/SkuWrite'
  responses:
    '201':
      description: Created.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Sku'
    '400':
      $ref: '#/components/responses/BadRequest'
    '401':
      $ref: '#/components/responses/Unauthorized'
    '403':
      $ref: '#/components/responses/Forbidden'
    '409':
      $ref: '#/components/responses/Conflict'
