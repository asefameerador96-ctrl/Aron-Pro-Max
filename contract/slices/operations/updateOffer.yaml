path: /v1/admin/offers/{id}
method: patch
operation:
  tags:
  - admin-products
  operationId: updateOffer
  summary: Change an offer; a rule change creates a new offer version (memos keep the version they used).
  description: 'Only while the offer is `draft` (1.12.0): every accepted change appends an immutable offer version;
    an `active` or `inactive` offer is `409`

    (end it and create a new one). The status moves through `POST /v1/admin/offers/{id}/status`; a `status` member
    here is `400`. Idempotent by

    `request_uuid` (required by the server). SUPERADMIN, or ADMIN with the `w` grant on module `discounts`.

    '
  parameters:
  - $ref: '#/components/parameters/IdPath'
  - $ref: '#/components/parameters/IfMatch'
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: '#/components/schemas/OfferPatch'
  responses:
    '200':
      description: Updated.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Offer'
    '400':
      $ref: '#/components/responses/BadRequest'
    '401':
      $ref: '#/components/responses/Unauthorized'
    '403':
      $ref: '#/components/responses/Forbidden'
    '404':
      $ref: '#/components/responses/NotFound'
    '409':
      $ref: '#/components/responses/Conflict'
    '412':
      $ref: '#/components/responses/PreconditionFailed'
