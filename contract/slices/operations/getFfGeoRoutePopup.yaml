path: /v1/dashboards/national/ff-geo/routes/{route_id}
method: get
operation:
  tags:
  - dashboards
  operationId: getFfGeoRoutePopup
  summary: FF Geo route pop-up
  description: 'SR name, contact, territory, zone, route, latest position time and miss % (brief s5.2). The route
    must be inside the caller''s scope, else 404. BRAND users get 403 (docs/34 s1: cards without a brand dimension
    are hidden).'
  parameters:
  - name: route_id
    in: path
    required: true
    schema:
      $ref: '#/components/schemas/Id'
  - name: date
    in: query
    required: false
    description: Business day; default today (Dhaka).
    schema:
      $ref: '#/components/schemas/BusinessDate'
  responses:
    '200':
      description: FF Geo route pop-up
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/FfGeoRoutePopup'
    '404':
      $ref: '#/components/responses/NotFound'
    '400':
      $ref: '#/components/responses/BadRequest'
    '401':
      $ref: '#/components/responses/Unauthorized'
    '403':
      $ref: '#/components/responses/Forbidden'
    '429':
      $ref: '#/components/responses/TooManyRequests'
    '503':
      $ref: '#/components/responses/ServiceUnavailable'
