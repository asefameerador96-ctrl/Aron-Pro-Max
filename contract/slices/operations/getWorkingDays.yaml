path: /v1/admin/calendar/working-days
method: get
operation:
  tags:
  - admin-calendar
  operationId: getWorkingDays
  summary: Every date of a month with Friday, weekend and national holiday flags and the working-day count (Fridays
    and holidays excluded).
  description: Weekend days come from `cfg.calendar.weekend_days` (ISO weekdays, default Friday = 5). Only global
    declarations count; a global make-up day is a working day.
  parameters:
  - name: month
    in: query
    required: false
    schema:
      $ref: '#/components/schemas/RouteTargetMonth'
    description: YYYY-MM; default the current Dhaka month.
  responses:
    '200':
      description: The month.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/WorkingDays'
    '400':
      $ref: '#/components/responses/BadRequest'
    '401':
      $ref: '#/components/responses/Unauthorized'
    '403':
      $ref: '#/components/responses/Forbidden'
