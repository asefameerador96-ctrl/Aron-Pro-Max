path: /v1/admin/tutorials/{id}
method: patch
operation:
  tags:
  - admin-content
  operationId: updateTutorial
  summary: Edit, reorder or retire a tutorial.
  parameters:
  - $ref: '#/components/parameters/IdPath'
  - $ref: '#/components/parameters/IfMatch'
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: '#/components/schemas/TutorialWrite'
  responses:
    '200':
      description: Updated.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/TutorialAdmin'
    '400':
      $ref: '#/components/responses/BadRequest'
    '401':
      $ref: '#/components/responses/Unauthorized'
    '403':
      $ref: '#/components/responses/Forbidden'
    '404':
      $ref: '#/components/responses/NotFound'
    '412':
      $ref: '#/components/responses/PreconditionFailed'
