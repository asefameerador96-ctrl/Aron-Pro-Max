path: /v1/auth/mfa/enrol
method: post
operation:
  tags:
  - auth
  operationId: enrolMfa
  summary: Start TOTP enrolment for the caller (web admin roles).
  responses:
    '200':
      description: TOTP secret URI and one-time recovery codes (shown once).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/MfaEnrolment'
    '401':
      $ref: '#/components/responses/Unauthorized'
    '409':
      $ref: '#/components/responses/Conflict'
