path: /v1/devices/me/commands/{command_id}/ack
method: post
operation:
  tags:
  - devices
  operationId: ackDeviceCommand
  summary: Report the result of a command (acked or failed). Idempotent.
  security:
  - bearerAuth: []
  - {}
  parameters:
  - $ref: '#/components/parameters/XDeviceIdRequired'
  - $ref: '#/components/parameters/XDeviceProof'
  - name: command_id
    in: path
    required: true
    schema:
      $ref: '#/components/schemas/Uuid'
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: '#/components/schemas/DeviceCommandAck'
  responses:
    '200':
      description: Final state recorded.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/DeviceCommandAckResult'
    '400':
      $ref: '#/components/responses/BadRequest'
    '401':
      $ref: '#/components/responses/Unauthorized'
    '404':
      $ref: '#/components/responses/NotFound'
