path: /v1/admin/routes
method: get
operation:
  tags:
  - admin-routes
  operationId: listRoutes
  summary: Routes with kind, visit kind and visit days.
  parameters:
  - $ref: '#/components/parameters/ZoneIdQuery'
  - $ref: '#/components/parameters/TerritoryIdQuery'
  - $ref: '#/components/parameters/StatusQuery'
  - $ref: '#/components/parameters/UpdatedSince'
  - $ref: '#/components/parameters/Search'
  - $ref: '#/components/parameters/Limit'
  - $ref: '#/components/parameters/Cursor'
  - in: query
    name: include
    required: false
    description: '`assignees` adds `assignees` (the users assigned to the route) to every item.'
    schema:
      type: string
      enum:
      - assignees
  responses:
    '200':
      description: Page of routes.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/RoutePage'
    '401':
      $ref: '#/components/responses/Unauthorized'
    '403':
      $ref: '#/components/responses/Forbidden'
