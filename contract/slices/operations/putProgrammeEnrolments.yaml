path: /v1/admin/programmes/{id}/enrolments
method: put
operation:
  tags:
  - admin-content
  operationId: putProgrammeEnrolments
  summary: Upsert enrolments (idempotent by batch_uuid, all-or-nothing).
  description: 'Permission module `loyalty`, `w` grant. A repeat of a `batch_uuid` returns the first counts; the
    same `batch_uuid` with different rows is `409` (1.13.0). A `tier_code` must be one of the current version''s
    tiers when it has any; an outlet that does not exist is `400` (the writers, SUPERADMIN and ADMIN, hold no geography
    scope; WM, DMO and TSO cannot write). Reading enrolments is cut to the caller''s reach: WM, DMO and TSO see
    the outlets of their zones and routes, a BRAND user is refused `403` (outlet data), `zone_id` outside the reach
    is `403`. An enrolment never overlaps another of the same programme and outlet (`409`).'
  parameters:
  - $ref: '#/components/parameters/IdPath'
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: '#/components/schemas/ProgrammeEnrolmentWrite'
  responses:
    '200':
      description: Stored.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/TargetBatchResult'
    '400':
      $ref: '#/components/responses/BadRequest'
    '401':
      $ref: '#/components/responses/Unauthorized'
    '403':
      $ref: '#/components/responses/Forbidden'
    '404':
      $ref: '#/components/responses/NotFound'
    '409':
      $ref: '#/components/responses/Conflict'
