path: /v1/admin/programmes/{id}/enrolments
method: put
operation:
  tags:
  - admin-content
  operationId: putProgrammeEnrolments
  summary: Upsert enrolments (idempotent by batch_uuid, all-or-nothing).
  description: Permission module `loyalty`, `w` grant. A repeat of a `batch_uuid` returns the first counts; the
    same `batch_uuid` with different rows is `409` (1.13.0). A `tier_code` must be one of the current version's
    tiers when it has any; an outlet outside the caller's server-side scope is `400`. An enrolment never overlaps
    another of the same programme and outlet (`409`).
  parameters:
  - $ref: '#/components/parameters/IdPath'
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: '#/components/schemas/ProgrammeEnrolmentWrite'
  responses:
    '200':
      description: Stored.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/TargetBatchResult'
    '400':
      $ref: '#/components/responses/BadRequest'
    '401':
      $ref: '#/components/responses/Unauthorized'
    '403':
      $ref: '#/components/responses/Forbidden'
    '404':
      $ref: '#/components/responses/NotFound'
    '409':
      $ref: '#/components/responses/Conflict'
