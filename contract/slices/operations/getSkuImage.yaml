path: /v1/sku-images/{asset_id}
method: get
operation:
  tags:
  - media
  operationId: getSkuImage
  summary: The bytes of a SKU's pack picture (PARITY-SPEC s2.6), by the stable `Sku.image_asset_id` of the bundle.
  description: 'Any signed-in user (pack art is the same for every role and reach). The API streams the bytes itself:
    no signed

    URL leaves it. An asset never changes (a new file is a new asset id), so the answer is cacheable for a year
    and

    its ETag is the asset id; the phone keeps the bytes in its bounded cache under the asset id and fetches once
    per

    new id. Served only when the asset exists, has purpose `sku_image`, is at most 300 KB and a SKU binds it;

    anything else, a malformed id included, is 404 without detail.

    '
  parameters:
  - name: asset_id
    in: path
    required: true
    schema:
      type: string
      maxLength: 36
  - name: If-None-Match
    in: header
    required: false
    schema:
      type: string
      maxLength: 100
  responses:
    '200':
      description: The picture (JPEG or PNG, at most 300 KB).
      headers:
        ETag:
          required: true
          schema:
            type: string
            maxLength: 40
            description: The asset id in quotes.
        Cache-Control:
          required: true
          schema:
            type: string
            const: private, max-age=31536000, immutable
      content:
        image/jpeg:
          schema:
            type: string
            contentMediaType: image/jpeg
            maxLength: 307200
        image/png:
          schema:
            type: string
            contentMediaType: image/png
            maxLength: 307200
    '304':
      $ref: '#/components/responses/NotModified'
    '401':
      $ref: '#/components/responses/Unauthorized'
    '404':
      $ref: '#/components/responses/NotFound'
    '503':
      $ref: '#/components/responses/ServiceUnavailable'
