path: /v1/admin/calendar/holidays/{holiday_id}/revoke
method: post
operation:
  tags:
  - admin-calendar
  operationId: revokeHoliday
  summary: Withdraw a holiday, make-up day or off-day declaration that has not started (its date is after today).
  parameters:
  - name: holiday_id
    in: path
    required: true
    schema:
      $ref: '#/components/schemas/Id'
    description: Calendar entry id.
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: '#/components/schemas/HolidayRevoke'
  responses:
    '200':
      description: The revoked entry.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Holiday'
    '400':
      $ref: '#/components/responses/BadRequest'
    '401':
      $ref: '#/components/responses/Unauthorized'
    '403':
      $ref: '#/components/responses/Forbidden'
    '404':
      $ref: '#/components/responses/NotFound'
    '409':
      $ref: '#/components/responses/Conflict'
