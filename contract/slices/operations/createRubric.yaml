path: /v1/admin/rubrics
method: post
operation:
  tags:
  - admin-content
  operationId: createRubric
  summary: Create a rubric.
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: '#/components/schemas/RubricWrite'
  responses:
    '201':
      description: Created.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/RubricAdmin'
    '400':
      $ref: '#/components/responses/BadRequest'
    '401':
      $ref: '#/components/responses/Unauthorized'
    '403':
      $ref: '#/components/responses/Forbidden'
    '409':
      $ref: '#/components/responses/Conflict'
