path: /v1/auth/logout
method: post
operation:
  tags:
  - auth
  operationId: logout
  summary: End a session; optionally revoke the upload grant after the outbox is empty.
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: '#/components/schemas/LogoutRequest'
  responses:
    '204':
      description: Logged out.
    '400':
      $ref: '#/components/responses/BadRequest'
    '401':
      $ref: '#/components/responses/Unauthorized'
