JourneyCall:
  type: object
  required:
  - visit_uuid
  - outlet
  - status
  - opened_at
  - closed_at
  - duration_s
  - distance_from_prev_m
  - distance_so_far_m
  - gap_to_next_s
  additionalProperties: false
  properties:
    visit_uuid:
      type: string
      format: uuid
    outlet:
      $ref: '#/components/schemas/JourneyOutlet'
    status:
      type: string
      enum:
      - new_sale
      - edited_sale
      - no_sale
      - repeat_sale
      description: 'repeat_sale (contract 1.14.0): a second or later sale at the same outlet on the same day. An
        older reader must treat an unknown status as new_sale.'
    opened_at:
      $ref: '#/components/schemas/Timestamp'
    closed_at:
      oneOf:
      - $ref: '#/components/schemas/Timestamp'
      - type: 'null'
    duration_s:
      type:
      - integer
      - 'null'
      minimum: 0
    distance_from_prev_m:
      type:
      - number
      - 'null'
      minimum: 0
      description: Metres, two decimals; null for the first call or when an outlet has no base point.
    distance_so_far_m:
      type: number
      minimum: 0
      description: 'Metres walked so far: the running sum of `distance_from_prev_m` up to and including this call
        (0 for the first call).'
    gap_to_next_s:
      type:
      - integer
      - 'null'
      minimum: 0
