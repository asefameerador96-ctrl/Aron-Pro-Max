SyncTotalsResponse:
  type: object
  required:
  - totals
  - day_states
  additionalProperties: false
  properties:
    totals:
      $ref: '#/components/schemas/ServerTotals'
    day_states:
      type: array
      items:
        $ref: '#/components/schemas/RouteDayState'
    supervisor_day:
      oneOf:
      - $ref: '#/components/schemas/SupervisorDayState'
      - type: 'null'
    digest:
      $ref: '#/components/schemas/SalesSubmitDigest'
      description: Optional in 1.9.0 (the server adds it when backend-core wires D-NIGHT-DAYCLOSE-01); a later batch
        makes it required, which is not breaking for a reader. Until then a phone without `digest` falls back to
        `totals`.
