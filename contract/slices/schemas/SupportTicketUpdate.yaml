SupportTicketUpdate:
  type: object
  description: 'One support-desk action (D-TSO-MAN-20). `op_uuid` makes it idempotent (a new v4 UUID per desk action,
    kept for

    its retries; the replay rules, the event UUIDs and the 409 for a reused `op_uuid` are in updateSupportTicket);

    `expected_version` is the `version` the desk read. At least one change besides those two. A resolve needs

    `resolution_code` and `resolution_notes`; a cancel needs `cancel_reason`.

    '
  required:
  - op_uuid
  - expected_version
  minProperties: 3
  additionalProperties: false
  properties:
    op_uuid:
      $ref: '#/components/schemas/Uuid'
    expected_version:
      type: integer
      minimum: 1
    status:
      type: string
      enum:
      - in_progress
      - resolved
      - closed
      - cancelled
    priority:
      $ref: '#/components/schemas/SupportTicketPriority'
    assignee_user_id:
      type:
      - integer
      - 'null'
      format: int64
      minimum: 1
      description: Null unassigns.
    resolution_code:
      type: string
      pattern: ^[a-z][a-z0-9_]{1,40}$
      description: A `ticket_resolution_code` code.
    resolution_notes:
      type: string
      minLength: 1
      maxLength: 2000
      description: D-TSO-MAN-20 (1 to 2000). The resolution message that wraps them fits SupportTicketEvent.body
        (at most 2204 of 2400 characters).
    cancel_reason:
      type: string
      minLength: 3
      maxLength: 500
