JourneyOutlet:
  type: object
  required:
  - id
  - name
  - code
  - phone_masked
  - cluster
  additionalProperties: false
  properties:
    id:
      $ref: '#/components/schemas/Id'
    name:
      type: string
      maxLength: 200
    code:
      type: string
      maxLength: 40
    phone_masked:
      type:
      - string
      - 'null'
      maxLength: 20
      description: First three and last three digits only.
    cluster:
      type:
      - string
      - 'null'
      maxLength: 120
