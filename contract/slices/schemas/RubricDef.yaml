RubricDef:
  type: object
  required:
  - rubric_id
  - version
  - kind
  - criteria
  additionalProperties: false
  properties:
    rubric_id:
      $ref: '#/components/schemas/Id'
    version:
      type: integer
      minimum: 1
    kind:
      type: string
      enum:
      - joint_call
      - retailer_questionnaire
    criteria:
      type: array
      maxItems: 50
      items:
        type: object
        required:
        - criterion_id
        - label_en
        - answer_type
        additionalProperties: false
        properties:
          criterion_id:
            $ref: '#/components/schemas/Id'
          label_bn:
            type:
            - string
            - 'null'
            maxLength: 300
          label_en:
            type: string
            maxLength: 300
          answer_type:
            type: string
            enum:
            - score_1_5
            - text
            - bool
            description: The one rubric answer type enum for read and write; `score_1_5` is a score from 1 to 5.
              `RubricWrite` also accepts the older spelling `stars_1_5` of the same type (docs/24 s14a R20).
          enabled:
            type: boolean
          key:
            type: string
            pattern: ^[a-z][a-z0-9_]{1,40}$
            description: Stable key of the criterion (the `key` of `RubricWrite`), returned on the admin read (`RubricAdmin`)
              so a definition round-trips into the write (docs/24 s14a R20); the bundle may omit it.
