OutletImportResult:
  type: object
  required:
  - batch_uuid
  - rows
  - replayed
  additionalProperties: false
  properties:
    batch_uuid:
      $ref: '#/components/schemas/Uuid'
    rows:
      type: integer
      minimum: 1
    replayed:
      type: boolean
    creates:
      type: integer
      minimum: 0
      description: 1.18.0.
    updates:
      type: integer
      minimum: 0
      description: 1.18.0.
    unchanged:
      type: integer
      minimum: 0
      description: 1.18.0 (push 1b). Rows that changed nothing (no write, no version bump, no audit row).
    by_channel:
      type: object
      additionalProperties:
        type: integer
        minimum: 0
      description: 1.18.0 (push 1b). Loaded rows per channel. Not on a replay.
    skipped:
      type: integer
      minimum: 0
      description: 1.18.0. Rows left out because of a row error (on_row_error skip_rows).
    errors:
      type: array
      maxItems: 1000
      items:
        $ref: '#/components/schemas/OutletImportRowError'
      description: 1.18.0. Only with skip_rows.
    errors_truncated:
      type: boolean
      description: 1.18.0.
    warnings:
      type: array
      maxItems: 1000
      items:
        $ref: '#/components/schemas/OutletImportRowWarning'
      description: 1.18.0. Not on a replay.
    warnings_truncated:
      type: boolean
      description: 1.18.0.
    warnings_by_code:
      type: object
      additionalProperties:
        type: integer
        minimum: 0
      description: 1.18.0.
