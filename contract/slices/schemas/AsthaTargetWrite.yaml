AsthaTargetWrite:
  type: object
  required:
  - batch_uuid
  - quarter
  - rows
  - change_reason
  additionalProperties: false
  properties:
    batch_uuid:
      $ref: '#/components/schemas/Uuid'
    quarter:
      type: string
      pattern: ^\d{4}-Q[1-4]$
    rows:
      type: array
      minItems: 1
      maxItems: 50000
      items:
        type: object
        required:
        - outlet_id
        - month
        - std_target
        - memo_target
        additionalProperties: false
        properties:
          outlet_id:
            $ref: '#/components/schemas/Id'
          brand_id:
            type:
            - integer
            - 'null'
            format: int64
            minimum: 1
          month:
            $ref: '#/components/schemas/Month'
          std_target:
            type: string
            pattern: ^\d{1,13}(\.\d{1,3})?$
            description: Never negative.
          memo_target:
            type: integer
            minimum: 0
          value_target_mtk:
            type: string
            pattern: ^(0|[1-9][0-9]{0,17})$
            description: Optional (1.15.0). Integer milli-taka, never negative or fractional (`400 ERR_VALIDATION`,
              pointer `body.rows[i].value_target_mtk`); omitted means "0".
    change_reason:
      $ref: '#/components/schemas/ChangeReason'
