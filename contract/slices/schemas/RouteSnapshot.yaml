RouteSnapshot:
  type: object
  description: 'Per-route section of the bundle; replaced as a whole when the route is added to the user. PHONE
    RULE B for the SR programme sections `targets`, `achievement_mtd`, `calendar`, `kpi`, `star` and `campaigns`
    (contract number provisional, the lead sets it at landing; the ONE place this rule is stated). It DIFFERS from
    the Astha achievement rule of `ProgrammesSection` (that section is a live snapshot of the same kind). Every
    server figure the phone merges (achievement, KPI volumes, memo counts and `by_pack`, Star STD, campaign STD
    and memo) is computed from the accepted memos of the route (campaigns: of the outlet) with a business date from
    the 1st of the bundle `month` up to and including `through_date` (the bundle date minus one day), active, lines
    not voided, sale lines only, read in ONE repeatable-read snapshot straight from the memo tables. It holds every
    memo whose upload the server had COMMITTED when the bundle was read, and the server commits a batch before it
    returns the acknowledgement. Today''s memos are never in a server figure. The phone merges its own memos by
    ORDER, with no clock: let R be the moment the phone sent the request for this bundle (its own sync-cycle counter).
    The phone ADDS a local memo iff it was not acknowledged (`accepted` or `duplicate`) before R, and ADDS every
    local memo dated after `through_date` whether acknowledged or not (the server figure is cut there); it SUBTRACTS
    a memo that was acknowledged before R and dated up to `through_date` when it has since voided or superseded
    it locally and that void or edit record was not acknowledged before R (an edit is therefore: add the new memo,
    subtract the old one); it counts only business dates inside the bundle `month` (a phone still holding last month''s
    bundle adds nothing dated in the new month); it sends NO bundle request while an upload batch is in flight (single
    flight: upload, then bundle). `as_of` is INFORMATIONAL only, the newest `received_at` among the memos read (the
    epoch when none): it is never used in arithmetic and a phone must not compare it with any clock. Day counts
    when today''s local memos are in the achieved figure: ADS, PADS and TADS divide by `calendar.elapsed_working_days_before_today`
    plus 1 when `calendar.today_is_working` (numerator and denominator then cover the same days; this is the SkuProgress
    through-today convention, a default until the owner answers question Q-A), RADS divides by `calendar.remaining_working_days_after_today`;
    a zero divisor gives no figure, never zero. `star` carries through-`through_date` figures only (the phone cannot
    add to it). Brand sums use ONE hierarchy, the current product tree, for target and figure alike (the dashboards
    use the as-was brand). Volumes are base units (sticks, pieces, dozens): packets, dozens and boxes are shown
    from `targets`, `achievement_mtd` and the `by_pack` lists, never converted from a stick sum of mixed pack sizes.'
  required:
  - route_id
  - route_snapshot_version
  - route
  - assignment_kind
  - planned_today
  - target_outlets
  - outlets
  - open_memos
  - sales_plan_sku_ids
  - targets
  - achievement_mtd
  - day_state
  additionalProperties: false
  properties:
    route_id:
      $ref: '#/components/schemas/Id'
    route_snapshot_version:
      type: integer
      minimum: 1
    route:
      $ref: '#/components/schemas/Route'
    assignment_kind:
      type: string
      enum:
      - primary
      - cover
    acting_for_user_id:
      type:
      - integer
      - 'null'
      format: int64
      minimum: 1
    planned_today:
      type: boolean
    target_outlets:
      type: integer
      minimum: 0
      description: Frozen at the first bundle of the day (strike-rate denominator).
    outlets:
      type: array
      maxItems: 2000
      items:
        $ref: '#/components/schemas/BundleOutlet'
    open_memos:
      type: array
      maxItems: 2000
      items:
        $ref: '#/components/schemas/OpenMemo'
    sales_plan_sku_ids:
      type: array
      maxItems: 500
      items:
        $ref: '#/components/schemas/Id'
    targets:
      type: array
      maxItems: 500
      items:
        $ref: '#/components/schemas/TargetRow'
    achievement_mtd:
      type: array
      maxItems: 500
      items:
        $ref: '#/components/schemas/AchievementRow'
    day_state:
      $ref: '#/components/schemas/RouteDayState'
    calendar:
      oneOf:
      - $ref: '#/components/schemas/RouteCalendar'
      - type: 'null'
      description: Working-day numbers for the SR programme screens (N-2). Null or absent for TSO/AMO zone bundles.
        Contract 1.22.0, optional.
    kpi:
      oneOf:
      - $ref: '#/components/schemas/RouteKpi'
      - type: 'null'
      description: Brand-wise KPI for screens 60 and 61 (N-5). Null or absent for zone bundles. Contract 1.22.0,
        optional.
    campaigns:
      type:
      - array
      - 'null'
      maxItems: 150
      items:
        $ref: '#/components/schemas/RouteCampaign'
      description: Outlets of the route enrolled in an active campaign for the month (N-3), with the outlet target
        pop-up figures and the SKU table. Empty or absent otherwise. At most 150 outlets and 20 SKUs each (lowest
        outlet id first); `campaigns_truncated` says when more existed. Contract 1.22.0, optional.
    campaigns_truncated:
      type:
      - boolean
      - 'null'
      description: True when the route had more campaign outlets (over 150), an outlet more campaign SKUs (over
        20) or more than one active campaign (only the lowest programme id is sent) than were sent; never silent.
        Contract 1.22.0, optional.
    targets_truncated:
      type:
      - boolean
      - 'null'
      description: True when `targets` or `achievement_mtd` had more than 500 rows and were cut; never silent. Contract
        1.22.0, optional.
    star_truncated:
      type:
      - boolean
      - 'null'
      description: True when the route had more than one active superstar programme with a target; only the lowest
        programme id is in `star`. Contract 1.22.0, optional.
    star:
      oneOf:
      - $ref: '#/components/schemas/RouteStar'
      - type: 'null'
      description: Match Box Lifting Star snapshot (N-8); absent or null when the route has no target for an active
        superstar programme. Contract 1.22.0, optional.
    sr_user_id:
      type:
      - integer
      - 'null'
      format: int64
      minimum: 1
      description: 'The route''s assigned SR on the bundle date (`meta.valid_for_business_date`): the same SR that
        `GET /v1/routes` names for the route on that date (its first `assignees` entry with role SR, a cover assignment
        before the primary one); null when the route is vacant (no SR assigned; the TSO app shows "SR Not Set").
        Sent in the TSO bundle so Assign Task works offline (lead rulings R-W-06, R-W-12); other bundles may omit
        it. Contract 1.10.0, optional.'
    sr_name:
      type:
      - string
      - 'null'
      maxLength: 120
      description: Full name of `sr_user_id` (`app_user.full_name`); null exactly when `sr_user_id` is null. Lead
        ruling R-W-06, contract 1.10.0, optional.
