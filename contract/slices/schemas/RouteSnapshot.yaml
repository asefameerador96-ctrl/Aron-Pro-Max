RouteSnapshot:
  type: object
  description: 'Per-route section of the bundle; replaced as a whole when the route is added to the user. PHONE
    RULE for the SR programme sections `targets`, `achievement_mtd`, `calendar`, `kpi`, `star` and `campaigns` (contract
    1.22.0; the ONE place this rule is stated). It DIFFERS from the Astha achievement rule of `ProgrammesSection`
    (there the server figure is a live snapshot and the phone adds only the memos not yet acknowledged when it sent
    the request). Here every server figure is cut at `through_date` (the bundle date minus one day) and comes from
    the asynchronous projector, so the phone adds (a) EVERY local memo with a business date after `through_date`,
    acknowledged or not, because the server figure never holds them, and (b) every local memo dated from the 1st
    of the bundle `month` up to `through_date` that the server figure may not hold yet: not acknowledged, or acknowledged
    but accepted after the `as_of` of the newest bundle the phone has. It always de-duplicates by memo UUID and
    only counts business dates inside the bundle `month` (a phone still holding last month''s bundle adds nothing
    dated in the new month). `as_of` moves only when the server rewrote the route''s figures, never with the worker''s
    clock. Day counts when today''s local memos are in the achieved figure: ADS, PADS and TADS divide by `calendar.elapsed_working_days_before_today`
    plus 1 when `calendar.today_is_working` (numerator and denominator then cover the same days; this is the SkuProgress
    through-today convention, a default until the owner answers question Q-A), RADS divides by `calendar.remaining_working_days_after_today`;
    a zero divisor gives no figure, never zero. `star` carries through-`through_date` figures only (the phone cannot
    add to it). Volumes are base units (sticks, pieces, dozens): packets, dozens and boxes are shown from `targets`,
    `achievement_mtd` and the `by_pack` lists, never converted from a stick sum of mixed pack sizes.'
  required:
  - route_id
  - route_snapshot_version
  - route
  - assignment_kind
  - planned_today
  - target_outlets
  - outlets
  - open_memos
  - sales_plan_sku_ids
  - targets
  - achievement_mtd
  - day_state
  additionalProperties: false
  properties:
    route_id:
      $ref: '#/components/schemas/Id'
    route_snapshot_version:
      type: integer
      minimum: 1
    route:
      $ref: '#/components/schemas/Route'
    assignment_kind:
      type: string
      enum:
      - primary
      - cover
    acting_for_user_id:
      type:
      - integer
      - 'null'
      format: int64
      minimum: 1
    planned_today:
      type: boolean
    target_outlets:
      type: integer
      minimum: 0
      description: Frozen at the first bundle of the day (strike-rate denominator).
    outlets:
      type: array
      maxItems: 2000
      items:
        $ref: '#/components/schemas/BundleOutlet'
    open_memos:
      type: array
      maxItems: 2000
      items:
        $ref: '#/components/schemas/OpenMemo'
    sales_plan_sku_ids:
      type: array
      maxItems: 500
      items:
        $ref: '#/components/schemas/Id'
    targets:
      type: array
      maxItems: 500
      items:
        $ref: '#/components/schemas/TargetRow'
    achievement_mtd:
      type: array
      maxItems: 500
      items:
        $ref: '#/components/schemas/AchievementRow'
    day_state:
      $ref: '#/components/schemas/RouteDayState'
    calendar:
      oneOf:
      - $ref: '#/components/schemas/RouteCalendar'
      - type: 'null'
      description: Working-day numbers for the SR programme screens (N-2). Null or absent for TSO/AMO zone bundles.
        Contract 1.22.0, optional.
    kpi:
      oneOf:
      - $ref: '#/components/schemas/RouteKpi'
      - type: 'null'
      description: Brand-wise KPI for screens 60 and 61 (N-5). Null or absent for zone bundles. Contract 1.22.0,
        optional.
    campaigns:
      type:
      - array
      - 'null'
      maxItems: 150
      items:
        $ref: '#/components/schemas/RouteCampaign'
      description: Outlets of the route enrolled in an active campaign for the month (N-3), with the outlet target
        pop-up figures and the SKU table. Empty or absent otherwise. At most 150 outlets and 20 SKUs each (lowest
        outlet id first); `campaigns_truncated` says when more existed. Contract 1.22.0, optional.
    campaigns_truncated:
      type:
      - boolean
      - 'null'
      description: True when the route had more campaign outlets (over 150), an outlet more campaign SKUs (over
        20) or more than one active campaign (only the lowest programme id is sent) than were sent; never silent.
        Contract 1.22.0, optional.
    targets_truncated:
      type:
      - boolean
      - 'null'
      description: True when `targets` or `achievement_mtd` had more than 500 rows and were cut; never silent. Contract
        1.22.0, optional.
    star_truncated:
      type:
      - boolean
      - 'null'
      description: True when the route had more than one active superstar programme with a target; only the lowest
        programme id is in `star`. Contract 1.22.0, optional.
    star:
      oneOf:
      - $ref: '#/components/schemas/RouteStar'
      - type: 'null'
      description: Match Box Lifting Star snapshot (N-8); absent or null when the route has no target for an active
        superstar programme. Contract 1.22.0, optional.
    sr_user_id:
      type:
      - integer
      - 'null'
      format: int64
      minimum: 1
      description: 'The route''s assigned SR on the bundle date (`meta.valid_for_business_date`): the same SR that
        `GET /v1/routes` names for the route on that date (its first `assignees` entry with role SR, a cover assignment
        before the primary one); null when the route is vacant (no SR assigned; the TSO app shows "SR Not Set").
        Sent in the TSO bundle so Assign Task works offline (lead rulings R-W-06, R-W-12); other bundles may omit
        it. Contract 1.10.0, optional.'
    sr_name:
      type:
      - string
      - 'null'
      maxLength: 120
      description: Full name of `sr_user_id` (`app_user.full_name`); null exactly when `sr_user_id` is null. Lead
        ruling R-W-06, contract 1.10.0, optional.
