RouteSnapshot:
  type: object
  description: Per-route section of the bundle; replaced as a whole when the route is added to the user.
  required:
  - route_id
  - route_snapshot_version
  - route
  - assignment_kind
  - planned_today
  - target_outlets
  - outlets
  - open_memos
  - sales_plan_sku_ids
  - targets
  - achievement_mtd
  - day_state
  additionalProperties: false
  properties:
    route_id:
      $ref: '#/components/schemas/Id'
    route_snapshot_version:
      type: integer
      minimum: 1
    route:
      $ref: '#/components/schemas/Route'
    assignment_kind:
      type: string
      enum:
      - primary
      - cover
    acting_for_user_id:
      type:
      - integer
      - 'null'
      format: int64
      minimum: 1
    planned_today:
      type: boolean
    target_outlets:
      type: integer
      minimum: 0
      description: Frozen at the first bundle of the day (strike-rate denominator).
    outlets:
      type: array
      maxItems: 2000
      items:
        $ref: '#/components/schemas/BundleOutlet'
    open_memos:
      type: array
      maxItems: 2000
      items:
        $ref: '#/components/schemas/OpenMemo'
    sales_plan_sku_ids:
      type: array
      maxItems: 500
      items:
        $ref: '#/components/schemas/Id'
    targets:
      type: array
      maxItems: 500
      items:
        $ref: '#/components/schemas/TargetRow'
    achievement_mtd:
      type: array
      maxItems: 500
      items:
        $ref: '#/components/schemas/AchievementRow'
    day_state:
      $ref: '#/components/schemas/RouteDayState'
    sr_user_id:
      type:
      - integer
      - 'null'
      format: int64
      minimum: 1
      description: 'The route''s assigned SR on the bundle date (`meta.valid_for_business_date`): the same SR that
        `GET /v1/routes` names for the route on that date (its first `assignees` entry with role SR, a cover assignment
        before the primary one); null when the route is vacant (no SR assigned; the TSO app shows "SR Not Set").
        Sent in the TSO bundle so Assign Task works offline (lead rulings R-W-06, R-W-12); other bundles may omit
        it. Contract 1.10.0, optional.'
    sr_name:
      type:
      - string
      - 'null'
      maxLength: 120
      description: Full name of `sr_user_id` (`app_user.full_name`); null exactly when `sr_user_id` is null. Lead
        ruling R-W-06, contract 1.10.0, optional.
