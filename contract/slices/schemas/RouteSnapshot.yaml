RouteSnapshot:
  type: object
  description: 'Per-route section of the bundle; replaced as a whole when the route is added to the user. THE IDENTITY
    RULE for the SR programme sections `targets`, `achievement_mtd`, `calendar`, `kpi`, `star` and `campaigns` (contract
    number provisional, the lead sets it at landing; the ONE place this rule is stated; D-TKPI-14). WHAT THE SERVER
    FIGURE IS. Every figure the phone merges (achievement, KPI volumes, memo counts and `by_pack`, Star STD, campaign
    STD and memo) is computed from the accepted memos with a business date from the 1st of the bundle `month` up
    to and including `through_date` (the bundle date minus one day), status active, memo lines not voided, read
    in ONE repeatable-read snapshot straight from the memo tables. The bundle date''s own memos are never in a figure
    (a bundle built ahead for tomorrow has `through_date` = the day it was built on). DEFINITIONS, the same on the
    phone for its local additions: quantities (`achieved_qty_base`, brand and category `volume_*`, `by_pack`, Star
    STD, campaign STD and SKU `sold_qty_base`) are SALE lines only; `achievement_mtd.memo_count` counts a memo once
    per SKU when it has ANY non-voided line of that SKU (free lines included); a KPI brand `memo_achieved` and a
    campaign `memo` count a memo once when it has a SALE line of the brand (campaign: of a shown campaign SKU).
    Brand sums use ONE hierarchy, the current product tree, for target and figure alike. Campaign figures are the
    outlet''s: every route''s memos at the outlet through `through_date`, plus this phone''s own local memos (another
    SR''s sales at a shared outlet are in the figure; that SR''s unsynced and today''s memos are not). HOW THE PHONE
    MERGES: BY IDENTITY, not by inference. With `POST /v1/sync/figures` the phone sends the uuids of its own memos
    whose status in the figure it does not know and the server answers, in the SAME snapshot as the figures, EXACTLY
    one of three states for each: IN the figure (with the stored line count, and the stored lines when `removed_locally`),
    VOIDED (gone for good), or NOT IN (everything else, listed nowhere). For each own memo of the month: dated after
    `through_date`: ADD it if it is live on the phone and not VOIDED (a VOIDED answer, e.g. an admin data void of
    today, drops it). Dated up to `through_date` and live on the phone: IN means add nothing (remember it as confirmed
    and do not probe it again until the phone itself voids or edits it), VOIDED means drop it, NOT IN means ADD
    it. Dated up to `through_date` and voided or superseded on the phone: IN means SUBTRACT the stored lines the
    answer lists, otherwise nothing. A memo confirmed IN earlier and untouched that the office later voids leaves
    the figure by itself and the phone adds nothing for it. A memo whose line the server refused for good is IN
    with fewer `lines` than the phone sent: the figure holds what the server stored and the phone adds nothing more
    (server-authoritative). The memo the office keyed from paper is answered through the printed `memo_no` and date
    (unique per date), so the phone''s own copy is IN when the paper memo is. There are no acknowledgements, resolutions,
    quarantine states, clocks or single-flight requirements in this rule. When more than 300 memos are unconfirmed
    the phone cannot get an exact total in one call and shows that it is still syncing until uploads and confirmations
    bring it under the cap. `as_of` is INFORMATIONAL only (the newest `received_at` among the memos read, the epoch
    when none) and is never used in arithmetic. OLD-PHONE FALLBACK (the only other case): a phone that has no `/figures`
    answer uses the bundle''s figures, shows them with their as-of label, adds only memos dated after `through_date`
    and its never-sent pending memos. The phone uses the newest `/figures` answer it has, else the bundle''s figures.
    Day counts when today''s local memos are in the achieved figure: ADS, PADS and TADS divide by `calendar.elapsed_working_days_before_today`
    plus 1 when `calendar.today_is_working` (the SkuProgress through-today convention, a default until the owner
    answers question Q-A), RADS divides by `calendar.remaining_working_days_after_today`; a zero divisor gives no
    figure, never zero. STAR: the phone merges the Star STD by this same rule and recomputes projection, achievement,
    slab and status with the shared StarProgress code (last month''s sold quantity `lms` is not merged). Volumes
    are base units (sticks, pieces, dozens): packets, dozens and boxes are shown from `targets`, `achievement_mtd`
    and the `by_pack` lists, never converted from a stick sum of mixed pack sizes.'
  required:
  - route_id
  - route_snapshot_version
  - route
  - assignment_kind
  - planned_today
  - target_outlets
  - outlets
  - open_memos
  - sales_plan_sku_ids
  - targets
  - achievement_mtd
  - day_state
  additionalProperties: false
  properties:
    route_id:
      $ref: '#/components/schemas/Id'
    route_snapshot_version:
      type: integer
      minimum: 1
    route:
      $ref: '#/components/schemas/Route'
    assignment_kind:
      type: string
      enum:
      - primary
      - cover
    acting_for_user_id:
      type:
      - integer
      - 'null'
      format: int64
      minimum: 1
    planned_today:
      type: boolean
    target_outlets:
      type: integer
      minimum: 0
      description: Frozen at the first bundle of the day (strike-rate denominator).
    outlets:
      type: array
      maxItems: 2000
      items:
        $ref: '#/components/schemas/BundleOutlet'
    open_memos:
      type: array
      maxItems: 2000
      items:
        $ref: '#/components/schemas/OpenMemo'
    sales_plan_sku_ids:
      type: array
      maxItems: 500
      items:
        $ref: '#/components/schemas/Id'
    targets:
      type: array
      maxItems: 500
      items:
        $ref: '#/components/schemas/TargetRow'
    achievement_mtd:
      type: array
      maxItems: 500
      items:
        $ref: '#/components/schemas/AchievementRow'
    day_state:
      $ref: '#/components/schemas/RouteDayState'
    calendar:
      oneOf:
      - $ref: '#/components/schemas/RouteCalendar'
      - type: 'null'
      description: Working-day numbers for the SR programme screens (N-2). Null or absent for TSO/AMO zone bundles.
        Contract 1.22.0, optional.
    kpi:
      oneOf:
      - $ref: '#/components/schemas/RouteKpi'
      - type: 'null'
      description: Brand-wise KPI for screens 60 and 61 (N-5). Null or absent for zone bundles. Contract 1.22.0,
        optional.
    campaigns:
      type:
      - array
      - 'null'
      maxItems: 150
      items:
        $ref: '#/components/schemas/RouteCampaign'
      description: Outlets of the route enrolled in an active campaign for the month (N-3), with the outlet target
        pop-up figures and the SKU table. Empty or absent otherwise. At most 150 outlets and 20 SKUs each (lowest
        outlet id first); `campaigns_truncated` says when more existed. Contract 1.22.0, optional.
    campaigns_truncated:
      type:
      - boolean
      - 'null'
      description: True when the route had more campaign outlets (over 150), an outlet more campaign SKUs (over
        20) or more than one active campaign (only the lowest programme id is sent) than were sent; never silent.
        Contract 1.22.0, optional.
    targets_truncated:
      type:
      - boolean
      - 'null'
      description: True when `targets` or `achievement_mtd` had more than 500 rows and were cut; never silent. Contract
        1.22.0, optional.
    star_truncated:
      type:
      - boolean
      - 'null'
      description: True when the route had more than one active superstar programme with a target; only the lowest
        programme id is in `star`. Contract 1.22.0, optional.
    star:
      oneOf:
      - $ref: '#/components/schemas/RouteStar'
      - type: 'null'
      description: Match Box Lifting Star snapshot (N-8); absent or null when the route has no target for an active
        superstar programme. Contract 1.22.0, optional.
    sr_user_id:
      type:
      - integer
      - 'null'
      format: int64
      minimum: 1
      description: 'The route''s assigned SR on the bundle date (`meta.valid_for_business_date`): the same SR that
        `GET /v1/routes` names for the route on that date (its first `assignees` entry with role SR, a cover assignment
        before the primary one); null when the route is vacant (no SR assigned; the TSO app shows "SR Not Set").
        Sent in the TSO bundle so Assign Task works offline (lead rulings R-W-06, R-W-12); other bundles may omit
        it. Contract 1.10.0, optional.'
    sr_name:
      type:
      - string
      - 'null'
      maxLength: 120
      description: Full name of `sr_user_id` (`app_user.full_name`); null exactly when `sr_user_id` is null. Lead
        ruling R-W-06, contract 1.10.0, optional.
