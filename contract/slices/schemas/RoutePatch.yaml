RoutePatch:
  type: object
  minProperties: 1
  additionalProperties: false
  properties:
    name:
      type: string
      minLength: 1
      maxLength: 120
    display_label:
      type:
      - string
      - 'null'
      maxLength: 60
    zone_id:
      $ref: '#/components/schemas/Id'
    visit_kind:
      type:
      - string
      - 'null'
      enum:
      - daily
      - 3f
      - 2f
      - null
    visit_days_mask:
      type: integer
      minimum: 1
      maximum: 127
    sequence_no:
      type:
      - integer
      - 'null'
      minimum: 1
    status:
      $ref: '#/components/schemas/ActiveStatus'
    effective_from:
      $ref: '#/components/schemas/BusinessDate'
    change_reason:
      oneOf:
      - $ref: '#/components/schemas/ChangeReason'
      - type: 'null'
