ConfigValueJson:
  description: 'A config value; its shape is fixed by the key''s `value_type` in the registry (validated by the
    registry, not by

    this schema). A role map holds per role a scalar, an object (`cfg.bundle.outlet_fields`:

    `{"SR": {"exclude": [...]}}`) or an array of scalars or objects (`cfg.web.menu_by_role`:

    `{"TSO": [{"menu": ..., "page": ..., "actions": [...]}]}`); an object inside holds scalars or arrays of scalars

    (`ConfigValueRecord`).

    '
  anyOf:
  - type:
    - number
    - boolean
  - type: string
    maxLength: 4000
  - type: array
    maxItems: 500
    items:
      anyOf:
      - type:
        - string
        - number
        maxLength: 200
      - $ref: '#/components/schemas/ConfigValueRecord'
  - type: object
    additionalProperties:
      anyOf:
      - $ref: '#/components/schemas/JsonScalar'
      - type: array
        maxItems: 200
        items:
          anyOf:
          - $ref: '#/components/schemas/JsonScalar'
          - $ref: '#/components/schemas/ConfigValueRecord'
      - $ref: '#/components/schemas/ConfigValueRecord'
