TargetVsAchievement:
  type: object
  additionalProperties: false
  required:
  - category_code
  - base_unit
  - daily_target
  - sales
  - achievement_pct_bp
  properties:
    category_code:
      type: string
      maxLength: 40
    base_unit:
      type: string
      enum:
      - stick
      - piece
      - dozen
    daily_target:
      oneOf:
      - $ref: '#/components/schemas/Decimal3'
      - type: 'null'
      description: The route's monthly target for the category / the working days of the month. Null without a target,
        and null when the month has no working day (W = 0, lead ruling R-F-13).
    sales:
      type: integer
      format: int64
      minimum: 0
    achievement_pct_bp:
      type:
      - integer
      - 'null'
      format: int64
      minimum: 0
      description: sales / daily_target in basis points, uncapped (may exceed 10000, hence int64, R-F-16); null
        whenever daily_target is null (R-F-13).
