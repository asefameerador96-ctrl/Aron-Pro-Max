TargetVsAchievement:
  type: object
  additionalProperties: false
  required:
  - category_code
  - base_unit
  - daily_target
  - sales
  - achievement_pct_bp
  properties:
    category_code:
      type: string
      maxLength: 40
    base_unit:
      type: string
      enum:
      - stick
      - piece
      - dozen
    daily_target:
      oneOf:
      - $ref: '#/components/schemas/Decimal3'
      - type: 'null'
      description: The route's monthly target for the category / the working days of the month (`monthly_target_qty`
        / `working_days`, rounded once to 3 decimals). For display only; `achievement_pct_bp` never divides by it
        (lead ruling R-W-06). Null without a target, and null when the month has no working day (W = 0, lead ruling
        R-F-13).
    sales:
      type: integer
      format: int64
      minimum: 0
    achievement_pct_bp:
      type:
      - integer
      - 'null'
      format: int64
      minimum: 0
      description: 'Achievement in basis points. One rule with the Sales card (lead ruling R-W-06): round_half_up(10000
        * sales * working_days / monthly_target_qty) once, computed by the server from the integers (the route''s
        monthly target for the category and W at its zone), never from the rounded daily_target, which is for display
        only. Uncapped: may exceed 10000, hence int64 (R-F-16). The bp is null when `working_days` is 0 or there
        is no target (`monthly_target_qty` null), and null when the route''s monthly target is 0 (`monthly_target_qty`
        "0.000", daily_target "0.000"); so null whenever daily_target is null (R-F-13). The server sends `monthly_target_qty`
        and `working_days` with every card, so a reader prints this figure and the bars from the same integers (R-W-13).
        Note on older servers: a server before the integration round sent neither member and divided by the rounded
        daily_target, which can differ by 1 bp; a reader prints the bp as sent.'
    monthly_target_qty:
      oneOf:
      - $ref: '#/components/schemas/Decimal3'
      - type: 'null'
      description: The route's monthly target for the category in base units (the sum of its SKU targets for the
        month of the date; whole base units today, so the fraction is ".000", as the Decimal3 members of TargetAchievementRow
        carry them); null without a target. With `working_days` it gives `daily_target` and the exact `achievement_pct_bp`
        (the Sales-card rule, NationalSalesCard). When `working_days` is 0 the phone and the web print "—" for every
        figure derived from it and never divide by it (R-F-13). Lead ruling R-W-06, contract 1.10.0; optional until
        the server sends it.
    working_days:
      type: integer
      minimum: 0
      maximum: 31
      description: 'W: the working days of the month that `daily_target` divides by, at the route''s zone (D-TSO-MAN-08:
        the zone''s weekend and the declarations on its path; WorkingDays of shared/rules). 0 when the month has
        no working day there (then `daily_target` and `achievement_pct_bp` are null, R-F-13). Lead ruling R-W-06,
        contract 1.10.0; optional until the server sends it.'
