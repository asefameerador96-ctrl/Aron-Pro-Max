MfaEnrolment:
  type: object
  required:
  - otpauth_uri
  - recovery_codes
  additionalProperties: false
  properties:
    otpauth_uri:
      type: string
      maxLength: 500
      pattern: ^otpauth://totp/
    recovery_codes:
      type: array
      minItems: 10
      maxItems: 10
      items:
        type: string
        pattern: ^[A-Z0-9]{4}-[A-Z0-9]{4}$
