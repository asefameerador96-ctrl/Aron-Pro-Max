ActivityLogPayload:
  type: object
  description: Screen and action events sampled at cfg.app.activity_log_sample_pct; telemetry, duplicates tolerated.
  required:
  - events
  additionalProperties: false
  properties:
    events:
      type: array
      minItems: 1
      maxItems: 200
      items:
        type: object
        required:
        - at
        - screen
        - action
        additionalProperties: false
        properties:
          at:
            $ref: '#/components/schemas/Timestamp'
          screen:
            type: string
            pattern: ^[a-z][a-z0-9_.]{1,60}$
          action:
            type: string
            pattern: ^[a-z][a-z0-9_.]{1,60}$
          duration_ms:
            type:
            - integer
            - 'null'
            minimum: 0
            maximum: 86400000
