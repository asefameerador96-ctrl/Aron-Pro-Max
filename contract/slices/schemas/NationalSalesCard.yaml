NationalSalesCard:
  type: object
  additionalProperties: false
  required:
  - category_code
  - base_unit
  - total_sales
  - daily_target
  - sales_so_far
  - remaining
  - achievement_pct_bp
  - target_routes
  properties:
    category_code:
      type: string
      maxLength: 40
    base_unit:
      type: string
      enum:
      - stick
      - piece
      - dozen
    total_sales:
      type: integer
      format: int64
      minimum: 0
      description: SUM(quantity) in base units (sticks, pieces, dozens) of the category's latest-version memo lines
        for the date, location and product filter.
    daily_target:
      oneOf:
      - $ref: '#/components/schemas/Decimal3'
      - type: 'null'
      description: 'Today''s target (D-TSO-MAN-08): the sum of the route monthly targets in scope for the month
        (`monthly_target_qty`) / `NationalSales.working_days` W, the working days at the lowest common node of the
        scope. Always the full-day target; on a Friday or holiday the same formula applies (no zeroing). Null when
        no target is loaded for the routes in scope, and null when W = 0 (a month with no working day at that node;
        the phone and the web print "—", lead ruling R-F-13).'
    sales_so_far:
      type: integer
      format: int64
      minimum: 0
      description: Same as total_sales; repeated for the "i" pop-up.
    remaining:
      oneOf:
      - $ref: '#/components/schemas/Decimal3'
      - type: 'null'
      description: max(daily_target - sales_so_far, 0); null whenever daily_target is null (no target, or W = 0).
    achievement_pct_bp:
      type:
      - integer
      - 'null'
      format: int64
      minimum: 0
      description: 'total_sales / daily_target in basis points (ring); null whenever daily_target is null: without
        a target, and when `NationalSales.working_days` is 0 (the ring prints "—", lead ruling R-F-13). Uncapped:
        may exceed 10000, hence int64 (R-F-16). Exact: round_half_up(10000 * total_sales * working_days / monthly_target_qty),
        from the integers, never from the rounded daily_target (D-TSO-MAN-10, contract 1.10.0).'
    target_routes:
      type: integer
      minimum: 0
      description: Routes in the filter that carry a monthly target for the category.
    monthly_target_qty:
      type:
      - integer
      - 'null'
      format: int64
      minimum: 0
      description: Sum of the route monthly targets (base units) in scope for the month of `date`; null when no
        target is loaded. The phone prints Total Target from it and `working_days` (D-TSO-MAN-08, contract 1.10.0;
        optional until the server sends it).
