NationalSalesCard:
  type: object
  additionalProperties: false
  required:
  - category_code
  - base_unit
  - total_sales
  - daily_target
  - sales_so_far
  - remaining
  - achievement_pct_bp
  - target_routes
  properties:
    category_code:
      type: string
      maxLength: 40
    base_unit:
      type: string
      enum:
      - stick
      - piece
      - dozen
    total_sales:
      type: integer
      format: int64
      minimum: 0
      description: SUM(quantity) in base units (sticks, pieces, dozens) of the category's latest-version memo lines
        for the date, location and product filter.
    daily_target:
      oneOf:
      - $ref: '#/components/schemas/Decimal3'
      - type: 'null'
      description: Sum over the routes in the filter of route monthly target / working days of the month (Fridays
        and holidays excluded); null when no target is loaded for them. Always the full-day target.
    sales_so_far:
      type: integer
      format: int64
      minimum: 0
      description: Same as total_sales; repeated for the "i" pop-up.
    remaining:
      oneOf:
      - $ref: '#/components/schemas/Decimal3'
      - type: 'null'
      description: max(daily_target - sales_so_far, 0); null without a target.
    achievement_pct_bp:
      type:
      - integer
      - 'null'
      minimum: 0
      description: 'total_sales / daily_target in basis points (ring); null without a target. May exceed 10000.
        Exact: round_half_up(10000 * total_sales * working_days / monthly_target_qty), from the integers, never
        from the rounded daily_target (D-TSO-MAN-10, contract 1.10.0).'
    target_routes:
      type: integer
      minimum: 0
      description: Routes in the filter that carry a monthly target for the category.
    monthly_target_qty:
      type:
      - integer
      - 'null'
      format: int64
      minimum: 0
      description: Sum of the route monthly targets (base units) in scope for the month of `date`; null when no
        target is loaded. The phone prints Total Target from it and `working_days` (D-TSO-MAN-08, contract 1.10.0;
        optional until the server sends it).
