RouteMapOutlet:
  type: object
  additionalProperties: false
  required:
  - outlet_id
  - code
  - name
  - lat
  - lng
  - state
  - call_time
  - sales
  properties:
    outlet_id:
      $ref: '#/components/schemas/Id'
    code:
      type: string
      maxLength: 40
    name:
      type:
      - string
      - 'null'
      maxLength: 160
    contact:
      type:
      - string
      - 'null'
      maxLength: 30
      description: Masked like FfGeoRoutePopup.contact.
    cluster_name:
      type:
      - string
      - 'null'
      maxLength: 120
    lat:
      type: number
      minimum: -90
      maximum: 90
    lng:
      type: number
      minimum: -180
      maximum: 180
    state:
      type: string
      enum:
      - not_called
      - geo_validated
      - photo_validation
      description: 'Black / green / red marker: not called yet / called inside the radius / called outside (photo
        capture required).'
    call_time:
      type:
      - string
      - 'null'
      format: date-time
    sales:
      type: array
      maxItems: 10
      items:
        $ref: '#/components/schemas/CategoryQty'
      description: Category-wise sales of the call, own units; empty when not called or zero memo.
