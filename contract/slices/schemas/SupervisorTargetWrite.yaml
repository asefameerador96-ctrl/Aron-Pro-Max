SupervisorTargetWrite:
  type: object
  required:
  - batch_uuid
  - rows
  - change_reason
  additionalProperties: false
  properties:
    batch_uuid:
      $ref: '#/components/schemas/Uuid'
    rows:
      type: array
      minItems: 1
      maxItems: 5000
      items:
        $ref: '#/components/schemas/SupervisorTarget'
    change_reason:
      $ref: '#/components/schemas/ChangeReason'
