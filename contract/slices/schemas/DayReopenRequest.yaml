DayReopenRequest:
  type: object
  required:
  - zone_id
  - business_date
  - reason
  additionalProperties: false
  properties:
    zone_id:
      $ref: '#/components/schemas/Id'
    business_date:
      $ref: '#/components/schemas/BusinessDate'
    reason:
      $ref: '#/components/schemas/ChangeReason'
    client_uuid:
      $ref: '#/components/schemas/Uuid'
      description: Optional idempotency key; a repeat of the same reopen answers the first result (D-TSO-MAN-29,
        contract 1.10.0).
