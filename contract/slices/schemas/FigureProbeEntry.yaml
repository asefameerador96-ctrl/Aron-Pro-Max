FigureProbeEntry:
  type: object
  description: One of the phone's own memos whose status in the figures it does not know (never confirmed IN, pending,
    sent and unanswered, held, refused, or voided or superseded on the phone).
  required:
  - memo_client_uuid
  - business_date
  additionalProperties: false
  properties:
    memo_client_uuid:
      type: string
      format: uuid
    memo_no:
      type: string
      maxLength: 64
      description: The printed memo number. When the uuid is unknown to the server and the office keyed the same
        printed memo from paper, the answer is the paper memo's (memo numbers are unique per business date over
        all memos, so one number is one memo; a mistyped number is another memo until a reviewer matches them).
    business_date:
      $ref: '#/components/schemas/BusinessDate'
    removed_locally:
      type: boolean
      description: True when the phone has voided or superseded the memo; the answer then lists the stored lines
        to subtract.
