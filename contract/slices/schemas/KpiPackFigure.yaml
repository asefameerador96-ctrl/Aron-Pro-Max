KpiPackFigure:
  type: object
  required:
  - pack_factor
  - target
  - achieved
  additionalProperties: false
  properties:
    pack_factor:
      type: integer
      minimum: 1
      maximum: 1000
      description: Base units (sticks or pieces) in one pack of the SKUs counted in this entry (the SKU `base_per_pack`).
    category_code:
      type: string
      enum:
      - cigarette
      - bidi
      - match
      - lighter
      description: 'The category of the SKUs counted in this entry (the SKU `category_code`). The entries of a list
        are ordered by category code (alphabetical: bidi, cigarette, lighter, match), then by `pack_factor` ascending.
        An entry counts ONE category and ONE pack size, so a brand whose SKUs mix categories (a 20s cigarette and
        a match SKU) has one entry per category and pack size, never sticks and dozens in the same entry; the phone
        shows each entry in its category''s unit. SKUs of an inactive or discontinued variant are counted and labelled
        like any other. Contract 1.25.0, optional: absent from an older server (the phone then resolves the category
        from its product tree).'
    target:
      type: integer
      format: int64
      minimum: 0
    achieved:
      type: integer
      format: int64
      minimum: 0
