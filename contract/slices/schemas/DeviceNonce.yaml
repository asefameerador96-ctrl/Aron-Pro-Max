DeviceNonce:
  type: object
  description: Play Integrity nonce. requestHash (standard API) = lower-case hex (64 characters) of SHA-256 over
    the UTF-8 bytes of `nonce` immediately followed by `device_uuid` (canonical lower-case hyphenated text), no
    separator.
  required:
  - nonce
  - expires_at
  additionalProperties: false
  properties:
    nonce:
      type: string
      minLength: 43
      maxLength: 64
      pattern: ^[A-Za-z0-9_-]+$
      description: 'Use as the Play Integrity request nonce (classic) or as requestHash input (standard): sha256(nonce
        + device_uuid).'
    expires_at:
      $ref: '#/components/schemas/Timestamp'
