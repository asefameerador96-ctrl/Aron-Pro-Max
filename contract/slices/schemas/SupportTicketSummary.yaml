SupportTicketSummary:
  type: object
  description: Ticket counts by status (D-TSO-MAN-25); the caller's own tickets, or every ticket for the support
    desk.
  required:
  - as_of
  - total
  - new
  - in_progress
  - resolved
  - closed
  - cancelled
  - open
  - resolved_pct_bp
  - open_pct_bp
  additionalProperties: false
  properties:
    as_of:
      $ref: '#/components/schemas/Timestamp'
    total:
      type: integer
      minimum: 0
      description: Every status.
    new:
      type: integer
      minimum: 0
    in_progress:
      type: integer
      minimum: 0
    resolved:
      type: integer
      minimum: 0
    closed:
      type: integer
      minimum: 0
    cancelled:
      type: integer
      minimum: 0
    open:
      type: integer
      minimum: 0
      description: new + in_progress.
    resolved_pct_bp:
      type:
      - integer
      - 'null'
      minimum: 0
      maximum: 10000
      description: resolved / total in basis points, rounded half up; null when total is 0.
    open_pct_bp:
      type:
      - integer
      - 'null'
      minimum: 0
      maximum: 10000
      description: open / total in basis points, rounded half up; null when total is 0.
