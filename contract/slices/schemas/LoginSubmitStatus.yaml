LoginSubmitStatus:
  type: object
  required:
  - as_of
  - business_date
  - kpis
  - not_logged_in
  - logged_in_not_submitted
  - submitted
  additionalProperties: false
  properties:
    as_of:
      $ref: '#/components/schemas/Timestamp'
    business_date:
      $ref: '#/components/schemas/BusinessDate'
    kpis:
      $ref: '#/components/schemas/DashboardKpis'
    not_logged_in:
      type: array
      items:
        $ref: '#/components/schemas/RouteDayState'
    logged_in_not_submitted:
      type: array
      items:
        $ref: '#/components/schemas/RouteDayState'
    submitted:
      type: array
      items:
        $ref: '#/components/schemas/RouteDayState'
    exceptions:
      type: array
      items:
        $ref: '#/components/schemas/RouteDayState'
    zones:
      type: array
      description: Final-submit state per zone in the caller's reach (F-WEB-047).
      items:
        type: object
        required:
        - zone_id
        - final_submitted
        additionalProperties: false
        properties:
          zone_id:
            $ref: '#/components/schemas/Id'
          final_submitted:
            type: boolean
