LoginSubmitStatus:
  type: object
  required:
  - as_of
  - business_date
  - kpis
  - not_logged_in
  - logged_in_not_submitted
  - submitted
  additionalProperties: false
  properties:
    as_of:
      $ref: '#/components/schemas/Timestamp'
    business_date:
      $ref: '#/components/schemas/BusinessDate'
    kpis:
      $ref: '#/components/schemas/DashboardKpis'
    not_logged_in:
      type: array
      items:
        $ref: '#/components/schemas/RouteDayState'
    logged_in_not_submitted:
      type: array
      items:
        $ref: '#/components/schemas/RouteDayState'
    submitted:
      type: array
      items:
        $ref: '#/components/schemas/RouteDayState'
    exceptions:
      type: array
      items:
        $ref: '#/components/schemas/RouteDayState'
    zones:
      type: array
      description: Final-submit state per zone in the caller's reach (F-WEB-047).
      items:
        type: object
        required:
        - zone_id
        - final_submitted
        additionalProperties: false
        properties:
          zone_id:
            $ref: '#/components/schemas/Id'
          final_submitted:
            type: boolean
    geo_valid_visits:
      type: integer
      minimum: 0
      description: 'AMO callers only (contract 1.11.0): the zone''s SR calls of the date inside the geo-fence.'
    photo_valid_visits:
      type: integer
      minimum: 0
      description: 'AMO callers only: SR calls of the date with a verification photo.'
    visits_total:
      type: integer
      minimum: 0
      description: 'AMO callers only: all SR calls of the date in the zone.'
    sales_by_category:
      type: array
      description: 'AMO callers only: the zone''s sold volume of the date per category (the Live Dashboard columns).'
      items:
        $ref: '#/components/schemas/CategoryVolume'
