CredentialActionResult:
  type: object
  required:
  - action
  - done_at
  additionalProperties: false
  properties:
    action:
      type: string
      enum:
      - reset_password
      - unlock
      - force_logout
      - reset_mfa
    done_at:
      $ref: '#/components/schemas/Timestamp'
    temporary_password:
      type:
      - string
      - 'null'
      minLength: 12
      maxLength: 32
      description: reset_password only; shown once.
    temporary_password_expires_at:
      oneOf:
      - $ref: '#/components/schemas/Timestamp'
      - type: 'null'
