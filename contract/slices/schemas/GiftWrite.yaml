GiftWrite:
  type: object
  required:
  - programme_id
  - code
  - name_en
  - change_reason
  additionalProperties: false
  properties:
    programme_id:
      $ref: '#/components/schemas/Id'
    code:
      type: string
      pattern: ^[a-z][a-z0-9_]{1,40}$
    name_en:
      type: string
      maxLength: 120
    name_bn:
      type:
      - string
      - 'null'
      maxLength: 120
    points_cost:
      type:
      - integer
      - 'null'
      minimum: 1
      maximum: 100000
    tier_codes:
      type: array
      maxItems: 10
      items:
        type: string
        pattern: ^[a-z][a-z0-9_]{1,40}$
    image_asset_id:
      oneOf:
      - $ref: '#/components/schemas/Uuid'
      - type: 'null'
    status:
      $ref: '#/components/schemas/ActiveStatus'
    change_reason:
      $ref: '#/components/schemas/ChangeReason'
