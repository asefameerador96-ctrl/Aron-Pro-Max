GiftChoiceWrite:
  type: object
  required:
  - quarter
  - rows
  additionalProperties: false
  properties:
    quarter:
      type: string
      pattern: ^\d{4}-Q[1-4]$
    rows:
      type: array
      minItems: 1
      maxItems: 2000
      items:
        type: object
        required:
        - client_uuid
        - outlet_id
        - gift_id
        additionalProperties: false
        properties:
          client_uuid:
            $ref: '#/components/schemas/Uuid'
          outlet_id:
            $ref: '#/components/schemas/Id'
          gift_id:
            $ref: '#/components/schemas/Id'
