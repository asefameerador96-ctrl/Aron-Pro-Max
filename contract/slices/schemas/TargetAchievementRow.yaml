TargetAchievementRow:
  type: object
  description: 'One product row of a target node. The integer members are the TSO app''s figures (D-TSO-MAN-39,
    40):

    target_qty_base T = the route monthly targets of the month in reach; achieved_qty_base A = sold quantity of
    sale

    lines, business dates 1st..`day`; tilldate_target_qty_base T'' = per item round_half_up(T * e / n), a category
    row

    the sum of its items (never its own T rounded once; see TargetAchievement); remaining_* = max(target - A, 0);
    *_pct_bp = A / target in basis points, rounded half up,

    uncapped (int64, R-F-16), null when the target is 0. When `period_days` n of the row''s node is 0 (the parent''s
    for

    `rows`, the child''s own for a child''s rows) the three till-date members (tilldate_target_qty_base,

    remaining_tilldate_qty_base, tilldate_achievement_pct_bp) are null and tilldate_target_qty is "0.000" (R-F-15).
    The

    Decimal3 members and `achievement_pct` keep their meaning for the AMO app.

    '
  required:
  - product_level
  - product_id
  - name
  - unit
  - target_qty
  - achieved_qty
  - tilldate_target_qty
  - remaining_qty
  - category_code
  - target_qty_base
  - achieved_qty_base
  - tilldate_target_qty_base
  - remaining_qty_base
  - remaining_tilldate_qty_base
  - achievement_pct_bp
  - tilldate_achievement_pct_bp
  additionalProperties: false
  properties:
    product_level:
      $ref: '#/components/schemas/ProductLevel'
    product_id:
      $ref: '#/components/schemas/Id'
    name:
      type: string
      maxLength: 120
    unit:
      type: string
      enum:
      - stick
      - piece
      - dozen
      - box
      - pack
    target_qty:
      $ref: '#/components/schemas/Decimal3'
    achieved_qty:
      $ref: '#/components/schemas/Decimal3'
    tilldate_target_qty:
      $ref: '#/components/schemas/Decimal3'
      description: 'The AMO app''s till-date target. "0.000" when `period_days` of the row''s node is 0 (R-F-15:
        T * e / n has no value there; the member stays required and non-null in 1.10.0).'
    achievement_pct:
      type:
      - number
      - 'null'
      minimum: 0
    remaining_qty:
      $ref: '#/components/schemas/Decimal3'
    memo_target:
      type:
      - integer
      - 'null'
      minimum: 0
    memo_achieved:
      type:
      - integer
      - 'null'
      minimum: 0
    category_code:
      type: string
      maxLength: 40
      description: The row's category (its own code on a category row); the Details table filters by it.
    target_qty_base:
      type: integer
      format: int64
      minimum: 0
      description: Monthly target T in base units.
    achieved_qty_base:
      type: integer
      format: int64
      minimum: 0
      description: Achievement A month to date in base units.
    tilldate_target_qty_base:
      type:
      - integer
      - 'null'
      format: int64
      minimum: 0
      description: Till-date target T' in base units; null when `period_days` is 0 (R-F-15), the `period_days` of
        the row's node.
    remaining_qty_base:
      type: integer
      format: int64
      minimum: 0
      description: max(T - A, 0).
    remaining_tilldate_qty_base:
      type:
      - integer
      - 'null'
      format: int64
      minimum: 0
      description: max(T' - A, 0); null when `period_days` is 0 (R-F-15), the `period_days` of the row's node.
    achievement_pct_bp:
      type:
      - integer
      - 'null'
      format: int64
      minimum: 0
      description: A / T in basis points, uncapped (int64, R-F-16); null when T is 0.
    tilldate_achievement_pct_bp:
      type:
      - integer
      - 'null'
      format: int64
      minimum: 0
      description: A / T' in basis points, uncapped (int64, R-F-16); null when T' is 0, and null when `period_days`
        is 0 (R-F-15), the `period_days` of the row's node.
    report_unit:
      type: string
      enum:
      - stick
      - piece
      - dozen
      - box
      - pack
      description: 'Contract 1.11.2 (D-AMO-FND-16). The field unit of the `*_qty_report` members (rule 5, docs/34
        s4.2): pack for cigarettes

        and bidi, box (of 25) for lighters, dozen for matches. A row whose SKUs cannot share one field unit answers
        its base

        `unit` here and the `*_qty_report` members equal the base quantities.

        '
    target_qty_report:
      $ref: '#/components/schemas/Decimal3'
      description: 'Contract 1.11.2. T in `report_unit`: the sum over the row''s SKUs of qty_base / base_per_pack
        of each SKU (10s and 20s packets are converted one by one, never divided by one factor), rounded half up
        to 3 decimals once.'
    achieved_qty_report:
      $ref: '#/components/schemas/Decimal3'
      description: Contract 1.11.2. A in `report_unit`, converted per SKU like `target_qty_report`.
    tilldate_target_qty_report:
      $ref: '#/components/schemas/Decimal3'
      description: 'Contract 1.11.2. T'' in `report_unit`: the row''s till-date target (base units, rounded once
        per item) re-expressed at the target mix of the row''s SKUs (T in `report_unit` / T in base units); "0.000"
        when `period_days` is 0.'
    remaining_qty_report:
      $ref: '#/components/schemas/Decimal3'
      description: Contract 1.11.2. max(T - A, 0) in `report_unit` (the report-unit T minus A, floored at 0).
