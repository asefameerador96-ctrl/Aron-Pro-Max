NationalSales:
  type: object
  description: Four sales cards (Cigarette, Bidi, Lighter, Match) with the daily target of the "i" pop-up.
  required:
  - date
  - till_time
  - as_of
  - last_updated_at
  - working_days
  - cards
  additionalProperties: false
  properties:
    date:
      $ref: '#/components/schemas/BusinessDate'
    till_time:
      type: boolean
      description: 'True when `date` is today (Dhaka): figures are till the time of `as_of`; false: final figures
        of a past day.'
    as_of:
      $ref: '#/components/schemas/Timestamp'
    last_updated_at:
      type:
      - string
      - 'null'
      format: date-time
      description: Oldest `last_updated_at` of the summary tables this card reads (null when none has been written
        yet). The page shows it as "last updated hh:mm" (Dhaka).
    working_days:
      type: integer
      minimum: 0
      maximum: 31
      description: 'Working days W of the date''s month at the lowest common node of the effective scope (filter
        and token reach; D-TSO-MAN-08, lead ruling R-F-17): one zone gives the zone, one territory the territory,
        mixed or national the global calendar. W = days of the month - the node''s weekend days (`cfg.calendar.weekend_days`
        resolved at the node) - the holidays on the node''s path (global, wing, division, territory, zone) + the
        make-up days on that path (one implementation, WorkingDays of shared/rules). 0 when the node has no working
        day in the month; every card''s daily_target, remaining and achievement_pct_bp are then null (R-F-13).'
    cards:
      type: array
      maxItems: 10
      items:
        $ref: '#/components/schemas/NationalSalesCard'
