NationalSales:
  type: object
  description: Four sales cards (Cigarette, Bidi, Lighter, Match) with the daily target of the "i" pop-up.
  required:
  - date
  - till_time
  - as_of
  - last_updated_at
  - working_days
  - cards
  additionalProperties: false
  properties:
    date:
      $ref: '#/components/schemas/BusinessDate'
    till_time:
      type: boolean
      description: 'True when `date` is today (Dhaka): figures are till the time of `as_of`; false: final figures
        of a past day.'
    as_of:
      $ref: '#/components/schemas/Timestamp'
    last_updated_at:
      type:
      - string
      - 'null'
      format: date-time
      description: Oldest `last_updated_at` of the summary tables this card reads (null when none has been written
        yet). The page shows it as "last updated hh:mm" (Dhaka).
    working_days:
      type: integer
      minimum: 0
      maximum: 31
      description: 'Working days W of the date''s month at the lowest common node of the effective scope (filter
        and token reach; D-TSO-MAN-08, lead ruling R-F-17): one zone gives the zone, one territory the territory,
        mixed or national the global calendar. W = the number of dates in the month that are working days at the
        node: a make-up day works, otherwise a date works when it is neither a weekend day (`cfg.calendar.weekend_days`
        resolved at the node) nor an off day (a holiday or an emergency off); per date the most specific declaration
        on the node''s path (global, wing, division, territory, zone) decides, and each date counts once (one implementation,
        WorkingDays.resolve and WorkingDays.month of shared/rules). Example: October 2026 at global scope with a
        Friday weekend gives 31 - 5 = 26; a global holiday on Friday 2 October leaves 26, and a make-up day on an
        ordinary weekday adds nothing. 0 when the node has no working day in the month; every card''s daily_target,
        remaining and achievement_pct_bp are then null (R-F-13).'
    cards:
      type: array
      maxItems: 10
      items:
        $ref: '#/components/schemas/NationalSalesCard'
