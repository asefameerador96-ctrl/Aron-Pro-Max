ProgrammeTier:
  type: object
  description: One tier rule. The threshold is data the owner supplies (docs/27 forbids inventing one); STD as stored,
    never negative.
  required:
  - tier_code
  - sort_order
  - label_en
  additionalProperties: false
  properties:
    tier_code:
      type: string
      pattern: ^[a-z][a-z0-9_]{1,40}$
    sort_order:
      type: integer
      minimum: 1
      maximum: 10
      description: 1 = lowest tier; thresholds rise with it.
    label_en:
      type: string
      minLength: 1
      maxLength: 80
    label_bn:
      type:
      - string
      - 'null'
      maxLength: 80
    threshold:
      type:
      - string
      - 'null'
      pattern: ^\d{1,13}(\.\d{1,3})?$
      description: Qualifying threshold in STD (up to 3 fraction digits, as a string); null until the owner supplies
        it.
    threshold_basis:
      type: string
      enum:
      - std
      default: std
      description: 'Unit of the threshold: the standard unit of the target model (brief Q1 default). Other bases
        wait for the owner.'
