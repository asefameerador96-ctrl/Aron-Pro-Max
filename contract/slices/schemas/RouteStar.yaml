RouteStar:
  type: object
  description: 'Match Box Lifting Star snapshot of the SR for the Dhaka month (screen 62). Quantities are Decimal3
    in the programme unit (base units divided by the programme unit divisor); percentages are basis points (growth
    signed); money is integer milli-taka. Server figures through `through_date` (never today). The amounts are shown,
    never applied to a memo. A row with neither `sku_ids` nor `sku_category` (the programme names a category outside
    the enum and lists no usable SKU) gives the phone no SKU rule: it shows no "today on this phone" line for the
    Star. Contract 1.24.0.'
  required:
  - programme_id
  - programme_code
  - name_en
  - name_bn
  - month
  - through_date
  - as_of
  - sr_name
  - sr_code
  - route_name
  - lmwd
  - wd
  - ewd
  - target
  - std
  - projection
  - achievement_bp
  - lms
  - lmads
  - pads
  - growth_bp
  - status_en
  - status_bn
  - achieved_slab
  - slab_amount_mtk
  - projected_slab
  - projected_amount_mtk
  additionalProperties: false
  properties:
    programme_id:
      $ref: '#/components/schemas/Id'
    programme_code:
      type: string
      maxLength: 40
    name_en:
      type: string
      maxLength: 120
    name_bn:
      type:
      - string
      - 'null'
      maxLength: 120
    month:
      $ref: '#/components/schemas/Month'
    through_date:
      $ref: '#/components/schemas/BusinessDate'
    as_of:
      $ref: '#/components/schemas/Timestamp'
    sr_name:
      type:
      - string
      - 'null'
      maxLength: 120
    sr_code:
      type:
      - string
      - 'null'
      maxLength: 60
    route_name:
      type: string
      maxLength: 120
    unit_divisor:
      type:
      - integer
      - 'null'
      minimum: 1
      description: 'The programme unit divisor: base units divided by it give the programme unit of `target`, `std`,
        `lms` (default 1). Contract 1.26.0, optional.'
    sku_category:
      type:
      - string
      - 'null'
      enum:
      - cigarette
      - bidi
      - match
      - lighter
      - null
      description: The SKU category whose SALE lines the STD and LMS count (the programme rule `sku_category`, default
        match). Absent when `sku_ids` lists the SKUs, and absent when the rule names a category outside this enum
        (the server logs it; the STD then counts no SKU). With `sku_ids` and `unit_divisor` it lets the phone show
        "today on this phone" for the Star as a separate, labelled figure, never added into `std`. Contract 1.26.0,
        optional.
    sku_ids:
      type:
      - array
      - 'null'
      maxItems: 500
      items:
        $ref: '#/components/schemas/Id'
      description: The explicit SKU ids the STD and LMS count (the programme rule `sku_ids`), present only when
        the rules list them; then `sku_category` is absent. The list is cleaned on the server (distinct, existing
        in the catalogue) and ordered ASCENDING BY ID. Contract 1.26.0, optional.
    sku_ids_truncated:
      type:
      - boolean
      - 'null'
      description: True when the CLEANED rule list (distinct, existing SKUs) holds more than 500 ids and `sku_ids`
        holds the first 500 in ascending id order (the STD itself counts all of them); absent otherwise. When true,
        the phone's local "today on this phone" figure is incomplete (it can only match the 500 SKUs carried). Contract
        1.26.0, optional.
    lmwd:
      type: integer
      minimum: 0
      maximum: 31
      description: Working days of last month that have CLOSED at the cut (all of them once `through_date` is past
        the end of last month; up to `through_date` for a bundle built ahead on the last day of the month); the
        divisor of `lmads`, over the same days as `lms`.
    wd:
      type: integer
      minimum: 0
      maximum: 31
      description: Working days of the month.
    ewd:
      type: integer
      minimum: 0
      maximum: 31
      description: Elapsed working days under the single day-count convention (SkuProgress.dayCounts) of the calendar
        anchor, `max(through_date + 1, the 1st of the bundle month)`; 0 when the window is empty (the 1st of the
        month), and the figures that divide by it are then null, never zero.
    target:
      $ref: '#/components/schemas/Decimal3'
    std:
      $ref: '#/components/schemas/Decimal3'
    projection:
      oneOf:
      - $ref: '#/components/schemas/Decimal3'
      - type: 'null'
    achievement_bp:
      type:
      - integer
      - 'null'
      format: int64
      minimum: 0
      description: Projection over target.
    lms:
      $ref: '#/components/schemas/Decimal3'
      description: 'Last month''s sold quantity in the programme unit, over the CLOSED days of last month: FINAL
        only once last month has closed (all of it once `through_date` is past its end); a bundle built ahead on
        the last day of a month holds the days up to `through_date` only (the same days as `lmwd`).'
    lmads:
      oneOf:
      - $ref: '#/components/schemas/Decimal3'
      - type: 'null'
      description: 'Last month''s average daily sold quantity, `lms` divided by `lmwd`: FINAL only once last month
        has closed. Null when `lmwd` is 0 (no closed working day of last month at the cut, e.g. a bundle built ahead
        on the first day of a month whose first days are all non-working), never zero by default; a Decimal3 `0.000`
        means a real zero (no sale over the closed working days).'
    pads:
      oneOf:
      - $ref: '#/components/schemas/Decimal3'
      - type: 'null'
    growth_bp:
      type:
      - integer
      - 'null'
      format: int64
    status_en:
      type: string
      maxLength: 120
    status_bn:
      type: string
      maxLength: 120
    achieved_slab:
      type:
      - string
      - 'null'
      maxLength: 60
    slab_amount_mtk:
      type:
      - integer
      - 'null'
      format: int64
      minimum: 0
    projected_slab:
      type:
      - string
      - 'null'
      maxLength: 60
    projected_amount_mtk:
      type:
      - integer
      - 'null'
      format: int64
      minimum: 0
