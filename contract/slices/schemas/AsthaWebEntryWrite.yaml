AsthaWebEntryWrite:
  type: object
  required:
  - client_uuid
  - route_id
  - business_date
  - rows
  additionalProperties: false
  properties:
    client_uuid:
      $ref: '#/components/schemas/Uuid'
    route_id:
      $ref: '#/components/schemas/Id'
    business_date:
      $ref: '#/components/schemas/BusinessDate'
    rows:
      type: array
      minItems: 1
      maxItems: 20000
      items:
        type: object
        required:
        - outlet_id
        - sku_id
        - qty_base
        additionalProperties: false
        properties:
          outlet_id:
            $ref: '#/components/schemas/Id'
          sku_id:
            $ref: '#/components/schemas/Id'
          qty_base:
            type: integer
            minimum: 0
            maximum: 10000000
    change_reason:
      oneOf:
      - $ref: '#/components/schemas/ChangeReason'
      - type: 'null'
