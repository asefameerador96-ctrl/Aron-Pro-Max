QuarantineItem:
  type: object
  required:
  - quarantine_id
  - client_uuid
  - type
  - code
  - status
  - user_id
  - business_date
  - received_at
  - payload
  additionalProperties: false
  properties:
    quarantine_id:
      $ref: '#/components/schemas/Id'
    client_uuid:
      $ref: '#/components/schemas/Uuid'
    type:
      $ref: '#/components/schemas/RecordType'
    code:
      $ref: '#/components/schemas/RecordOutcomeCode'
    status:
      $ref: '#/components/schemas/QuarantineStatus'
    user_id:
      $ref: '#/components/schemas/Id'
    device_id:
      type:
      - integer
      - 'null'
      format: int64
      minimum: 1
    route_id:
      type:
      - integer
      - 'null'
      format: int64
      minimum: 1
    business_date:
      $ref: '#/components/schemas/BusinessDate'
    received_at:
      $ref: '#/components/schemas/Timestamp'
    payload:
      $ref: '#/components/schemas/SyncRecord'
    detail:
      type:
      - string
      - 'null'
      maxLength: 1000
    resolved_by_user_id:
      type:
      - integer
      - 'null'
      format: int64
      minimum: 1
    resolved_at:
      oneOf:
      - $ref: '#/components/schemas/Timestamp'
      - type: 'null'
    resolution_note:
      type:
      - string
      - 'null'
      maxLength: 500
    waiting:
      type: boolean
      description: 'From 1.20.0. True for an OPEN item that waits for another parent: its first parent was accepted
        and the record''s other parent is not stored yet. `code` stays the first parent''s code (the accept waives
        that check) and is not the item''s own state; `detail` says what it waits for (`waits for another parent:
        <field> <uuid> ...`, field names and uuids only). The server''s own sweep (in the API process) releases
        it when that parent is stored, with exactly the override a reviewer''s accept carried for it and nothing
        more; a reviewer can accept it meanwhile. If a check of its own then holds it, it becomes an ordinary held
        item (`waiting` false) with its own `code` and `detail`. The phone is told nothing final for it.'
    waits_for_uuid:
      oneOf:
      - $ref: '#/components/schemas/Uuid'
      - type: 'null'
      description: From 1.20.0. The parent a waiting item awaits; null when not waiting.
    waits_for_refused:
      type: boolean
      description: 'From 1.20.0. True when the awaited parent is refused or discarded (refreshed at every pass):
        the item is not released automatically while the parent stays refused, and discarding it (resolve `discard`)
        is the way out.'
