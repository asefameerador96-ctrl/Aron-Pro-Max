SkuPrice:
  type: object
  required:
  - id
  - sku_id
  - price_type
  - amount_mtk
  - per_base_qty
  - valid_from
  additionalProperties: false
  properties:
    id:
      $ref: '#/components/schemas/Id'
    sku_id:
      $ref: '#/components/schemas/Id'
    price_type:
      $ref: '#/components/schemas/PriceType'
    amount_mtk:
      $ref: '#/components/schemas/MtkNonNegative'
    per_base_qty:
      type: integer
      minimum: 1
      maximum: 1000
      description: The price is for this many base units (1 for every seed price).
    valid_from:
      $ref: '#/components/schemas/BusinessDate'
    valid_to:
      description: Exclusive; null = open.
      oneOf:
      - $ref: '#/components/schemas/BusinessDate'
      - type: 'null'
