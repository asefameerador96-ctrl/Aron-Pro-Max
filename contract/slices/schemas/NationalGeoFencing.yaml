NationalGeoFencing:
  type: object
  description: Completed calls with or without a memo, and those inside the outlet radius. Hidden from BRAND users
    (403).
  required:
  - date
  - till_time
  - as_of
  - last_updated_at
  - total_calls
  - geo_validated
  - geo_pct_bp
  additionalProperties: false
  properties:
    date:
      $ref: '#/components/schemas/BusinessDate'
    till_time:
      type: boolean
      description: 'True when `date` is today (Dhaka): figures are till the time of `as_of`; false: final figures
        of a past day.'
    as_of:
      $ref: '#/components/schemas/Timestamp'
    last_updated_at:
      type:
      - string
      - 'null'
      format: date-time
      description: Oldest `last_updated_at` of the summary tables this card reads (null when none has been written
        yet). The page shows it as "last updated hh:mm" (Dhaka).
    total_calls:
      type: integer
      minimum: 0
    geo_validated:
      type: integer
      minimum: 0
    geo_pct_bp:
      type:
      - integer
      - 'null'
      minimum: 0
      description: 'Basis points: 10000 = 100 %. Integer arithmetic, rounded half up; null when the denominator
        is 0.'
