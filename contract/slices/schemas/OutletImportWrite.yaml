OutletImportWrite:
  type: object
  required:
  - batch_uuid
  - rows
  - dry_run
  additionalProperties: false
  properties:
    batch_uuid:
      $ref: '#/components/schemas/Uuid'
    rows:
      type: array
      minItems: 1
      maxItems: 5000
      items:
        $ref: '#/components/schemas/OutletImportRow'
    dry_run:
      type: boolean
    change_reason:
      $ref: '#/components/schemas/ChangeReason'
    location_confirmed:
      type: boolean
      default: false
      description: '1.18.0. The owner''s switch at load time: true marks every imported pin inside Bangladesh as
        confirmed (no first-visit correction); false loads them as the master pin, unconfirmed. A pin outside Bangladesh
        is never confirmed. A re-run with true confirms pins loaded earlier with false.'
    on_row_error:
      type: string
      enum:
      - reject_batch
      - skip_rows
      default: reject_batch
      description: 1.18.0. reject_batch (the earlier behaviour) refuses the whole commit on any row error; skip_rows
        writes the good rows and lists the skipped ones.
