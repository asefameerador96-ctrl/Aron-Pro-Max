RouteTargetRow:
  type: object
  required:
  - route_code
  - sku_code
  - month
  - qty_base
  additionalProperties: false
  properties:
    route_code:
      type: string
      minLength: 1
      maxLength: 40
      description: Surrounding spaces are ignored.
    sku_code:
      type: string
      minLength: 1
      maxLength: 40
      description: Surrounding spaces are ignored.
    month:
      $ref: '#/components/schemas/RouteTargetMonth'
    qty_base:
      type: integer
      format: int64
      minimum: 0
      maximum: 1000000000
      description: 'Base units: sticks, pieces or dozens.'
