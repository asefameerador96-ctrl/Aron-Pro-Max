RouteCampaign:
  type: object
  description: Campaign target and achievement of one outlet for the Dhaka month (screen 21, outlet target pop-up
    and page). STD and SKU quantities are base units; memo achievement counts distinct active memos of the outlet
    with a campaign SKU line. Server figures through `through_date` (never today; the rule for the phone is the
    figures rule of `RouteSnapshot`). Contract 1.22.0.
  required:
  - outlet_id
  - programme_id
  - label_en
  - label_bn
  - month
  - through_date
  - as_of
  - std
  - memo
  - skus
  additionalProperties: false
  properties:
    outlet_id:
      $ref: '#/components/schemas/Id'
    programme_id:
      $ref: '#/components/schemas/Id'
    label_en:
      type: string
      maxLength: 120
    label_bn:
      type:
      - string
      - 'null'
      maxLength: 120
    month:
      $ref: '#/components/schemas/Month'
    through_date:
      $ref: '#/components/schemas/BusinessDate'
    as_of:
      $ref: '#/components/schemas/Timestamp'
    std:
      $ref: '#/components/schemas/CampaignFigure'
    memo:
      $ref: '#/components/schemas/CampaignFigure'
    skus:
      type: array
      maxItems: 20
      items:
        $ref: '#/components/schemas/CampaignSku'
