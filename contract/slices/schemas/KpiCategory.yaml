KpiCategory:
  type: object
  description: Volume of a category row (BLM, match and lighter).
  required:
  - category_code
  - volume_target
  - volume_achieved
  - volume_bp
  additionalProperties: false
  properties:
    category_code:
      type: string
      enum:
      - match
      - lighter
    volume_target:
      type: integer
      format: int64
      minimum: 0
    volume_achieved:
      type: integer
      format: int64
      minimum: 0
    volume_bp:
      type:
      - integer
      - 'null'
      format: int64
      minimum: 0
