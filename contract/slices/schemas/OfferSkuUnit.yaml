OfferSkuUnit:
  type: object
  description: How one SKU named by an offer is counted in the field (docs/34 s4.2), so the portal can show a base-unit
    member in both units.
  required:
  - sku_id
  - base_unit
  - pack_factor
  - field_unit
  additionalProperties: false
  properties:
    sku_id:
      $ref: '#/components/schemas/Id'
    base_unit:
      type: string
      enum:
      - stick
      - piece
      - dozen
    pack_factor:
      type: integer
      minimum: 1
      maximum: 1000
      description: Base units per pack (app.sku.base_per_pack); base quantity = field quantity x pack_factor.
    field_unit:
      type: string
      enum:
      - packet
      - box
      - dozen
      - piece
      description: 'The word the field apps count this SKU in, derived by the server from the SKU category (docs/34
        s4.2): packet for cigarettes and bidi, box for lighters, dozen for matches, piece for any other category.'
