OfferSkuUnit:
  type: object
  description: How one SKU named by an offer is counted in the field (docs/34 s4.2), so the portal can show a base-unit
    member in both units.
  required:
  - sku_id
  - base_unit
  - pack_factor
  - field_unit
  additionalProperties: false
  properties:
    sku_id:
      $ref: '#/components/schemas/Id'
    base_unit:
      type: string
      enum:
      - stick
      - piece
      - dozen
    pack_factor:
      type: integer
      minimum: 1
      maximum: 1000
      description: Base units per pack (app.sku.base_per_pack); base quantity = field quantity x pack_factor.
    field_unit:
      $ref: '#/components/schemas/QtyUnit'
      description: 'The unit the field apps count this SKU in (docs/34 s4.2), in the contract''s one unit vocabulary
        (`QtyUnit`): `pack` (a packet of 20 or 10 sticks, a bidi packet, or a box of 25 lighters; the word packet
        or box is the app''s label for the category) for cigarettes, bidi and lighters, `dozen` for matches, and
        the SKU''s own `base_unit` for any other category. Derived by the server from the SKU category. Bidi in
        packets is pending the owner''s confirmation (docs/34 s4.2).'
