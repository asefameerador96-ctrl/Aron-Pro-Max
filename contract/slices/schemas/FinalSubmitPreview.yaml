FinalSubmitPreview:
  type: object
  required:
  - zone_id
  - business_date
  - already_submitted
  - can_submit
  - routes
  additionalProperties: false
  properties:
    zone_id:
      $ref: '#/components/schemas/Id'
    business_date:
      $ref: '#/components/schemas/BusinessDate'
    already_submitted:
      type: boolean
    can_submit:
      type: boolean
      description: 'Whether the caller may Final Submit this zone-day: true when the caller''s role is TSO or is
        listed in `cfg.day.final_submit_delegate_roles` (resolved as `postFinalSubmit` reads it), the same rule
        the submit path enforces; the zone is already in the caller''s reach (else this read is 403). The server
        always computes it. It is the role rule only: whether the zone-day is already submitted is `already_submitted`,
        so the app and the web offer Submit when `can_submit` is true and `already_submitted` is false. A reader
        of an older server that does not send it falls back to the TSO rule (lead ruling R-W-06, R-W-13; contract
        1.10.0).'
    submitted_at:
      oneOf:
      - $ref: '#/components/schemas/Timestamp'
      - type: 'null'
    submitted_by:
      type:
      - string
      - 'null'
      maxLength: 120
    routes:
      type: array
      maxItems: 200
      items:
        type: object
        required:
        - route_id
        - route_code
        - route_name
        - kind
        - state
        - had_data
        - memo_count
        - net_mtk
        additionalProperties: false
        properties:
          route_id:
            $ref: '#/components/schemas/Id'
          route_code:
            type: string
            maxLength: 40
          route_name:
            type: string
            maxLength: 120
          kind:
            type: string
            enum:
            - sr
            - amo
          ff_user_id:
            type:
            - integer
            - 'null'
            format: int64
            minimum: 1
            description: Null means "SR Not Set" (normal for an AMO route).
          ff_user_name:
            type:
            - string
            - 'null'
            maxLength: 120
          state:
            $ref: '#/components/schemas/DayState'
          had_data:
            type: boolean
          planned:
            type:
            - boolean
            - 'null'
            description: Whether the route was planned for this business date (`app.route_day.planned`); null when
              the route has no route-day row yet. Every active route stays listed (F-TSO-010); a route with `planned
              == false` and `had_data == false` is "not due" and is greyed, not shown as a failed submit (D-BC-PREVIEW-01).
              Server warnings count only due routes. Optional (contract 1.7.0).
          memo_count:
            type: integer
            minimum: 0
          net_mtk:
            $ref: '#/components/schemas/Mtk'
          pending_rows_reported:
            type:
            - integer
            - 'null'
            minimum: 0
          route_class:
            type:
            - string
            - 'null'
            enum:
            - normal
            - manual
            - dummy_br
            - dummy_institutional
            - null
            description: The route's class (`app.route.route_class`); contract 1.10.0, optional until the server
              sends it.
          visit_kind:
            type:
            - string
            - 'null'
            maxLength: 20
            description: The route's visit kind as stored (daily, 3f, 2f); null for an AMO route or a route without
              one. The card title is "<route name> <kind label>" with the label Daily, 3F, 2F or AMO (D-TSO-MAN-27,
              contract 1.10.0).
          ff_role:
            oneOf:
            - $ref: '#/components/schemas/Role'
            - type: 'null'
            description: Role of the route-day's field user (the "FF:" line); null with ff_user_id null ("SR Not
              Set"). Contract 1.10.0.
          upload_state:
            type: string
            enum:
            - uploaded
            - web_entry
            - not_uploaded
            - not_due
            description: 'uploaded: the route-day''s sales are submitted; web_entry: a saved Web Entry stands for
              it (counts as uploaded); not_uploaded: due and not uploaded (amber "Not uploaded" chip, named in the
              warning); not_due: not planned and without data, or a dummy BR or Institutional route without data
              (D-TSO-MAN-27, contract 1.10.0; optional until the server sends it).'
    warnings:
      type: array
      maxItems: 20
      items:
        type: string
        enum:
        - routes_not_sales_submitted
        - routes_with_pending_rows
        - routes_not_logged_in
    submit_seq:
      type: integer
      minimum: 0
      description: Number of reopened Final Submits of this zone-day; the app derives the next client_uuid from
        it (FinalSubmitRequest, D-TSO-MAN-28). Contract 1.10.0, optional until the server sends it.
    warn_route_ids:
      type: array
      maxItems: 200
      description: The due routes not uploaded (upload_state not_uploaded), named in the app's warning dialog ("Submit
        anyway" / "Cancel"); the submit is never blocked (D-TSO-MAN-27). Empty when nothing is due. Contract 1.10.0,
        optional until the server sends it.
      items:
        $ref: '#/components/schemas/Id'
