RecordOutcomeCode:
  type: string
  description: 'Stable code on a rejected or quarantined record (docs/24 s4.5 lists retryability and the phone action).

    From contract 1.10.0 (D-TSO-MAN-31, D-TSO-MAN-17..20): `after_final_submit` (quarantined): a record captured

    before its zone-day''s Final Submit that arrived after it; held out of the day''s figures and counted, flagged

    late, only when an ADMIN accepts it on the quarantine page. `day_final_submitted` (rejected, not retryable):
    a

    memo, memo edit, void, return or collection captured at or after the zone-day''s Final Submit. `ticket_state_invalid`

    (rejected, not retryable): a `support_ticket_event` the ticket''s state does not allow (a comment after

    resolved, a close review before resolved) or on another user''s ticket. `issue_type_unknown` (rejected, not

    retryable): a `support_ticket` whose `issue_type_code` is not an active `ticket_issue_type` code on its

    business date.

    '
  enum:
  - scope_stale
  - config_version_unknown
  - parent_missing
  - outlet_pending_approval
  - price_list_unknown
  - schema_invalid
  - unknown_record_type
  - unknown_sku
  - unknown_outlet
  - unknown_route
  - arithmetic_mismatch
  - memo_no_invalid
  - memo_no_duplicate
  - edit_not_allowed
  - chain_too_deep
  - voided_by_admin
  - content_duplicate
  - lines_exceed_max
  - qty_invalid
  - price_invalid
  - attendance_duplicate
  - checkout_too_early
  - server_error
  - payload_conflict
  - business_date_out_of_window
  - scope_out_of_reach
  - no_assignment_on_date
  - device_integrity_failed
  - device_not_enrolled
  - user_disabled
  - device_revoked
  - app_version_blocked
  - after_month_close
  - unknown_gift
  - insufficient_points
  - gift_photo_exists
  - programme_inactive
  - after_final_submit
  - day_final_submitted
  - ticket_state_invalid
  - issue_type_unknown
