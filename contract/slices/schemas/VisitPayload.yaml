VisitPayload:
  type: object
  description: Immutable facts at outlet open. The visit is the family root (rank 0, family_uuid = its client_uuid).
  required:
  - visit_kind
  - outlet_id
  - opened_at
  - sequence_no
  - planned
  - fix
  - geo
  additionalProperties: false
  properties:
    visit_kind:
      $ref: '#/components/schemas/VisitKind'
    outlet_id:
      $ref: '#/components/schemas/Id'
    opened_at:
      $ref: '#/components/schemas/Timestamp'
    sequence_no:
      type: integer
      minimum: 1
      maximum: 1000
      description: Order of this visit in the user's business day.
    planned:
      type: boolean
      description: The outlet is on a route planned today.
    assessed_user_id:
      type:
      - integer
      - 'null'
      format: int64
      minimum: 1
      description: SR assessed on an AMO joint call (the route's active assignee).
    fix:
      $ref: '#/components/schemas/GeoFix'
    geo:
      $ref: '#/components/schemas/DeviceGeoVerdict'
    call_photo_uuid:
      description: 'media_uuid of the outlet photo taken at call start (media purpose `outlet_call`, ref type `visit`,
        contract 1.14.0, SRM-A-27). Idempotent: the media record is keyed by this UUID. Null or absent when no photo
        was taken.'
      oneOf:
      - $ref: '#/components/schemas/Uuid'
      - type: 'null'
    call_photo_skip_reason_code:
      type:
      - string
      - 'null'
      pattern: ^[a-z][a-z0-9_]{1,40}$
      description: Why no call-start photo was taken (code list `call_photo_skip`, first value `camera_unavailable`;
        a reasoned skip never blocks the sale). Allowed only when `call_photo_uuid` is null and the code is an active
        item of the list; any other combination is rejected `schema_invalid`.
    force_sale_reason:
      type:
      - string
      - 'null'
      enum:
      - internet_problem
      - location_change
      - null
      description: Why the sale is made outside the geo-fence, chosen on the phone (contract 1.11.0, D-AMO-MAN-08).
        Allowed only when `geo.action` is `force_sale`; any other combination is rejected `schema_invalid`.
