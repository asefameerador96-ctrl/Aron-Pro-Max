ProgrammesSection:
  type: object
  description: 'Programme data for the user''s routes (docs/24 s4.10, s4.14), 1.15.0: an object when a programme
    is active in the user''s reach, else the bundle member is null. Cut to the outlets and routes of the bundle
    (token scope). `loyalty.balance_points` and `expiring_points` are integer points: everything the server held
    when the bundle was built (`as_of_date` is display only; see `LoyaltyBalance`; the phone subtracts its own redemptions
    not acknowledged when it sent the request); `astha_targets` carry server achievement (units in `AsthaTargetRow`;
    `astha_as_of` is the display time); a hidden tile (flags cfg.flag.astha_ui, loyalty_ui, superstar_ui) sends
    no rows. `astha_targets` carries the whole CURRENT QUARTER of the bundle''s business date (its three months,
    so the quarter and month views work offline; from 1.22.0, before that only the current month), only outlets
    enrolled in an active Astha programme, and no row whose targets and achievements are all zero; it is bounded
    at 1,000 rows per user IN ALL: the current month is filled first, then the other months in order, and past the
    bound the server sends what fits, logs a warning, sets `astha_truncated` true and names every month that is
    incomplete in `astha_truncated_months` (`YYYY-MM`), which the phone shows and reads online with `listAsthaTargets`
    (never a silent cut). Budget for a 120-outlet SR: the whole section at most 300 KB raw and 32 KB gzip (docs/04).
    `gifts[].image_url` is always null in the bundle: the phone resolves a gift picture from `gifts[].image_asset_id`
    with `GET /v1/sku-images/{asset_id}`. ACHIEVEMENT RULE (the one rule; every other description refers here).
    Server guarantee: every figure of this section is read in ONE read-only REPEATABLE READ snapshot on the primary
    database, and it includes every memo of this user whose sync acknowledgement was sent before this bundle request
    was received. Phone rule, recomputed from scratch after each bundle and keyed by memo_uuid: (1) no timestamp
    is compared anywhere in this rule (`astha_as_of` and a row''s `as_of` are display only, "data as of"); (2) the
    phone adds only its own memos that had NOT been acknowledged when it SENT the bundle request; (3) the phone
    subtracts a memo that WAS acknowledged before it sent the request but which it has since voided or superseded
    locally, and a void or edit that is HELD (quarantined) is never applied by the phone; (4) the phone sends no
    bundle request while an upload batch is in flight and uploads no records while a bundle request is in flight
    (single-flight sync, both directions), and if an acknowledgement arrives during the request it discards the
    section''s achievement and refetches; (5) a memo whose last server answer is `quarantined` (held for review,
    or waiting for a parent) is never added: it is shown as awaiting, and it counts as acknowledged, and is in the
    server figure, only once a resolution `accepted` or `accepted_with_fix`, or an `accepted` or `duplicate` acknowledgement,
    has reached the phone before a bundle request (a reviewer''s accept and the waiting sweep commit the memo with
    no upload acknowledgement, so adding every unacknowledged memo would count it twice); a resolution `discarded`
    (a `return_to_device` also arrives as `discarded`) removes it. The same rules cover the loyalty balances, a
    redemption being treated like a memo and keyed by redemption uuid: every `loyalty` figure includes every redemption
    of this user acknowledged before the request was received (and everything the ledger holds, with no business-date
    cut), and clause (5) covers a held redemption too: it stays subtracted once, shown as held, until a resolution
    or an acknowledgement has reached the phone. This phone arithmetic will be REPLACED by the server''s per-uuid
    answer (the identity probe, lane sr-targets-server); until then it is the rule. Caps are never silent: `truncated_sections`
    names any of programmes (50), loyalty (11,000 balances), gifts (200), gift_assignments (2,000) or pending_gift_verifications
    (500) that was cut, and `astha_truncated` (with `astha_truncated_months`) the 1,000-row Astha bound.'
  required:
  - programmes
  - loyalty
  - gifts
  - astha_targets
  - astha_as_of
  - astha_truncated
  - truncated_sections
  - gift_assignments
  - pending_gift_verifications
  additionalProperties: false
  properties:
    programmes:
      type: array
      maxItems: 50
      items:
        $ref: '#/components/schemas/Programme'
    loyalty:
      type: array
      maxItems: 11000
      items:
        $ref: '#/components/schemas/LoyaltyBalance'
    gifts:
      type: array
      maxItems: 200
      items:
        $ref: '#/components/schemas/Gift'
    astha_as_of:
      $ref: '#/components/schemas/Timestamp'
      description: '1.15.0. Display only ("data as of"), never part of the achievement rule: the newest memo ingest
        (receipt or status change) among the outlets of the rows actually sent, for the quarter of the business
        date (before 1.22.0: the month); the Dhaka start of the quarter when there is none. Rows carry no `as_of`
        in the bundle, to save bytes.'
    truncated_sections:
      type: array
      maxItems: 5
      description: '1.15.0 (values `gift_assignments` and `pending_gift_verifications`: 1.17.0). Which of `programmes`,
        `loyalty`, `gifts`, `gift_assignments`, `pending_gift_verifications` was cut at its cap (50, 11,000, 200,
        2,000, 500); empty when none. A cut is also logged by the server. The phone shows a notice.'
      items:
        type: string
        enum:
        - programmes
        - loyalty
        - gifts
        - gift_assignments
        - pending_gift_verifications
    astha_truncated:
      type: boolean
      description: 1.15.0. True when the user's routes had more Astha rows (for the quarter from 1.22.0, before
        that for the month) than the bound of 1,000 and the list was cut; the phone shows a notice and reads the
        rest with `listAsthaTargets`. `astha_truncated_months` says which months.
    astha_truncated_months:
      type: array
      maxItems: 3
      items:
        $ref: '#/components/schemas/Month'
      description: 'From 1.22.0, additive. The months of the quarter whose rows were cut in whole or in part (empty
        when `astha_truncated` is false); a month not named here is complete FOR THE OUTLETS ENROLLED TODAY ON TODAY''S
        ROUTES: a row of a past month is not sent (and the month is not named) when the outlet''s enrolment ended
        earlier in the quarter or its target row still carries an old route; `listAsthaTargets` has the same route
        and enrolment filter, so the limit is the same online. A month the bound cut is named even when the cut
        left it with no row sent.'
    astha_targets:
      type: array
      maxItems: 1000
      items:
        $ref: '#/components/schemas/AsthaTargetRow'
    gift_assignments:
      type: array
      maxItems: 2000
      items:
        $ref: '#/components/schemas/GiftAssignment'
    pending_gift_verifications:
      type: array
      maxItems: 2000
      items:
        $ref: '#/components/schemas/PendingGiftVerification'
