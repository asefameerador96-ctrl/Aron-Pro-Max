NationalFilterOptions:
  type: object
  description: Selectable values inside the caller's scope. Houses are active only and listed once per (territory,
    name). Product lists carry their parent code for the cascading selects.
  required:
  - date
  - till_time
  - as_of
  - last_updated_at
  - wings
  - divisions
  - territories
  - houses
  - zones
  - categories
  - segments
  - brands
  - variants
  additionalProperties: false
  properties:
    date:
      $ref: '#/components/schemas/BusinessDate'
    till_time:
      type: boolean
      description: 'True when `date` is today (Dhaka): figures are till the time of `as_of`; false: final figures
        of a past day.'
    as_of:
      $ref: '#/components/schemas/Timestamp'
    last_updated_at:
      type:
      - string
      - 'null'
      format: date-time
      description: Oldest `last_updated_at` of the summary tables this card reads (null when none has been written
        yet). The page shows it as "last updated hh:mm" (Dhaka).
    wings:
      type: array
      maxItems: 50
      items:
        type: object
        additionalProperties: false
        required:
        - id
        - code
        - name
        properties:
          id:
            $ref: '#/components/schemas/Id'
          code:
            type: string
            maxLength: 40
          name:
            type:
            - string
            - 'null'
            maxLength: 120
    divisions:
      type: array
      maxItems: 200
      items:
        type: object
        additionalProperties: false
        required:
        - id
        - code
        - name
        properties:
          id:
            $ref: '#/components/schemas/Id'
          code:
            type: string
            maxLength: 40
          name:
            type:
            - string
            - 'null'
            maxLength: 120
          wing_id:
            $ref: '#/components/schemas/Id'
    territories:
      type: array
      maxItems: 400
      items:
        type: object
        additionalProperties: false
        required:
        - id
        - code
        - name
        properties:
          id:
            $ref: '#/components/schemas/Id'
          code:
            type: string
            maxLength: 40
          name:
            type:
            - string
            - 'null'
            maxLength: 120
          division_id:
            $ref: '#/components/schemas/Id'
    houses:
      type: array
      maxItems: 400
      items:
        type: object
        additionalProperties: false
        required:
        - id
        - code
        - name
        properties:
          id:
            $ref: '#/components/schemas/Id'
          code:
            type: string
            maxLength: 40
          name:
            type:
            - string
            - 'null'
            maxLength: 120
          territory_id:
            $ref: '#/components/schemas/Id'
    zones:
      type: array
      maxItems: 1200
      items:
        type: object
        additionalProperties: false
        required:
        - id
        - code
        - name
        properties:
          id:
            $ref: '#/components/schemas/Id'
          code:
            type: string
            maxLength: 40
          name:
            type:
            - string
            - 'null'
            maxLength: 120
          house_id:
            type:
            - integer
            - 'null'
          territory_id:
            $ref: '#/components/schemas/Id'
    categories:
      type: array
      maxItems: 20
      items:
        type: object
        additionalProperties: false
        required:
        - code
        - name
        properties:
          code:
            type: string
            maxLength: 40
          name:
            type:
            - string
            - 'null'
            maxLength: 120
    segments:
      type: array
      maxItems: 100
      items:
        type: object
        additionalProperties: false
        required:
        - code
        - name
        - category_code
        properties:
          code:
            type: string
            maxLength: 40
          name:
            type:
            - string
            - 'null'
            maxLength: 120
          category_code:
            type: string
            maxLength: 40
    brands:
      type: array
      maxItems: 200
      items:
        type: object
        additionalProperties: false
        required:
        - code
        - name
        - segment_code
        properties:
          code:
            type: string
            maxLength: 40
          name:
            type:
            - string
            - 'null'
            maxLength: 120
          segment_code:
            type: string
            maxLength: 40
    variants:
      type: array
      maxItems: 500
      items:
        type: object
        additionalProperties: false
        required:
        - code
        - name
        - brand_code
        properties:
          code:
            type: string
            maxLength: 40
          name:
            type:
            - string
            - 'null'
            maxLength: 120
          brand_code:
            type: string
            maxLength: 40
