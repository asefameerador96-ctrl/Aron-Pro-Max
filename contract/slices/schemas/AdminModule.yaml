AdminModule:
  type: string
  enum:
  - masterdata
  - routes
  - outlets
  - products
  - prices
  - users
  - targets
  - credentials
  - mdm
  - reports
  - config
  - data_entry
  - indent
  - leaderboard
  - daily_tracking
  - support
  - discounts
  - loyalty
  description: 'The fixed module list of an ADMIN user''s grants (docs/34 s1). `loyalty` from contract 1.13.0: the
    loyalty-programme portal (`/v1/admin/programmes`, `/v1/admin/gifts` and everything under them, moved off `targets`).
    `discounts` from contract 1.12.1: the discount-programme portal (`/v1/admin/offers` and everything under it,
    moved off `targets`). `support` from contract 1.10.0 (lead ruling R-F-11): the support ticket routes (`/v1/support/tickets`
    and every path under it) belong to it; the support-desk permission stays `support.ticket.manage` (`Me.support_desk`).'
