SubmitBusinessTotals:
  type: object
  description: 'Per login and business date, from the stored (not voided, not rejected) rows with the same rules
    as the dashboard aggregates (`dw.agg_daily_route`, `agg_daily_route_sku`): a memo counts when it is active with
    at least one line; a sale quantity is the `sale` lines only (free and DRP lines are left out); a visit counts
    when it is an `sr_call` that is not abandoned. The phone compares its own local figures (same rules, base units)
    with these; a difference means rows not yet acknowledged.'
  required:
  - outlets_visited
  - sold
  - stock_issued
  - qc
  - promotion_mtk
  additionalProperties: false
  properties:
    outlets_visited:
      type: integer
      minimum: 0
      description: Distinct outlets with a stored sr_call visit that is not abandoned.
    sold:
      type: array
      description: Sold quantity in base units (sticks, pieces) per SKU category code; live memos only (a superseded
        or voided memo is not counted), `sale` lines only. A category with no sale is absent. Ordered by category_code.
      items:
        $ref: '#/components/schemas/CategoryQtyBase'
    stock_issued:
      type: array
      description: 'Stock issued in base units per category: `stock_movement` kinds `issue` and `adjustment` (signed),
        not voided. Ordered by category_code.'
      items:
        $ref: '#/components/schemas/CategoryQtyBase'
    qc:
      type: array
      description: Stored `qc_line` quantity in base units per category (a defect count, SRM-A-34), not voided.
        Ordered by category_code.
      items:
        $ref: '#/components/schemas/CategoryQtyBase'
    promotion_mtk:
      $ref: '#/components/schemas/MtkNonNegative'
      description: offer + DRP discount of the active memos, milli-taka; zero while the discount programmes are
        deferred.
