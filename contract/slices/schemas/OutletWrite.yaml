OutletWrite:
  type: object
  required:
  - name
  - owner_name
  - zone_id
  - cluster_id
  - channel
  - outlet_kind
  additionalProperties: false
  properties:
    code:
      type:
      - string
      - 'null'
      pattern: ^[0-9A-Za-z][0-9A-Za-z._/-]{0,31}$
    name:
      type: string
      minLength: 2
      maxLength: 120
    name_bn:
      type:
      - string
      - 'null'
      maxLength: 120
    owner_name:
      type: string
      minLength: 2
      maxLength: 120
    contact_number:
      oneOf:
      - $ref: '#/components/schemas/PhoneBd'
      - type: 'null'
    address:
      type:
      - string
      - 'null'
      maxLength: 300
    zone_id:
      $ref: '#/components/schemas/Id'
    route_id:
      type:
      - integer
      - 'null'
      format: int64
      minimum: 1
    cluster_id:
      $ref: '#/components/schemas/Id'
    channel:
      type: string
      enum:
      - GT
      - DCC
      - Astha
      - RCC
      - MT
      - HoReCa
    sub_channel_id:
      type:
      - integer
      - 'null'
      format: int64
      minimum: 1
    geo_class:
      type:
      - string
      - 'null'
      enum:
      - Hill
      - Urban
      - SemiUrban
      - Rural
      - null
    lat:
      type:
      - number
      - 'null'
      minimum: -90
      maximum: 90
    lng:
      type:
      - number
      - 'null'
      minimum: -180
      maximum: 180
    outlet_kind:
      type: string
      enum:
      - retail
      - wholesale
    external_ref:
      type:
      - string
      - 'null'
      maxLength: 64
    change_reason:
      oneOf:
      - $ref: '#/components/schemas/ChangeReason'
      - type: 'null'
