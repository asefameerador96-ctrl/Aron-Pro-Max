TimeAnchor:
  type: object
  required:
  - boot_count
  - server_time
  - elapsed_ms
  additionalProperties: false
  properties:
    boot_count:
      type: integer
      minimum: 0
    server_time:
      $ref: '#/components/schemas/Timestamp'
    elapsed_ms:
      type: integer
      format: int64
      minimum: 0
