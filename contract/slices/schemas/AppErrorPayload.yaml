AppErrorPayload:
  type: object
  description: A crash, ANR or handled error from the phone, scrubbed of phone numbers and outlet names before capture.
  required:
  - occurred_at
  - kind
  - exception_class
  - app_version
  additionalProperties: false
  properties:
    occurred_at:
      $ref: '#/components/schemas/Timestamp'
    kind:
      type: string
      enum:
      - crash
      - anr
      - handled
    exception_class:
      type: string
      maxLength: 200
    message:
      type:
      - string
      - 'null'
      maxLength: 500
    stack:
      type:
      - string
      - 'null'
      maxLength: 16000
    screen:
      type:
      - string
      - 'null'
      maxLength: 60
    app_version:
      $ref: '#/components/schemas/AppVersionString'
