Banner:
  type: object
  required:
  - bn
  - en
  - severity
  additionalProperties: false
  properties:
    bn:
      type: string
      maxLength: 200
    en:
      type: string
      maxLength: 200
    severity:
      type: string
      enum:
      - info
      - warning
      - critical
    from:
      $ref: '#/components/schemas/Timestamp'
    to:
      $ref: '#/components/schemas/Timestamp'
