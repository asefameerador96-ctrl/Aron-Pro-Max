SupportTicketEvent:
  type: object
  description: One entry of a ticket's thread (D-TSO-MAN-21). A support actor is shown as "Support", never by name.
  required:
  - event_uuid
  - kind
  - body
  - actor_is_support
  - actor_display
  - from_status
  - to_status
  - resolution_code
  - created_at
  - attachments
  additionalProperties: false
  properties:
    event_uuid:
      $ref: '#/components/schemas/Uuid'
    kind:
      $ref: '#/components/schemas/SupportTicketEventKind'
    body:
      type:
      - string
      - 'null'
      maxLength: 2400
      description: 'The entry''s text; null for an entry without text. A comment or a desk reply is 1 to 2000 characters
        (SupportTicketEventPayload, SupportTicketEventWrite). A `resolution` entry carries the D-TSO-MAN-20 message
        (updateSupportTicket): 62 fixed characters, the ticket number (at most 22), the resolution label (at most
        120) and the notes (at most 2000), so at most 2204; 2400 bounds it with room.'
    actor_is_support:
      type: boolean
    actor_display:
      type: string
      maxLength: 120
      description: '"Support" for a support-desk actor or the job, else the reporter''s full name.'
    from_status:
      oneOf:
      - $ref: '#/components/schemas/SupportTicketStatus'
      - type: 'null'
    to_status:
      oneOf:
      - $ref: '#/components/schemas/SupportTicketStatus'
      - type: 'null'
    resolution_code:
      type:
      - string
      - 'null'
      pattern: ^[a-z][a-z0-9_]{1,40}$
    created_at:
      $ref: '#/components/schemas/Timestamp'
    attachments:
      type: array
      maxItems: 3
      description: Media uuids of the event's photos (read through the media read URL).
      items:
        $ref: '#/components/schemas/Uuid'
