Me:
  type: object
  required:
  - user
  - permissions
  - scope
  additionalProperties: false
  properties:
    user:
      $ref: '#/components/schemas/UserSummary'
    permissions:
      type: array
      maxItems: 200
      items:
        type: string
        pattern: ^[a-z_]+(\.[a-z_]+)*$
    scope:
      $ref: '#/components/schemas/ScopeSummary'
    pii:
      type: boolean
      description: 'Whether the caller may see outlet phone and owner columns now: true only inside a reveal window
        opened by POST /v1/auth/reauth.'
    pii_until:
      oneOf:
      - $ref: '#/components/schemas/Timestamp'
      - type: 'null'
      description: End of the reveal window while pii is true, else null.
    mfa_enabled:
      type: boolean
    menus:
      type: array
      maxItems: 200
      description: The caller's role row of cfg.web.menu_by_role, resolved now (same mapping as GET /v1/admin/permissions).
      items:
        $ref: '#/components/schemas/MenuPermission'
