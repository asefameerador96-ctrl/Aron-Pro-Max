AchievementRow:
  type: object
  description: Month-to-date achievement read from the accepted memos through `through_date`; the phone merges its
    own memos on top by the identity rule of `RouteSnapshot` (`as_of` is informational).
  required:
  - scope_type
  - scope_id
  - month
  - product_level
  - product_id
  - achieved_qty_base
  - memo_count
  - as_of
  additionalProperties: false
  properties:
    scope_type:
      $ref: '#/components/schemas/TargetScopeType'
    scope_id:
      $ref: '#/components/schemas/Id'
    month:
      $ref: '#/components/schemas/Month'
    product_level:
      $ref: '#/components/schemas/ProductLevel'
    product_id:
      $ref: '#/components/schemas/Id'
    achieved_qty_base:
      type: integer
      format: int64
      minimum: 0
    memo_count:
      type: integer
      minimum: 0
      description: Memos with ANY non-voided line of the SKU (free lines included); `achieved_qty_base` counts sale
        lines only. See the identity rule in `RouteSnapshot`.
    as_of:
      $ref: '#/components/schemas/Timestamp'
    through_date:
      $ref: '#/components/schemas/BusinessDate'
      description: Last Dhaka business date the figure covers (the bundle date minus one day). The bundle date's
        own memos are never in a server figure. How the phone merges its own memos is stated once, as the identity
        rule in the description of `RouteSnapshot`. Contract 1.22.0, optional.
