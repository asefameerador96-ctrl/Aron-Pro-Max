ContentViewPayload:
  type: object
  description: One AV or KV item shown during a call (docs/24 s4.14). Telemetry class; a missing asset is logged
    as skipped and never blocks the sale.
  required:
  - visit_client_uuid
  - content_id
  - content_version
  - kind
  - outcome
  - sequence_no
  additionalProperties: false
  properties:
    visit_client_uuid:
      $ref: '#/components/schemas/Uuid'
    content_id:
      $ref: '#/components/schemas/Id'
    content_version:
      type: integer
      minimum: 1
    kind:
      $ref: '#/components/schemas/ContentKind'
    outcome:
      type: string
      enum:
      - viewed
      - skipped_missing
      - skipped_user
    sequence_no:
      type: integer
      minimum: 1
      maximum: 20
    started_at:
      oneOf:
      - $ref: '#/components/schemas/Timestamp'
      - type: 'null'
    duration_ms:
      type:
      - integer
      - 'null'
      minimum: 0
      maximum: 3600000
