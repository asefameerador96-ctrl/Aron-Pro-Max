FiguresResponse:
  type: object
  required:
  - business_date
  - through_date
  - routes
  - figure_probe
  additionalProperties: false
  properties:
    business_date:
      $ref: '#/components/schemas/BusinessDate'
    through_date:
      $ref: '#/components/schemas/BusinessDate'
    routes:
      type: array
      maxItems: 20
      items:
        $ref: '#/components/schemas/FigureRoute'
    figure_probe:
      $ref: '#/components/schemas/FigureProbeAnswer'
    astha:
      type:
      - object
      - 'null'
      additionalProperties: true
      description: 'Only with `include_astha`: the bundle''s Astha section (`ProgrammesSection`), built in the same
        transaction.'
