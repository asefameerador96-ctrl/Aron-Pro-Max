PaperBackfillRequest:
  type: object
  required:
  - client_uuid
  - memo_no
  - business_date
  - user_id
  - route_id
  - outlet_id
  - lines
  - paid_mtk
  - reason
  additionalProperties: false
  properties:
    client_uuid:
      $ref: '#/components/schemas/Uuid'
    memo_no:
      $ref: '#/components/schemas/MemoNo'
    business_date:
      $ref: '#/components/schemas/BusinessDate'
    user_id:
      $ref: '#/components/schemas/Id'
    route_id:
      $ref: '#/components/schemas/Id'
    outlet_id:
      $ref: '#/components/schemas/Id'
    lines:
      type: array
      minItems: 0
      maxItems: 60
      items:
        type: object
        required:
        - sku_id
        - qty_base
        - line_kind
        additionalProperties: false
        properties:
          sku_id:
            $ref: '#/components/schemas/Id'
          qty_base:
            type: integer
            minimum: 1
            maximum: 10000000
          line_kind:
            $ref: '#/components/schemas/LineKind'
    discount_mtk:
      $ref: '#/components/schemas/MtkNonNegative'
    paid_mtk:
      $ref: '#/components/schemas/MtkNonNegative'
    reason:
      $ref: '#/components/schemas/ChangeReason'
