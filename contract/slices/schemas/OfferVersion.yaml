OfferVersion:
  type: object
  description: One immutable version of an offer (1.12.0).
  required:
  - offer_version_id
  - offer_id
  - version_no
  - is_current
  - offer_type
  - level
  - title_en
  - valid_from
  - valid_to
  - qualifying
  - scope
  - stacking
  - created_at
  additionalProperties: false
  properties:
    offer_version_id:
      $ref: '#/components/schemas/Id'
    offer_id:
      $ref: '#/components/schemas/Id'
    version_no:
      type: integer
      minimum: 1
    is_current:
      type: boolean
    offer_type:
      type: string
      enum:
      - pct_discount
      - amount_per_unit
      - free_qty
      - drp_slide
    level:
      type: string
      enum:
      - line
      - memo
    title_en:
      type: string
      maxLength: 200
    title_bn:
      type:
      - string
      - 'null'
      maxLength: 200
    valid_from:
      $ref: '#/components/schemas/BusinessDate'
    valid_to:
      $ref: '#/components/schemas/BusinessDate'
    threshold_qty_base:
      type:
      - integer
      - 'null'
      minimum: 1
      description: Quantity in base units (sticks, pieces, dozens) that triggers the offer.
    discount_bp:
      type:
      - integer
      - 'null'
      minimum: 1
      maximum: 10000
      description: pct_discount in basis points of the line gross (100 = 1 percent).
    discount_mtk_per_unit:
      type:
      - integer
      - 'null'
      format: int64
      minimum: 1
      description: amount_per_unit in integer milli-taka per base unit (not per packet).
    reward_sku_id:
      type:
      - integer
      - 'null'
      format: int64
      minimum: 1
    reward_qty_base:
      type:
      - integer
      - 'null'
      minimum: 1
      description: Free quantity in base units of the reward SKU.
    qualifying:
      type: array
      maxItems: 100
      items:
        type: object
        required:
        - product_level
        - product_id
        additionalProperties: false
        properties:
          product_level:
            $ref: '#/components/schemas/ProductLevel'
          product_id:
            $ref: '#/components/schemas/Id'
    scope:
      type: array
      maxItems: 200
      items:
        type: object
        required:
        - node_type
        - node_id
        additionalProperties: false
        properties:
          node_type:
            type: string
            enum:
            - wing
            - division
            - territory
            - zone
            - route
            - channel
            - sub_channel
          node_id:
            $ref: '#/components/schemas/Id'
    stacking:
      type: string
      enum:
      - exclusive
      - stackable
    change_reason:
      type:
      - string
      - 'null'
    created_at:
      type: string
      format: date-time
    sku_units:
      type: array
      maxItems: 101
      items:
        $ref: '#/components/schemas/OfferSkuUnit'
