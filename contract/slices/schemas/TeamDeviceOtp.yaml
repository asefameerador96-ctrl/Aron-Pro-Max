TeamDeviceOtp:
  type: object
  required:
  - user_id
  - username
  - full_name
  - route_names
  - otp
  - created_at
  - expires_at
  - attempts
  additionalProperties: false
  properties:
    user_id:
      $ref: '#/components/schemas/Id'
    username:
      $ref: '#/components/schemas/Username'
    full_name:
      type: string
      maxLength: 120
    route_names:
      type: array
      maxItems: 20
      items:
        type: string
        maxLength: 120
      description: The SR's active routes.
    otp:
      type: string
      pattern: ^[0-9]{4,8}$
      description: 'The live code (cfg.auth.otp_length digits). Sensitive: shown, never logged.'
    created_at:
      $ref: '#/components/schemas/Timestamp'
    expires_at:
      $ref: '#/components/schemas/Timestamp'
    attempts:
      type: integer
      minimum: 0
