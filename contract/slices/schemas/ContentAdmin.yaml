ContentAdmin:
  allOf:
  - $ref: '#/components/schemas/ContentItem'
  - type: object
    required:
    - status
    - updated_at
    properties:
      status:
        $ref: '#/components/schemas/ActiveStatus'
      assigned_scope:
        type: array
        maxItems: 200
        items:
          type: object
          required:
          - node_type
          - node_id
          additionalProperties: false
          properties:
            node_type:
              type: string
              enum:
              - wing
              - division
              - territory
              - zone
              - route
              - outlet
            node_id:
              $ref: '#/components/schemas/Id'
      updated_at:
        $ref: '#/components/schemas/Timestamp'
  unevaluatedProperties: false
