LoyaltyBalance:
  type: object
  required:
  - outlet_id
  - programme_id
  - league_label
  - balance_points
  - overdrawn
  - expiring_points
  - expiry_date
  - as_of_date
  additionalProperties: false
  properties:
    outlet_id:
      $ref: '#/components/schemas/Id'
    programme_id:
      $ref: '#/components/schemas/Id'
    league_label:
      type:
      - string
      - 'null'
      maxLength: 40
    balance_points:
      type: integer
      description: 'The PLAIN SUM of all ledger rows up to `as_of_date`, `expiry` rows included. Points lapse only
        when the nightly expiry job posts its debit (computed FIFO: the oldest credit is consumed first, so a credit
        that was partly redeemed lapses only for what is left of it); before that job has run the balance may still
        include points past their date. Negative only after a flagged overdraw.'
    overdrawn:
      type: boolean
      description: '1.16.0. True exactly when `balance_points` is below zero: a negative balance is the overdraw
        signal. Derived on read, never stored on a ledger row.'
    expiring_points:
      type: integer
      minimum: 0
      description: The credits expiring on the EARLIEST upcoming `expires_on` (that date is `expiry_date`), capped
        by the balance and never negative; no window. Debits are not matched to credits in this read.
    expiry_date:
      oneOf:
      - $ref: '#/components/schemas/BusinessDate'
      - type: 'null'
    as_of_date:
      $ref: '#/components/schemas/BusinessDate'
