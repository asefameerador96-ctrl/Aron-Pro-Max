OutletProposal:
  type: object
  description: Proposed outlet facts; which members are required depends on the request type (docs/24 s12.2). A
    `cluster_id` that is gone, or outside the outlet's zone on an `info` request, is dropped from the stored proposal
    and the request is flagged `cluster_dropped`; the rest of the proposal is kept.
  additionalProperties: false
  properties:
    name:
      type: string
      minLength: 2
      maxLength: 120
    name_bn:
      type:
      - string
      - 'null'
      maxLength: 120
    owner_name:
      type: string
      minLength: 2
      maxLength: 120
    contact_number:
      $ref: '#/components/schemas/PhoneBd'
    address:
      type:
      - string
      - 'null'
      maxLength: 300
    cluster_id:
      $ref: '#/components/schemas/Id'
    cluster_request_uuid:
      type: string
      format: uuid
      description: 'Contract 1.16.0 (new shop requests): the client uuid of the SR''s own pending `cluster_create`
        request whose cluster this shop belongs to, when the cluster does not exist yet. Used at approval when `cluster_id`
        is absent; the shop cannot be approved before that cluster request is (409 guard `cluster_request_pending`).'
    sub_channel_id:
      type:
      - integer
      - 'null'
      format: int64
      minimum: 1
    geo_class:
      type:
      - string
      - 'null'
      enum:
      - Hill
      - Urban
      - SemiUrban
      - Rural
      - null
    lat:
      type: number
      minimum: -90
      maximum: 90
    lng:
      type: number
      minimum: -180
      maximum: 180
    close_reason_code:
      type: string
      pattern: ^[a-z][a-z0-9_]{1,40}$
