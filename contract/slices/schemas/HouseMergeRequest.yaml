HouseMergeRequest:
  type: object
  required:
  - keep_id
  - merge_ids
  - change_reason
  additionalProperties: false
  properties:
    keep_id:
      $ref: '#/components/schemas/Id'
    merge_ids:
      type: array
      minItems: 1
      maxItems: 20
      uniqueItems: true
      items:
        $ref: '#/components/schemas/Id'
    change_reason:
      $ref: '#/components/schemas/ChangeReason'
