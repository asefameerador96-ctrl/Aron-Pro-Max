TeamStockList:
  type: object
  required:
  - as_of
  - business_date
  - items
  additionalProperties: false
  properties:
    as_of:
      $ref: '#/components/schemas/Timestamp'
    business_date:
      $ref: '#/components/schemas/BusinessDate'
    items:
      type: array
      items:
        type: object
        required:
        - user_id
        - full_name
        - by_sku
        additionalProperties: false
        properties:
          user_id:
            $ref: '#/components/schemas/Id'
          full_name:
            type: string
            maxLength: 120
          route_names:
            type: array
            maxItems: 50
            items:
              type: string
              maxLength: 120
            description: Names of the routes the SR works on the date, in route order (contract 1.11.0). An SR with
              no stock rows is listed with an empty `by_sku`.
          total_outlets:
            type: integer
            minimum: 0
            description: Active outlets on those routes (contract 1.11.0).
          phone:
            type:
            - string
            - 'null'
            pattern: ^01[3-9][0-9]{8}$
            description: The SR's phone in clear, only for an AMO reading the SRs of their own zone (D-AMO-MAN-09);
              null for every other reader (contract 1.11.0).
          by_sku:
            type: array
            items:
              type: object
              required:
              - sku_id
              - base_unit
              - issued_qty_base
              - sold_qty_base
              - returned_qty_base
              - current_qty_base
              additionalProperties: false
              properties:
                sku_id:
                  $ref: '#/components/schemas/Id'
                base_unit:
                  type: string
                  enum:
                  - stick
                  - piece
                  - dozen
                issued_qty_base:
                  type: integer
                sold_qty_base:
                  $ref: '#/components/schemas/QtyBase'
                returned_qty_base:
                  $ref: '#/components/schemas/QtyBase'
                current_qty_base:
                  type: integer
