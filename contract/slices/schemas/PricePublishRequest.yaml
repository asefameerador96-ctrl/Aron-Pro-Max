PricePublishRequest:
  type: object
  required:
  - batch_uuid
  - valid_from
  - prices
  - change_reason
  additionalProperties: false
  properties:
    batch_uuid:
      $ref: '#/components/schemas/Uuid'
    valid_from:
      $ref: '#/components/schemas/BusinessDate'
    prices:
      type: array
      minItems: 1
      maxItems: 1000
      items:
        type: object
        required:
        - sku_id
        - price_type
        - amount_mtk
        additionalProperties: false
        properties:
          sku_id:
            $ref: '#/components/schemas/Id'
          price_type:
            $ref: '#/components/schemas/PriceType'
          amount_mtk:
            $ref: '#/components/schemas/MtkNonNegative'
          per_base_qty:
            type: integer
            minimum: 1
            maximum: 1000
            default: 1
    change_reason:
      $ref: '#/components/schemas/ChangeReason'
