RouteWrite:
  type: object
  required:
  - code
  - name
  - zone_id
  - kind
  - visit_days_mask
  additionalProperties: false
  properties:
    code:
      type: string
      pattern: ^[A-Za-z0-9][A-Za-z0-9_-]{0,39}$
    name:
      type: string
      minLength: 1
      maxLength: 120
    display_label:
      type:
      - string
      - 'null'
      maxLength: 60
    zone_id:
      $ref: '#/components/schemas/Id'
    kind:
      type: string
      enum:
      - sr
      - amo
    visit_kind:
      type:
      - string
      - 'null'
      enum:
      - daily
      - 3f
      - 2f
      - null
    visit_days_mask:
      type: integer
      minimum: 1
      maximum: 127
    sequence_no:
      type:
      - integer
      - 'null'
      minimum: 1
