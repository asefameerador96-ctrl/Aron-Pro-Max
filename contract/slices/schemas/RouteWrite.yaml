RouteWrite:
  type: object
  required:
  - code
  - name
  - zone_id
  - kind
  - visit_days_mask
  additionalProperties: false
  properties:
    code:
      type: string
      pattern: ^[A-Za-z0-9][A-Za-z0-9_-]{0,39}$
    name:
      type: string
      minLength: 1
      maxLength: 120
    display_label:
      type:
      - string
      - 'null'
      maxLength: 60
    zone_id:
      $ref: '#/components/schemas/Id'
    kind:
      type: string
      enum:
      - sr
      - amo
    visit_kind:
      type:
      - string
      - 'null'
      enum:
      - daily
      - 3f
      - 2f
      - none
      - null
      description: 'none (1.18.0) = no visit plan, stored as the field has it: mask 0, never planned, not counted
        in target outlets; shown as "no visit plan".'
    visit_days_mask:
      type: integer
      minimum: 0
      maximum: 127
      description: 0 only with visit_kind none (no visit plan).
    sequence_no:
      type:
      - integer
      - 'null'
      minimum: 1
