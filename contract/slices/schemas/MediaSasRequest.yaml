MediaSasRequest:
  type: object
  required:
  - items
  additionalProperties: false
  properties:
    items:
      type: array
      minItems: 1
      maxItems: 10
      items:
        type: object
        required:
        - media_uuid
        - purpose
        - sha256
        - bytes
        - business_date
        - mime
        additionalProperties: false
        properties:
          media_uuid:
            $ref: '#/components/schemas/Uuid'
          purpose:
            $ref: '#/components/schemas/MediaPurpose'
          sha256:
            $ref: '#/components/schemas/Sha256Hex'
          bytes:
            type: integer
            minimum: 1
            maximum: 307200
          business_date:
            $ref: '#/components/schemas/BusinessDate'
          mime:
            type: string
            const: image/jpeg
