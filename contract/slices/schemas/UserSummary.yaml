UserSummary:
  type: object
  required:
  - user_id
  - username
  - full_name
  - role
  - locale
  additionalProperties: false
  properties:
    user_id:
      $ref: '#/components/schemas/Id'
    username:
      $ref: '#/components/schemas/Username'
    full_name:
      type: string
      maxLength: 120
    role:
      $ref: '#/components/schemas/Role'
    designation:
      type:
      - string
      - 'null'
      maxLength: 60
    locale:
      type: string
      enum:
      - bn
      - en
