AttendanceEventPayload:
  type: object
  required:
  - kind
  - fix
  additionalProperties: false
  properties:
    kind:
      $ref: '#/components/schemas/AttendanceKind'
    fix:
      $ref: '#/components/schemas/GeoFix'
    address_display:
      type:
      - string
      - 'null'
      maxLength: 300
      description: Reverse-geocoded text shown on screen; display only, never used for a decision.
    closed_by:
      $ref: '#/components/schemas/AttendanceClosedBy'
      description: 'Contract 1.20.0, optional, `check_out` only (on a `check_in` the record is refused `schema_invalid`).
        Absent = `rep`. `phone`: the phone closed a forgotten day; stored and acknowledged, never a check-out time.'
