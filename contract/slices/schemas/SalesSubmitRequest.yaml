SalesSubmitRequest:
  type: object
  required:
  - client_uuid
  - scope
  - business_date
  - submit_cycle
  - device_counts
  - device_money
  - submitted_with_dues
  - dues_outstanding_mtk
  additionalProperties: false
  properties:
    client_uuid:
      $ref: '#/components/schemas/Uuid'
    scope:
      type: string
      enum:
      - route_day
      - supervisor_day
    route_id:
      type:
      - integer
      - 'null'
      format: int64
      minimum: 1
    business_date:
      $ref: '#/components/schemas/BusinessDate'
    submit_cycle:
      type: integer
      minimum: 1
      maximum: 50
    device_counts:
      $ref: '#/components/schemas/TypeCounts'
    device_money:
      $ref: '#/components/schemas/MoneyTotals'
    submitted_with_dues:
      type: boolean
    dues_outstanding_mtk:
      $ref: '#/components/schemas/MtkNonNegative'
    captured_at:
      $ref: '#/components/schemas/Timestamp'
      description: '1.16.0, optional: the phone''s own clock at the moment the rep pressed Sales Submit, in the
        same format and from the same clock as the `captured_at` of the record envelopes. The server stores it as
        the anchor of `RouteDayState.late_rows_after_sales_submit` (rows the phone captured after it are late).
        Absent (an older client) or implausible (more than 6 hours before or more than 5 minutes after the server''s
        receipt time; the business date plays no part, so a back-dated submit with an accurate clock stays `phone`):
        the server stamps its own time, records it with the Sales Submit record (`anchor_clock = server`) and the
        route-day says `late_rows_anchor = server`, so a supervisor knows the count may be off by clock skew. An
        unparseable value is `400 ERR_VALIDATION` pointer `/captured_at`.'
