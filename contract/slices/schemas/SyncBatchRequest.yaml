SyncBatchRequest:
  type: object
  required:
  - batch_uuid
  - device_uuid
  - schema_version
  - app_version
  - trigger
  - sent_at_device
  - pending_rows
  - time_anchors
  - device_counts
  - records
  additionalProperties: false
  properties:
    batch_uuid:
      $ref: '#/components/schemas/Uuid'
    device_uuid:
      $ref: '#/components/schemas/Uuid'
    schema_version:
      type: integer
      minimum: 1
      maximum: 1000
    app_version:
      $ref: '#/components/schemas/AppVersionString'
    trigger:
      $ref: '#/components/schemas/SyncTrigger'
    sent_at_device:
      $ref: '#/components/schemas/Timestamp'
    pending_rows:
      type: integer
      minimum: 0
    time_anchors:
      type: array
      maxItems: 3
      items:
        $ref: '#/components/schemas/TimeAnchor'
    device_counts:
      type: object
      description: Business date to committed-row counts per type, for every date present in `records` plus today.
      propertyNames:
        type: string
        pattern: ^\d{4}-\d{2}-\d{2}$
      additionalProperties:
        $ref: '#/components/schemas/TypeCounts'
    device_money:
      type: object
      description: Business date to money totals (sent with day_submit and at least once per date).
      propertyNames:
        type: string
        pattern: ^\d{4}-\d{2}-\d{2}$
      additionalProperties:
        $ref: '#/components/schemas/MoneyTotals'
    telemetry:
      oneOf:
      - $ref: '#/components/schemas/DeviceDayTelemetry'
      - type: 'null'
    records:
      type: array
      minItems: 1
      maxItems: 500
      items:
        $ref: '#/components/schemas/SyncRecord'
