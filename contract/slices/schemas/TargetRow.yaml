TargetRow:
  description: Open on purpose (N-014). `TargetRow` is the `allOf` base of `Target`, which closes the combined object,
    so `TargetRow` carries no closing keyword.
  type: object
  required:
  - scope_type
  - scope_id
  - month
  - product_level
  - product_id
  - std_target
  - std_unit
  - memo_target
  properties:
    scope_type:
      $ref: '#/components/schemas/TargetScopeType'
    scope_id:
      $ref: '#/components/schemas/Id'
    month:
      $ref: '#/components/schemas/Month'
    product_level:
      $ref: '#/components/schemas/ProductLevel'
    product_id:
      $ref: '#/components/schemas/Id'
    std_target:
      $ref: '#/components/schemas/Decimal3'
    std_unit:
      type: string
      enum:
      - stick
      - piece
      - dozen
    memo_target:
      type: integer
      minimum: 0
