OutletRequestCreateRequest:
  type: object
  description: 'Body of `POST /v1/outlet-requests` (web source, docs/24 s14a R20). `request_uuid` is generated by
    the browser (UUID v4) when the form opens: the idempotency key and the identity of the request, in the same
    key space as the `client_uuid` of an app `outlet_change_request` record. `proposed` carries the members the
    request type requires (docs/24 s12.2).'
  required:
  - request_uuid
  - request_type
  - outlet_id
  - proposed
  additionalProperties: false
  properties:
    request_uuid:
      $ref: '#/components/schemas/Uuid'
    request_type:
      type: string
      enum:
      - info
      - location
      - cluster
      - close
      description: The `OutletRequestType` values on an existing outlet; `new` and `route_add` are raised in the
        apps only.
    outlet_id:
      $ref: '#/components/schemas/Id'
    proposed:
      $ref: '#/components/schemas/OutletProposal'
    note:
      type:
      - string
      - 'null'
      maxLength: 500
