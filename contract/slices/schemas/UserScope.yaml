UserScope:
  type: object
  required:
  - user_id
  - scope_version
  - nodes
  additionalProperties: false
  properties:
    user_id:
      $ref: '#/components/schemas/Id'
    scope_version:
      type: integer
      minimum: 0
    nodes:
      type: array
      maxItems: 100
      items:
        $ref: '#/components/schemas/UserScopeNode'
