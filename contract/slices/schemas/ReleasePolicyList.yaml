ReleasePolicyList:
  type: object
  required:
  - items
  additionalProperties: false
  properties:
    items:
      type: array
      items:
        type: object
        required:
        - flavour
        - min_version_code
        - blocked_version_codes
        additionalProperties: false
        properties:
          flavour:
            $ref: '#/components/schemas/AppFlavour'
          min_version_code:
            type: integer
            minimum: 1
          latest_version_code:
            type:
            - integer
            - 'null'
            minimum: 1
          blocked_version_codes:
            type: array
            maxItems: 100
            items:
              type: integer
              minimum: 1
          devices_below_min:
            type: integer
            minimum: 0
