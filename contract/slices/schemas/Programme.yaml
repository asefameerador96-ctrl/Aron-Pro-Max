Programme:
  type: object
  required:
  - programme_id
  - kind
  - code
  - name_en
  - active_from
  - active_to
  - status
  - version
  additionalProperties: false
  properties:
    programme_id:
      $ref: '#/components/schemas/Id'
    kind:
      $ref: '#/components/schemas/ProgrammeKind'
    code:
      type: string
      pattern: ^[A-Za-z0-9][A-Za-z0-9_-]{0,39}$
    name_en:
      type: string
      maxLength: 120
    name_bn:
      type:
      - string
      - 'null'
      maxLength: 120
    period_label:
      type:
      - string
      - 'null'
      maxLength: 40
      description: For example `2026-10` (Diamond League month) or `2026-Q4` (Astha quarter).
    active_from:
      $ref: '#/components/schemas/BusinessDate'
    active_to:
      $ref: '#/components/schemas/BusinessDate'
    points_expire_on:
      description: Diamond League points of this period expire after this date (period end + cfg.loyalty.expiry_days).
      oneOf:
      - $ref: '#/components/schemas/BusinessDate'
      - type: 'null'
    rules:
      type: object
      description: Kind-specific rules as data (Superstar slabs and criteria, campaign gift list); validated against
        the kind's schema.
      additionalProperties:
        $ref: '#/components/schemas/JsonScalar'
    status:
      $ref: '#/components/schemas/ProgrammeStatus'
    version:
      type: integer
      minimum: 1
      description: Row version of the programme; also its ETag.
    programme_version_id:
      $ref: '#/components/schemas/Id'
    version_no:
      type: integer
      minimum: 1
      description: Number of the current definition version (1.13.0).
    tiers:
      type: array
      maxItems: 10
      items:
        $ref: '#/components/schemas/ProgrammeTier'
    qualifying:
      type: array
      maxItems: 100
      items:
        $ref: '#/components/schemas/LoyaltyProductRef'
      description: Products the programme applies to; empty = all.
    scope:
      type: array
      maxItems: 200
      items:
        $ref: '#/components/schemas/LoyaltyScopeNode'
      description: Places and channels the programme applies to; empty = everywhere.
    change_reason:
      type:
      - string
      - 'null'
    created_at:
      type: string
      format: date-time
    updated_at:
      type: string
      format: date-time
