ChangePasswordRequest:
  type: object
  required:
  - current_password
  - new_password
  additionalProperties: false
  properties:
    current_password:
      type: string
      minLength: 1
      maxLength: 128
      writeOnly: true
    new_password:
      type: string
      minLength: 8
      maxLength: 128
      writeOnly: true
      description: 'Policy by role: web 12+ with upper, lower, digit; field roles 8+ with the deny-list; not one
        of the last 10; not within 24 h of the last change.'
