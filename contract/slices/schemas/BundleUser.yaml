BundleUser:
  type: object
  required:
  - user_id
  - username
  - full_name
  - role
  - locale
  - bind_ordinal
  - memo_seq_block_size
  additionalProperties: false
  properties:
    user_id:
      $ref: '#/components/schemas/Id'
    username:
      $ref: '#/components/schemas/Username'
    full_name:
      type: string
      maxLength: 120
    role:
      $ref: '#/components/schemas/Role'
    designation:
      type:
      - string
      - 'null'
      maxLength: 60
    locale:
      type: string
      enum:
      - bn
      - en
    bind_ordinal:
      type: integer
      minimum: 0
      maximum: 3
    memo_seq_block_size:
      type: integer
      minimum: 100
      maximum: 999
    zone_id:
      type:
      - integer
      - 'null'
      format: int64
      minimum: 1
    territory_id:
      type:
      - integer
      - 'null'
      format: int64
      minimum: 1
    consents:
      type: array
      maxItems: 50
      description: Policy versions the user accepted (F-SYS-075), earliest acceptance per version. The phone seeds
        its consent flag from it and does not show the notice again.
      items:
        type: object
        required:
        - policy_key
        - policy_version
        - accepted_at
        additionalProperties: false
        properties:
          policy_key:
            type: string
            enum:
            - location_notice
          policy_version:
            type: integer
            minimum: 1
          accepted_at:
            $ref: '#/components/schemas/Timestamp'
