BundleUser:
  type: object
  required:
  - user_id
  - username
  - full_name
  - role
  - locale
  - bind_ordinal
  - memo_seq_block_size
  additionalProperties: false
  properties:
    user_id:
      $ref: '#/components/schemas/Id'
    username:
      $ref: '#/components/schemas/Username'
    full_name:
      type: string
      maxLength: 120
    role:
      $ref: '#/components/schemas/Role'
    designation:
      type:
      - string
      - 'null'
      maxLength: 60
    locale:
      type: string
      enum:
      - bn
      - en
    bind_ordinal:
      type: integer
      minimum: 0
      maximum: 3
    memo_seq_block_size:
      type: integer
      minimum: 100
      maximum: 999
    zone_id:
      type:
      - integer
      - 'null'
      format: int64
      minimum: 1
    territory_id:
      type:
      - integer
      - 'null'
      format: int64
      minimum: 1
