GiftPhotoPayload:
  type: object
  description: 'Hand-over photo of a gift: of an Astha gift assignment or of one redeemed campaign gift unit (Gift
    Verify). Several photos may be sent: the FIRST by `captured_at` (tie: client

    uuid) is the winner and locks the Astha choice; every other photo is STORED as a flagged duplicate, never refused
    or deleted (cfg.astha.one_photo_per_outlet is the phone''s own

    count rule). A campaign-unit photo whose redemption is FINAL (refused, voided, or a line of it voided or refused)
    or that fails the server checks is stored and flagged

    (`check_flag`: parent_refused, parent_voided, unit_out_of_range, gift_not_in_redemption, outlet_mismatch, out_of_reach),
    never the unit''s photo; only a redemption that has

    genuinely not arrived yet answers `parent_missing` (retryable).

    '
  required:
  - programme_kind
  - outlet_id
  - gift_id
  - photo_uuid
  - fix
  additionalProperties: false
  properties:
    programme_kind:
      $ref: '#/components/schemas/ProgrammeKind'
    outlet_id:
      $ref: '#/components/schemas/Id'
    gift_id:
      $ref: '#/components/schemas/Id'
    gift_assignment_id:
      type:
      - integer
      - 'null'
      format: int64
      minimum: 1
      description: Set for Astha.
    redemption_client_uuid:
      description: Set for a campaign Gift Verify photo.
      oneOf:
      - $ref: '#/components/schemas/Uuid'
      - type: 'null'
    unit_no:
      type:
      - integer
      - 'null'
      minimum: 1
      maximum: 50
      description: Which unit of a redeemed line (one slot per redeemed gift).
    photo_uuid:
      $ref: '#/components/schemas/Uuid'
    fix:
      $ref: '#/components/schemas/GeoFix'
