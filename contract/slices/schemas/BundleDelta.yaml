BundleDelta:
  type: object
  description: Changes since `base_cursor`; applied in one local transaction (old or new, never a mix).
  required:
  - meta
  - sections
  - routes_added
  - routes_removed
  - day_states
  additionalProperties: false
  properties:
    meta:
      type: object
      required:
      - bundle_version
      - base_cursor
      - cursor
      - valid_for_business_date
      - config_version
      - server_time
      additionalProperties: false
      properties:
        bundle_version:
          $ref: '#/components/schemas/BundleVersion'
        base_cursor:
          $ref: '#/components/schemas/DeltaCursor'
        cursor:
          $ref: '#/components/schemas/DeltaCursor'
        valid_for_business_date:
          $ref: '#/components/schemas/BusinessDate'
        config_version:
          $ref: '#/components/schemas/ConfigVersionNumber'
        server_time:
          $ref: '#/components/schemas/Timestamp'
    sections:
      type: object
      additionalProperties: false
      properties:
        outlets:
          $ref: '#/components/schemas/SectionDelta'
        open_memos:
          $ref: '#/components/schemas/SectionDelta'
        prices:
          $ref: '#/components/schemas/SectionDelta'
        offers:
          $ref: '#/components/schemas/SectionDelta'
        tasks:
          $ref: '#/components/schemas/SectionDelta'
        skus:
          $ref: '#/components/schemas/SectionDelta'
        targets:
          $ref: '#/components/schemas/SectionDelta'
        achievement_mtd:
          $ref: '#/components/schemas/SectionDelta'
        team:
          $ref: '#/components/schemas/SectionDelta'
        pending_outlet_requests:
          $ref: '#/components/schemas/SectionDelta'
    clusters:
      type:
      - array
      - 'null'
      maxItems: 600
      description: 'Contract 1.16.0: the WHOLE `clusters` section when its content differs from the snapshot named
        by `base_cursor` (replace the phone''s list), null when unchanged.'
      items:
        $ref: '#/components/schemas/BundleCluster'
    clusters_truncated:
      type:
      - boolean
      - 'null'
      description: 'Contract 1.16.0: the truncation flag that goes with a carried `clusters`; null with it.'
    outlet_sku_stats:
      type:
      - array
      - 'null'
      maxItems: 400
      description: 'Contract 1.16.0: the WHOLE `outlet_sku_stats` section when its content differs from the snapshot
        named by `base_cursor` (a late-synced memo of an earlier day changes it), null when unchanged.'
      items:
        $ref: '#/components/schemas/OutletSkuStat'
    outlet_sku_stats_truncated:
      type:
      - boolean
      - 'null'
      description: 'Contract 1.16.0: the truncation flag that goes with a carried `outlet_sku_stats`; null with
        it.'
    code_lists:
      type: array
      maxItems: 30
      description: Lists that changed, replaced whole.
      items:
        $ref: '#/components/schemas/CodeList'
    templates:
      type: array
      maxItems: 20
      items:
        $ref: '#/components/schemas/PrintTemplate'
    routes_added:
      type: array
      maxItems: 20
      items:
        $ref: '#/components/schemas/RouteSnapshot'
    routes_removed:
      type: array
      maxItems: 20
      items:
        $ref: '#/components/schemas/Id'
    day_states:
      type: array
      maxItems: 40
      items:
        $ref: '#/components/schemas/RouteDayState'
    resolutions:
      type: array
      maxItems: 200
      items:
        $ref: '#/components/schemas/Resolution'
