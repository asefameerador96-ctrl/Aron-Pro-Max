SkuWrite:
  type: object
  required:
  - code
  - variant_id
  - category_code
  - name
  - short_name
  - base_unit
  - base_per_pack
  - entry_unit_default
  - report_factor
  - sort
  additionalProperties: false
  properties:
    code:
      type: string
      pattern: ^[A-Za-z0-9][A-Za-z0-9._-]{0,39}$
    variant_id:
      $ref: '#/components/schemas/Id'
    category_code:
      type: string
      enum:
      - cigarette
      - bidi
      - lighter
      - match
    name:
      type: string
      minLength: 1
      maxLength: 120
    short_name:
      type: string
      minLength: 1
      maxLength: 20
    name_bn:
      type:
      - string
      - 'null'
      maxLength: 120
    base_unit:
      type: string
      enum:
      - stick
      - piece
      - dozen
    base_per_pack:
      type: integer
      minimum: 1
      maximum: 1000
    entry_unit_default:
      $ref: '#/components/schemas/QtyUnit'
    report_unit:
      type:
      - string
      - 'null'
      enum:
      - stick
      - piece
      - dozen
      - box
      - pack
      - null
    report_factor:
      $ref: '#/components/schemas/Decimal3'
    sort:
      type: integer
