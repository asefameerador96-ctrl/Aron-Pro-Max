AppRelease:
  type: object
  required:
  - release_id
  - flavour
  - version_name
  - version_code
  - abi
  - sha256
  - size_bytes
  - download_url
  - signing_cert_sha256
  - status
  - rollout_pct
  - created_at
  - version
  additionalProperties: false
  properties:
    release_id:
      $ref: '#/components/schemas/Id'
    flavour:
      $ref: '#/components/schemas/AppFlavour'
    version_name:
      type: string
      pattern: ^\d{1,3}\.\d{1,3}\.\d{1,3}$
    version_code:
      type: integer
      minimum: 1
      maximum: 2100000000
    abi:
      $ref: '#/components/schemas/Abi'
    sha256:
      $ref: '#/components/schemas/Sha256Hex'
    size_bytes:
      type: integer
      minimum: 1
      maximum: 104857600
    download_url:
      type: string
      format: uri
      maxLength: 1000
    signing_cert_sha256:
      $ref: '#/components/schemas/Sha256Hex'
    status:
      type: string
      enum:
      - draft
      - published
      - blocked
      - retired
    rollout_pct:
      type: integer
      minimum: 0
      maximum: 100
      description: Staged exposure by stable device hash.
    notes_en:
      type:
      - string
      - 'null'
      maxLength: 2000
    notes_bn:
      type:
      - string
      - 'null'
      maxLength: 2000
    created_at:
      $ref: '#/components/schemas/Timestamp'
    published_at:
      oneOf:
      - $ref: '#/components/schemas/Timestamp'
      - type: 'null'
    version:
      type: integer
      minimum: 1
