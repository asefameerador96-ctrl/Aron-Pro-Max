DaySubmitPayload:
  type: object
  description: Always the last record of the route-day (or supervisor-day) sequence in the outbox.
  required:
  - scope
  - submit_cycle
  - device_counts
  - device_money
  - rejected_count
  - quarantined_count
  - pending_count
  - submitted_with_dues
  - dues_outstanding_mtk
  - retailers_with_dues
  - stock_slip_printed
  additionalProperties: false
  properties:
    scope:
      type: string
      enum:
      - route_day
      - supervisor_day
    submit_cycle:
      type: integer
      minimum: 1
      maximum: 50
      description: 1 for the first submit; n+1 after the server voided cycle n.
    device_counts:
      $ref: '#/components/schemas/TypeCounts'
    device_money:
      $ref: '#/components/schemas/MoneyTotals'
    rejected_count:
      type: integer
      minimum: 0
    quarantined_count:
      type: integer
      minimum: 0
    pending_count:
      type: integer
      minimum: 0
      description: Rows of this route-day not yet acknowledged when the SR tapped submit.
    submitted_with_dues:
      type: boolean
    dues_outstanding_mtk:
      $ref: '#/components/schemas/MtkNonNegative'
    retailers_with_dues:
      type: integer
      minimum: 0
    stock_slip_printed:
      type: boolean
