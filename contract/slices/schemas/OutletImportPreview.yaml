OutletImportPreview:
  type: object
  required:
  - batch_uuid
  - rows
  - creates
  - updates
  - by_channel
  - errors
  - errors_truncated
  additionalProperties: false
  properties:
    batch_uuid:
      $ref: '#/components/schemas/Uuid'
    rows:
      type: integer
      minimum: 1
    creates:
      type: integer
      minimum: 0
    updates:
      type: integer
      minimum: 0
    unchanged:
      type: integer
      minimum: 0
      description: 1.18.0 (push 1b). Valid rows whose outlet already holds exactly these values; the commit writes
        nothing for them (no version bump, no audit row).
    skipped:
      type: integer
      minimum: 0
      description: '1.18.0 (push 1b). Rows with a row error: left out by on_row_error skip_rows, else they refuse
        the commit.'
    by_channel:
      type: object
      additionalProperties:
        type: integer
        minimum: 0
      description: Valid rows per channel.
    errors:
      type: array
      maxItems: 1000
      items:
        $ref: '#/components/schemas/OutletImportRowError'
    errors_truncated:
      type: boolean
    warnings:
      type: array
      maxItems: 1000
      items:
        $ref: '#/components/schemas/OutletImportRowWarning'
      description: 1.18.0.
    warnings_truncated:
      type: boolean
      description: 1.18.0.
    warnings_by_code:
      type: object
      additionalProperties:
        type: integer
        minimum: 0
      description: 1.18.0. Count of every warning code, informational ones included.
