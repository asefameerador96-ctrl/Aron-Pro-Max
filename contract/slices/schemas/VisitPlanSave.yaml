VisitPlanSave:
  type: object
  description: Body of `saveVisitPlan`, the `visit_plan` record (`plan_uuid` is its client uuid) plus the route
    and the outlets chosen on the Set Plan screen.
  required:
  - plan_uuid
  - plan_date
  - route_id
  - outlet_ids
  additionalProperties: false
  properties:
    plan_uuid:
      $ref: '#/components/schemas/Uuid'
    plan_date:
      $ref: '#/components/schemas/BusinessDate'
    route_id:
      $ref: '#/components/schemas/Id'
    outlet_ids:
      type: array
      minItems: 1
      maxItems: 500
      description: Duplicates count once.
      items:
        $ref: '#/components/schemas/Id'
    note:
      type:
      - string
      - 'null'
      maxLength: 500
