Feedback:
  type: object
  required:
  - feedback_uuid
  - user_id
  - category_code
  - title
  - description
  - created_at
  additionalProperties: false
  properties:
    feedback_uuid:
      $ref: '#/components/schemas/Uuid'
    user_id:
      $ref: '#/components/schemas/Id'
    category_code:
      type: string
      pattern: ^[a-z][a-z0-9_]{1,40}$
    title:
      type: string
      maxLength: 120
    description:
      type: string
      maxLength: 2000
    photo_uuid:
      oneOf:
      - $ref: '#/components/schemas/Uuid'
      - type: 'null'
    created_at:
      $ref: '#/components/schemas/Timestamp'
    status:
      $ref: '#/components/schemas/FeedbackStatus'
    business_date:
      $ref: '#/components/schemas/BusinessDate'
      description: The record's business date (contract 1.10.0).
    captured_at:
      $ref: '#/components/schemas/Timestamp'
      description: When the TSO saved it on the phone (contract 1.10.0).
    username:
      oneOf:
      - $ref: '#/components/schemas/Username'
      - type: 'null'
      description: The author's login name for the inbox (contract 1.10.0).
    zone_id:
      type:
      - integer
      - 'null'
      format: int64
      minimum: 1
      description: The author's zone, when it has one (contract 1.10.0).
