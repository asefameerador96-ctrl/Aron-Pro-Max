Bundle:
  type: object
  description: The day bundle (docs/24 s4.10). One snapshot of all routes assigned to the user for the business
    date.
  required:
  - meta
  - user
  - config
  - code_lists
  - products
  - prices
  - offers
  - calendar
  - templates
  - routes
  - tasks
  - reason_texts
  additionalProperties: false
  properties:
    meta:
      $ref: '#/components/schemas/BundleMeta'
    user:
      $ref: '#/components/schemas/BundleUser'
    config:
      $ref: '#/components/schemas/ResolvedConfig'
    code_lists:
      type: array
      maxItems: 30
      items:
        $ref: '#/components/schemas/CodeList'
    products:
      $ref: '#/components/schemas/BundleProducts'
    prices:
      type: array
      maxItems: 3000
      description: Outlet, cc and distributor prices valid today plus any starting within cfg.sys.schedule_horizon_days.
      items:
        $ref: '#/components/schemas/SkuPrice'
    offers:
      type: array
      maxItems: 200
      items:
        $ref: '#/components/schemas/Offer'
    calendar:
      $ref: '#/components/schemas/CalendarSection'
    templates:
      type: array
      maxItems: 20
      items:
        $ref: '#/components/schemas/PrintTemplate'
    routes:
      type: array
      maxItems: 60
      items:
        $ref: '#/components/schemas/RouteSnapshot'
    tasks:
      type: array
      maxItems: 1000
      items:
        $ref: '#/components/schemas/Task'
    surveys:
      type: array
      maxItems: 20
      items:
        $ref: '#/components/schemas/SurveyDef'
    rubrics:
      type: array
      maxItems: 10
      items:
        $ref: '#/components/schemas/RubricDef'
    supervisor:
      oneOf:
      - $ref: '#/components/schemas/SupervisorSection'
      - type: 'null'
    reason_texts:
      type: object
      description: Record outcome code to bn and en text (REJECT and QUARANTINE codes only).
      propertyNames:
        $ref: '#/components/schemas/RecordOutcomeCode'
      additionalProperties:
        type: object
        required:
        - bn
        - en
        additionalProperties: false
        properties:
          bn:
            type: string
            maxLength: 300
          en:
            type: string
            maxLength: 300
    device_policy_version:
      $ref: '#/components/schemas/ConfigVersionNumber'
    programmes:
      description: Loyalty, Astha and campaign data of the user's routes (docs/24 s4.14); null when no programme
        is active.
      oneOf:
      - $ref: '#/components/schemas/ProgrammesSection'
      - type: 'null'
    content:
      type: array
      maxItems: 50
      description: AV and KV items valid today or within cfg.sys.schedule_horizon_days.
      items:
        $ref: '#/components/schemas/ContentItem'
    tutorials:
      type: array
      maxItems: 100
      items:
        $ref: '#/components/schemas/TutorialItem'
    my_outlet_requests:
      type: array
      maxItems: 200
      description: The user's own outlet change requests of the last 30 days with status and rejection reason (SR
        and AMO own-request list).
      items:
        $ref: '#/components/schemas/OutletRequestSummary'
