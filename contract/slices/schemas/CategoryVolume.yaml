CategoryVolume:
  type: object
  required:
  - category_code
  - base_unit
  - qty_base
  - net_mtk
  additionalProperties: false
  properties:
    category_code:
      type: string
      pattern: ^[a-z][a-z0-9_]{1,30}$
    base_unit:
      type: string
      enum:
      - stick
      - piece
      - dozen
    qty_base:
      type: integer
      format: int64
      minimum: 0
    report_unit:
      type:
      - string
      - 'null'
      enum:
      - stick
      - piece
      - dozen
      - box
      - pack
      - null
    qty_report:
      oneOf:
      - $ref: '#/components/schemas/Decimal3'
      - type: 'null'
    entry_unit:
      type: string
      enum:
      - pack
      - dozen
      description: 'The unit the field apps count this category in (docs/34 s4.2): pack (packet or box, per SKU
        `base_per_pack`) or dozen (matches).'
    qty_entered:
      $ref: '#/components/schemas/Decimal3'
      description: 'This item''s quantity in `entry_unit`, summed per SKU first (each SKU''s base-unit quantity
        over its base_per_pack): 10s and 20s of one category convert correctly. Same basis as the item''s `qty_base`,
        which the list that carries the item states: in `DashboardSummary.by_category` the sold quantity of sale
        lines only, no free or DRP lines (D-TSO-MAN-09, lead ruling R-W-06); `DailyTrackingRow.by_category` states
        its own basis.'
    net_mtk:
      $ref: '#/components/schemas/Mtk'
