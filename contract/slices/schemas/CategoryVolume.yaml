CategoryVolume:
  type: object
  required:
  - category_code
  - base_unit
  - qty_base
  - net_mtk
  additionalProperties: false
  properties:
    category_code:
      type: string
      pattern: ^[a-z][a-z0-9_]{1,30}$
    base_unit:
      type: string
      enum:
      - stick
      - piece
      - dozen
    qty_base:
      type: integer
      format: int64
      minimum: 0
    report_unit:
      type:
      - string
      - 'null'
      enum:
      - stick
      - piece
      - dozen
      - box
      - pack
      - null
    qty_report:
      oneOf:
      - $ref: '#/components/schemas/Decimal3'
      - type: 'null'
    entry_unit:
      type: string
      enum:
      - pack
      - dozen
      description: 'The unit the field apps count this category in (docs/34 s4.2): pack (packet or box, per SKU
        `base_per_pack`) or dozen (matches).'
    qty_entered:
      $ref: '#/components/schemas/Decimal3'
      description: 'This item''s quantity in `entry_unit`, summed per SKU first (each SKU''s base-unit quantity
        over its base_per_pack): 10s and 20s of one category convert correctly. Same basis as the item''s `qty_base`:
        in both lists that carry the item (`DashboardSummary.by_category`, `DailyTrackingRow.by_category`) the sold
        quantity of sale lines only, no free or DRP lines (D-TSO-MAN-09, lead rulings R-W-06 and R-W-20).'
    net_mtk:
      $ref: '#/components/schemas/Mtk'
    memos:
      type:
      - integer
      - 'null'
      minimum: 0
      description: 'Contract 1.11.1 (D-AMO-MAN-18): accepted memos with at least one sale line of this category
        in the window, each memo counted once per category (a memo spanning two brands of the category counts once).
        Null when the figure is not computed (the per-route rows of Daily Tracking).'
