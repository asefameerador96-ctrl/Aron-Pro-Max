TicketNumber:
  type: string
  pattern: ^INC[0-9]{6,}$
  description: Server-assigned ticket number, "INC" and at least 6 digits from INC100001 (7 digits after INC999999),
    so the vendor's numbers (INC0107xx) never collide (D-TSO-MAN-18). Assigned at the first insert; a replay answers
    the stored number.
  examples:
  - INC100001
