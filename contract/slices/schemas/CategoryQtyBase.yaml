CategoryQtyBase:
  type: object
  required:
  - category_code
  - qty_base
  additionalProperties: false
  properties:
    category_code:
      type: string
      maxLength: 40
      description: The SKU category code (cigarette, bidi, lighter, match).
    qty_base:
      type: integer
      format: int64
      description: Base units (sticks, pieces, dozens as stored).
