<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1300" height="400" viewBox="0 0 1300 400" font-family="Segoe UI, Liberation Sans, Arial, Helvetica, sans-serif"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4a4a4a"/></marker></defs><rect width="1300" height="400" fill="#ffffff"/><text x="20" y="28" font-size="16" font-weight="600" fill="#1b1b1b">LLD 7 — Scaling rules: replicas follow the field day (Dhaka time)</text><line x1="120.0" y1="90" x2="120.0" y2="290" stroke="#ddd"/><text x="120.0" y="308" font-size="11" text-anchor="middle" fill="#555">00:00</text><line x1="257.5" y1="90" x2="257.5" y2="290" stroke="#ddd"/><text x="257.5" y="308" font-size="11" text-anchor="middle" fill="#555">03:00</text><line x1="395.0" y1="90" x2="395.0" y2="290" stroke="#ddd"/><text x="395.0" y="308" font-size="11" text-anchor="middle" fill="#555">06:00</text><line x1="532.5" y1="90" x2="532.5" y2="290" stroke="#ddd"/><text x="532.5" y="308" font-size="11" text-anchor="middle" fill="#555">09:00</text><line x1="670.0" y1="90" x2="670.0" y2="290" stroke="#ddd"/><text x="670.0" y="308" font-size="11" text-anchor="middle" fill="#555">12:00</text><line x1="807.5" y1="90" x2="807.5" y2="290" stroke="#ddd"/><text x="807.5" y="308" font-size="11" text-anchor="middle" fill="#555">15:00</text><line x1="945.0" y1="90" x2="945.0" y2="290" stroke="#ddd"/><text x="945.0" y="308" font-size="11" text-anchor="middle" fill="#555">18:00</text><line x1="1082.5" y1="90" x2="1082.5" y2="290" stroke="#ddd"/><text x="1082.5" y="308" font-size="11" text-anchor="middle" fill="#555">21:00</text><line x1="1220.0" y1="90" x2="1220.0" y2="290" stroke="#ddd"/><text x="1220.0" y="308" font-size="11" text-anchor="middle" fill="#555">24:00</text><text x="110" y="133" font-size="12" text-anchor="end" font-weight="600">api</text><rect x="120.0" y="110" width="286.4583333333333" height="36" fill="#dfe9f7" stroke="#7a8aa6"/><text x="263.22916666666663" y="133" font-size="11.5" text-anchor="middle" fill="#1b1b1b">min 3 (one per zone)</text><rect x="406.4583333333333" y="110" width="171.87499999999994" height="36" fill="#b7cdea" stroke="#7a8aa6"/><text x="492.39583333333326" y="133" font-size="11.5" text-anchor="middle" fill="#1b1b1b">pre-scale 8 · storm</text><rect x="578.3333333333333" y="110" width="309.3750000000001" height="36" fill="#dfe9f7" stroke="#7a8aa6"/><text x="733.0208333333333" y="133" font-size="11.5" text-anchor="middle" fill="#1b1b1b">min 3, autoscale to 30 on demand</text><rect x="887.7083333333334" y="110" width="148.95833333333314" height="36" fill="#b7cdea" stroke="#7a8aa6"/><text x="962.1875" y="133" font-size="11.5" text-anchor="middle" fill="#1b1b1b">pre-scale 8 · check-out</text><rect x="1036.6666666666665" y="110" width="183.33333333333348" height="36" fill="#dfe9f7" stroke="#7a8aa6"/><text x="1128.3333333333333" y="133" font-size="11.5" text-anchor="middle" fill="#1b1b1b">min 3</text><text x="110" y="193" font-size="12" text-anchor="end" font-weight="600">worker</text><rect x="120.0" y="170" width="1100.0" height="36" fill="#e8f0e3" stroke="#7a8aa6"/><text x="670.0" y="193" font-size="11.5" text-anchor="middle" fill="#1b1b1b">min 1, KEDA on outbox depth (200 rows/replica) and photo queue (100/replica), max 10</text><text x="110" y="253" font-size="12" text-anchor="end" font-weight="600">web</text><rect x="120.0" y="230" width="767.7083333333334" height="36" fill="#f3e9dc" stroke="#7a8aa6"/><text x="503.8541666666667" y="253" font-size="11.5" text-anchor="middle" fill="#1b1b1b">min 2</text><rect x="887.7083333333334" y="230" width="148.95833333333314" height="36" fill="#e5cfae" stroke="#7a8aa6"/><text x="962.1875" y="253" font-size="11.5" text-anchor="middle" fill="#1b1b1b">pre-scale 4 (designed) · 1,500 readers</text><rect x="1036.6666666666665" y="230" width="183.33333333333348" height="36" fill="#f3e9dc" stroke="#7a8aa6"/><text x="1128.3333333333333" y="253" font-size="11.5" text-anchor="middle" fill="#1b1b1b">min 2</text><text x="120" y="330" font-size="11" fill="#555" text-anchor="start">Database: D8ds_v5 all day (HA); step up to D16ds_v5 in place if the load test shows CPU above 80 % or IOPS above 7,200. Disk: 1,024 GiB, grow to 2,048 GiB by month 6.</text><text x="120" y="352" font-size="11" fill="#555" text-anchor="start">Autoscale rule: HTTP 50 concurrent requests per api replica, evaluated every 15 s, doubling up-steps, scale-in after 300 s.</text></svg>