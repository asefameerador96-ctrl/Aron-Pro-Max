/* =====================================================================
   Aron "Calm Glass" preview, tokens v1 (refined, docs/design/tokens.md). Names: group-role-variant.
   Themes: light, dark, sunlight. Tiers: A, B, C. Sunlight forces tier C. No external requests, no frameworks.
   Fonts: the four bundled Noto faces, subset and embedded (see the @font-face block); the web frames use the system UI face for Latin.
   ===================================================================== */
*{box-sizing:border-box}
:root{
  color-scheme:light;
  --bg-s0:#D8E7FB;--bg-s1:#E8EFFA;--bg-s2:#F3F5FB;--fade-rgb:243 245 251;--bg-solid-rgb:232 239 250;--sweep:rgba(255,255,255,.45);
  --glow-a:156 194 255;--glow-a-k:.50;--glow-b:201 184 255;--glow-b-k:.30;--bg-solid:#E8EFFA;
  --surface-glass:rgba(255,255,255,.62);--strong-rgb:255 255 255;--surface-solid:#FFFFFF;--surface-raised:#F2F5FA;--scrim-a:.32;
  --hl-top:rgba(255,255,255,.75);--hl-bot:rgba(11,27,51,.10);--bar-edge:rgba(11,27,51,.10);
  --border-divider:rgba(11,27,51,.08);--border-solid:rgba(11,27,51,.30);--border-input:#66768F;--border-focus:#0A58CC;
  --text-primary:#0B1B33;--text-secondary:#303D52;--text-disabled:#738097;--text-placeholder:#5F6D84;--text-on-accent:#FFFFFF;
  --accent:#0A58CC;--accent-text:#063B84;--accent-hi:#052E6B;--accent-fill:#041F49;--accent-pressed:#031734;--accent-container:#DCE9FD;--accent-on-container:#0A3F94;
  --success:#0B7A45;--success-container:#D6F0E1;--success-on-container:#0A5A33;
  --warning:#9A5200;--warning-container:#FFE9C7;--warning-on-container:#7A4300;
  --danger:#C0182D;--danger-container:#FDDDE1;--danger-on-container:#8E1224;--danger-fill:#7A0E1C;
  --offline:#53627C;--offline-container:#E3E8F0;--offline-on-container:#3F4C63;
  --state-pressed:rgba(11,27,51,.08);--disabled-fill:#DCE2EB;--disabled-label:#515E73;--skeleton:rgba(11,27,51,.07);
  /* surfaces: field = content (96 percent), tile = translucent glass with an opaque label plate */
  --field-fill:linear-gradient(180deg,rgba(255,255,255,.96),rgba(246,249,254,.96));--field-flat:rgba(255,255,255,.96);
  --tile-fill:linear-gradient(180deg,rgba(255,255,255,.30) 0,rgba(255,255,255,0) 45%),linear-gradient(180deg,rgba(255,255,255,.66),rgba(255,255,255,.58));
  --card-fill:var(--tile-fill);
  --vib:rgba(10,88,204,.04);
  --elev-card:0 1px 3px rgba(11,27,51,.06),0 2px 10px rgba(11,27,51,.10);
  --elev-sheet:0 -4px 24px rgba(11,27,51,.14);
  --elev-sheet-web:0 2px 6px rgba(11,27,51,.08),0 8px 24px rgba(11,27,51,.14);
  --elev-dialog:0 4px 8px rgba(11,27,51,.10),0 8px 32px rgba(11,27,51,.18);
  --surface-data:rgba(255,255,255,.92);
  --viz-1:#2A78D6;--viz-2:#EB6834;--viz-3:#1BAF7A;
  --map-land:#EEF1F6;--map-water:#CFE0F5;--map-road:#FFFFFF;--map-lbl:#303D52;
  --card-bw:1px;--paper:#FCFCFA;--paper-ink:#16181D;
  /* motion (tokens s8) */
  --motion-press:90ms;--motion-fast:150ms;--motion-base:220ms;--motion-sheet:320ms;
  --ease-out:cubic-bezier(.2,0,0,1);--ease-in:cubic-bezier(.4,0,1,1);--ease-inout:cubic-bezier(.4,0,.2,1);
  --ease-spring:linear(0,.086 10%,.263 20%,.454 30%,.622 40%,.754 50%,.851 60%,.916 70%,.958 80%,.983 90%,1);
  /* fonts: embedded subsets of the four bundled faces (phones); the web frames override --ff-lat with the system UI face */
  --ff-lat:"Noto Sans Aron",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --ff-bn:"Noto Sans Bengali Aron","Noto Sans Bengali","Kohinoor Bangla","Bangla Sangam MN","Nirmala UI","Shonar Bangla";
  --fs:1;--w-semi:700;
}
:root[data-wt="600"]{--w-semi:600}

  --success:#4CD38B;--success-container:#12382A;--success-on-container:#9BE7BF;
  --warning:#FFB84D;--warning-container:#45330F;--warning-on-container:#FFD58F;

  --state-pressed:rgba(255,255,255,.10);--disabled-fill:#2A3550;--disabled-label:#97A6BF;--skeleton:rgba(255,255,255,.10);
  --field-fill:linear-gradient(180deg,rgba(0,0,0,0) 45%,rgba(0,0,0,.14) 100%),rgba(20,29,48,.96);--field-flat:rgba(20,29,48,.96);
  --tile-fill:linear-gradient(180deg,rgba(0,0,0,0) 45%,rgba(0,0,0,.14) 100%),rgba(255,255,255,.12);
  --vib:rgba(132,182,255,.04);
  --elev-card:0 1px 3px rgba(0,0,0,.25),0 2px 10px rgba(0,0,0,.35);
  --elev-sheet:0 -4px 24px rgba(0,0,0,.45);
  --elev-sheet-web:0 2px 6px rgba(0,0,0,.40),0 8px 24px rgba(0,0,0,.50);
  --elev-dialog:0 4px 8px rgba(0,0,0,.45),0 8px 32px rgba(0,0,0,.55);
  --surface-data:rgba(20,29,48,.94);
  --viz-1:#3987E5;--viz-2:#D95926;--viz-3:#199E70;
  --map-land:#121A2B;--map-water:#0D2238;--map-road:#1F2A40;--map-lbl:#C2CCDD;
  --paper:#F4F4EF;
}
:root[data-theme="sunlight"]{
  color-scheme:light;
  --bg-solid:#F1F3F7;--fade-rgb:241 243 247;--bg-solid-rgb:241 243 247;--sweep:transparent;
  --surface-glass:#FFFFFF;--strong-rgb:255 255 255;--surface-solid:#FFFFFF;--surface-raised:#EEF1F6;--scrim-a:.56;
  --hl-top:rgba(5,10,20,.72);--hl-bot:rgba(5,10,20,.72);--bar-edge:rgba(5,10,20,.72);

  --text-primary:#050A14;--text-secondary:#2B3648;--text-disabled:#5B6578;--text-placeholder:#4A5568;--text-on-accent:#FFFFFF;
  --accent:#0041B3;--accent-text:#0041B3;--accent-hi:#002A73;--accent-fill:#002A73;--accent-pressed:#001B4D;--accent-container:#CFE0FF;--accent-on-container:#002A73;
  --success:#005C2E;--success-container:#CFEBD9;--success-on-container:#00391C;
  --warning:#7A3E00;--warning-container:#FFE0A8;--warning-on-container:#4D2700;
  --danger:#A30018;--danger-container:#FAD0D6;--danger-on-container:#6B0010;--danger-fill:#6B0010;
  --offline:#3B4658;--offline-container:#DDE2EA;--offline-on-container:#1F2937;
  --state-pressed:rgba(5,10,20,.12);--disabled-fill:#D9DEE7;--disabled-label:#3B4658;--skeleton:rgba(5,10,20,.10);

  --surface-data:#FFFFFF;
  --map-land:#EEF1F6;--map-water:#CFE0F5;--map-road:#FFFFFF;--map-lbl:#2B3648;
}
/* the bright primary fill (needs a written amendment of docs/32 2a.3 and 2a.4): ?pri=bright */
:root[data-pri="bright"][data-theme="light"]{--accent-hi:#1B68DC;--accent-fill:#0A58CC;--accent-pressed:#0846A8}
:root[data-pri="bright"][data-theme="dark"]{--accent-hi:#A0C8FF;--accent-fill:#84B6FF;--accent-pressed:#68A2F8;--text-on-accent:#05122B}
/* ---- tiers: A real blur on the top bar (apps) and on web bars and sheets; B glass-lite; C solid ---- */
:root[data-tier="A"]{--strong-a:.86;--dialog-a:.96;--bf-bar:blur(16px) saturate(1.4);--bf-sheet:blur(28px) saturate(1.4);--scrim-k:.55}
:root[data-tier="B"]{--strong-a:.96;--dialog-a:.96;--bf-bar:none;--bf-sheet:none;--scrim-k:1}
:root[data-tier="C"]{--strong-a:1;--dialog-a:1;--bf-bar:none;--bf-sheet:none;--scrim-k:1;
  --card-fill:var(--surface-solid);--tile-fill:var(--surface-solid);--field-fill:var(--surface-solid);--field-flat:var(--surface-solid);
  --vib:transparent;--elev-card:0 0 #0000;--elev-sheet:0 0 #0000;--elev-sheet-web:0 0 #0000;--elev-dialog:0 0 #0000;--surface-glass:var(--surface-solid);--surface-data:var(--surface-solid);--fade-rgb:var(--bg-solid-rgb)}
:root{
  --fill-strong:rgb(var(--strong-rgb)/var(--strong-a));--fill-dialog:var(--field-flat);
  --surface-scrim:rgb(0 0 0/calc(var(--scrim-a)*var(--scrim-k)));
}
:root[data-tier="C"]{--fill-strong:var(--surface-solid);--fill-dialog:var(--surface-solid)}
/* page background (AronBackground / the baked window background): gradient + two glows; flat in C and sunlight */
.pbg{position:absolute;inset:0;
  background:
    radial-gradient(circle 324px at 12% 6%,rgb(var(--glow-a)/var(--glow-a-k)),rgb(var(--glow-a)/0)),
    radial-gradient(circle 288px at 95% 78%,rgb(var(--glow-b)/var(--glow-b-k)),rgb(var(--glow-b)/0)),
    linear-gradient(168deg,var(--bg-s0) 0%,var(--bg-s1) 50%,var(--bg-s2) 100%)}
.pbg.w{background:
    radial-gradient(circle 1229px at 12% 6%,rgb(var(--glow-a)/var(--glow-a-k)),rgb(var(--glow-a)/0)),
    radial-gradient(circle 1093px at 95% 78%,rgb(var(--glow-b)/var(--glow-b-k)),rgb(var(--glow-b)/0)),
    linear-gradient(168deg,var(--bg-s0) 0%,var(--bg-s1) 50%,var(--bg-s2) 100%)}
.page-bg{position:fixed;inset:0;z-index:-1;
  background:

/* filter chips: opaque raised, 40 visual inside a 48 dp hit area (4 dp transparent border), selected = container + ring + check */

  font-size:calc(var(--fs-cap)*var(--fs));line-height:calc(var(--lh-cap)*var(--fs));background-color:var(--surface-raised);color:var(--text-secondary);box-shadow:inset 0 0 0 1px var(--border-divider)}

.dockbar{display:flex;align-items:center;gap:0;padding:0 8px;background:var(--field-flat);border-radius:20px 20px 0 0;box-shadow:inset 0 1px 0 var(--hl-top),0 -1px 0 var(--bar-edge)}
.dockbar .hscroll{flex:1}

html[data-fs="130"] .avatar,html[data-fs="150"] .avatar,html[data-fs="200"] .avatar{display:none}

html[data-h="640"]{--ph:660px;--sh:640px}
.tb-title{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.infilter{display:none}

html[data-fs="130"] .fdock.pin,html[data-fs="150"] .fdock.pin,html[data-fs="200"] .fdock.pin{display:none}
.c-only{display:none}

/* ---- Home ---- */
.hero{display:flex;flex-direction:column;gap:6px;padding:16px;text-align:start;border:0;width:100%;color:inherit}

.hero .meta{display:flex;flex-wrap:wrap;gap:4px 12px;align-items:center;color:var(--text-secondary)}
.mrow{display:flex;align-items:center;gap:10px}
.tgrp{display:flex;flex-direction:column;gap:8px}
.tiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
html[data-fs="130"] .tiles,html[data-fs="150"] .tiles{grid-template-columns:repeat(2,minmax(0,1fr))}
html[data-fs="200"] .tiles{grid-template-columns:1fr}
.tile{position:relative;display:flex;flex-direction:column;align-items:center;gap:6px;min-height:96px;padding:8px 4px 4px;border:0;color:var(--text-primary);text-align:center;box-shadow:none;transition:transform var(--motion-press) linear}
.tile.s{min-height:84px}
.tile:active{transform:scale(.96)}
.tile.target{box-shadow:inset 0 0 0 2px var(--accent)}
.tile .plate{align-self:stretch;margin-top:auto;display:grid;place-items:center;min-height:32px;padding:5px 4px;border-radius:12px;background:var(--surface-solid)}
.tile .plate .t-label{display:block;max-width:100%;overflow-wrap:normal;word-break:normal;hyphens:none}
html[data-fs="200"] .tile{flex-direction:row;min-height:64px;padding:8px 12px 8px 8px;gap:12px;text-align:start}
html[data-fs="200"] .tile .plate{flex:1;align-self:stretch;margin-top:0;place-items:center start;padding:4px 12px}
.well44{position:relative;width:44px;height:44px;border-radius:14px;display:grid;place-items:center;background:var(--accent-container);color:var(--accent-on-container);flex:none}
.well36{width:36px;height:36px;border-radius:11px}
.badge{position:absolute;top:-6px;right:-10px;min-width:24px;height:24px;padding:0 6px;border-radius:12px;display:grid;place-items:center;background:var(--accent-hi);color:var(--text-on-accent);font-weight:700;font-size:14px;line-height:24px;box-shadow:0 0 0 2px var(--surface-solid)}
.kpi{min-height:88px;justify-content:center;gap:2px;display:flex;flex-direction:column;align-items:center;padding:8px 4px;text-align:center}
.kv{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
html[data-fs="130"] .kv.stackable,html[data-fs="150"] .kv.stackable,html[data-fs="200"] .kv.stackable{flex-direction:column;align-items:flex-start;gap:0}
.stk{display:grid;grid-template-columns:1fr auto auto;gap:6px 18px;align-items:baseline}
.stk .h{color:var(--text-secondary)}
html[data-fs="150"] .stk,html[data-fs="200"] .stk{grid-template-columns:1fr;gap:2px}
html[data-fs="150"] .stk .h,html[data-fs="200"] .stk .h,html[data-fs="150"] .stk>span:empty,html[data-fs="200"] .stk>span:empty{display:none}
html[data-fs="150"] .stk b,html[data-fs="200"] .stk b{text-align:start}
html[data-fs="150"] .stk b::before,html[data-fs="200"] .stk b::before{content:attr(data-l) " ";font-weight:400;color:var(--text-secondary)}
html[data-fs="150"] .stk>.t-body,html[data-fs="200"] .stk>.t-body{margin-top:8px;font-weight:700}
.r{text-align:end}
.dline{display:flex;align-items:center;gap:8px;flex-wrap:wrap;color:var(--text-secondary);padding:0 4px}
.hr{height:1px;background:var(--border-divider);margin:8px 0}

/* ---- flat list rows (long lists: field 96 percent, no shadow, no gradient, no stroke) ---- */
.grp{border-radius:20px;overflow:hidden;background:var(--field-flat);box-shadow:inset 0 0 0 1px var(--hl-top)}
:root[data-tier="C"] .grp{box-shadow:none;border:var(--card-bw) solid var(--border-solid)}
.row{display:flex;align-items:center;gap:12px;width:100%;min-height:64px;padding:12px 16px;border:0;background:none;text-align:start;position:relative;color:inherit}
.row+.row::before{content:"";position:absolute;top:0;left:16px;right:0;height:1px;background:var(--border-divider)}
.row:active{background:var(--state-pressed)}
.row .mid{flex:1;min-width:0}
.row .end{display:flex;flex-direction:column;align-items:flex-end;gap:4px;flex:none;text-align:end;max-width:46%}
.ok-t{color:var(--success-on-container)}
.srow{padding:12px 16px 14px;display:flex;flex-direction:column;gap:10px;position:relative}
.srow+.srow::before{content:"";position:absolute;top:0;left:16px;right:0;height:1px;background:var(--border-divider)}
.srow.on{background:var(--accent-container)}
.srow.on .sec{color:var(--accent-on-container)}
.srow .top{display:flex;gap:12px;align-items:center}
.srow.idle{flex-direction:row;align-items:center;min-height:72px;padding:12px 8px 12px 16px;gap:12px}
.srow.idle .top{flex:1;min-width:0}
.srow .stepline.end{justify-content:flex-end}
.thumb{position:relative;flex:none;width:48px;height:48px;border-radius:12px;display:grid;place-items:center;background:linear-gradient(145deg,var(--viz-1),var(--accent-hi))}
.thumb.l{background:linear-gradient(145deg,var(--viz-2),#B8431A)}
.thumb.mt{background:linear-gradient(145deg,var(--viz-3),#0F7A55)}
.pk{position:absolute;right:-8px;bottom:-8px;min-width:24px;height:24px;padding:0 6px;border-radius:12px;background:var(--accent-container);color:var(--accent-on-container);font-weight:700;font-size:14px;line-height:24px;text-align:center;box-shadow:0 0 0 2px var(--surface-solid)}
.stepline{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
html[data-fs="150"] .stepline,html[data-fs="200"] .stepline{flex-direction:column;align-items:flex-start}
html[data-fs="150"] .srow.idle,html[data-fs="200"] .srow.idle{flex-wrap:wrap}
.warnline{display:flex;gap:6px;align-items:flex-start;color:var(--warning-on-container);background:var(--warning-container);border-radius:12px;padding:6px 10px}
html[data-h="640"] .screen .srow{flex-direction:row;align-items:center;flex-wrap:wrap}
html[data-h="640"] .screen .srow .top{flex:1;min-width:110px}
html[data-h="640"] .screen .stp{gap:4px}
html[data-h="640"] .screen .stp .well{min-width:52px}
html[data-h="640"] .screen .srow .thumb{display:none}
html[data-h="640"] .screen .srow .warnline{display:none}

/* ---- visit / geo ---- */
.geo{display:flex;gap:14px;padding:16px;border-radius:20px;align-items:center}
.geo.ok{background:var(--success-container);color:var(--success-on-container)}
.geo.warn{background:var(--warning-container);color:var(--warning-on-container)}
.geo.acc{background:var(--accent-container);color:var(--accent-on-container)}
.geo .tx{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px}
.geo svg.rg{flex:none}
.geo .btn.txt{color:inherit;padding:0 8px;min-height:48px;margin-inline-start:-8px;text-decoration:underline;text-underline-offset:3px}
.rows2{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}
.radio{display:flex;align-items:center;gap:12px;min-height:56px;padding:8px 16px;border-radius:16px;width:100%;border:0;background:var(--surface-raised);box-shadow:inset 0 0 0 1px var(--border-input);text-align:start}
.radio[aria-checked="true"]{background:var(--accent-container);box-shadow:inset 0 0 0 2px var(--accent)}
.radio .dot{width:22px;height:22px;border-radius:50%;box-shadow:inset 0 0 0 2px var(--border-input);display:grid;place-items:center;flex:none;color:var(--text-on-accent)}
.radio[aria-checked="true"] .dot{background:var(--accent-hi);box-shadow:none}
.fld{display:flex;flex-direction:column;gap:6px}
.inp{min-height:56px;width:100%;padding:8px 14px;border-radius:12px;border:0;background:var(--surface-raised);box-shadow:inset 0 0 0 1px var(--border-input);color:var(--text-primary);font-variant-numeric:tabular-nums}
.inp::placeholder{color:var(--text-placeholder);opacity:1}
.inp:focus-visible{outline-offset:0;box-shadow:inset 0 0 0 2px var(--border-focus)}
.inp.err{box-shadow:inset 0 0 0 2px var(--danger)}
.errline{display:flex;gap:6px;align-items:flex-start;color:var(--danger-on-container)}
.srch{display:flex;align-items:center;gap:8px;min-height:48px;padding:0 12px;border-radius:14px;background:var(--surface-raised);box-shadow:inset 0 0 0 1px var(--border-input);color:var(--text-secondary);flex:1}

/* ---- paper slip (print preview). Physical paper, not a UI surface ---- */
.paper{position:relative;width:236px;margin:0 auto;padding:16px 14px 18px;background:var(--paper);color:var(--paper-ink);border-radius:6px 6px 0 0;
  font-size:12px;line-height:1.55;box-shadow:0 1px 2px rgba(11,27,51,.12),0 8px 24px -4px rgba(11,27,51,.28);font-family:var(--ff)}
.paper::after{content:"";position:absolute;left:0;right:0;top:100%;height:8px;
  background:linear-gradient(135deg,var(--paper) 50%,transparent 50%) 0 0/12px 8px,linear-gradient(225deg,var(--paper) 50%,transparent 50%) 0 0/12px 8px;filter:drop-shadow(0 2px 2px rgba(11,27,51,.12))}
.paper .c{text-align:center}.paper b{font-weight:700}
.paper .ln{border:0;border-top:1.5px dashed rgba(22,24,29,.55);margin:6px 0}
.paper .g{display:grid;grid-template-columns:1fr auto auto;gap:0 10px}
.paper .g.t{grid-template-columns:1fr auto}
.paper .big{font-size:15px;font-weight:700}
.paper .dup{margin-top:6px;text-align:center;font-weight:700;border:1.5px solid var(--paper-ink);padding:2px 0;border-radius:4px}

/* ---- overlays (sheet, dialog): field 96 percent, no blur in the apps, translation only for sheets ---- */
.ov{position:absolute;inset:0;z-index:40;pointer-events:none}
.ov.open{pointer-events:auto}
.scrim{position:absolute;inset:0;background:var(--surface-scrim);opacity:0;transition:opacity var(--motion-base) var(--ease-out)}
.ov.open .scrim{opacity:1}
.sheet{position:absolute;left:0;right:0;bottom:0;max-height:85%;overflow:auto;scrollbar-width:none;border-radius:28px 28px 0 0;padding:8px 16px 28px;
  background:var(--surface-solid);box-shadow:var(--elev-sheet);transform:translateY(106%);transition:transform var(--motion-sheet) var(--ease-spring);display:flex;flex-direction:column;gap:12px}
:root[data-tier="C"] .sheet{border:var(--card-bw) solid var(--border-solid);border-bottom:0}
.ov.open .sheet{transform:none}
.sheet .handle{align-self:center;width:36px;height:4px;border-radius:2px;background:var(--text-secondary);opacity:.7;margin:4px 0 4px}
.dlg{position:absolute;left:24px;right:24px;top:50%;padding:24px;border-radius:28px;background:var(--surface-solid);box-shadow:var(--elev-dialog);display:flex;flex-direction:column;gap:12px;
  transform:translateY(-50%) scale(.94);opacity:0;transition:transform var(--motion-base) var(--ease-out),opacity var(--motion-base) var(--ease-out)}
:root[data-tier="C"] .dlg{border:var(--card-bw) solid var(--border-solid)}
.ov.open .dlg{transform:translateY(-50%);opacity:1}
.dlg-act{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
html[data-fs="130"] .dlg-act,html[data-fs="150"] .dlg-act,html[data-fs="200"] .dlg-act{flex-direction:column-reverse;align-items:stretch}
.okdisc{width:96px;height:96px;border-radius:50%;background:var(--success-container);color:var(--success-on-container);display:grid;place-items:center;align-self:center}
.empty{display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center;padding:24px 16px}
.empty .ill{width:96px;height:96px;border-radius:50%;background:var(--accent-container);color:var(--accent-on-container);display:grid;place-items:center}
.empty .btn{margin-top:4px}
.sk{position:relative;overflow:hidden;background:var(--skeleton);border-radius:12px}
.sk::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgb(255 255 255/0),var(--sweep),rgb(255 255 255/0));transform:translateX(-100%);animation:sweep 1.2s linear 2}
@keyframes sweep{to{transform:translateX(100%)}}
.holdbtn{position:relative;overflow:hidden;min-height:72px;width:100%;border:0;border-radius:999px;background:var(--accent-container);color:var(--accent-on-container);display:grid;place-items:center;box-shadow:inset 0 0 0 1.5px var(--accent);touch-action:none;user-select:none}
.holdbtn .fill{position:absolute;left:0;top:0;bottom:0;width:0;overflow:hidden;background:var(--accent-hi);transition:width .15s ease}
.holdbtn .fill .lab2{position:absolute;left:0;top:0;bottom:0;width:var(--hw,312px);display:grid;place-items:center;color:var(--text-on-accent)}
.holdbtn.holding .fill{width:100%;transition:width 1.2s linear}
.holdbtn .lab{position:relative;z-index:1;padding:0 12px;text-align:center}
.steps{display:flex;align-items:center;gap:8px}
.steps .st{display:flex;align-items:center;gap:6px;color:var(--text-secondary);flex:none;font-size:calc(var(--fs-cap)*var(--fs));line-height:calc(var(--lh-cap)*var(--fs))}

.steps .st b{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;background:var(--surface-raised);box-shadow:inset 0 0 0 1px var(--border-input);font-size:14px;line-height:1;flex:none}
.steps .st.on{color:var(--accent-on-container)}
.steps .st.on b{background:var(--accent-container);box-shadow:inset 0 0 0 1.5px var(--accent)}
.steps .st.done b{background:var(--success-container);color:var(--success-on-container);box-shadow:none}
.steps .ln{flex:1;height:2px;background:var(--border-divider);min-width:8px}

/* ---- tasks ---- */
.task{display:flex;flex-direction:column;gap:8px;padding:16px;min-height:120px}
.task .hd{display:flex;gap:8px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.task .ft{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}
.task .due{display:flex;align-items:center;gap:6px;color:var(--text-secondary)}
.task.done .t-body{color:var(--text-secondary)}

/* ---- login, attendance, submit, settings, outlet, tutorial, journey, kpi ---- */
.mark72{width:72px;height:72px;border-radius:22px;display:grid;place-items:center;background:var(--accent-container);color:var(--accent-on-container);margin:0 auto}
.otp{display:flex;gap:12px;justify-content:center}
.otp i{width:56px;height:64px;border-radius:14px;background:var(--surface-raised);box-shadow:inset 0 0 0 1px var(--border-input);display:grid;place-items:center;font-style:normal;font-weight:700;font-size:26px;font-variant-numeric:tabular-nums}
.otp i.cur{box-shadow:inset 0 0 0 2px var(--border-focus)}
.drow{display:flex;align-items:center;gap:12px;min-height:56px}
.drow .ico{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;flex:none;background:var(--surface-raised);color:var(--text-secondary)}
.drow.done .ico{background:var(--success-container);color:var(--success-on-container)}
.rtab{display:grid;grid-template-columns:1fr auto auto;gap:6px 16px;align-items:center}
.rtab .h{color:var(--text-secondary)}
.setgrp{display:flex;flex-direction:column;gap:6px}
.sgrp{border-radius:20px;overflow:hidden;background:var(--field-flat);box-shadow:inset 0 0 0 1px var(--hl-top)}
:root[data-tier="C"] .sgrp{box-shadow:none;border:var(--card-bw) solid var(--border-solid)}
.sgrp>*+*{border-top:1px solid var(--border-divider)}
.srow2{display:flex;align-items:center;gap:12px;min-height:56px;padding:8px 16px;width:100%;border:0;background:none;text-align:start;color:inherit}
.srow2:active{background:var(--state-pressed)}
.srow2 .mid{flex:1;min-width:0}
.omgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
html[data-fs="200"] .omgrid{grid-template-columns:1fr}
.omt{display:flex;flex-direction:column;align-items:flex-start;justify-content:space-between;gap:8px;min-height:112px;padding:16px;border:0;text-align:start;color:inherit}
.omt:active{background-color:var(--state-pressed)}
.tl{position:relative;display:flex;flex-direction:column}
.tl .it{display:flex;gap:12px;padding:10px 0;position:relative}
.tl .it::before{content:"";position:absolute;left:15px;top:0;bottom:0;width:2px;background:var(--border-divider)}
.tl .it:first-child::before{top:50%}.tl .it:last-child::before{bottom:50%}
.tl .dot{position:relative;z-index:1;width:32px;height:32px;border-radius:50%;display:grid;place-items:center;flex:none;background:var(--surface-raised);color:var(--text-secondary);box-shadow:inset 0 0 0 1.5px var(--border-input)}
.tl .dot.v{background:var(--success-container);color:var(--success-on-container);box-shadow:none}
.tl .dot.s{background:var(--offline-container);color:var(--offline-on-container);box-shadow:none}
.tl .it.next .dot{background:var(--accent-container);color:var(--accent-on-container);box-shadow:inset 0 0 0 1.5px var(--accent)}
.dlrow{display:flex;align-items:center;gap:12px;padding:12px 16px}
.dlrow .ico{width:48px;height:48px;border-radius:14px;display:grid;place-items:center;background:var(--accent-container);color:var(--accent-on-container);flex:none}

/* ---- gallery page ---- */
.wrap{max-width:1480px;margin:0 auto;padding:0 24px}
.ctl{position:sticky;top:0;z-index:100;box-shadow:inset 0 -1px 0 var(--bar-edge)}
:root[data-tier="C"] .ctl{box-shadow:none;border-bottom:var(--card-bw) solid var(--border-solid)}
.ctl .wrap{display:flex;flex-wrap:wrap;align-items:center;gap:10px 22px;padding-top:10px;padding-bottom:10px}
.brand{display:flex;align-items:center;gap:10px;margin-inline-end:auto;min-width:0}
.mark{width:36px;height:36px;border-radius:12px;display:grid;place-items:center;background:linear-gradient(180deg,var(--accent-hi),var(--accent-fill));color:var(--text-on-accent);box-shadow:0 4px 10px -2px color-mix(in srgb,var(--accent) 40%,transparent),inset 0 1px 0 rgba(255,255,255,.35)}
.cg{display:flex;align-items:center;gap:8px}
.cg>.lb{color:var(--text-secondary)}
.ctl .seg{min-height:40px;padding:3px;border-radius:14px}
.ctl .seg>button{min-height:34px;padding:3px 12px}
.ctl .seg::before{top:3px;bottom:3px}
.swl{display:flex;align-items:center;gap:8px;border:0;background:none;padding:0}
.hint{color:var(--text-secondary)}
.intro{padding:34px 0 8px}
.intro h1{font-size:clamp(30px,4.2vw,52px);line-height:1.18;font-weight:700}
html[data-lang="bn"] .intro h1{line-height:1.4}
.intro p{max-width:760px;margin-top:10px}
.nav{display:flex;gap:0;flex-wrap:wrap;margin:18px 0 6px}
.nav a{text-decoration:none}
.sechead{display:flex;align-items:baseline;gap:14px;margin:44px 0 18px;flex-wrap:wrap}
.gallery{display:grid;grid-template-columns:repeat(auto-fit,minmax(380px,380px));gap:44px 36px;justify-content:center}
figure{margin:0}
figcaption{margin:14px auto 0;width:var(--fw,380px);max-width:100%;display:flex;flex-direction:column;gap:2px}
#desk figure>.fit{margin:0 auto}
.fx.in{animation:rise var(--motion-base) var(--ease-out) both}
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.eff{display:inline-flex;align-items:center;gap:6px}
footer.foot{margin:56px 0 40px;display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:16px}
footer.foot .card{padding:18px}
footer.foot ul{margin:8px 0 0;padding-inline-start:18px}
.sw-dot{display:inline-block;width:14px;height:14px;border-radius:50%;vertical-align:-2px;margin-inline-end:6px;box-shadow:inset 0 0 0 1px var(--border-divider)}
.seg[aria-disabled="true"]{opacity:.55}
.stt{display:inline-flex;gap:4px;flex-wrap:wrap;color:var(--text-secondary)}

  return `<span class="m num ${o.fit===false?'':'mfit'} ${c}">${o.neg?'−':''}${a}${dd}${o.nosign?'':' <i class="tk">৳</i>'}</span>`;};

const rng=s=>()=>((s=(s*1664525+1013904223)>>>0)/4294967296);

     <div style="display:flex;align-items:flex-start;gap:8px"><div style="flex:1"><h1 class="t-title">${t('জিওফেন্সের ব্যাসার্ধ','Geofence radius')}</h1><p class="t-cap sec">${t('প্রযোজ্য: টেরিটরি · বনানী · সংস্করণ 12 · অডিট','Applies to: Territory · Banani · version 12 · Audit')}</p></div></div>
     <div class="step"><b>1</b><span class="t-label">${t('কোথায়','Where')}</span></div>
     <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px"><select class="sel t-body" id="gf-level" aria-label="${t('স্তর','Level')}">${lv.map(l=>`<option value="${l[0]}" ${g.level===l[0]?'selected':''}>${l[1]}</option>`).join('')}</select><select class="sel t-body" aria-label="${t('এলাকা','Area')}"><option>${t('বনানী','Banani')}</option><option>${t('গুলশান','Gulshan')}</option></select></div>
     <div class="step"><b>2</b><span class="t-label">${t('কত দূর','How far')}</span></div>
     <div style="display:flex;align-items:baseline;gap:10px;flex-wrap:wrap"><span class="t-display" id="gf-cur"></span>${chip('c-neu','',t('বিভাগ থেকে','from Division'))}</div>
     <span class="t-cap sec" style="margin-top:-8px">${t('এখানে কার্যকর ব্যাসার্ধ','Radius in force here')}</span>
     <div><input class="range" id="gf-rng" type="range" min="0" max="1000" step="1" value="${posFromM(g.m)}" aria-label="${t('ব্যাসার্ধ','Radius')}">
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px" class="t-cap sec"><span>${t('ছোট: বেশি ফোর্স সেল','Small: more force sales')}</span><span style="text-align:end">${t('বড়: ভুল দোকান বৈধ হওয়ার ঝুঁকি','Large: a neighbouring shop may count')}</span></div></div>
     <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap"><input class="nf t-bodyS" id="gf-num" inputmode="numeric" aria-label="${t('মিটার','Metres')}"><span class="t-body sec">${t('মি','m')}</span><span class="t-cap sec" style="flex:1;min-width:120px">${t('20 থেকে 2,000 মি','20 to 2,000 m')}</span></div>
     <p id="gf-err" class="t-cap" style="display:none;gap:8px;align-items:center;border-radius:12px;padding:6px 10px;background:var(--danger-container);color:var(--danger-on-container)">${ic('warn',16)}<span>${t('20 থেকে 2,000 মিটারের মধ্যে একটি সংখ্যা দিন।','Enter a number from 20 to 2,000 metres.')}</span></p>
     <div style="display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap"><span class="t-label sec">${t('যদি এই ব্যাসার্ধ হতো…','If the radius were…')}</span>${segW('gf-days',[[7,n(7)],[14,n(14)],[30,n(30)]].map(x=>[x[0],x[1]]),30,'gfdays')}</div>
     <div class="wif" id="gf-bar" role="img" aria-label="${t('যাচাইয়ের ফল','What-if result')}"></div><p class="t-cap" id="gf-wtxt" role="status"></p>
     <div class="card flat" style="padding:12px;box-shadow:none"><span class="t-label">${t('এই পরিবর্তনে প্রভাব পড়বে','This change affects')}</span><p class="t-cap sec num" id="gf-blast"></p></div>
     <div class="step"><b>3</b><span class="t-label">${t('নিশ্চিত করুন','Confirm')}</span></div>
     <div class="fld"><label class="t-cap sec" for="gf-why">${t('কারণ (কমপক্ষে 10 অক্ষর)','Reason (at least 10 characters)')}</label><textarea class="ta t-body" id="gf-why" rows="2">${g.why}</textarea><span class="t-cap sec num" id="gf-cnt" style="align-self:flex-end"></span></div>
    </div>
    <div class="gp-foot"><div id="gf-risk"></div><p class="t-cap sec" id="gf-gate" style="margin-top:-2px"></p><p class="cap-reason t-cap" id="gf-why-t" style="margin:0"></p><button class="wbtn pri" id="gf-btn" data-act="gfgo" style="width:100%;justify-content:center;min-height:48px"></button></div></aside>
   <div class="toast" id="gf-toast" role="status"></div></div></div>`;
  gfUpdate(el,true);
}
addWeb({id:'geo',path:'/admin/config/geofence',short:['জিওফেন্স','Geofence'],t:['জিওফেন্স ব্যাসার্ধ (অ্যাডমিন)','Geofence radius (admin)'],ref:'F-ADM-039 · screens-web s2',
 note:['স্লাইডার টানুন: বৃত্ত, যাচাই, ঝুঁকির স্তর ও বোতাম লাইভ বদলায়; কারণ লিখলে বোতাম চালু হয়','Drag the slider: circle, what-if, risk class and button change live; the button needs a reason'],draw:geoDraw});

/* ---------- web interactions ---------- */
Object.assign(ACT,{
 dseg(a){S.dash.date=a.dataset.v;redraw('dash');},
 zseg(a){S.dash.zm=a.dataset.v;redraw('dash');},
 wtheme(a){const o=['light','dark','sunlight'];setState('theme',o[(o.indexOf(st.theme)+1)%3]);},
 gfdays(a,fid){GF.days=+a.dataset.v;gfUpdate($('#sc-geo'));},
 gfgo(a){const g=GF;if(a.getAttribute('aria-disabled')==='true')return;const rk=gfRisk();
   g.toast=rk===1?t(`ব্যাসার্ধ ${g.m} মি প্রয়োগ হয়েছে। ফোন পরের সিঙ্কে পাবে।`,`Radius ${g.m} m applied. Phones get it at their next sync.`):t('অনুরোধ #123 জমা হয়েছে, অনুমোদনের অপেক্ষায়','Request #123 submitted, waiting for approval');
   if(rk===1)g.cur=g.m;g.why='';$('#gf-why').value='';gfUpdate($('#sc-geo'));clearTimeout(g._t);g._t=setTimeout(()=>{g.toast='';gfUpdate($('#sc-geo'));},4200);}
});
document.addEventListener('input',e=>{
  const el=$('#sc-geo');if(!el||!el.contains(e.target))return;
  if(e.target.id==='gf-rng'){GF.m=mFromPos(+e.target.value);GF.bad=false;gfUpdate(el);}
  else if(e.target.id==='gf-why'){GF.why=e.target.value;gfUpdate(el);}
  else if(e.target.id==='gf-num'){const v=parseInt(asc(e.target.value).replace(/[^\d]/g,''),10);if(v>=20&&v<=2000){GF.m=v;GF.bad=false;}else GF.bad=true;gfUpdate(el);}
});
document.addEventListener('change',e=>{
  const el=$('#sc-geo');if(!el||!el.contains(e.target))return;
  if(e.target.id==='gf-level'){GF.level=e.target.value;gfUpdate(el);}
  if(e.target.id==='gf-num'){gfUpdate(el);}
});


/* ===================== init ===================== */
function build(){
  $('#phones').innerHTML=FR.filter(f=>f.kind==='phone').map(phoneShell).join('');
  $('#desk').innerHTML=FR.filter(f=>f.kind==='web').map(webShell).join('');
}
(function init(){
  try{const mq=m=>matchMedia(m).matches;if(mq('(prefers-contrast: more)'))st.theme='sunlight';else if(mq('(prefers-color-scheme: dark)'))st.theme='dark';if(mq('(prefers-reduced-transparency: reduce)'))st.tier='C';
    const q=new URLSearchParams(location.search),p=JSON.parse(store.get('aron.prev')||'null');
    if(p)Object.assign(st,{theme:p.theme||st.theme,tier:p.tier||st.tier,fs:p.fs||st.fs,lang:p.lang||st.lang,off:!!p.off,h:p.h||st.h,pri:p.pri||st.pri,wt:p.wt||st.wt});
    ['theme','tier','fs','lang','h','pri','wt','state'].forEach(k=>{if(q.has(k))st[k]=q.get(k);});if(q.has('offline'))st.off=q.get('offline')==='1';
    if(!['light','dark','sunlight'].includes(st.theme))st.theme='light';if(!['A','B','C'].includes(st.tier))st.tier='B';
    if(!['100','130','150','200'].includes(String(st.fs)))st.fs='100';st.fs=String(st.fs);if(!['bn','en'].includes(st.lang))st.lang='bn';
    if(!['800','640'].includes(String(st.h)))st.h='800';st.h=String(st.h);if(!['deep','bright'].includes(st.pri))st.pri='deep';if(!['700','600'].includes(String(st.wt)))st.wt='700';st.wt=String(st.wt);
    if(!STATES.includes(st.state))st.state='normal';
  }catch(e){}
  build();apply();drawAll();
  /* header collapse (Home) and filter dock hide on scroll down (Sale, Stock): translation only, read in the scroll handler, not in composition */
  $$('.screen').forEach(sc=>{const s=$('.scroller',sc);let on=false,last=0;s.addEventListener('scroll',()=>{const y=s.scrollTop;if(!on&&y>32){on=true;sc.setAttribute('data-scrolled','')}else if(on&&y<8){on=false;sc.removeAttribute('data-scrolled')}
    if(y>last+6&&y>80)sc.setAttribute('data-dockhide','');else if(y<last-6||y<40)sc.removeAttribute('data-dockhide');last=y;},{passive:true});});
  fitAll();post();addEventListener('resize',()=>{clearTimeout(window._rz);window._rz=setTimeout(()=>{fitAll();post();},60);});
  if(document.fonts&&document.fonts.ready)document.fonts.ready.then(()=>{post();fitAll();});
  setTimeout(()=>$$('.fx').forEach(f=>f.classList.remove('in')),600);
})();
</script>
