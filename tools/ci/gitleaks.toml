# gitleaks configuration for CI (tools/ci/, ci.yml gates job). Owner: infra lane.
# Default rules, plus ONE path exception: contract/slices/ is generated by tools/slice-contract.py from
# contract/openapi.yaml (which IS scanned, with its reviewed example values pinned by fingerprint in
# tools/ci/gitleaksignore). Re-scanning the generated copy would re-flag the same examples with a new fingerprint on
# every regeneration. Nothing else is excluded.
title = "aron"

[extend]
useDefault = true

[[allowlists]]
description = "generated copy of contract/openapi.yaml (scanned at its source)"
paths = ["""^contract/slices/"""]
