# Weekly dependency PRs, small and grouped. The stack is pinned by docs/24 s13 (Gradle, Kotlin, AGP, Ktor, Compose BOM,
# Room, ...): the lead reviews each update; a pinned major is never merged without a spec change.
version: 2
updates:
  - package-ecosystem: gradle
    directory: "/"
    schedule: { interval: weekly, day: monday, time: "03:00", timezone: Asia/Dhaka }
    open-pull-requests-limit: 5
    groups: { gradle-minor-patch: { update-types: [minor, patch] } }
  - package-ecosystem: npm
    directory: "/web"
    schedule: { interval: weekly, day: monday, time: "03:00", timezone: Asia/Dhaka }
    open-pull-requests-limit: 5
    groups: { npm-minor-patch: { update-types: [minor, patch] } }
  - package-ecosystem: github-actions
    directory: "/"
    schedule: { interval: weekly, day: monday, time: "03:00", timezone: Asia/Dhaka }
    open-pull-requests-limit: 5
  - package-ecosystem: docker
    directory: "/infra/docker"
    schedule: { interval: weekly, day: monday, time: "03:00", timezone: Asia/Dhaka }
    open-pull-requests-limit: 3
