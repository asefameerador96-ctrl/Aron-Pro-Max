# CodeQL static analysis (docs/30 s3, docs/31 s2): Kotlin (shared, backend and the three Android apps with every module
# they include) and JavaScript/TypeScript (web/). Results go to GitHub > Security > Code scanning. Owner: infra lane.
#
# Separate from ci.yml so the 15-minute CI budget and the dev deploy never wait on it; pull requests to main and
# nightly (new queries find old code). gitleaks and the other ci.yml gates stay the primary checks (lead, 2026-10-07).
# Kotlin needs a real compile while CodeQL watches: no Gradle build cache, no daemon, the Kotlin compiler in-process.
# Push runs are never cancelled (same rule as ci.yml); a pull request cancels its own older run.
# Actions are pinned by commit SHA (release tag in the comment), resolved with `git ls-remote` on 2026-10-07.

name: codeql

on:
  # Lead decision 2026-10-07: pull requests to main (the daily gate PR) and nightly, never on a push.
  pull_request:
    branches: [main]
  schedule:
    - cron: "17 21 * * *" # 21:17 UTC = 03:17 Asia/Dhaka, nightly
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: codeql-${{ github.event_name == 'pull_request' && github.ref || format('{0}-{1}', github.ref, github.sha) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # CodeQL needs GitHub Advanced Security on a private repository (private since 2026-10-24, docs/30 s3a), so it is
  # skipped while the repository is private and runs again unchanged once it is public. A scheduled run has no event
  # payload (no repository object, and the github context has no visibility field), so the visibility is read from the
  # API here: a guard on the event's repository.private would let every nightly run through.
  # If Advanced Security is enabled on the private repository, remove this job and the guard below.
  visibility:
    name: Repository visibility (CodeQL runs only on a public repository)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      private: ${{ steps.repo.outputs.private }}
    steps:
      - id: repo
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          private="$(gh api "repos/${GITHUB_REPOSITORY}" --jq '.private')"
          case "${private}" in
            true|false) ;;
            *) echo "::error::could not read the repository visibility (got '${private}')"; exit 1 ;;
          esac
          echo "private=${private}" >> "${GITHUB_OUTPUT}"
          [ "${private}" = false ] || echo "::notice::private repository: CodeQL skipped (needs GitHub Advanced Security; docs/30 s3a)"

  analyze:
    name: CodeQL ${{ matrix.language }}
    needs: visibility
    # Skipped on the private repository (see the visibility job).
    if: ${{ needs.visibility.outputs.private == 'false' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
      actions: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: java-kotlin
            build-mode: manual
          - language: javascript-typescript
            build-mode: none
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Point ANDROID_HOME at a cacheable SDK in the runner temp folder
        if: matrix.language == 'java-kotlin'
        run: |
          echo "ANDROID_HOME=${RUNNER_TEMP}/android-sdk" >> "${GITHUB_ENV}"
          echo "ANDROID_SDK_ROOT=${RUNNER_TEMP}/android-sdk" >> "${GITHUB_ENV}"
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        if: matrix.language == 'java-kotlin'
        with:
          distribution: temurin
          java-version: "21"
      - name: Cache the Android SDK
        if: matrix.language == 'java-kotlin'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/android-sdk
          key: android-sdk-${{ runner.os }}-${{ hashFiles('tools/android-sdk.sh') }}
      - name: Install Android SDK packages
        if: matrix.language == 'java-kotlin'
        run: tools/android-sdk.sh
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        if: matrix.language == 'java-kotlin'
        with:
          # Dependencies may come from the cache; compiled classes must not (CodeQL only sees what is compiled).
          cache-read-only: true
      - name: Initialise CodeQL
        uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          queries: security-extended
      - name: Compile all Kotlin under CodeQL (no build cache, no daemon, compiler in-process)
        if: matrix.language == 'java-kotlin'
        run: >-
          ./gradlew --console=plain --no-daemon --no-build-cache --no-configuration-cache
          -Pkotlin.compiler.execution.strategy=in-process -Pkotlin.incremental=false
          compileKotlinJvm classes
          :android:app-sr:compileDebugKotlin :android:app-amo:compileDebugKotlin :android:app-tso:compileDebugKotlin
      - name: Analyse
        uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          category: /language:${{ matrix.language }}
