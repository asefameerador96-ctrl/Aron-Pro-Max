# Read-only cost reading of the dev resource group (infra/scripts/cost-report.sh): month-to-date cost per day and per
# resource from Azure's cost data, for the owner's reviews (docs/28). Changes nothing in Azure. Owner: infra lane.
# Manual, plus every morning at 08:05 Asia/Dhaka (02:05 UTC). The result is in the run summary.
# Actions are pinned by commit SHA (release tag in the comment).

name: cost-report

on:
  workflow_dispatch:
  schedule:
    - cron: "5 2 * * *"

permissions:
  contents: read
  id-token: write

jobs:
  cost:
    name: Cost reading of the dev resource group
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: azure-dev
    env:
      AZURE_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Sign in to Azure (OIDC, no client secret)
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Cost reading (read-only)
        run: infra/scripts/cost-report.sh "${AZURE_RESOURCE_GROUP}"
