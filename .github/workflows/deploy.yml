# Deploy Aron to Azure (docs/23 s6, docs/24 s6 and s13.6). Owner: infra lane. Order and reasons: infra/README.md.
#
# Triggers
#   - workflow_run: after a SUCCESSFUL ci run of a push to the integration branch, deploying exactly the commit that
#     run tested (nothing untested is deployed; pull requests never deploy);
#   - workflow_call from promote-prod (prod, final account only);
#   - manual dispatch, from the integration branch only.
# The GitHub environment azure-dev additionally allows deployments from the integration branch only
# (infra/bootstrap-azure.ps1), so editing this file on another branch does not reach Azure.
#
# All deploy logic lives in infra/deploy.sh (the same one command a person runs); this file signs in, proves the
# identity's scope, and calls it. Its concurrency group only queues deploys (ci runs are never touched). deploy.sh waits for
# a running deployment instead and never replaces a deployed commit by one of its ancestors.
#
# Needs (created by infra/bootstrap-azure.ps1): secrets AZURE_CLIENT_ID, AZURE_TENANT_ID, AZURE_SUBSCRIPTION_ID;
# variables AZURE_RESOURCE_GROUP, AZURE_LOCATION, ARON_ALERT_EMAILS. Optional: variables ARON_BUDGET_AMOUNT,
# ARON_NAME_SUFFIX; secrets FCM_SERVICE_ACCOUNT_JSON, MAPS_WEB_KEY.
# Actions are pinned by commit SHA (tag in the comment), resolved with `git ls-remote` on 2026-10-05.

name: deploy

on:
  # After a green ci run of a push to the integration branch (a separate workflow, so a cancelled ci run never stops a
  # deploy that has started).
  workflow_run:
    workflows: [ci]
    types: [completed]
    branches: [claude/wonderful-thompson-k6ejnf]
  workflow_call:
    inputs:
      environment:
        type: string
        default: dev
      # Declared here too: a called workflow sees the CALLER's event (promote-prod is a workflow_dispatch), so an
      # undeclared input would read as null and switch the migrations off.
      run_migrations:
        type: boolean
        default: true
  workflow_dispatch:
    inputs:
      environment:
        description: Profile (infra/params/<profile>*.bicepparam); dev = rehearsal (existing resources), dev-lite = cheap TEST profile. prod is not offered until the final account exists (it deploys only through promote-prod.yml).
        type: choice
        options: [dev, dev-lite]
        default: dev
      run_migrations:
        description: Run the database migrations job before the apps (untick only to redeploy apps without a migration)
        type: boolean
        default: true
      force_infra:
        description: Run main.bicep even when infra/ is unchanged since the deployed commit
        type: boolean
        default: false
      rollback_sha:
        description: ROLLBACK - full commit id of an earlier integration-branch commit whose image is redeployed (no build, no migrations; docs/runbooks/rollback-bad-deploy.md). Empty = normal deploy.
        type: string
        default: ""

permissions:
  contents: read
  id-token: write

env:
  INTEGRATION_BRANCH: claude/wonderful-thompson-k6ejnf

jobs:
  deploy:
    name: Deploy to ${{ inputs.environment || 'dev' }}
    if: github.event_name != 'workflow_run' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    # One deploy per environment at a time, never cancelled mid-flight; GitHub keeps one pending run and a newer one
    # replaces it, so after a burst of pushes only the newest green head deploys. The group sits on the JOB (CI audit
    # 2026-10-07 s5 item 5): a run whose `if` is false (a red or pull-request ci run) never enters it, so it can no
    # longer replace a waiting green deploy. A rollback has its own group. deploy.sh also holds an Azure-side lock and
    # skips an ancestor of the live commit or a commit with nothing deployable changed.
    concurrency:
      group: deploy-${{ inputs.environment || 'dev' }}${{ (github.event_name == 'workflow_dispatch' && inputs.rollback_sha != '') && '-rollback' || '' }}
      cancel-in-progress: false
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    environment: ${{ (inputs.environment || 'dev') == 'prod' && 'azure-prod' || 'azure-dev' }}
    env:
      ENV_NAME: ${{ inputs.environment || 'dev' }}
      AZURE_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
      AZURE_LOCATION: ${{ vars.AZURE_LOCATION }}
      ARON_ALERT_EMAILS: ${{ vars.ARON_ALERT_EMAILS }}
      ARON_BUDGET_AMOUNT: ${{ vars.ARON_BUDGET_AMOUNT }}
      ARON_NAME_SUFFIX: ${{ vars.ARON_NAME_SUFFIX }}
      # Dev seed + SR slice smoke (deploy script): only on dev profiles, only when this variable is true.
      ARON_DEV_SEED: ${{ vars.ARON_DEV_SEED }}
      # Migrations run unless a person unticks run_migrations on a manual dispatch. Under workflow_run the inputs are
      # null, and null == false is TRUE in GitHub expressions, so the event is tested first.
      RUN_MIGRATIONS: ${{ (github.event_name == 'workflow_dispatch' && inputs.run_migrations == false) && 'false' || 'true' }}
      FORCE_INFRA: ${{ inputs.force_infra && 'true' || 'false' }}
      # Only a manual dispatch can roll back (under workflow_run and workflow_call the input is null or absent).
      ROLLBACK_SHA: ${{ github.event_name == 'workflow_dispatch' && inputs.rollback_sha || '' }}
      # "HH:MM-HH:MM" Asia/Dhaka: no deploy while reps sell; unset until real users exist (rollbacks always allowed).
      ARON_DEPLOY_FREEZE_DHAKA: ${{ vars.ARON_DEPLOY_FREEZE_DHAKA }}
    steps:
      - name: Deploy only from the integration branch (prod only from a server-v* release tag)
        env:
          REF: ${{ github.ref }}
          FINAL: ${{ vars.ARON_FINAL_ACCOUNT }}
        run: |
          # docs/30 s2: dev and dev-lite come from the integration branch; prod only from a release tag on main, through
          # promote-prod.yml (the azure-prod environment adds the required approver).
          if [ "${ENV_NAME}" = prod ]; then
            # prod only in the final account and only through promote-prod (its checks: tag on main, CI green, staging
            # soak). In a called workflow GITHUB_WORKFLOW is the caller's name.
            [ "${FINAL}" = "true" ] || { echo "::error::no prod before the final account exists (ARON_FINAL_ACCOUNT, docs/28)"; exit 1; }
            [ "${GITHUB_WORKFLOW}" = promote-prod ] || { echo "::error::prod deploys only through promote-prod.yml, not ${GITHUB_WORKFLOW}"; exit 1; }
            case "${REF}" in
              refs/tags/server-v[0-9]*) echo "prod release ${REF#refs/tags/}" ;;
              *) echo "::error::prod deploys only from a server-vX.Y.Z release tag through promote-prod.yml; this run is on ${REF}."; exit 1 ;;
            esac
          elif [ "${REF}" != "refs/heads/${INTEGRATION_BRANCH}" ]; then
            echo "::error::Deploys run only from ${INTEGRATION_BRANCH}; this run is on ${REF}."
            exit 1
          fi

      - name: Check the Azure secrets and variables exist
        env:
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
        run: |
          missing=""
          for v in AZURE_CLIENT_ID AZURE_TENANT_ID AZURE_SUBSCRIPTION_ID; do
            [ -n "${!v}" ] || missing="${missing} secret:${v}"
          done
          for v in AZURE_RESOURCE_GROUP AZURE_LOCATION ARON_ALERT_EMAILS; do
            [ -n "${!v}" ] || missing="${missing} variable:${v}"
          done
          if [ -n "${missing}" ]; then
            echo "::error title=Azure is not set up for this repository::Missing:${missing}. Run infra/bootstrap-azure.ps1 once with -AlertEmails (it creates the AZURE_* secrets and the variables), or set ARON_ALERT_EMAILS under Settings > Secrets and variables > Actions > Variables. See infra/README.md, 'Sponsor steps'."
            exit 1
          fi
          echo "Azure settings present: group ${AZURE_RESOURCE_GROUP}, region ${AZURE_LOCATION}"

      # The job runs only for a green ci run of a PUSH to the integration branch (job condition above), never for a
      # pull request, so the checked-out commit is already on the branch.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 nosemgrep: workflow-run-target-code-checkout
        with:
          fetch-depth: 0
          # The commit the green ci run tested (workflow_run runs on the branch tip otherwise).
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      - name: Sign in to Azure (OIDC, no client secret)
        id: login
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Explain a failed sign-in
        if: failure() && steps.login.outcome == 'failure'
        run: |
          echo "::error title=Azure sign-in (OIDC) failed::Usually the identity's federated credential does not match the subject GitHub presents (shown above as 'subject claim'). Re-run infra/bootstrap-azure.ps1 on the laptop: it trusts both the classic and the ID-qualified subject of the azure-dev environment. See infra/README.md, 'Sponsor steps'."
          exit 1

      - name: Azure CLI settings
        run: |
          az config set extension.use_dynamic_install=yes_without_prompt core.only_show_errors=true
          az bicep install
          az version -o tsv

      - name: Scope check (rights on the resource group only)
        run: infra/scripts/scope-check.sh "${AZURE_RESOURCE_GROUP}"

      - name: Deploy (infra/deploy.sh)
        env:
          GIT_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
          FCM_SERVICE_ACCOUNT_JSON: ${{ secrets.FCM_SERVICE_ACCOUNT_JSON }}
          MAPS_WEB_KEY: ${{ secrets.MAPS_WEB_KEY }}
        run: infra/deploy.sh "${ENV_NAME}"
