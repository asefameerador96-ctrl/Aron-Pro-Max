# Read-only diagnostics of the dev rehearsal environment (D-OPS-DIAGNOSE-01): infra/scripts/diagnose.sh prints the
# PostgreSQL server state, metrics, parameters and server-log excerpts, the migrate job's and worker's console and
# system logs and the API container app's console and system log from Log Analytics (ERROR/WARN and start-up lines, capped,
# newest first), the migrate job's pre-flight lines, and the worker app's state for a UTC window. It changes nothing in Azure.
#
# Manual only, integration branch only (the GitHub environment azure-dev deploys from that branch only), environment
# azure-dev with the deploy identity (OIDC). The output goes to the job log of a public repository: the script prints
# metadata, metrics and log excerpts only, never a secret, connection string or Key Vault value, and drops DETAIL and
# parameter lines from server logs. DEFAULT-DENY FOR FREE TEXT: unless the input include_messages is true, every log query projects
# only named structured columns (time, level, logger, exception class, SQLSTATE, duration, a fixed kind label, platform reason) and
# never message or exception text; with include_messages the text is added behind the redactor and a strict line check. Messages
# are off by default in a public log. Actions are pinned by commit SHA (release tag in the comment).

name: ops-diagnose

on:
  workflow_dispatch:
    inputs:
      since:
        description: Window start, UTC (e.g. 2026-11-05T09:40:00Z); empty = 3 hours ago
        type: string
        default: ""
      until:
        description: Window end, UTC; empty = now
        type: string
        default: ""
      job_prefix:
        description: Container Apps job execution prefix to read console logs for
        type: string
        default: caj-aron-dev-migrate
      worker_app:
        description: The worker container app to describe
        type: string
        default: ca-aron-dev-worker
      api_app:
        description: The API container app to read console and system logs for
        type: string
        default: ca-aron-dev-api
      include_messages:
        description: Also print log message text (redacted, strict line check). OFF by default, because this is a public repository; off prints only structured columns.
        type: boolean
        default: false

permissions:
  contents: read
  id-token: write

concurrency:
  group: ops-diagnose
  cancel-in-progress: false

jobs:
  diagnose:
    name: Diagnose dev (read-only)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: azure-dev
    env:
      AZURE_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
      SINCE: ${{ inputs.since }}
      UNTIL: ${{ inputs.until }}
      JOB_PREFIX: ${{ inputs.job_prefix }}
      WORKER_APP: ${{ inputs.worker_app }}
      API_APP: ${{ inputs.api_app }}
      INCLUDE_MESSAGES: ${{ inputs.include_messages }}
    steps:
      - name: Branch
        run: |
          [ "${GITHUB_REF}" = "refs/heads/claude/wonderful-thompson-k6ejnf" ] || { echo "::error::integration branch only"; exit 1; }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Validate the inputs (fixed patterns, before anything is queried)
        run: |
          ok_ts='^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}Z$'; ok_name='^[a-z0-9][a-z0-9-]{0,62}$'
          [ -z "$SINCE" ] || [[ "$SINCE" =~ $ok_ts ]] || { echo "::error::since must be like 2026-11-05T09:40:00Z"; exit 1; }
          [ -z "$UNTIL" ] || [[ "$UNTIL" =~ $ok_ts ]] || { echo "::error::until must be like 2026-11-05T09:40:00Z"; exit 1; }
          [[ "$INCLUDE_MESSAGES" =~ ^(true|false)$ ]] || { echo "::error::include_messages must be true or false"; exit 1; }
          for v in "$JOB_PREFIX" "$WORKER_APP" "$API_APP"; do [[ "$v" =~ $ok_name ]] || { echo "::error::an app or job name has characters outside a-z 0-9 -"; exit 1; }; done
      - name: Sign in to Azure (OIDC, no client secret)
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Azure CLI settings
        run: az config set extension.use_dynamic_install=yes_without_prompt core.only_show_errors=true
      - name: Diagnose (infra/scripts/diagnose.sh)
        shell: bash
        run: |
          set -o pipefail
          since="${SINCE:-$(date -u -d '3 hours ago' +%Y-%m-%dT%H:%M:%SZ)}"
          until="${UNTIL:-$(date -u +%Y-%m-%dT%H:%M:%SZ)}"
          echo "window ${since} .. ${until}; job prefix ${JOB_PREFIX}; worker ${WORKER_APP}; api ${API_APP}; include_messages ${INCLUDE_MESSAGES}"
          infra/scripts/diagnose.sh "$since" "$until" "$JOB_PREFIX" "$WORKER_APP" "$API_APP" "$INCLUDE_MESSAGES" | tee diagnose.txt
          { echo '## ops-diagnose'; echo; echo "window ${since} .. ${until}"; echo; echo '```'; head -c 60000 diagnose.txt | iconv -c -f UTF-8 -t UTF-8; echo; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          # The script ends with this line, written through its output filter: if the filter ever died, or the script stopped early, the step is RED, not green.
          grep -q '^diagnose: done (read-only)$' diagnose.txt || { echo '::error::diagnose.sh did not reach its final line (output filter or script stopped early)'; exit 1; }
