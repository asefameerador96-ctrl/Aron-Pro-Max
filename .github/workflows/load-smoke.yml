name: Load smoke (k6, pilot size)

# SCALE-01: the k6 smoke of the morning login and evening submit storms at pilot size against dev (TEST account).
# Manual: the owner (or the lead) dispatches it; it never runs on a push (docs/28: no fleet-sized load in TEST).
on:
  workflow_dispatch:
    inputs:
      vus:
        description: 'Virtual users (pilot size: at most 10)'
        default: '5'
        required: false
      evening_batches:
        description: 'Batches of 200 rows per VU in the evening storm'
        default: '2'
        required: false

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install k6
        run: |
          set -euo pipefail
          sudo gpg -k
          sudo gpg --no-default-keyring --keyring /usr/share/keyrings/k6-archive-keyring.gpg --keyserver hkp://keyserver.ubuntu.com:80 --recv-keys C5AD17C747E3415A3642D57D77C6C491D6AC1D69
          echo "deb [signed-by=/usr/share/keyrings/k6-archive-keyring.gpg] https://dl.k6.io/deb stable main" | sudo tee /etc/apt/sources.list.d/k6.list
          sudo apt-get update -q && sudo apt-get install -y k6
      - name: Run the smoke against dev
        env:
          BASE_URL: ${{ secrets.LOAD_BASE_URL }}
          USERS: ${{ secrets.LOAD_USERS }}
          PASSWORD: ${{ secrets.LOAD_PASSWORD }}
        run: |
          set -euo pipefail
          [ -n "$BASE_URL" ] || { echo "::error::LOAD_BASE_URL secret is not set"; exit 1; }
          k6 run -e BASE_URL="$BASE_URL" -e USERS="$USERS" -e PASSWORD="$PASSWORD" -e VUS="${{ inputs.vus }}" -e EVENING_BATCHES="${{ inputs.evening_batches }}" tools/load/smoke.js
      - name: Upload the summary
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: load-smoke-summary
          path: tools/load/last-run.md
          if-no-files-found: ignore
