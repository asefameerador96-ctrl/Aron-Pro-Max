# What-if only (D-FINAL-INFRA-09): the owner can run this after the bootstrap of an environment, and it CHANGES NOTHING.
# It signs in as that environment's deploy identity (OIDC) and asks Azure what `main.bicep`
# with the profile's parameter file would do to the resource group: `az deployment group what-if` is a read; no deployment,
# no secret, no image, no migration, no tag, no lock. The what-if guard then prints any change a real deploy would refuse
# (a PostgreSQL server replaced or reconfigured, a second server). The output goes to the job log of a public repository:
# resource types, names and changed property paths only.
#
# Manual only. dev and dev-lite from the integration branch; stage and stage-lite only in the final account
# (ARON_FINAL_ACCOUNT=true), from main, and only when the GitHub environment exists with a required reviewer
# (infra/scripts/final-account-guard.sh). prod is NOT offered: azure-prod admits server-v* tags only and its identity is the deployer;
# the prod what-if runs from the laptop (`AZURE_RESOURCE_GROUP=rg-aron-prod ARON_ENV=prod infra/validate.sh` with the owner's az sign-in).
# The preview omits what deploy.sh prepares from live state: the PostgreSQL live zones (a failed-over server shows as a zone change the
# real deploy would not make), the read-replica gate (the replica shows as a create even before the first backup) and the budget start
# date. It never calls scope-check.sh: that probe CREATES things (a test deployment, a resource group attempt), a what-if must not.
# Actions are pinned by commit SHA (release tag in the comment).

name: whatif

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Profile (infra/params/<profile>.bicepparam)
        type: choice
        options: [dev, dev-lite, stage, stage-lite]
        default: stage

permissions:
  contents: read
  id-token: write
  actions: read

jobs:
  whatif:
    name: What-if ${{ inputs.environment }} (changes nothing)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    concurrency:
      group: whatif-${{ inputs.environment }}
      cancel-in-progress: false
    environment: ${{ startsWith(inputs.environment, 'stage') && 'azure-stage' || 'azure-dev' }}
    env:
      PROFILE: ${{ inputs.environment }}
      AZURE_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
      AZURE_LOCATION: ${{ vars.AZURE_LOCATION }}
      ARON_ALERT_EMAILS: ${{ vars.ARON_ALERT_EMAILS }}
      ARON_BUDGET_AMOUNT: ${{ vars.ARON_BUDGET_AMOUNT }}
      ARON_NAME_SUFFIX: ${{ vars.ARON_NAME_SUFFIX }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Where this profile may run (final account, branch, protected environment)
        env:
          GH_TOKEN: ${{ github.token }}
          ARON_FINAL_ACCOUNT: ${{ vars.ARON_FINAL_ACCOUNT }}
        run: infra/scripts/final-account-guard.sh "${PROFILE}"
      - name: Check the Azure secrets and variables exist
        env:
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
        run: |
          missing=""
          for v in AZURE_CLIENT_ID AZURE_TENANT_ID AZURE_SUBSCRIPTION_ID; do
            [ -n "${!v}" ] || missing="${missing} secret:${v}"
          done
          for v in AZURE_RESOURCE_GROUP AZURE_LOCATION ARON_ALERT_EMAILS; do
            [ -n "${!v}" ] || missing="${missing} variable:${v}"
          done
          if [ -n "${missing}" ]; then
            echo "::error title=Azure is not set up for this environment::Missing:${missing}. Run infra/bootstrap-azure.ps1 for it (docs/setup/move-to-final-account.md)."
            exit 1
          fi
      - name: Sign in to Azure (OIDC, no client secret)
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Azure CLI settings
        run: |
          az config set extension.use_dynamic_install=yes_without_prompt core.only_show_errors=true
          az bicep install
      - name: What-if of main.bicep (read only)
        run: |
          set -euo pipefail
          # A throwaway value satisfies the password's minLength; a what-if never sends or stores it.
          export ARON_DB_ADMIN_PASSWORD="whatif-only-not-a-secret-0000"
          az deployment group what-if -g "${AZURE_RESOURCE_GROUP}" --template-file infra/main.bicep \
            --parameters "infra/params/${PROFILE}.bicepparam" --no-pretty-print -o json > whatif.json
          existing="$(az postgres flexible-server list -g "${AZURE_RESOURCE_GROUP}" --query "[].id" -o tsv | tr '\n' ' ')"
          rc=0
          ARON_ALLOW_REPLICA="$([[ "${PROFILE}" == stage* ]] && echo true || echo false)" \
          EXISTING_POSTGRES_IDS="${existing}" infra/scripts/whatif-guard.py whatif.json | tee whatif.txt || rc=$?
          {
            echo "## what-if ${PROFILE} (nothing was changed)"; echo "Omits what deploy.sh prepares from live state: PostgreSQL live zones, the read-replica gate, the budget start date."; echo
            echo '```'; head -c 60000 whatif.txt; echo; echo '```'
            [ "${rc}" -eq 0 ] && echo "The what-if guard accepts these changes." || echo "**The what-if guard REFUSES a change above; a real deploy would stop.**"
          } >> "${GITHUB_STEP_SUMMARY}"
          exit "${rc}"
