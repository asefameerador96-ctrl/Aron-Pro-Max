# Android release (docs/30 s2 step 5, N-064): an `app-vX.Y.Z` tag builds the SR, AMO and TSO release APKs against the
# FINAL API host, signs them with the release key (GitHub secrets only, docs/24 s13.6, D24-49), checks the size
# budget, and publishes a GitHub Release with the APKs and their SHA-256. Owner: infra lane.
#
# INERT until the final account exists: without ARON_FINAL_ACCOUNT = true, a release API origin
# (ARON_PROD_API_BASE_URL, https) and the four ANDROID_SIGNING_* secrets, the run says what is missing and stops
# (green, nothing built or published). Test builds keep coming from ci.yml as debug APKs.
# Signing happens here with apksigner (the Gradle build stays unsigned, so the key never touches the build files).
# The draft release in the admin portal for the rings (docs/30 s1) is created from this Release by the admin portal's
# release management (F-ADM-027); this workflow only publishes the files and their digests.
# Actions are pinned by commit SHA (release tag in the comment).

name: release-app

on:
  push:
    tags: ["app-v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-app-${{ github.event_name == 'pull_request' && github.ref || format('{0}-{1}', github.ref, github.sha) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  guard:
    name: Final account, release origin and signing key present
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      go: ${{ steps.check.outputs.go }}
    steps:
      - id: check
        env:
          FINAL: ${{ vars.ARON_FINAL_ACCOUNT }}
          API: ${{ vars.ARON_PROD_API_BASE_URL }}
          KS: ${{ secrets.ANDROID_SIGNING_KEYSTORE_BASE64 }}
          KSP: ${{ secrets.ANDROID_SIGNING_KEYSTORE_PASSWORD }}
          ALIAS: ${{ secrets.ANDROID_SIGNING_KEY_ALIAS }}
          KP: ${{ secrets.ANDROID_SIGNING_KEY_PASSWORD }}
          REF: ${{ github.ref }}
        run: |
          missing=""
          [ "${FINAL}" = "true" ] || missing="${missing} variable:ARON_FINAL_ACCOUNT=true"
          [[ "${API}" =~ ^https://[A-Za-z0-9.-]+$ ]] || missing="${missing} variable:ARON_PROD_API_BASE_URL(https origin)"
          for v in KS KSP ALIAS KP; do [ -n "${!v}" ] || missing="${missing} secret:${v}"; done
          if [ -n "${missing}" ]; then
            echo "::notice title=release-app is inert::Not built or published. Missing:${missing} (docs/28, docs/30 s5)."
            echo "go=false" >> "${GITHUB_OUTPUT}"; exit 0
          fi
          [[ "${REF}" =~ ^refs/tags/app-v[0-9]+\.[0-9]+\.[0-9]+$ ]] \
            || { echo "::error::release from an app-vX.Y.Z tag only, not ${REF}"; exit 1; }
          echo "go=true" >> "${GITHUB_OUTPUT}"

  release:
    name: Signed release APKs and GitHub Release
    needs: guard
    if: needs.guard.outputs.go == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: write
    env:
      API: ${{ vars.ARON_PROD_API_BASE_URL }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Point ANDROID_HOME at a cacheable SDK in the runner temp folder
        run: |
          echo "ANDROID_HOME=${RUNNER_TEMP}/android-sdk" >> "${GITHUB_ENV}"
          echo "ANDROID_SDK_ROOT=${RUNNER_TEMP}/android-sdk" >> "${GITHUB_ENV}"
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "21"
      - name: Cache the Android SDK
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/android-sdk
          key: android-sdk-${{ runner.os }}-${{ hashFiles('tools/android-sdk.sh') }}
      - name: Install Android SDK packages
        run: tools/android-sdk.sh
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-read-only: true
      - name: Version from the tag (vX.Y.Z -> versionCode X*10000 + Y*100 + Z)
        run: |
          v="${GITHUB_REF_NAME#app-v}"; IFS=. read -r ma mi pa <<< "${v}"
          echo "VERSION_NAME=${v}" >> "${GITHUB_ENV}"
          echo "VERSION_CODE=$(( ma * 10000 + mi * 100 + pa ))" >> "${GITHUB_ENV}"
      - name: Write google-services.json from the secret (only when it is set)
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "${GOOGLE_SERVICES_JSON}" ]; then
            for app in app-sr app-amo app-tso; do printf '%s' "${GOOGLE_SERVICES_JSON}" > "android/${app}/google-services.json"; done
          fi
      - name: Build the three release APKs against the final API origin
        env:
          MAPS_ANDROID_KEY: ${{ secrets.MAPS_ANDROID_KEY }}
        run: >-
          ./gradlew --console=plain
          -Paron.apiBaseUrl="${API}" -Paron.versionName="${VERSION_NAME}" -Paron.versionCode="${VERSION_CODE}"
          :android:app-sr:assembleRelease :android:app-amo:assembleRelease :android:app-tso:assembleRelease
      - name: Remove google-services.json from the workspace
        if: always()
        run: rm -f android/app-sr/google-services.json android/app-amo/google-services.json android/app-tso/google-services.json
      - name: Sign, verify and digest (keystore only in the runner temp folder)
        env:
          KS: ${{ secrets.ANDROID_SIGNING_KEYSTORE_BASE64 }}
          KSP: ${{ secrets.ANDROID_SIGNING_KEYSTORE_PASSWORD }}
          ALIAS: ${{ secrets.ANDROID_SIGNING_KEY_ALIAS }}
          KP: ${{ secrets.ANDROID_SIGNING_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          ks="${RUNNER_TEMP}/release.jks"; trap 'rm -f "${ks}"' EXIT
          printf '%s' "${KS}" | base64 -d > "${ks}"
          signer="${ANDROID_HOME}/build-tools/36.0.0/apksigner"
          mkdir -p out
          for app in sr amo tso; do
            src="$(ls android/app-${app}/build/outputs/apk/release/*-release-unsigned.apk)"
            dst="out/aron-${app}-${VERSION_NAME}.apk"
            "${signer}" sign --ks "${ks}" --ks-pass env:KSP --ks-key-alias "${ALIAS}" --key-pass env:KP --out "${dst}" "${src}"
            "${signer}" verify --print-certs "${dst}" | grep -E "Signer #1 certificate SHA-256 digest" | sed "s/^/${app}: /"
          done
          (cd out && sha256sum ./*.apk > SHA256SUMS)
          cat out/SHA256SUMS
      - name: APK size gate
        run: python3 tools/ci/apk-size-gate.py "sr-release=out/aron-sr-${VERSION_NAME}.apk" "amo-release=out/aron-amo-${VERSION_NAME}.apk" "tso-release=out/aron-tso-${VERSION_NAME}.apk"
      - name: Publish the GitHub Release (notes from docs/releases/<tag>.md, Bangla and English)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes="docs/releases/${GITHUB_REF_NAME}.md"
          [ -f "${notes}" ] || { echo "::error::release notes ${notes} are missing (Bangla and English, docs/30 s3)"; exit 1; }
          gh release create "${GITHUB_REF_NAME}" out/*.apk out/SHA256SUMS --title "Aron apps ${VERSION_NAME}" --notes-file "${notes}" --verify-tag
