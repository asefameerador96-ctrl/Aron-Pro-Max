# Reset a resource group to its profile (docs/28): deletes ONLY the resources whose creation-time settings differ from
# infra/params/<environment>.bicepparam (PostgreSQL tier/storage/geo backup/network, the Container Apps environment's
# VNet, an unused Front Door, a storage account whose replication cannot be converted). Keeps Key Vault, logs, the
# registry, identities, alerts and the budget. See infra/scripts/reset-to-profile.sh. Owner: infra lane.
#
# Manual only, integration branch only, environment azure-dev. A dry run lists what would go. Deleting needs BOTH the
# profile dev-lite (the cheap TEST profile; the rehearsal profile dev keeps everything, docs/28 exception) AND the
# exact words "owner approved reset" in "confirm" (the owner decides; the lane never types them on its own).
# Actions are pinned by commit SHA (tag in the comment).

name: reset

on:
  workflow_dispatch:
    inputs:
      profile:
        description: Profile to reset to (infra/params/<profile>.bicepparam); only dev-lite can delete
        type: choice
        options: [dev-lite, dev]
        default: dev-lite
      confirm:
        description: Type exactly "owner approved reset" to DELETE the listed resources; anything else is a dry run
        type: string
        default: ""

permissions:
  contents: read
  id-token: write

env:
  INTEGRATION_BRANCH: claude/wonderful-thompson-k6ejnf

jobs:
  reset:
    name: Reset rg to the ${{ inputs.profile }} profile
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    environment: azure-dev
    env:
      AZURE_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
      PROFILE: ${{ inputs.profile }}
      CONFIRM_TEXT: ${{ inputs.confirm }}
    steps:
      - name: Integration branch only
        env:
          REF: ${{ github.ref }}
        run: |
          if [ "${REF}" != "refs/heads/${INTEGRATION_BRANCH}" ]; then
            echo "::error::Reset runs only from ${INTEGRATION_BRANCH}; this run is on ${REF}."
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Sign in to Azure (OIDC, no client secret)
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Azure CLI settings
        run: |
          az config set extension.use_dynamic_install=yes_without_prompt core.only_show_errors=true
          az bicep install
      - name: Scope check (rights on the resource group only)
        run: infra/scripts/scope-check.sh "${AZURE_RESOURCE_GROUP}"
      - name: Reset (dry run unless the owner approved it for dev-lite)
        run: |
          if [ "${CONFIRM_TEXT}" = "owner approved reset" ] && [ "${PROFILE}" = "dev-lite" ]; then
            echo "Owner-approved reset to ${PROFILE}: deleting the resources the profile cannot adopt."
            export CONFIRM="${AZURE_RESOURCE_GROUP}" OWNER_APPROVED=yes
          elif [ -n "${CONFIRM_TEXT}" ]; then
            echo "::warning::confirm text or profile does not allow deleting (needs profile dev-lite and exactly 'owner approved reset'): dry run only"
          fi
          infra/scripts/reset-to-profile.sh "${AZURE_RESOURCE_GROUP}" "${PROFILE}"
