# CI for the Aron monorepo (docs/24-build-spec.md s13.2). Owner: infra lane.
#
# Jobs: changed-area filter -> repository gates (gitleaks on the pushed commits; migration checksum, order and squawk
# lint; oasdiff breaking-change check on the contract: tools/ci/), contract lint, JVM build and tests (shared, db,
# backend on PostgreSQL 16), web (lint, types, unit tests, build, e2e), three debug APKs plus Android unit tests and
# lint, the SR release APK with the APK size gate (F-SYS-036), container images (built, booted against PostgreSQL,
# SBOM per image), infra validation (Bicep build/lint/checks, actionlint) -> on a push to the integration branch only,
# and only when all of those passed, the Azure deploy (deploy.yml, reusable workflow). CodeQL runs in codeql.yml.
# Budget: under 15 minutes wall time for a full run (docs/31 s2); the jobs run in parallel and path-filtered.
#
# Secrets (never committed; set them in GitHub > Settings > Secrets and variables > Actions, docs/24 s13.6):
#   MAPS_ANDROID_KEY          Google Maps SDK for Android key (AMO and TSO apps); manifest placeholder mapsApiKey
#   MAPS_WEB_KEY              Google Maps JavaScript API key for web/ (NEXT_PUBLIC_MAPS_WEB_KEY at next build)
#   GOOGLE_SERVICES_JSON      Firebase google-services.json content, written into android/app-{sr,amo,tso}/
#   FCM_SERVICE_ACCOUNT_JSON  Firebase service account for the backend FCM sender; copied to Key Vault by the deploy
#                             workflow (secret aron-fcm-service-account); never used by this workflow
# Every secret is optional here: without them the debug APKs still build (maps show no tiles, push is off).
# Actions are pinned by commit SHA (release tag in the comment), resolved with `git ls-remote` on 2026-10-05.

name: ci

on:
  push:
    branches: [main, "lane/**", "claude/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Six lanes push to the integration branch every few minutes: a push run is NEVER cancelled (grouped by branch AND
# commit, so every push gets its own complete run, even when the same commit lands on two branches). Only
# pull_request runs are grouped by ref and cancel their predecessor.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || format('{0}-{1}', github.ref, github.sha) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    # Cheap path filter without a third-party action: a docs-only push skips the JVM and Android builds.
    # Anything unknown (manual dispatch, a new branch, a force-push, a diff failure) runs everything.
    name: Detect changed areas
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      contract: ${{ steps.filter.outputs.contract }}
      jvm: ${{ steps.filter.outputs.jvm }}
      android: ${{ steps.filter.outputs.android }}
      web: ${{ steps.filter.outputs.web }}
      infra: ${{ steps.filter.outputs.infra }}
      deploy: ${{ steps.filter.outputs.deploy }}
      db: ${{ steps.filter.outputs.db }}
      base: ${{ steps.filter.outputs.base }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - id: filter
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          all() { printf 'contract=true\njvm=true\nandroid=true\nweb=true\ninfra=true\ndeploy=true\ndb=true\nbase=\n' >> "${GITHUB_OUTPUT}"; echo "running everything: $1"; exit 0; }
          case "${EVENT}" in
            pull_request) base="${PR_BASE}" ;;
            push) base="${BEFORE}" ;;
            *) all "event ${EVENT}" ;;
          esac
          if [ -z "${base}" ] || [ "${base}" = "0000000000000000000000000000000000000000" ]; then all "no base commit"; fi
          files="$(git diff --name-only "${base}" "${GITHUB_SHA}" 2>/dev/null)" || all "base ${base} not reachable"
          printf '%s\n' "${files}"
          # Files that can change any build: root Gradle, the version catalogue, the wrapper and this workflow.
          common='^(build\.gradle\.kts|settings\.gradle\.kts|gradle\.properties|gradlew|gradlew\.bat|gradle/|\.github/workflows/ci\.yml)'
          has() { printf '%s\n' "${files}" | grep -Eq "$1" && echo true || echo false; }
          {
            echo "contract=$(has '^(contract/|\.github/workflows/ci\.yml)')"
            # shared/contract's drift tests read docs/24-build-spec.md, so a spec edit re-runs them.
            echo "jvm=$(has "${common}|^(contract/|shared/|db/|backend/|docs/24-build-spec\.md)")"
            echo "android=$(has "${common}|^(contract/|shared/|android/|tools/android-sdk\.sh)")"
            echo "web=$(has '^(web/|contract/openapi\.yaml|\.github/workflows/ci\.yml)')"
            echo "infra=$(has '^(infra/|\.github/|tools/ci/)')"
            # What ends up in Azure: the backend image (shared, db, backend), the web image, the Bicep, the deploy.
            echo "deploy=$(has "${common}|^(shared/|db/|backend/|web/|infra/|\.github/workflows/deploy\.yml)")"
            echo "db=$(has '^(db/migrations/|tools/ci/)')"
            echo "base=${base}"
          } | tee -a "${GITHUB_OUTPUT}"

  gates:
    # Cheap repository gates (tools/ci/, pinned binaries with SHA-256): every push and pull request.
    name: Repository gates (secrets, migrations, contract)
    needs: changes
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      BEFORE: ${{ needs.changes.outputs.base }}
      INTEGRATION_BRANCH: claude/wonderful-thompson-k6ejnf
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Choose the comparison base
        # SCAN_RANGE: the pushed commits for gitleaks (BEFORE..SHA works even when BEFORE is not an ancestor).
        # CHECK_BASE: an ANCESTOR of this commit for the migration and contract gates: the merge-base with BEFORE,
        # else (first push of a branch, force-push, manual run) the merge-base with the integration branch, else
        # (a run on the integration branch tip itself) the parent commit.
        run: |
          range="" check=""
          if [ -n "${BEFORE}" ] && git cat-file -e "${BEFORE}^{commit}" 2>/dev/null; then
            range="${BEFORE}..${GITHUB_SHA}"
            check="$(git merge-base "${BEFORE}" "${GITHUB_SHA}" || true)"
          fi
          if [ -z "${check}" ] && git rev-parse -q --verify "origin/${INTEGRATION_BRANCH}" >/dev/null; then
            check="$(git merge-base "origin/${INTEGRATION_BRANCH}" "${GITHUB_SHA}" || true)"
          fi
          if [ -z "${check}" ] || [ "${check}" = "${GITHUB_SHA}" ]; then
            check="$(git rev-parse HEAD~1)"
            echo "::notice::no earlier base for this run; the migration and contract gates compare with the parent commit"
          fi
          echo "SCAN_RANGE=${range}" >> "${GITHUB_ENV}"
          echo "CHECK_BASE=${check}" >> "${GITHUB_ENV}"
          echo "gitleaks range: ${range:-whole history}; gate base: ${check}"
      - name: Install gitleaks, oasdiff and squawk (pinned, checksum-verified)
        run: |
          for t in gitleaks oasdiff squawk; do tools/ci/install-tool.sh "$t" "${RUNNER_TEMP}/bin"; done
          echo "${RUNNER_TEMP}/bin" >> "${GITHUB_PATH}"
      - name: Gate self-tests (each gate fails on a deliberate violation; tools/ci/test_gates.py)
        run: python3 tools/ci/test_gates.py
      - name: Secret scan of the pushed commits (gitleaks; reviewed exceptions in tools/ci/gitleaksignore)
        run: |
          # Known base: only the new commits. Unknown base (manual run, new branch): the whole history.
          range=()
          [ -n "${SCAN_RANGE}" ] && range=(--log-opts="${SCAN_RANGE}")
          gitleaks git --no-banner --redact --exit-code 1 --config tools/ci/gitleaks.toml \
            --gitleaks-ignore-path tools/ci/gitleaksignore "${range[@]}" .
      - name: Migrations (shipped ones unchanged, versions in order, squawk on the new ones)
        if: needs.changes.outputs.db == 'true'
        run: tools/ci/migrations-check.sh "${CHECK_BASE}" squawk
      - name: Contract breaking-change check (oasdiff)
        if: needs.changes.outputs.contract == 'true'
        run: tools/ci/contract-breaking.sh "${CHECK_BASE}" oasdiff

  contract:
    name: Contract lint
    needs: changes
    if: needs.changes.outputs.contract == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
      - name: Lint contract/openapi.yaml (Redocly, 0 errors and 0 warnings)
        run: npx --yes @redocly/cli@2 lint contract/openapi.yaml --config contract/redocly.yaml

  jvm:
    name: Shared, db and backend (build and tests)
    needs: changes
    if: needs.changes.outputs.jvm == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: aron_test
          POSTGRES_DB: aron_test
          # Throwaway service container reachable only from this job: trust auth, no password at all.
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U aron_test -d aron_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      ARON_TEST_PG_URL: jdbc:postgresql://localhost:5432/aron_test?user=aron_test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
      - name: Build and test shared, db and backend
        run: >-
          ./gradlew --console=plain
          :shared:contract:build :shared:rules:build :db:build
          :backend:platform:build :backend:auth:build :backend:sync:build :backend:masterdata:build
          :backend:config:build :backend:analytics:build :backend:notify:build :backend:media:build
          :backend:app:build
      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: jvm-test-reports
          path: |
            **/build/reports/tests/
            **/build/test-results/
          retention-days: 7

  android:
    name: Android debug APKs, unit tests and lint
    needs: changes
    if: needs.changes.outputs.android == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      MAPS_ANDROID_KEY: ${{ secrets.MAPS_ANDROID_KEY }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Point ANDROID_HOME at a cacheable SDK in the runner temp folder
        # The runner context is not available in job-level env, so the path is exported here.
        run: |
          echo "ANDROID_HOME=${RUNNER_TEMP}/android-sdk" >> "${GITHUB_ENV}"
          echo "ANDROID_SDK_ROOT=${RUNNER_TEMP}/android-sdk" >> "${GITHUB_ENV}"
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "21"
      - name: Cache the Android SDK
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/android-sdk
          key: android-sdk-${{ runner.os }}-${{ hashFiles('tools/android-sdk.sh') }}
      - name: Install Android SDK packages (same script as the dev box)
        run: tools/android-sdk.sh
      - name: Write google-services.json from the secret (only when it is set)
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "${GOOGLE_SERVICES_JSON}" ]; then
            for app in app-sr app-amo app-tso; do
              printf '%s' "${GOOGLE_SERVICES_JSON}" > "android/${app}/google-services.json"
            done
            echo "google-services.json written for the three apps"
          else
            echo "GOOGLE_SERVICES_JSON not set: building without Firebase (push disabled)"
          fi
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
      - name: Assemble the three debug APKs, run Android unit tests and lint
        run: >-
          ./gradlew --console=plain
          :android:app-sr:assembleDebug :android:app-amo:assembleDebug :android:app-tso:assembleDebug
          testDebugUnitTest lintDebug
      - name: Remove google-services.json from the workspace
        if: always()
        run: rm -f android/app-sr/google-services.json android/app-amo/google-services.json android/app-tso/google-services.json
      - name: Upload debug APKs (every successful Android run)
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: aron-debug-apks-${{ github.sha }}
          path: |
            android/app-sr/build/outputs/apk/debug/*.apk
            android/app-amo/build/outputs/apk/debug/*.apk
            android/app-tso/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
      - name: Upload Android test reports
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: android-test-reports
          path: |
            android/**/build/reports/tests/
            android/**/build/test-results/
          retention-days: 7

  android-release:
    # F-SYS-036 and the android-core request: the SR release build (R8, resource shrinking, https-only guard) must keep
    # building, and every release APK stays inside the size budget per ABI (tools/ci/apk-size-gate.py).
    name: SR release APK and APK size gate
    needs: changes
    if: needs.changes.outputs.android == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Point ANDROID_HOME at a cacheable SDK in the runner temp folder
        run: |
          echo "ANDROID_HOME=${RUNNER_TEMP}/android-sdk" >> "${GITHUB_ENV}"
          echo "ANDROID_SDK_ROOT=${RUNNER_TEMP}/android-sdk" >> "${GITHUB_ENV}"
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "21"
      - name: Cache the Android SDK
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/android-sdk
          key: android-sdk-${{ runner.os }}-${{ hashFiles('tools/android-sdk.sh') }}
      - name: Install Android SDK packages (same script as the dev box)
        run: tools/android-sdk.sh
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
      - name: Assemble the SR release APK (unsigned here; signing happens in release-app.yml)
        run: ./gradlew --console=plain :android:app-sr:assembleRelease
      - name: APK size gate (30 MB per ABI, installed 70 MB, warn +5 %, fail +15 % against the baseline)
        run: |
          apks=()
          for f in android/app-sr/build/outputs/apk/release/*.apk; do apks+=("sr-release=$f"); done
          [ "${#apks[@]}" -gt 0 ] || { echo "::error::no SR release APK was built"; exit 1; }
          python3 tools/ci/apk-size-gate.py "${apks[@]}"

  web:
    # docs/24 s13.2 web gate; steps from web/scripts/ci.sh (docs/requests/web-infra-ci-job.md).
    name: Web (lint, types, tests, build, e2e)
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: bash scripts/ci.sh install
      - name: Generated contract types are up to date
        run: bash scripts/ci.sh generate
      - run: bash scripts/ci.sh lint
      - run: bash scripts/ci.sh typecheck
      - run: bash scripts/ci.sh test
      - name: next build
        env:
          NEXT_PUBLIC_MAPS_WEB_KEY: ${{ secrets.MAPS_WEB_KEY }}
        run: bash scripts/ci.sh build
      - run: npx playwright install --with-deps chromium
      - run: bash scripts/ci.sh e2e
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: web-playwright-results
          path: web/test-results/
          if-no-files-found: ignore
          retention-days: 7

  images:
    # The deploy images, built and booted without Azure: migrate twice against PostgreSQL 16, api health and
    # readiness with the X-Aron-Api marker, worker stays up, web serves (infra/scripts/image-smoke.sh).
    name: Container images (build and runtime smoke)
    needs: changes
    if: needs.changes.outputs.deploy == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: aron_test
          POSTGRES_DB: aron_test
          # Throwaway service container reachable only from this job: trust auth, no password at all.
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U aron_test -d aron_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
      - name: Build the images and smoke-test the backend roles
        env:
          IMAGE_TAG: ${{ github.sha }}
        run: infra/scripts/image-smoke.sh
      - name: SBOM of the backend and web images (SPDX, syft pinned by checksum)
        env:
          TAG: ${{ github.sha }}
        run: |
          syft="$(tools/ci/install-tool.sh syft "${RUNNER_TEMP}/bin")"
          for img in aron-backend aron-web; do
            "${syft}" scan "docker:${img}:${TAG}" -o "spdx-json=sbom-${img}.spdx.json" -q
            echo "${img}: $(python3 -c 'import json,sys; print(len(json.load(open(sys.argv[1]))["packages"]))' "sbom-${img}.spdx.json") packages"
          done
      - name: Upload the SBOMs
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sbom-${{ github.sha }}
          path: sbom-*.spdx.json
          if-no-files-found: error
          retention-days: 90

  infra:
    name: Infra validation (Bicep, workflows)
    needs: changes
    if: needs.changes.outputs.infra == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Bicep build, lint and parameter files; template checks; actionlint; shellcheck
        run: infra/validate.sh

  deploy:
    # Only a push to the integration branch deploys, and only after every check above passed or was not needed.
    name: Deploy to Azure (dev)
    needs: [changes, gates, contract, jvm, web, android, android-release, images, infra]
    if: >-
      !cancelled() && !failure()
      && github.event_name == 'push'
      && github.ref == 'refs/heads/claude/wonderful-thompson-k6ejnf'
      && needs.changes.outputs.deploy == 'true'
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/deploy.yml
    with:
      environment: dev
    secrets: inherit
