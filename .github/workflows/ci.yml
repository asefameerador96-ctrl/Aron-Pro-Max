# CI for the Aron monorepo (docs/24-build-spec.md s13.2). Owner: infra lane.
#
# Jobs: changed-area filter -> repository gates (gitleaks on the pushed commits; migration checksum, order and squawk
# lint; oasdiff breaking-change check on the contract: tools/ci/), contract lint, JVM build and tests (shared, db,
# backend on PostgreSQL 16), web (lint, types, unit tests, build, e2e), three debug APKs plus Android unit tests and
# lint, the three release APKs (signed on integration pushes) with the APK size gate (F-SYS-036), container images
# (built, booted against PostgreSQL, SBOM per image), infra validation (Bicep build/lint/checks, actionlint). A green
# run of a push to the integration branch triggers the Azure deploy (deploy.yml, workflow_run). CodeQL: codeql.yml.
# Budget: under 15 minutes wall time for a full run (docs/31 s2); the jobs run in parallel and path-filtered.
#
# Secrets (never committed; set them in GitHub > Settings > Secrets and variables > Actions, docs/24 s13.6):
#   MAPS_ANDROID_KEY          Google Maps SDK for Android key (AMO and TSO apps); manifest placeholder mapsApiKey
#   MAPS_WEB_KEY              Google Maps JavaScript API key for web/ (NEXT_PUBLIC_MAPS_WEB_KEY at next build)
#   GOOGLE_SERVICES_JSON      Firebase google-services.json content, written into android/app-{sr,amo,tso}/
#   FCM_SERVICE_ACCOUNT_JSON  Firebase service account for the backend FCM sender; copied to Key Vault by the deploy
#                             workflow (secret aron-fcm-service-account); never used by this workflow
# Every secret is optional here: without them the debug APKs still build (maps show no tiles, push is off).
# Actions are pinned by commit SHA (release tag in the comment), resolved with `git ls-remote` on 2026-10-05.

name: ci

on:
  push:
    branches: [main, "lane/**", "claude/**"]
    # Docs and status commits are most pushes: they start no run. Re-included: the two documents tests read.
    paths:
      - "**"
      - "!docs/**"
      - "!**/*.md"
      - "docs/24-build-spec.md"
      - "docs/data-dictionary.md"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  # AUD-DG-03: CI builds talk to the dev environment (Front Door) and carry a version code that always increases,
  # so a phone installed from one run upgrades to the next. ARON_DEV_API_BASE_URL overrides the origin.
  ARON_API_BASE_URL: ${{ vars.ARON_DEV_API_BASE_URL || 'https://fde-aron-dev-7i7g53-gpgaa3fpgrhmdgaz.z03.azurefd.net' }}
  ARON_VERSION_CODE: ${{ github.run_number }}
  ARON_VERSION_NAME: 0.1.${{ github.run_number }}

# Lead decision 2026-10-07 (CI throughput): one group per ref. A running push run always finishes; GitHub keeps one
# pending run per group and a newer push replaces the older PENDING one, so the newest head of each branch always gets
# a verdict and intermediate merge commits are skipped. The newer head contains every older commit and compares with
# the LAST GREEN head (changes job), so nothing of a skipped run goes untested. Pull requests cancel their older run.
# The Azure deploy is a separate workflow (deploy.yml, on ci completed).
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    # Cheap path filter without a third-party action: a docs-only push skips the JVM and Android builds.
    # Anything unknown (manual dispatch, a new branch, a force-push, a diff failure) runs everything.
    name: Detect changed areas
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read
    timeout-minutes: 5
    outputs:
      contract: ${{ steps.filter.outputs.contract }}
      jvm: ${{ steps.filter.outputs.jvm }}
      android: ${{ steps.filter.outputs.android }}
      web: ${{ steps.filter.outputs.web }}
      infra: ${{ steps.filter.outputs.infra }}
      deploy: ${{ steps.filter.outputs.deploy }}
      db: ${{ steps.filter.outputs.db }}
      base: ${{ steps.filter.outputs.base }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - id: filter
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          GH_TOKEN: ${{ github.token }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          # Push: compare with the head of the last SUCCESSFUL ci run on this branch when it is an ancestor (older runs
          # may have been cancelled by newer pushes), else with the pushed "before".
          if [ "${EVENT}" = push ]; then
            green="$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/ci.yml/runs?branch=${REF_NAME}&status=success&per_page=1" --jq '.workflow_runs[0].head_sha // ""' 2>/dev/null || true)"
            if [ -n "${green}" ] && git merge-base --is-ancestor "${green}" "${GITHUB_SHA}" 2>/dev/null; then
              echo "comparing with the last green head ${green}"; BEFORE="${green}"
            fi
          fi
          all() { printf 'contract=true\njvm=true\nandroid=true\nweb=true\ninfra=true\ndeploy=true\ndb=true\nbase=\n' >> "${GITHUB_OUTPUT}"; echo "running everything: $1"; exit 0; }
          case "${EVENT}" in
            pull_request) base="${PR_BASE}" ;;
            push) base="${BEFORE}" ;;
            *) all "event ${EVENT}" ;;
          esac
          if [ -z "${base}" ] || [ "${base}" = "0000000000000000000000000000000000000000" ]; then all "no base commit"; fi
          files="$(git diff --name-only "${base}" "${GITHUB_SHA}" 2>/dev/null)" || all "base ${base} not reachable"
          printf '%s\n' "${files}"
          # Files that can change any build: root Gradle, the version catalogue, the wrapper and this workflow.
          common='^(build\.gradle\.kts|settings\.gradle\.kts|gradle\.properties|gradlew|gradlew\.bat|gradle/|\.github/workflows/ci\.yml)'
          has() { printf '%s\n' "${files}" | grep -Eq "$1" && echo true || echo false; }
          {
            echo "contract=$(has '^(contract/|tools/slice-contract\.py|\.github/workflows/ci\.yml)')"
            # shared/contract's drift tests read docs/24-build-spec.md, so a spec edit re-runs them.
            # db's DataDictionaryTest compares docs/data-dictionary.md with the migrated schema.
            echo "jvm=$(has "${common}|^(contract/|shared/|db/|backend/|docs/24-build-spec\.md|docs/data-dictionary\.md)")"
            echo "android=$(has "${common}|^(contract/|shared/|android/|tools/android-sdk\.sh)")"
            echo "web=$(has '^(web/|contract/openapi\.yaml|\.github/workflows/ci\.yml)')"
            echo "infra=$(has '^(infra/|\.github/|tools/ci/)')"
            # What ends up in Azure: the backend image (shared, db, backend), the web image, the Bicep, the deploy.
            echo "deploy=$(has "${common}|^(shared/|db/|backend/|web/|infra/|\.github/workflows/deploy\.yml)")"
            echo "db=$(has '^(db/migrations/|tools/ci/)')"
            echo "base=${base}"
          } | tee -a "${GITHUB_OUTPUT}"

  gates:
    # Cheap repository gates (tools/ci/, pinned binaries with SHA-256): every push and pull request.
    name: Repository gates (secrets, migrations, contract)
    needs: changes
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      BEFORE: ${{ needs.changes.outputs.base }}
      INTEGRATION_BRANCH: claude/wonderful-thompson-k6ejnf
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Choose the comparison base
        # SCAN_RANGE: the pushed commits for gitleaks (BEFORE..SHA works even when BEFORE is not an ancestor).
        # CHECK_BASE: an ANCESTOR of this commit for the migration and contract gates: the merge-base with BEFORE,
        # else (first push of a branch, force-push, manual run) the merge-base with the integration branch, else
        # (a run on the integration branch tip itself) the parent commit.
        run: |
          range="" check=""
          if [ -n "${BEFORE}" ] && git cat-file -e "${BEFORE}^{commit}" 2>/dev/null; then
            range="${BEFORE}..${GITHUB_SHA}"
            check="$(git merge-base "${BEFORE}" "${GITHUB_SHA}" || true)"
          fi
          if [ -z "${check}" ] && git rev-parse -q --verify "origin/${INTEGRATION_BRANCH}" >/dev/null; then
            check="$(git merge-base "origin/${INTEGRATION_BRANCH}" "${GITHUB_SHA}" || true)"
          fi
          if [ -z "${check}" ] || [ "${check}" = "${GITHUB_SHA}" ]; then
            check="$(git rev-parse HEAD~1)"
            echo "::notice::no earlier base for this run; the migration and contract gates compare with the parent commit"
          fi
          echo "SCAN_RANGE=${range}" >> "${GITHUB_ENV}"
          echo "CHECK_BASE=${check}" >> "${GITHUB_ENV}"
          echo "gitleaks range: ${range:-whole history}; gate base: ${check}"
      - name: Install gitleaks, oasdiff, squawk and osv-scanner (pinned, checksum-verified)
        run: |
          for t in gitleaks oasdiff squawk osv-scanner; do tools/ci/install-tool.sh "$t" "${RUNNER_TEMP}/bin"; done
          echo "${RUNNER_TEMP}/bin" >> "${GITHUB_PATH}"
      - name: Gate self-tests (each gate fails on a deliberate violation; tools/ci/test_gates.py)
        run: python3 tools/ci/test_gates.py
      - name: Secret scan of the whole history (gitleaks; reviewed exceptions in tools/ci/gitleaksignore)
        run: |
          # Known base: only the new commits. Unknown base (manual run, new branch): the whole history.
          # The whole history every time (about 2 s): no pushed commit is ever skipped, whatever run was cancelled.
          gitleaks git --no-banner --redact --exit-code 1 --config tools/ci/gitleaks.toml \
            --gitleaks-ignore-path tools/ci/gitleaksignore .
      - name: Dependency scan (OSV-Scanner; high or critical in a production dependency fails)
        # AUD-SEC-05. web/package-lock.json today; the Gradle verification file joins it when it exists (Day 6).
        # Dev-only findings and unknown severities are warnings; exceptions are dated lines in tools/ci/osv-allow.txt.
        run: |
          set +e
          osv-scanner scan source --lockfile web/package-lock.json --format json > "${RUNNER_TEMP}/osv.json"
          rc=$?
          set -e
          # 0 = nothing found, 1 = vulnerabilities found (the gate decides); anything else is a scanner failure.
          [ "${rc}" -le 1 ] || { echo "::error::osv-scanner failed (exit ${rc})"; exit 1; }
          python3 tools/ci/osv-gate.py "${RUNNER_TEMP}/osv.json" tools/ci/osv-allow.txt
      - name: npm install scripts reviewed (web/.npmrc ignore-scripts; tools/ci/npm-install-scripts.txt)
        run: python3 tools/ci/install-scripts-check.py web/package-lock.json tools/ci/npm-install-scripts.txt
      - name: Static analysis (Semgrep, pinned image; findings new since the base fail)
        run: tools/ci/semgrep.sh "${CHECK_BASE}"
      - name: Dependency review (pull requests; high or critical fails)
        if: github.event_name == 'pull_request'
        uses: actions/dependency-review-action@2031cfc080254a8a887f58cffee85186f0e49e48 # v4.9.0
        with:
          fail-on-severity: high
      - name: Migrations (shipped ones unchanged, versions in order, squawk on the new ones)
        if: needs.changes.outputs.db == 'true'
        run: tools/ci/migrations-check.sh "${CHECK_BASE}" squawk
      - name: Contract breaking-change check (oasdiff)
        if: needs.changes.outputs.contract == 'true'
        run: tools/ci/contract-breaking.sh "${CHECK_BASE}" oasdiff

  contract:
    name: Contract lint
    needs: changes
    if: needs.changes.outputs.contract == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
      - name: contract/slices is current (generated from openapi.yaml by tools/slice-contract.py)
        run: |
          python3 -c 'import yaml' 2>/dev/null || pip install --quiet --user pyyaml==6.0.2
          python3 tools/slice-contract.py --check
      - name: Lint contract/openapi.yaml (Redocly, 0 errors and 0 warnings)
        run: npx --yes @redocly/cli@2 lint contract/openapi.yaml --config contract/redocly.yaml

  jvm:
    name: Shared, db and backend (build and tests)
    needs: changes
    if: needs.changes.outputs.jvm == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: aron_test
          POSTGRES_DB: aron_test
          # Throwaway service container reachable only from this job: trust auth, no password at all.
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U aron_test -d aron_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      ARON_TEST_PG_URL: jdbc:postgresql://localhost:5432/aron_test?user=aron_test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
      - name: Build and test shared, db and backend
        run: >-
          ./gradlew --console=plain
          :shared:contract:build :shared:rules:build :db:build
          :backend:platform:build :backend:auth:build :backend:sync:build :backend:masterdata:build
          :backend:config:build :backend:analytics:build :backend:notify:build :backend:media:build
          :backend:app:build
      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: jvm-test-reports
          path: |
            **/build/reports/tests/
            **/build/test-results/
          retention-days: 7
      - name: Explain a stale data dictionary (docs/requests/db-data-dictionary-ci.md)
        if: failure()
        run: |
          if grep -ls '<failure' db/build/test-results/test/*DataDictionaryTest*.xml 2>/dev/null | head -1 | grep -q .; then
            if grep -q 'theCommittedDictionaryMatchesTheSchema' db/build/test-results/test/*DataDictionaryTest*.xml \
               && grep -A2 'theCommittedDictionaryMatchesTheSchema' db/build/test-results/test/*DataDictionaryTest*.xml | grep -q '<failure'; then
              echo "::error title=Data dictionary out of date::run tools/data-dictionary/render.sh and commit docs/data-dictionary.md with the migration that changed the schema"
            else
              echo "::error title=Data dictionary rule broken::a table, view or column has no COMMENT, a malformed metadata line, or a PII class below its columns (convention in the V0016 header)"
            fi
          fi
      - name: Publish the data dictionary for BI readers (main only)
        if: success() && github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: data-dictionary-${{ github.sha }}
          path: docs/data-dictionary.md
          if-no-files-found: error
          retention-days: 90

  android:
    name: Android debug APKs, unit tests and lint
    needs: changes
    if: needs.changes.outputs.android == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      MAPS_ANDROID_KEY: ${{ secrets.MAPS_ANDROID_KEY }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Point ANDROID_HOME at a cacheable SDK in the runner temp folder
        # The runner context is not available in job-level env, so the path is exported here.
        run: |
          echo "ANDROID_HOME=${RUNNER_TEMP}/android-sdk" >> "${GITHUB_ENV}"
          echo "ANDROID_SDK_ROOT=${RUNNER_TEMP}/android-sdk" >> "${GITHUB_ENV}"
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "21"
      - name: Cache the Android SDK
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/android-sdk
          key: android-sdk-${{ runner.os }}-${{ hashFiles('tools/android-sdk.sh') }}
      - name: Install Android SDK packages (same script as the dev box)
        run: tools/android-sdk.sh
      - name: Write google-services.json from the secret (only when it is set)
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "${GOOGLE_SERVICES_JSON}" ]; then
            for app in app-sr app-amo app-tso; do
              printf '%s' "${GOOGLE_SERVICES_JSON}" > "android/${app}/google-services.json"
            done
            echo "google-services.json written for the three apps"
          else
            echo "GOOGLE_SERVICES_JSON not set: building without Firebase (push disabled)"
          fi
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
      - name: Assemble the three debug APKs, run Android unit tests and lint
        run: >-
          ./gradlew --console=plain
          -Paron.apiBaseUrl="${ARON_API_BASE_URL}" -Paron.versionCode="${ARON_VERSION_CODE}" -Paron.versionName="${ARON_VERSION_NAME}"
          :android:app-sr:assembleDebug :android:app-amo:assembleDebug :android:app-tso:assembleDebug
          testDebugUnitTest lintDebug
      - name: Remove google-services.json from the workspace
        if: always()
        run: rm -f android/app-sr/google-services.json android/app-amo/google-services.json android/app-tso/google-services.json
      - name: Upload debug APKs (every successful Android run)
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: aron-debug-apks-${{ github.sha }}
          path: |
            android/app-sr/build/outputs/apk/debug/*.apk
            android/app-amo/build/outputs/apk/debug/*.apk
            android/app-tso/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
      - name: Upload Android test reports
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: android-test-reports
          path: |
            android/**/build/reports/tests/
            android/**/build/test-results/
          retention-days: 7

  android-release:
    # F-SYS-036 and the android-core request: the SR release build (R8, resource shrinking, https-only guard) must keep
    # building, and every release APK stays inside the size budget per ABI (tools/ci/apk-size-gate.py).
    name: Release APKs and APK size gate
    needs: changes
    if: needs.changes.outputs.android == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Point ANDROID_HOME at a cacheable SDK in the runner temp folder
        run: |
          echo "ANDROID_HOME=${RUNNER_TEMP}/android-sdk" >> "${GITHUB_ENV}"
          echo "ANDROID_SDK_ROOT=${RUNNER_TEMP}/android-sdk" >> "${GITHUB_ENV}"
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "21"
      - name: Cache the Android SDK
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/android-sdk
          key: android-sdk-${{ runner.os }}-${{ hashFiles('tools/android-sdk.sh') }}
      - name: Install Android SDK packages (same script as the dev box)
        run: tools/android-sdk.sh
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
      - name: Assemble the three release APKs against the dev origin (R8, resource shrinking, https-only guard)
        run: >-
          ./gradlew --console=plain
          -Paron.apiBaseUrl="${ARON_API_BASE_URL}" -Paron.versionCode="${ARON_VERSION_CODE}" -Paron.versionName="${ARON_VERSION_NAME}"
          :android:app-sr:assembleRelease :android:app-amo:assembleRelease :android:app-tso:assembleRelease
      - name: APK size gate (30 MB per ABI, installed 70 MB, warn +5 %, fail +15 % against the baseline)
        run: |
          apks=()
          for app in sr amo tso; do
            for f in "android/app-${app}/build/outputs/apk/release/"*.apk; do apks+=("${app}-release=$f"); done
          done
          [ "${#apks[@]}" -eq 3 ] || { echo "::error::expected 3 release APKs, found ${#apks[@]}"; exit 1; }
          python3 tools/ci/apk-size-gate.py "${apks[@]}"
      - name: Sign with the release key (integration branch pushes only, when the ANDROID_SIGNING_* secrets exist)
        # AUD-DG-03: the owner's device-owner phones are installed ONCE with a release-signed build (changing the signer
        # later needs a factory reset). Signed with apksigner, so the key never touches the Gradle build.
        id: sign
        if: github.event_name == 'push' && github.ref == 'refs/heads/claude/wonderful-thompson-k6ejnf'
        env:
          KS: ${{ secrets.ANDROID_SIGNING_KEYSTORE_BASE64 }}
          KSP: ${{ secrets.ANDROID_SIGNING_KEYSTORE_PASSWORD }}
          ALIAS: ${{ secrets.ANDROID_SIGNING_KEY_ALIAS }}
          KP: ${{ secrets.ANDROID_SIGNING_KEY_PASSWORD }}
        run: |
          for v in KS KSP ALIAS KP; do
            [ -n "${!v}" ] || { echo "::warning::release signing secret ${v} missing: release APKs stay unsigned"; echo "signed=false" >> "${GITHUB_OUTPUT}"; exit 0; }
          done
          ks="${RUNNER_TEMP}/release.jks"; trap 'rm -f "${ks}"' EXIT
          printf '%s' "${KS}" | base64 -d > "${ks}"
          signer="${ANDROID_HOME}/build-tools/36.0.0/apksigner"
          mkdir -p signed
          for app in sr amo tso; do
            src="$(ls android/app-${app}/build/outputs/apk/release/*-release-unsigned.apk)"
            dst="signed/aron-${app}-${ARON_VERSION_NAME}-dev.apk"
            "${signer}" sign --ks "${ks}" --ks-pass env:KSP --ks-key-alias "${ALIAS}" --key-pass env:KP --out "${dst}" "${src}"
            "${signer}" verify --print-certs "${dst}" | grep -E "Signer #1 certificate SHA-256 digest" | sed "s/^/${app}: /"
          done
          (cd signed && sha256sum ./*.apk > SHA256SUMS && cat SHA256SUMS)
          echo "signed=true" >> "${GITHUB_OUTPUT}"
      - name: Upload the release-signed dev APKs
        if: steps.sign.outputs.signed == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: aron-release-signed-dev-${{ github.run_number }}
          path: signed/
          if-no-files-found: error
          retention-days: 30

  web:
    # docs/24 s13.2 web gate; steps from web/scripts/ci.sh (docs/requests/web-infra-ci-job.md).
    name: Web (lint, types, tests, build, e2e)
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: bash scripts/ci.sh install
      - name: npm audit of the production dependencies (high or critical fails; AUD-SEC-05)
        run: npm audit --omit=dev --audit-level=high
      - name: Generated contract types are up to date
        run: bash scripts/ci.sh generate
      - run: bash scripts/ci.sh lint
      - run: bash scripts/ci.sh typecheck
      - run: bash scripts/ci.sh test
      - name: next build
        env:
          NEXT_PUBLIC_MAPS_WEB_KEY: ${{ secrets.MAPS_WEB_KEY }}
        run: bash scripts/ci.sh build
      - run: npx playwright install --with-deps chromium
      - run: bash scripts/ci.sh e2e
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: web-playwright-results
          path: web/test-results/
          if-no-files-found: ignore
          retention-days: 7

  images:
    # The deploy images, built and booted without Azure: migrate twice against PostgreSQL 16, api health and
    # readiness with the X-Aron-Api marker, worker stays up, web serves (infra/scripts/image-smoke.sh).
    name: Container images (build and runtime smoke)
    needs: changes
    if: needs.changes.outputs.deploy == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: aron_test
          POSTGRES_DB: aron_test
          # Throwaway service container reachable only from this job: trust auth, no password at all.
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U aron_test -d aron_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
      - name: Build the images and smoke-test the backend roles
        env:
          IMAGE_TAG: ${{ github.sha }}
        run: infra/scripts/image-smoke.sh
      - name: Image vulnerability scan (Trivy pinned by checksum; a fixable CRITICAL fails)
        # AUD-SEC-05. --ignore-unfixed: a critical with no fixed package yet cannot be acted on and would block every
        # push; it still shows in the SBOM below and in the weekly CodeQL/Dependabot view.
        env:
          TAG: ${{ github.sha }}
        run: |
          trivy="$(tools/ci/install-tool.sh trivy "${RUNNER_TEMP}/bin")"
          for img in aron-backend aron-web; do
            "${trivy}" image --quiet --no-progress --scanners vuln --severity CRITICAL --ignore-unfixed --exit-code 1 "${img}:${TAG}"
          done
      - name: SBOM of the backend and web images (SPDX, syft pinned by checksum)
        env:
          TAG: ${{ github.sha }}
        run: |
          syft="$(tools/ci/install-tool.sh syft "${RUNNER_TEMP}/bin")"
          for img in aron-backend aron-web; do
            "${syft}" scan "docker:${img}:${TAG}" -o "spdx-json=sbom-${img}.spdx.json" -q
            echo "${img}: $(python3 -c 'import json,sys; print(len(json.load(open(sys.argv[1]))["packages"]))' "sbom-${img}.spdx.json") packages"
          done
      - name: Upload the SBOMs
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sbom-${{ github.sha }}
          path: sbom-*.spdx.json
          if-no-files-found: error
          retention-days: 90

  infra:
    name: Infra validation (Bicep, workflows)
    needs: changes
    if: needs.changes.outputs.infra == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Bicep build, lint and parameter files; template checks; actionlint; shellcheck
        run: infra/validate.sh

